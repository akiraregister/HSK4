<!doctype html>
<!-- App Store 用スクリーンショット（6枚）の版下。
     1枚 1290×2796px（iPhone 6.9インチ／15・16 Pro Max の必須サイズ）。
     書き出し: node marketing/capture-sheets.mjs → marketing/appstore/out/01..06.png
     中の端末画面は marketing/shots/*.png（アプリを実際に操作して撮ったもの）。
     文言を変えたら書き出し直すこと。色・書体はアプリ本体と同じトークンを使っている。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>加油 — App Store スクリーンショット版下</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Yomogi&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FCF9F2;--ink:#2A2724;--ink-2:#4A443C;--muted:#8A8377;--line:#E4DCCB;
  --brand:#F2A227;--bad:#B0561F;--paper:#FBF6EA;
  --sage:#D5E4C8;--apricot:#FBE0BC;--blush:#F6D9D2;--stroke:#2A2724;
  --font-display:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;
  --font-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  --font-hand:'Yomogi','Hiragino Maru Gothic ProN',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#DDD6C8;font-family:var(--font-body);display:flex;flex-wrap:wrap;gap:40px;padding:40px}

/* 1枚ぶん。App Store の 6.9インチ枠 */
.sheet{width:1290px;height:2796px;position:relative;overflow:hidden;background:var(--bg);flex:none}
.sheet svg.bg{position:absolute;inset:0;width:1290px;height:2796px}
.inner{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;
       padding:96px 86px 0}

/* 上の帯：どのアプリの画面かを毎枚示す */
.mark{display:flex;align-items:center;gap:14px;margin-bottom:46px}
.mark .w{font-family:var(--font-display);font-weight:900;font-size:44px;letter-spacing:.06em}
.mark .s{font-family:var(--font-hand);font-size:24px;color:var(--muted);align-self:flex-end;padding-bottom:6px}

.eyebrow{font-family:var(--font-hand);font-size:34px;color:var(--bad);letter-spacing:.04em;margin-bottom:16px}
h1{font-family:var(--font-display);font-weight:900;font-size:100px;line-height:1.3;letter-spacing:.005em;
   text-align:center;color:var(--ink);text-wrap:balance}
h1 em{font-style:normal;color:var(--bad)}
.sub{font-size:35px;line-height:1.72;color:var(--ink-2);text-align:center;margin-top:26px;max-width:21em;text-wrap:balance}
.squiggle{display:block;height:20px;margin:20px 0 0;overflow:visible}
.squiggle path{stroke:var(--brand);stroke-width:11;fill:none;stroke-linecap:round}

/* 端末。アプリと同じ「太い黒枠＋大きな丸み」に寄せ、下端は枠の外へ流す */
.phone{margin-top:74px;width:930px;flex:none;border:9px solid var(--stroke);border-radius:80px;background:#fff;
       padding:15px;box-shadow:0 34px 60px -30px rgba(42,39,36,.45)}
.phone img{display:block;width:100%;border-radius:66px}

/* 端末を少し下げて、下の帯と重ならないようにする枚 */
.sheet.tall .phone{margin-bottom:126px}
</style>
</head>
<body>

<!-- 背面シェイプ。アプリと同じ3色だけを使う。枚ごとに配置を変えてリズムを作る -->
<template id="bgA">
  <svg class="bg" viewBox="0 0 1290 2796" aria-hidden="true">
    <path d="M-40 300 C 200 190, 430 260, 660 200 C 890 140, 1120 200, 1330 130 L1330 560 C 1100 660, 850 570, 620 620 C 390 670, 160 610, -40 670 Z" fill="#FBE0BC"/>
    <path d="M-40 1980 C 220 1900, 430 1980, 660 1930 L1330 1880 L1330 2860 L-40 2860 Z" fill="#D5E4C8" opacity=".55"/>
  </svg>
</template>

<script>
const SHEETS = [
  { n:'01', eyebrow:'HSK4・90日プログラム', h:'90日で、<em>HSK4に届く</em>。',
    sub:'開くと、今日ぶんだけが出ている。<br>1日15分、単語5個と文法3つから。', img:'../shots/home.png',
    shapes:[['#FBE0BC','M-40 300 C 200 190, 430 262, 660 200 C 890 140, 1120 200, 1330 130 L1330 600 C 1100 700, 850 600, 620 650 C 390 700, 160 640, -40 700 Z'],
            ['#D5E4C8','M-40 2020 C 230 1930, 460 2030, 700 1970 C 940 1912, 1140 1980, 1330 1930 L1330 2860 L-40 2860 Z']] },

  { n:'02', eyebrow:'間隔反復（SM-2）', h:'忘れる頃に、<br><em>もう一度</em>出る。',
    sub:'手応えを4段階で押すだけ。<br>次に出す日は、アプリが決めます。', img:'../shots/review.png',
    shapes:[['#F6D9D2','M-40 260 C 180 170, 420 250, 650 190 C 880 130, 1120 200, 1330 140 L1330 640 C 1120 720, 880 640, 640 690 C 400 740, 170 680, -40 730 Z'],
            ['#FBE0BC','M-40 2120 C 260 2030, 520 2130, 780 2070 C 1000 2020, 1180 2070, 1330 2040 L1330 2860 L-40 2860 Z']] },

  { n:'03', eyebrow:'498語・222文法', h:'覚えるのは、<br><em>使う</em>中国語。',
    sub:'例文は、上海の会議室でも街角の食堂でも<br>実際に口に出す場面から選びました。', img:'../shots/day.png',
    shapes:[['#D5E4C8','M-40 280 C 210 180, 440 260, 680 200 C 920 140, 1130 210, 1330 150 L1330 620 C 1110 700, 860 620, 620 670 C 380 720, 160 660, -40 710 Z'],
            ['#F6D9D2','M-40 2080 C 250 1990, 500 2090, 760 2030 C 990 1978, 1180 2040, 1330 2000 L1330 2860 L-40 2860 Z']] },

  { n:'04', eyebrow:'リスニング・全90日', h:'音声は、<br><em>90日ぶん全部</em>。',
    sub:'会話が流れるのは1回だけ。<br>聞き終えるまで、中国語の文字は出ません。', img:'../shots/screen-listening.png',
    shapes:[['#FBE0BC','M-40 240 C 200 150, 450 240, 690 180 C 930 120, 1140 190, 1330 130 L1330 660 C 1100 740, 850 660, 610 710 C 370 760, 150 700, -40 750 Z'],
            ['#D5E4C8','M-40 2060 C 240 1970, 490 2070, 750 2010 C 980 1958, 1170 2020, 1330 1980 L1330 2860 L-40 2860 Z']] },

  { n:'05', eyebrow:'ミニテスト・986問', h:'書いた中文を、<br><em>AIが直す</em>。',
    sub:'毎日5問。並べ替えと作文があるので、<br>覚えたかではなく組み立てられるかが出ます。', img:'../shots/screen-writing.png',
    shapes:[['#F6D9D2','M-40 270 C 190 180, 430 255, 670 195 C 910 135, 1130 205, 1330 145 L1330 630 C 1110 710, 860 630, 620 680 C 380 730, 160 670, -40 720 Z'],
            ['#FBE0BC','M-40 2100 C 260 2010, 510 2110, 770 2050 C 1000 1998, 1180 2060, 1330 2020 L1330 2860 L-40 2860 Z']] },

  { n:'06', eyebrow:'模擬試験・40問30分', h:'いまの位置が、<br><em>点数で見える</em>。',
    sub:'分野ごとの正答率が出て、<br>間違えた範囲の語はそのまま復習へ。', img:'../shots/mock-result.png',
    shapes:[['#D5E4C8','M-40 250 C 220 160, 460 245, 700 185 C 940 125, 1140 195, 1330 135 L1330 650 C 1100 730, 850 650, 610 700 C 370 750, 150 690, -40 740 Z'],
            ['#F6D9D2','M-40 2090 C 250 2000, 500 2100, 760 2040 C 990 1988, 1180 2050, 1330 2010 L1330 2860 L-40 2860 Z']] },
];

const LOGO = `<svg width="58" height="58" viewBox="0 0 100 100" aria-hidden="true">
  <path d="M52 6 C 62 30, 80 42, 80 64 A 30 30 0 1 1 20 64 C 20 46, 33 41, 41 28 C 44 41, 50 45, 50 37 C 50 26, 47 16, 52 6 Z" fill="#F2A227" stroke="#2A2724" stroke-width="4.5" stroke-linejoin="round"></path>
  <circle cx="41" cy="63" r="3.6" fill="#2A2724"></circle><circle cx="59" cy="63" r="3.6" fill="#2A2724"></circle>
  <path d="M43 73 Q 50 79 57 73" stroke="#2A2724" stroke-width="3.8" fill="none" stroke-linecap="round"></path>
</svg>`;

document.body.innerHTML = SHEETS.map(s => `
  <section class="sheet" id="sheet-${s.n}">
    <svg class="bg" viewBox="0 0 1290 2796" aria-hidden="true">
      ${s.shapes.map(([c, d]) => `<path d="${d}" fill="${c}"></path>`).join('')}
    </svg>
    <div class="inner">
      <div class="mark">${LOGO}<span class="w">加油</span><span class="s">ジャーヨウ</span></div>
      <p class="eyebrow">${s.eyebrow}</p>
      <h1>${s.h}</h1>
      <svg class="squiggle" width="300" viewBox="0 0 300 12" aria-hidden="true"><path d="M5 8 Q 42 2 79 7 T 153 7 T 227 7 T 295 6"/></svg>
      <p class="sub">${s.sub}</p>
      <div class="phone"><img src="${s.img}" alt=""></div>
    </div>
  </section>`).join('');
</script>
</body>
</html>
