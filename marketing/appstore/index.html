<!doctype html>
<!-- App Store 用スクリーンショット（7枚）の版下。
     1枚 1290×2796px（iPhone 6.9インチ／15・16 Pro Max の必須サイズ）。
     書き出し: node marketing/capture-sheets.mjs appstore → marketing/appstore/out/01..07.png

     7枚とも「端末まるごと」にすると全部同じ絵に見えて、どこの話か分からなくなる。
     そこでレイアウトを3つに分け、枚ごとに回している。
       type A … 端末まるごと。画面全体が訴求そのものの回（01・07）
       type B … 端末＋その中の「小さな一箇所」を丸で囲って拡大（02）
                 ※ 画面のほとんどを占めるカードにこれをやると、同じ絵が二度出るだけになる
       type C … 端末枠を使わず、カード1枚を大きく。文字を読ませる回（04・06）
       type D … カード2枚を重ね、前後の流れを見せる回（03・05）
     中の画面は marketing/shots/*.png（アプリを実際に操作して撮ったもの）。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>加油 — App Store スクリーンショット版下</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Yomogi&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FCF9F2;--ink:#2A2724;--ink-2:#4A443C;--muted:#8A8377;--line:#E4DCCB;
  --brand:#F2A227;--bad:#B0561F;--paper:#FBF6EA;
  --sage:#D5E4C8;--apricot:#FBE0BC;--blush:#F6D9D2;--stroke:#2A2724;
  --font-display:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;
  --font-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  --font-hand:'Yomogi','Hiragino Maru Gothic ProN',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#DDD6C8;font-family:var(--font-body);display:flex;flex-wrap:wrap;gap:40px;padding:40px}

.sheet{width:1290px;height:2796px;position:relative;overflow:hidden;background:var(--bg);flex:none;
       display:flex;flex-direction:column}

/* 上の色帯。App Storeの一覧で埋もれないよう、ここだけベタで塗る。
   色はアプリのボタンと同じ2色（墨とアンバー）だけを交互に使う。 */
.band{position:relative;flex:none;min-height:930px;padding:92px 62px 0;text-align:center;
      display:flex;flex-direction:column;align-items:center;justify-content:center}
.band.ink{background:var(--stroke);color:#FCF9F2}
.band.amber{background:var(--brand);color:var(--ink)}
/* 帯の下端は手書きの波で切る（アプリの背面シェイプと同じ語彙） */
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:132px;display:block}

.mark{display:flex;align-items:center;gap:13px;margin-bottom:34px}
.mark .w{font-family:var(--font-display);font-weight:900;font-size:42px;letter-spacing:.06em}
.mark .s{font-family:var(--font-hand);font-size:23px;opacity:.62;align-self:flex-end;padding-bottom:6px}

.eyebrow{font-family:var(--font-display);font-weight:700;font-size:32px;letter-spacing:.06em;
         margin-bottom:22px;padding:9px 26px;border-radius:999px;line-height:1.5}
.ink .eyebrow{background:rgba(252,249,242,.14);color:#FBE0BC}
.amber .eyebrow{background:rgba(42,39,36,.10);color:#6B4A14}

h1{font-family:var(--font-display);font-weight:900;font-size:106px;line-height:1.26;letter-spacing:.002em;text-wrap:balance}
h1.sm{font-size:80px;line-height:1.32}
.ink h1 em{font-style:normal;color:var(--brand)}
.amber h1 em{font-style:normal;color:#8C3F0F}
.squiggle{display:block;height:20px;margin:22px 0 0;overflow:visible}
.ink .squiggle path{stroke:var(--brand)}
.amber .squiggle path{stroke:var(--stroke)}
.squiggle path{stroke-width:12;fill:none;stroke-linecap:round}
.sub{font-size:35px;line-height:1.66;margin-top:24px;max-width:24em;text-wrap:balance;padding-bottom:148px}
.ink .sub{color:rgba(252,249,242,.82)}
.amber .sub{color:rgba(42,39,36,.78)}

/* 絵。端末は帯の上へ食い込ませて奥行きを出す。
   カード主役の型（C・D）は中身の高さが読めないので食い込ませない（見出しを隠してしまう）。 */
.stage{position:relative;flex:1;margin-top:-172px;z-index:2}
.c .stage,.d .stage{margin-top:-24px}

.phone{position:absolute;border:11px solid var(--stroke);border-radius:84px;background:#fff;padding:16px;
       box-shadow:0 46px 90px -34px rgba(42,39,36,.62)}
.phone img{display:block;width:100%;border-radius:68px}
.a .phone{left:50%;transform:translateX(-50%);bottom:-40px;width:940px}
.a.tilt .phone{transform:translateX(-50%) rotate(-1.6deg)}
.b .phone{left:50%;transform:translateX(-50%);top:152px;width:700px;border-radius:68px;border-width:9px;padding:13px}
.b .phone img{border-radius:54px}
.b .card{left:50%;transform:translateX(-50%) rotate(-1.6deg);bottom:150px;width:1150px}

/* 抜き出したカード。アプリの中のカードをそのまま大きくしたもの */
.card{position:absolute;background:#fff;border:9px solid var(--stroke);border-radius:46px;overflow:hidden;
      box-shadow:0 50px 90px -30px rgba(42,39,36,.64)}
.card img{display:block;width:100%}
/* type C：端末枠を使わず、カードだけを大きく中央に */
.c .stage{display:flex;align-items:center;justify-content:center}
.c .card{position:static;width:1060px;transform:rotate(-1.1deg);max-height:100%}
/* type D：2枚を重ねて、前 → 後 の流れを見せる */
.d .stage{display:flex;flex-direction:column;align-items:center;justify-content:center}
.d .card{position:static}
.d .card.back {width:820px;transform:rotate(2.2deg);margin-left:230px;z-index:1}
.d .card.front{width:940px;transform:rotate(-2deg);margin-top:-46px;margin-right:180px;z-index:2}
/* 長いカードは下を切って、ぼかして「続きがある」ことを示す */
.card.clip img{margin-bottom:-2px}
.card.clip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:210px;
  background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 82%)}

/* 端末側の「ここの話です」を示す手書き風の丸 */
.ring{position:absolute;pointer-events:none;z-index:3}
</style>
</head>
<body>
<script type="module">
const LOGO = `<svg width="58" height="58" viewBox="0 0 100 100" aria-hidden="true">
  <path d="M52 6 C 62 30, 80 42, 80 64 A 30 30 0 1 1 20 64 C 20 46, 33 41, 41 28 C 44 41, 50 45, 50 37 C 50 26, 47 16, 52 6 Z" fill="#F2A227" stroke="#2A2724" stroke-width="4.5" stroke-linejoin="round"></path>
  <circle cx="41" cy="63" r="3.6" fill="#2A2724"></circle><circle cx="59" cy="63" r="3.6" fill="#2A2724"></circle>
  <path d="M43 73 Q 50 79 57 73" stroke="#2A2724" stroke-width="3.8" fill="none" stroke-linecap="round"></path>
</svg>`;

// 帯の色は2つだけ（アプリのボタンと同じ墨とアンバー）。交互に並べてリズムを作る。
// クリーム側には淡い3色（セージ／アプリコット／ブラッシュ）を1つだけ敷く。
const FOOT = {
  sage:    ['#D5E4C8','M-40 300 C 250 210, 500 310, 760 250 C 990 198, 1180 260, 1330 220 L1330 1200 L-40 1200 Z'],
  apricot: ['#FBE0BC','M-40 340 C 260 250, 510 350, 770 290 C 1000 238, 1180 300, 1330 260 L1330 1200 L-40 1200 Z'],
  blush:   ['#F6D9D2','M-40 320 C 240 230, 490 330, 750 270 C 980 218, 1170 280, 1330 240 L1330 1200 L-40 1200 Z'],
};
// 帯の下端の波。枚ごとに形を変えて、同じ絵に見えないようにする。
const WAVES = [
  'M0,54 C 210,6 430,104 650,58 C 870,12 1080,96 1290,52 L1290,132 L0,132 Z',
  'M0,76 C 240,20 400,110 660,70 C 900,34 1090,104 1290,62 L1290,132 L0,132 Z',
  'M0,48 C 180,102 420,14 640,62 C 880,114 1070,28 1290,74 L1290,132 L0,132 Z',
  'M0,68 C 260,110 460,22 700,58 C 920,90 1110,30 1290,66 L1290,132 L0,132 Z',
];

const SHEETS = [
  { n:'01', type:'a', band:'ink',   foot:'apricot', logo:true,
    eyebrow:'日本語話者のためのHSK4対策',
    h:'HSK4に特化。<br><em>90日完結</em>。',
    sub:'頻出498語と文法222項目を、90日ぶんに。',
    phone:'../shots/home.png' },

  { n:'02', type:'b', band:'amber', foot:'sage', small:true,
    eyebrow:'これ1本で足りる',
    h:'毎日15分だけ。<br>単語も、文法も、<br>リスニングも、ミニテストも。',
    sub:'単語5個・文法3つ・音声1問・テスト5問。',
    phone:'../shots/day.png', card:'../shots/card-day.png',
    ring:{ shot:'day', key:'summary' } },

  { n:'03', type:'d', band:'ink',   foot:'blush',
    eyebrow:'間隔反復（SM-2）',
    h:'忘れる頃に、<br>もう一度出題して、<br><em>効果的に復習</em>。',
    sub:'手応えを4段階で押すだけ。あとは自動です。',
    back:'../shots/card-flashcard-front.png', front:'../shots/card-flashcard.png' },

  { n:'04', type:'c', band:'amber', foot:'sage',
    eyebrow:'文法222項目すべてに',
    h:'日本人が<br>間違えやすいところを<br><em>独自解説</em>。',
    sub:'例：日本語の過去を、全部 了 にしないこと。',
    card:'../shots/card-grammar.png', clip:true },

  { n:'05', type:'d', band:'ink',   foot:'apricot',
    eyebrow:'本番は听力が約3分の1',
    h:'90日分の音声を<br><em>全部カバー</em>。',
    sub:'再生は1回だけ。聞き終えるまで文字は出ません。',
    back:'../shots/listening-ready.png', front:'../shots/card-listening.png' },

  { n:'06', type:'c', band:'amber', foot:'blush',
    eyebrow:'作文180問',
    h:'<em>AI</em>による添削。',
    sub:'点数と「自然な言い方」が返ります。',
    card:'../shots/card-writing.png', cardW:1240 },

  { n:'07', type:'a', tilt:true, band:'ink', foot:'sage',
    eyebrow:'40問30分',
    h:'模擬試験で、<br><em>苦手な分野</em>が見える。',
    sub:'間違えた範囲は、そのまま復習に送れます。',
    phone:'../shots/mock-result.png' },
];

const REGIONS = await fetch('../shots/regions.json').then(r => r.json());

document.body.innerHTML = SHEETS.map((s, i) => {
  const [fc, fd] = FOOT[s.foot];
  const wave = WAVES[i % WAVES.length];
  return `
  <section class="sheet ${s.type}${s.tilt ? ' tilt' : ''}" id="sheet-${s.n}">
    <svg class="bg" viewBox="0 0 1290 1200" preserveAspectRatio="none"
         style="position:absolute;left:0;bottom:0;width:1290px;height:1200px" aria-hidden="true">
      <path d="${fd}" fill="${fc}"></path>
    </svg>
    <div class="band ${s.band}">
      ${s.logo ? `<div class="mark">${LOGO}<span class="w">加油</span><span class="s">ジャーヨウ</span></div>` : ''}
      <p class="eyebrow">${s.eyebrow}</p>
      <h1${s.small ? ' class="sm"' : ''}>${s.h}</h1>
      <svg class="squiggle" width="300" viewBox="0 0 300 13" aria-hidden="true"><path d="M6 9 Q 43 2 80 8 T 154 8 T 228 8 T 294 7"/></svg>
      <p class="sub">${s.sub}</p>
      <svg class="wave" viewBox="0 0 1290 132" preserveAspectRatio="none" aria-hidden="true">
        <path d="${wave}" fill="#FCF9F2"></path>
      </svg>
    </div>
    <div class="stage">
      ${s.phone ? `<div class="phone"><img src="${s.phone}" alt=""></div>` : ''}
      ${s.card ? `<div class="card${s.clip ? ' clip' : ''}"${s.cardW ? ` style="width:${s.cardW}px"` : ''}><img src="${s.card}" alt=""></div>` : ''}
      ${s.back ? `<div class="card back"><img src="${s.back}" alt=""></div>` : ''}
      ${s.front ? `<div class="card front"><img src="${s.front}" alt=""></div>` : ''}
    </div>
  </section>`;
}).join('');

// 丸の位置は、端末画像の実寸から出す。
// 座標は撮影時に記録した regions.json（スクショ内のピクセル）を、表示倍率で変換するだけ。
const SHOT_W = 1170, SHOT_H = 2532;
await Promise.all([...document.images].map(im => im.complete ? null
  : new Promise(res => { im.onload = im.onerror = res; })));

for (const s of SHEETS) {
  if (!s.ring) continue;
  const reg = (REGIONS[s.ring.shot] || {})[s.ring.key];
  const sheet = document.getElementById('sheet-' + s.n);
  const img = sheet.querySelector('.phone img');
  if (!reg || !img) continue;
  const sr = sheet.getBoundingClientRect(), ir = img.getBoundingClientRect();
  const k = ir.width / SHOT_W;
  // スクショの外へはみ出す領域は、見えている範囲までに詰める
  const h = Math.min(reg.h, SHOT_H - reg.y);
  const cx = (ir.left - sr.left) + (reg.x + reg.w / 2) * k;
  const cy = (ir.top - sr.top) + (reg.y + h / 2) * k;
  const rx = reg.w / 2 * k + 26, ry = h / 2 * k + 26;
  const pad = 18;
  const st = sheet.querySelector('.stage'), str = st.getBoundingClientRect();
  st.insertAdjacentHTML('beforeend',
    `<svg class="ring" style="left:${cx - rx - pad - (str.left - sr.left)}px;` +
    `top:${cy - ry - pad - (str.top - sr.top)}px"` +
    ` width="${(rx + pad) * 2}" height="${(ry + pad) * 2}">` +
    `<ellipse cx="${rx + pad}" cy="${ry + pad}" rx="${rx}" ry="${ry}"` +
    ` fill="none" stroke="#F2A227" stroke-width="7" stroke-linecap="round" stroke-dasharray="46 15"></ellipse></svg>`);
}
</script>
</body>
</html>
