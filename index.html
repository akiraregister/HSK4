<style>
:root{--bg:#FCF9F2;--card:#fff;--ink:#2A2724;--muted:#8A8377;--line:#E4DCCB;--accent:#2A2724;--good:#4E7A3C;--goodbg:#D5E4C8;--goodline:#B6CBA4;--bad:#B0561F;--gray:#F0EBE0;--primary:#2A2724;--primary-2:#3D3833;--brand:#F2A227;--brand-2:#D98A16;--brand-3:#FBE0BC;--paper:#FBF6EA;--caution:#B0561F;--sc-head:#2A2724;--pinyin:#7C7469;--brand-tint:#FBE0BC;--caution-tint:#F6D9D2;--primary-tint:#F0EBE0;--sage:#D5E4C8;--apricot:#FBE0BC;--blush:#F6D9D2;--stroke:#2A2724;--bw:1.5px;--font-brand:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;--font-display:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;--font-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;--font-hand:'Yomogi','Hiragino Maru Gothic ProN',cursive}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-weight:400;line-height:1.7}
.app{max-width:980px;margin:0 auto;padding:18px 12px calc(90px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:10;background:rgba(252,249,242,.90);backdrop-filter:blur(14px);border-bottom:var(--bw) solid var(--stroke);padding:calc(18px + env(safe-area-inset-top)) 16px 14px}.top-inner{max-width:980px;margin:0 auto}
h1{font-size:20px;margin:0 0 12px;letter-spacing:-.01em;line-height:1.2;text-align:left}.small{font-size:14.5px;color:var(--muted);line-height:1.6}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,button,input,textarea{font:inherit}select{flex:1;min-width:180px;border:var(--bw) solid var(--stroke);border-radius:999px;padding:11px 14px;background:#fff;font-weight:700}
button{border:var(--bw) solid var(--stroke);background:#fff;border-radius:999px;padding:11px 14px;font-weight:900;color:var(--ink);touch-action:manipulation;cursor:pointer}
.top .row button{border:var(--bw) solid var(--stroke);background:#fff;color:var(--ink)}
.nav-tabs{display:flex;gap:6px;margin-top:10px}
.nav-tab{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 6px;font-size:13px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.72);border:var(--bw) solid #CFC6B6;border-radius:999px;cursor:pointer;touch-action:manipulation;user-select:none;min-height:44px}
.nav-tab svg{display:none}
.nav-tab i{font-size:17px}
.nav-tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav-tab.active{color:var(--bg);background:var(--stroke);border-color:var(--stroke);font-weight:900}
.nav-tab.tab-done{color:var(--good)}button.primary{background:var(--accent);color:var(--bg);border-color:var(--stroke)}
button.complete.active{background:var(--goodbg);color:#2E8B62;border-color:var(--goodline)}button.toggle.off{background:#fff;color:var(--ink)}button.toggle.on{background:var(--gray);color:#5C5249}
button.bookmark{padding:7px 9px;border-radius:999px;background:#fff;color:#A29A8E}button.bookmark.active{background:#FBF4E8;border-color:#E8D9C4;color:#94621C}
.card{background:var(--card);border:var(--bw) solid var(--stroke);border-radius:20px;padding:16px;margin:12px 0}.section-title{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.section-title h2{font-size:18px;margin:0}.badge{display:inline-flex;border-radius:999px;background:var(--gray);color:#5C5249;padding:4px 10px;font-size:13px;font-weight:900}
.vocab{display:grid;gap:10px}.vitem{border:var(--bw) solid var(--stroke);border-radius:18px;padding:13px 15px;background:#fff}.item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.zh{font-size:20px;font-weight:800}.pinyin{color:#5C5249;margin-top:2px}.ja{color:#463F37;margin-top:4px}.ex{margin-top:10px;line-height:1.75}
.gitem{border:var(--bw) solid var(--stroke);border-radius:18px;padding:15px 17px;margin:10px 0;background:#fff}.gitem h3{margin:0 0 6px;font-size:17px}.label{font-weight:800;color:#463F37}.note{background:var(--paper);border:var(--bw) dashed #DFD2B8;border-radius:14px;padding:12px 14px;margin-top:8px;line-height:1.75}
.testq{border-top:1px solid var(--line);padding:14px 0}.testq:first-child{border-top:0}.opts{display:grid;gap:8px;margin-top:8px}.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px;background:#fff;min-height:44px}textarea{min-height:88px;resize:vertical}
.answer{display:none;margin-top:8px;border-radius:14px;background:#FBF7F0;border:1px dashed #DCD3C6;padding:10px}.show-answers .answer{display:block}
.hidden-ja .ja,.hidden-ja .exja{display:none}.hidden-pinyin .pinyin,.hidden-pinyin .expinyin{display:none}.scorebox{background:#FBF4E8;border:1px solid #E8D9C4;border-radius:16px;padding:12px;margin-top:12px}.good{color:var(--good);font-weight:800}.bad{color:var(--bad);font-weight:800}.muted{color:var(--muted)}
.drag-area{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding:10px;border:1px dashed #DCD3C6;border-radius:16px;background:#FBF7F0;min-height:58px}
.answer-area{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding:10px;border:1px solid #E3DBCE;border-radius:16px;background:#fff;min-height:58px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:14px;background:white;border:1px solid var(--line);font-weight:800;box-shadow:0 2px 6px rgba(16,24,40,.05);touch-action:manipulation}
.chip.used{background:var(--gray);color:#A29A8E;text-decoration:line-through}
.chip.answer-chip{background:#221B15;color:white;border-color:#221B15}
.chip.dragging{opacity:.45}.chip.selected{outline:3px solid #CFC6B6}
.bookmark-panel{display:none}.bookmark-panel.active{display:block}.empty{padding:14px;border:1px dashed #DCD3C6;border-radius:16px;background:#FBF7F0;color:var(--muted)}
.bm-stickybar{position:sticky;top:var(--top-h,64px);z-index:8;background:var(--card);padding:8px 0;margin:0 0 8px;box-shadow:0 6px 10px -6px rgba(16,24,40,.18)}


.day-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.daybtn{padding:10px 0;border-radius:12px;background:#fff}.daybtn.done{background:var(--goodbg);border-color:var(--goodline);color:#2E8B62}.daybtn.locked{opacity:.55}
.progressline{height:10px;border-radius:999px;background:var(--gray);overflow:hidden;margin-top:8px}.progressline span{display:block;height:100%;background:#221B15;width:0%}
@media(min-width:700px){.day-grid{grid-template-columns:repeat(10,1fr)}}
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:rgba(252,249,242,.94);backdrop-filter:blur(14px);border-top:var(--bw) solid var(--stroke);padding:11px 14px;padding-bottom:calc(11px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:20;transform:translateZ(0);-webkit-transform:translateZ(0);will-change:transform}.bottomnav button{flex:1}
@media(max-width:430px){.top{padding:calc(20px + env(safe-area-inset-top)) 14px 14px}h1{font-size:21px;margin-bottom:16px;text-align:center}button{padding:10px 11px}.app{padding-top:20px}}@media(min-width:800px){.vocab{grid-template-columns:1fr 1fr}.top h1{font-size:28px}.app{padding-bottom:40px}.bottomnav{display:none}}

.syncbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:2px;padding:11px 13px;border:var(--bw) solid var(--stroke);background:#fff;border-radius:16px}
.syncbar .sync-status{font-size:13px;color:#463F37;font-weight:700}
.syncbar .sync-user{font-size:13px;color:#5C5249;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.syncbar button{padding:6px 9px;font-size:12.5px}
.syncbar .login{background:var(--stroke);color:var(--bg);border-color:var(--stroke)}
.syncbar .logout{background:#fff;color:var(--ink);border-color:var(--stroke)}
.syncbar .force-btn{background:var(--apricot);color:#8A5A18;border-color:var(--stroke);font-size:10.5px;padding:6px 11px}
.syncbar .force-dl{background:var(--sage);color:#3D5A2E;border-color:var(--stroke)}
.hl-btn{border:none!important;background:transparent!important;font-size:18px;padding:2px 4px!important;cursor:pointer;touch-action:manipulation;line-height:1}
.hl-0 .vitem-inner{border-left:8px solid transparent}
.hl-1 .vitem-inner{border-left:8px solid var(--amber);background:var(--amberbg)}
.hl-2 .vitem-inner{border-left:8px solid var(--amber);background:var(--amberbg)}
.hl-3 .vitem-inner{border-left:8px solid var(--red2);background:var(--redbg)}
.hl-badge{font-size:12px;padding:2px 6px;border-radius:8px;font-weight:700;margin-left:4px}
.hl-badge-1{background:#C2773C;color:#94621C}
.hl-badge-2{background:#C2773C;color:#fff}
.hl-badge-3{background:#C8483B;color:#fff}
.ai-challenge-box{background:var(--gray);border:1px solid #CFC6B6;border-radius:16px;padding:14px;margin-top:12px}
.ai-challenge-box h3{margin:0 0 8px;color:var(--ink);font-size:15px}
.ai-q{font-weight:700;margin-bottom:8px;line-height:1.5}
.ai-opts label{display:block;padding:8px 10px;border:1px solid #ECE5DA;border-radius:10px;margin-bottom:6px;cursor:pointer;touch-action:manipulation}
.ai-ans-box{background:#EAF5EF;border:1px solid #C2E2CE;border-radius:10px;padding:10px;margin-top:8px}
.speak-btn{border:none!important;background:transparent!important;padding:4px 6px!important;cursor:pointer;touch-action:manipulation;line-height:0;vertical-align:middle;color:var(--muted);display:inline-flex;align-items:center}.speak-btn .spk-ic{width:18px;height:18px;display:block}
.speak-btn:active{color:var(--ink);transform:scale(1.15)}
.syncdot{width:8px;height:8px;border-radius:999px;background:#A29A8E;display:inline-block}
.syncdot.on{background:var(--good)}.syncdot.warn{background:var(--brand-2)}.syncdot.err{background:var(--bad)}
.cloud-note{font-size:12.5px;color:#8C8074;text-align:center;margin-top:4px}

/* ===== 改善案（フィードバック②③④⑤⑥＋）追加スタイル ===== */
:root{--blue:#2A2724;--amber:#E0A046;--amberbg:#FBE0BC;--red2:#D96A4F;--redbg:#F6D9D2}
/* ④ 下部ボタン配色：前=淡色 / 完了=グリーン / 次=ブルー */
#bottomPrev,#bottomNext{background:#fff;color:var(--ink);border-color:var(--stroke);display:inline-flex;align-items:center;justify-content:center;gap:5px}
#bottomPrev svg,#bottomNext svg{width:18px;height:18px}
#bottomComplete{background:var(--brand);color:var(--ink);border-color:var(--stroke);flex:1.4}
#bottomComplete.active{background:var(--sage);color:var(--ink);border-color:var(--stroke)}
/* ②③ 学習画面内ツールバー（拼音/和訳トグル・密度・Day選択） */
.daytools{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.modebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip-toggle{border:var(--bw) solid #CFC6B6;background:rgba(255,255,255,.8);color:var(--muted);border-radius:999px;padding:9px 16px;font-weight:900;font-size:14px;cursor:pointer;touch-action:manipulation}
.chip-toggle.on{background:var(--stroke);border-color:var(--stroke);color:var(--bg)}
.daybar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.daybar select{flex:1;min-width:120px}
.daybar button{flex:0 0 auto;background:#fff}
/* ⑤ 難易度コントロール（普通/曖昧/苦手）＋カード左の色バー */
.lvc{display:inline-flex;gap:6px;margin-top:8px}
.lvc button{border:var(--bw) solid #E0D6C4;border-radius:999px;padding:6px 13px;font-size:11.5px;font-weight:900;background:#fff;color:#A89A85;min-height:32px}
.lvc button+button{border-left:1px solid var(--line)}
.lvc button.lvc-on-0{background:var(--gray);border-color:var(--stroke);color:#5C5249}
.lvc button.lvc-on-1{background:var(--apricot);border-color:var(--stroke);color:#8A5A18}
.lvc button.lvc-on-2{background:var(--blush);border-color:var(--stroke);color:#A3402A}
.vitem.lv-1,.gitem.lv-1{border-left:8px solid var(--amber)}
.vitem.lv-2,.gitem.lv-2{border-left:8px solid var(--red2)}
/* ⑥ 密度（標準 / コンパクト） */
/* ⑥ コンパクト＝「一覧／復習モード」：ブックマーク画面でのみ有効。
   各項目を 中文＋拼音＋語義 に圧縮し、例文・文法詳細を畳んで件数を最大化する。
   学習セクション(#content)には一切影響しない（常に標準＝詳細）。 */
#bookmarkPanel.compact .card{padding:10px;margin:8px 0}
#bookmarkPanel.compact .section-title{margin-bottom:6px}
#bookmarkPanel.compact .section-title h2{font-size:16px}
#bookmarkPanel.compact .vocab{gap:6px}
#bookmarkPanel.compact .vitem,#bookmarkPanel.compact .gitem{padding:8px 10px}
#bookmarkPanel.compact .gitem{margin:6px 0}
#bookmarkPanel.compact .gitem h3{font-size:15px;margin:0}
#bookmarkPanel.compact .zh{font-size:17px}
#bookmarkPanel.compact .ja{margin-top:2px}
/* 例文・文法の詳細解説は非表示（標準モードで読む） */
#bookmarkPanel.compact .ex,
#bookmarkPanel.compact .expinyin,
#bookmarkPanel.compact .exja,
#bookmarkPanel.compact .note{display:none}
/* 難易度コントロールも小型化 */
#bookmarkPanel.compact .lvc{margin-top:4px}
#bookmarkPanel.compact .lvc button{padding:3px 8px;font-size:10px}
#bookmarkPanel.compact .gitem .pinyin,#bookmarkPanel.compact .vitem .pinyin{margin-top:1px}
/* ＋ ブックマークだけのミニテスト（フラッシュカード） */
.testwrap .seg{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.testwrap .seg .chip-toggle.on{background:var(--stroke);border-color:var(--stroke);color:var(--bg)}
.flashcard{border:1px solid var(--line);border-radius:18px;padding:22px 16px;background:#fff;text-align:center;box-shadow:0 10px 30px -16px rgba(20,30,50,.12);margin-top:12px}
.flashcard .fc-prompt{font-size:26px;font-weight:800;margin:6px 0}
.flashcard .fc-sub{color:#5C5249;margin-top:4px}
.flashcard .fc-answer{margin-top:14px;padding-top:14px;border-top:1px dashed #DCD3C6}
.flashcard .fc-answer .a-main{font-size:24px;font-weight:800;color:var(--ink)}
.fc-actions{display:flex;gap:8px;margin-top:14px}
.fc-actions button{flex:1;padding:11px 6px;font-size:14px}
.fc-progress{text-align:center;color:#8C8074;font-size:14px;margin-top:10px}
.badge-leech{background:#F5E8D3;color:#94621C}
.leech-tip{background:#FBF4E8;border:1px solid #E8D9C4;color:#94621C;border-radius:10px;padding:8px 10px;font-size:13.5px;margin:10px 0 0;text-align:left;line-height:1.55}
.ex-leech{border:1px solid #E8D9C4;background:#FBF4E8;border-radius:10px;padding:8px 10px}
.btn-vague{background:var(--amberbg);color:#94621C;border-color:#E8D9C4}
.btn-known{background:#EAF5EF;color:#2E8B62;border-color:#C2E2CE}
.btn-master{background:var(--gray);color:var(--ink);border-color:#CFC6B6}

.lc-progress{height:10px;border-radius:999px;background:var(--gray);overflow:hidden;margin:4px 0 14px}.lc-progress span{display:block;height:100%;background:#C2773C;transition:width .25s}
.lc-q{font-size:18px;font-weight:700;line-height:1.5;white-space:pre-wrap}
.lc-qpin{color:#5C5249;font-size:14px;margin-top:4px}
.lc-listen{margin:14px 0 4px}
.lc-listen .lc-btn{display:inline-flex;align-items:center;gap:8px}
.lc-listen .lc-btn svg{width:20px;height:20px}
.lc-listen-reveal{display:block;margin-top:10px;background:none;border:none;padding:0;font:inherit;font-size:14px;color:var(--muted);text-decoration:underline;cursor:pointer}
.lc-listen-text{font-family:var(--zh-font);font-size:16px;margin-top:8px;color:#5C5249}
.lc-opts{display:grid;gap:10px;margin-top:14px}
.lc-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;touch-action:manipulation}
.lc-opt.sel{border-color:#C2773C;background:#FBF4E8;color:#94621C}
.lc-opt.unknown{border-style:dashed;color:var(--muted);font-weight:600;text-align:center}
.lc-opt.unknown.sel{border-color:#A29A8E;background:#EFE9E0;color:#8C8074;border-style:dashed}
.lc-nav{display:flex;gap:10px;margin-top:16px}
.lc-result-lv{font-size:32px;font-weight:800;color:var(--ink);text-align:center;margin:6px 0}
.lc-result-sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:8px}
.lc-bands{display:grid;gap:8px;margin:14px 0}
.lc-band{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lc-band .lcbar{flex:1;height:8px;border-radius:999px;background:var(--gray);margin:0 10px;overflow:hidden}.lc-band .lcbar span{display:block;height:100%;background:var(--ink)}
.lc-band .lcsc{font-size:14px;font-weight:700;color:#463F37;min-width:38px;text-align:right}
.lc-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.lc-btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;touch-action:manipulation}
.lc-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.lc-btn.primary:disabled{opacity:.4;cursor:not-allowed}
.lc-btn.rec{border-color:#C2773C;background:#FBF4E8;color:#94621C}
.lc-btn.flex{flex:1}
.lc-startlist{margin:14px 0 0;padding:0;list-style:none;color:#463F37;line-height:1.7;font-size:14.5px}.lc-startlist li{padding-left:18px;position:relative}.lc-startlist li:before{content:"・";position:absolute;left:2px}
.cw-ex{cursor:text}
mark.cw-hl{background:#FBF4E8;color:inherit;border-radius:3px;padding:0 1px}
.cw-subtabs{display:flex;gap:8px;margin-bottom:12px}
.cw-subtab{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px;font:inherit;font-weight:700;color:#5C5249;cursor:pointer}
.cw-subtab.active{border-color:var(--ink);background:var(--gray);color:var(--ink)}
.cw-item{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.cw-item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cw-item .zh{font-size:17px;font-weight:700}
.cw-del{border:none;background:transparent;font-size:16px;cursor:pointer;line-height:1}
#cw-fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:9998;background:var(--ink);color:#fff;border:none;border-radius:999px;padding:13px 22px;font:inherit;font-weight:700;font-size:14px;box-shadow:0 10px 28px rgba(46,75,107,.40);cursor:pointer;display:none;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cw-modal{position:fixed;inset:0;z-index:9999;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center;padding:16px}
.cw-modal-card{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(16,24,40,.3)}
.cw-modal-h{font-size:18px;font-weight:800;margin-bottom:10px;color:var(--ink)}

let firebaseApp=null, auth=null, db=null, provider=null;
let firebaseReady=false;
async function initFirebase(){
  try{
    const appMod  = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js");
    const authMod = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js");
    const fsMod   = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js");
    initializeApp=appMod.initializeApp;
    getAuth=authMod.getAuth; GoogleAuthProvider=authMod.GoogleAuthProvider;
    signInWithPopup=authMod.signInWithPopup; signInWithRedirect=authMod.signInWithRedirect;
    getRedirectResult=authMod.getRedirectResult; onAuthStateChanged=authMod.onAuthStateChanged; signOut=authMod.signOut;
    getFirestore=fsMod.getFirestore; doc=fsMod.doc; getDoc=fsMod.getDoc; setDoc=fsMod.setDoc; serverTimestamp=fsMod.serverTimestamp;
    firebaseApp=initializeApp(firebaseConfig);
    auth=getAuth(firebaseApp);
    db=getFirestore(firebaseApp);
    provider=new GoogleAuthProvider();
    firebaseReady=true;
    getRedirectResult(auth).catch(e=>console.warn('Redirect result error',e));
    onAuthStateChanged(auth, async (user)=>{
      cloudUser=user; cloudReady=false;
      if(user){
        setSyncStatus('warn','ログイン済み：同期準備中...',user.email||'');
        await loadCloudState();
        // Stripeの決済ページから戻ってきた直後（成功）なら、購入済みの内容を
        // 自動で取得する。ログイン確認後でないとfetchPaidContent()できないため、
        // ここ（onAuthStateChanged内）で処理する。
        var purchaseParam=null;
        try{ purchaseParam=new URLSearchParams(location.search).get('purchase'); }catch(e){}
        if(purchaseParam==='success'){
          try{ history.replaceState(null,'',location.pathname); }catch(e){}
          var got=await fetchPaidContent();
          _toast(got?'購入ありがとうございます！Day8以降が使えるようになりました。':'購入の確認に少し時間がかかっています。少し待ってから「購入済みの内容を確認する」をお試しください。');
          if(got) render();
        } else if(LESSONS.length<TOTAL_DAYS){
          // 別端末で購入済みの場合などに備え、ログインのたびに一度だけ確認する。
          fetchPaidContent().then(function(got2){ if(got2) render(); });
        }
      } else {
        setSyncStatus('warn','未ログイン：この端末内に保存中');
      }
    });
  }catch(e){
    console.warn('Firebase init failed; running local-only', e);
    setSyncStatus('warn','オフライン：この端末内に保存中');
    var lb=document.getElementById('loginBtn'); if(lb){ lb.disabled=true; lb.style.opacity='0.5'; lb.title='クラウド同期は現在利用できません'; }
  }
}
let cloudUser = null;
let cloudReady = false;
let cloudLoading = false;
let cloudSaveTimer = null;
let suppressCloudSave = false;
function nowMs(){ return Date.now(); }
function setSyncStatus(kind, text, userText=''){
  const dot=document.getElementById('syncDot'), status=document.getElementById('syncStatus'), user=document.getElementById('syncUser'), login=document.getElementById('loginBtn'), logout=document.getElementById('logoutBtn');
  if(dot) dot.className='syncdot '+(kind==='on'?'on':kind==='err'?'err':'warn');
  if(status) status.textContent=text;
  if(user) user.textContent=userText||'';
  if(login) login.style.display=cloudUser?'none':'';
  if(logout) logout.style.display=cloudUser?'':'none';
  var fu=document.getElementById('forceUploadBtn'),fd=document.getElementById('forceDownloadBtn');
  if(fu) fu.style.display=cloudUser?'':'none';
  if(fd) fd.style.display=cloudUser?'':'none';
}
function cloudDocRef(){ return cloudUser ? doc(db,'users',cloudUser.uid,'hsk4','state') : null; }
function localUpdatedAt(){ const n=Number(localStorage.getItem(storageKey+'-updatedAtMs')||0); return Number.isFinite(n)?n:0; }
function markLocalUpdated(){ localStorage.setItem(storageKey+'-updatedAtMs', String(nowMs())); }
function normalizeStateForCloud(s){ return {completed:s.completed||{}, answers:s.answers||{}, scores:s.scores||{}, bookmarks:s.bookmarks||{}, dragOrders:s.dragOrders||{}, levels:s.levels||{}, customWords:Array.isArray(s.customWords)?s.customWords:[], density:s.density||'standard', fontScale:(s.fontScale==='sm'||s.fontScale==='lg')?s.fontScale:'md', srs:(s.srs&&typeof s.srs==='object')?s.srs:{}, srsNewLimit:(typeof s.srsNewLimit==='number')?s.srsNewLimit:8, srsDueLimit:(typeof s.srsDueLimit==='number')?s.srsDueLimit:30, srsDir:(s.srsDir==='ja2zh')?'ja2zh':'zh2ja', examDate:(typeof s.examDate==='string')?s.examDate:'', mockHistory:Array.isArray(s.mockHistory)?s.mockHistory:[], bmSort:(['recommend','hard','added','random'].indexOf(s.bmSort)>=0)?s.bmSort:'recommend', revScope:(s.revScope==='bm')?'bm':'all', currentDay:current||1, updatedAtMs:nowMs(), appVersion:'firebase-sync-v1', storageKey:storageKey}; }
async function saveCloudState(force=false){
  if(!cloudUser || ((!cloudReady)&&!force) || (cloudLoading && !force)) return;
  try{ const payload=normalizeStateForCloud(state); payload.updatedAt=serverTimestamp(); await setDoc(cloudDocRef(), payload, {merge:true}); setSyncStatus('on','クラウド同期済み',cloudUser.email||''); }
  catch(e){ console.error(e); setSyncStatus('err','クラウド保存エラー：Rulesを確認',cloudUser?.email||''); }
}
function scheduleCloudSave(){ if(!cloudUser || suppressCloudSave) return; setSyncStatus('warn','クラウドへ保存中...',cloudUser.email||''); clearTimeout(cloudSaveTimer); cloudSaveTimer=setTimeout(()=>saveCloudState(false),700); }
async function loadCloudState(){
  if(!cloudUser) return;
  cloudLoading=true; setSyncStatus('warn','クラウド同期を確認中...',cloudUser.email||'');
  try{
    const snap=await getDoc(cloudDocRef());
    if(!snap.exists()){cloudReady=true;await saveCloudState(true);setSyncStatus('on','初回同期完了',cloudUser.email||'');cloudLoading=false;return;}
    const cloud=snap.data()||{},cloudTs=Number(cloud.updatedAtMs||0),localTs=localUpdatedAt();
    const lbm=Object.keys(state.bookmarks||{}).length,cbm=Object.keys(cloud.bookmarks||{}).length;
    // ローカルが「完全に空」かどうか（新規端末/初回起動の判定。完了・回答・ブックマークいずれも無い）
    const localEmpty=!lbm && !Object.keys(state.completed||{}).length && !Object.keys(state.answers||{}).length;
    // クラウドに何らかの学習データがあるか
    const cloudHasData=cbm>0 || Object.keys(cloud.completed||{}).length>0 || Object.keys(cloud.answers||{}).length>0;
    // 判定：①空ローカルでクラウドにデータあり→クラウド採用（空で上書きしない） ②それ以外は「最終更新が新しい方」を採用（last-write-wins）
    //   → ローカルが新しい/同時刻ならローカルをアップロード。オフライン編集（ブックマーク削除含む）も保持される。
    const loadFromCloud=(localEmpty && cloudHasData) || (!localEmpty && cloudTs>localTs);
    if(loadFromCloud){
      suppressCloudSave=true;
      state.completed=cloud.completed||{};state.answers=cloud.answers||{};
      state.scores=cloud.scores||{};state.bookmarks=cloud.bookmarks||{};
      state.dragOrders=cloud.dragOrders||{};
      state.levels=cloud.levels||state.levels||{};
      if(cloud.srs&&typeof cloud.srs==='object') state.srs=cloud.srs;             // 復習スケジュール（SM-2）
      if(Array.isArray(cloud.customWords)) state.customWords=cloud.customWords;    // マイ単語
      if(typeof cloud.srsNewLimit==='number') state.srsNewLimit=cloud.srsNewLimit;
      if(typeof cloud.srsDueLimit==='number') state.srsDueLimit=cloud.srsDueLimit;
      if(cloud.srsDir==='ja2zh'||cloud.srsDir==='zh2ja') state.srsDir=cloud.srsDir;
      if(['recommend','hard','added','random'].indexOf(cloud.bmSort)>=0) state.bmSort=cloud.bmSort;
      if(cloud.revScope==='bm'||cloud.revScope==='all') state.revScope=cloud.revScope;
      if(cloud.fontScale==='sm'||cloud.fontScale==='lg'||cloud.fontScale==='md') state.fontScale=cloud.fontScale;
      cwEnsureIds();
      if(cloud.density) state.density=cloud.density;
      if(cloud.currentDay) current=Number(cloud.currentDay)||current;
      localStorage.setItem(storageKey,JSON.stringify(state));
      localStorage.setItem(storageKey+'-updatedAtMs',String(cloudTs));
      localStorage.setItem('hsk4-current-day',String(current));
      suppressCloudSave=false;
      if(typeof applyFontScale==='function') applyFontScale();
      setSyncStatus('on','クラウドから同期(BM:'+cbm+'件)',cloudUser.email||'');
      if(typeof render==='function') render();
    } else {
      cloudReady=true;await saveCloudState(true);
      setSyncStatus('on','端末→クラウド同期(BM:'+lbm+'件)',cloudUser.email||'');
    }
    cloudReady=true;
  } catch(e){console.error(e);setSyncStatus('err','同期エラー:'+(e.message||'不明'),cloudUser?.email||'');}
  finally{cloudLoading=false;}
}
window.hsk4GoogleLogin=async function(){ if(!firebaseReady){ setSyncStatus('warn','クラウド同期は現在利用できません'); return; } try{ setSyncStatus('warn','Googleログイン中...'); try{ await signInWithPopup(auth,provider); } catch(e){ console.warn('popup failed; redirect',e); await signInWithRedirect(auth,provider); } } catch(e){ console.error(e); setSyncStatus('err','ログインできませんでした'); } };
window.hsk4Logout=async function(){ if(!firebaseReady){ return; } await saveCloudState(true); await signOut(auth); };

// data-action委譲: ブックマーク削除・ハイライト・画面遷移
document.addEventListener('click', function(e){
  var btn = e.target.closest('[data-action]');
  if(!btn) return;
  var a = btn.dataset.action;
  var id = btn.dataset.id;
  if(a==='showHome') showHome();
  else if(a==='showBookmarks') showBookmarks();
  else if(a==='removeBookmark' && id) toggleBookmark(id);
  else if(a==='hl' && id) cycleHighlight(id);
  else if(a==='bmSort' && id) bmSetSort(id);
});

论","pinyin":"tǎolùn","ja":"議論する、相談する","example":"这个问题我想再讨论一下。","exPinyin":"Zhège wèntí wǒ xiǎng zài tǎolùn yíxià.","exJa":"この問題をもう少し相談したいです。"}],"grammar":[{"id":"d4-g0","name":"結果補語：好","pinyin":"hǎo","meaning":"きちんとできる、準備できる","explain":"動詞＋好は、動作がきちんと完了して使える状態になったことを表します。","contrast":"做好饭 は料理ができた、做完饭 は作業を終えた。","mistake":"准备好了 は非常によく使います。","example":"我准备好了。","exPinyin":"Wǒ zhǔnbèi hǎo le.","exJa":"準備できました。","test":"会議室を予約できました。","answer":"会议室订好了。"},{"id":"d4-g1","name":"結果補語：到","pinyin":"dào","meaning":"目的達成・見つける","explain":"動詞＋到は、探す・買う・聞くなどが成功したことを表します。","contrast":"买了票 は買った、买到票 は買えた。","mistake":"成功したかどうかを言う時に便利です。","example":"我找到钥匙了。","exPinyin":"Wǒ zhǎodào yàoshi le.","exJa":"鍵を見つけました。","test":"タクシーを呼べました。","answer":"我打到车了。"},{"id":"d4-g2","name":"方向補語：来去","pinyin":"lái/qù","meaning":"動作の方向を表す","explain":"来は話し手に近づく方向、去は離れる方向です。","contrast":"拿过来 はこちらへ、拿过去 は向こうへ。","mistake":"日本語では省略しがちな方向を中国語ではよく言います。","example":"你把外卖拿进来吧。","exPinyin":"Nǐ bǎ wàimài ná jìnlái ba.","exJa":"デリバリーを中に持ってきてください。","test":"彼は出て行きました。","answer":"他走出去了。"}]},{"day":5,"title":"Day 5｜HSK4 基礎強化","vocab":[{"id":"d5-v0","zh":"几乎","pinyin":"jīhū","ja":"ほとんど","example":"在上海，手机几乎可以解决很多事情。","exPinyin":"Zài Shànghǎi, shǒujī jīhū kěyǐ jiějué hěn duō shìqing.","exJa":"上海ではスマホでほとんど多くのことを解決できます。"},{"id":"d5-v1","zh":"手续","pinyin":"shǒuxù","ja":"手続き","example":"办理手续有点儿麻烦。","exPinyin":"Bànlǐ shǒuxù yǒudiǎnr máfan.","exJa":"手続きをするのは少し面倒です。"},{"id":"d5-v2","zh":"麻烦","pinyin":"máfan","ja":"面倒だ","example":"不好意思，麻烦您少放一点辣椒。","exPinyin":"Bù hǎoyìsi, máfan nín shǎo fàng yìdiǎn làjiāo.","exJa":"すみません、唐辛子を少なめにしてください。"},{"id":"d5-v3","zh":"流利","pinyin":"liúlì","ja":"流暢だ","example":"我中文说得还不太流利。","exPinyin":"Wǒ Zhōngwén shuō de hái bú tài liúlì.","exJa":"私は中国語を話すのがまだあまり流暢ではありません。"},{"id":"d5-v4","zh":"自然","pinyin":"zìrán","ja":"自然だ","example":"他说中文说得很自然。","exPinyin":"Tā shuō Zhōngwén shuō de hěn zìrán.","exJa":"彼の中国語はとても自然です。"}],"grammar":[{"id":"d5-g0","name":"方向補語：进来进去","pinyin":"jìnlái/jìnqù","meaning":"入ってくる/入っていく","explain":"进来は話し手の方へ入る、进去は話し手から離れた場所へ入る意味です。","contrast":"来/去は話し手の位置で決まります。","mistake":"場所感覚を意識します。","example":"他走进来了。","exPinyin":"Tā zǒu jìnlái le.","exJa":"彼は中に入ってきました。","test":"子どもが部屋に入ってきました。","answer":"孩子走进房间来了。"},{"id":"d5-g1","name":"方向補語：出来出去","pinyin":"chūlái/chūqù","meaning":"出てくる/出ていく","explain":"出来は話し手の方へ出てくる、出去は外へ出ていく意味です。","contrast":"拿出来 は取り出す、拿出去 は外へ持っていく。","mistake":"出す、だけでは方向が足りないことがあります。","example":"请把护照拿出来。","exPinyin":"Qǐng bǎ hùzhào ná chūlái.","exJa":"パスポートを出してください。","test":"ゴミを外に出してください。","answer":"请把垃圾拿出去。"},{"id":"d5-g2","name":"程度補語：说得","pinyin":"de","meaning":"どの程度〜するか","explain":"動詞＋得＋程度で、動作の程度を説明します。","contrast":"我说中文 は話す、我中文说得很好 は話すのが上手い。","mistake":"目的語がある時は我中文说得…の形が自然です。","example":"我中文说得还不太自然。","exPinyin":"Wǒ Zhōngwén shuō de hái bú tài zìrán.","exJa":"私の中国語はまだあまり自然ではありません。","test":"彼は話すのが速いです。","answer":"他说得很快。"}]},{"day":6,"title":"Day 6｜HSK4 基礎強化","vocab":[{"id":"d6-v0","zh":"顺利","pinyin":"shùnlì","ja":"順調だ","example":"今天的会议进行得很顺利。","exPinyin":"Jīntiān de huìyì jìnxíng de hěn shùnlì.","exJa":"今日の会議はとても順調に進みました。"},{"id":"d6-v1","zh":"安全","pinyin":"ānquán","ja":"安全だ","example":"晚上回家要注意安全。","exPinyin":"Wǎnshang huí jiā yào zhùyì ānquán.","exJa":"夜帰る時は安全に気をつけてください。"},{"id":"d6-v2","zh":"准时","pinyin":"zhǔnshí","ja":"時間通り","example":"请大家明天准时到会议室。","exPinyin":"Qǐng dàjiā míngtiān zhǔnshí dào huìyìshì.","exJa":"明日は時間通りに会議室に来てください。"},{"id":"d6-v3","zh":"负责","pinyin":"fùzé","ja":"担当する","example":"这个项目由我负责。","exPinyin":"Zhège xiàngmù yóu wǒ fùzé.","exJa":"このプロジェクトは私が担当します。"},{"id":"d6-v4","zh":"同意","pinyin":"tóngyì","ja":"同意する","example":"我同意你的看法。","exPinyin":"Wǒ tóngyì nǐ de kànfǎ.","exJa":"あなたの考えに賛成です。"}],"grammar":[{"id":"d6-g0","name":"可能補語：看得懂","pinyin":"de/bu","meaning":"〜して理解できる/できない","explain":"動詞＋得/不＋結果補語で可能・不可能を表します。","contrast":"看懂 は理解する、看得懂 は読んで理解できる、看不懂 は読んでも分からない。","mistake":"会と混同しないこと。","example":"这篇文章我看得懂。","exPinyin":"Zhè piān wénzhāng wǒ kàn de dǒng.","exJa":"この文章は読んで理解できます。","test":"この説明は聞いて分かりません。","answer":"这个说明我听不懂。"},{"id":"d6-g1","name":"可能補語：买得到","pinyin":"de dào","meaning":"手に入れられる","explain":"動詞＋得到/不到で、目的を達成できるかを表します。","contrast":"买得到 は買える、买不到 は買えない。","mistake":"可能性というより結果達成の可否です。","example":"这个票今天买得到吗？","exPinyin":"Zhège piào jīntiān mǎi de dào ma?","exJa":"このチケットは今日買えますか。","test":"この店は予約できますか。","answer":"这家店订得到吗？"},{"id":"d6-g2","name":"比構文","pinyin":"bǐ","meaning":"AはBより〜","explain":"A比B＋形容詞で比較を表します。","contrast":"上海比东京热。形容詞の前に很は普通入れません。","mistake":"比东京很热 は不自然です。","example":"上海比东京方便。","exPinyin":"Shànghǎi bǐ Dōngjīng fāngbiàn.","exJa":"上海は東京より便利です。","test":"今日は昨日より寒いです。","answer":"今天比昨天冷。"}]},{"day":7,"title":"Day 7｜HSK4 基礎強化","vocab":[{"id":"d7-v0","zh":"拒绝","pinyin":"jùjué","ja":"断る","example":"如果不方便，可以直接拒绝。","exPinyin":"Rúguǒ bù fāngbiàn, kěyǐ zhíjiē jùjué.","exJa":"都合が悪ければ、直接断ってもいいです。"},{"id":"d7-v1","zh":"解释","pinyin":"jiěshì","ja":"説明する","example":"你能再解释一下吗？","exPinyin":"Nǐ néng zài jiěshì yíxià ma?","exJa":"もう一度説明してもらえますか。"},{"id":"d7-v2","zh":"改变","pinyin":"gǎibiàn","ja":"変える","example":"计划有一点改变。","exPinyin":"Jìhuà yǒu yìdiǎn gǎibiàn.","exJa":"予定に少し変更があります。"},{"id":"d7-v3","zh":"推迟","pinyin":"tuīchí","ja":"延期する","example":"会议推迟到下午三点。","exPinyin":"Huìyì tuīchí dào xiàwǔ sān diǎn.","exJa":"会議は午後3時に延期されました。"},{"id":"d7-v4","zh":"提前","pinyin":"tíqián","ja":"前倒しする","example":"我们提前十分钟出发吧。","exPinyin":"Wǒmen tíqián shí fēnzhōng chūfā ba.","exJa":"10分早めに出発しましょう。"}],"grammar":[{"id":"d7-g0","name":"没有〜那么〜","pinyin":"méiyǒu nàme","meaning":"〜ほど…ではない","explain":"A没有B那么＋形容詞で、AはBほど〜ではないと言います。","contrast":"比は「より〜」、没有那么は「ほど〜ではない」。","mistake":"我的中文没有我想象的那么好 が自然です。","example":"我的中文没有我想象的那么好。","exPinyin":"Wǒ de Zhōngwén méiyǒu wǒ xiǎngxiàng de nàme hǎo.","exJa":"私の中国語は思っていたほど良くありません。","test":"上海の冬は東京ほど寒くありません。","answer":"上海的冬天没有东京那么冷。"},{"id":"d7-g1","name":"越来越","pinyin":"yuèláiyuè","meaning":"ますます〜","explain":"変化がだんだん強くなることを表します。","contrast":"越来越自然 はだんだん自然になる。越A越BはAすればするほどBです。","mistake":"more and moreを直訳せず、越来越＋形容詞で覚えます。","example":"我的中文越来越自然了。","exPinyin":"Wǒ de Zhōngwén yuèláiyuè zìrán le.","exJa":"私の中国語はますます自然になってきました。","test":"上海の生活にますます慣れてきました。","answer":"我越来越习惯上海的生活了。"},{"id":"d7-g2","name":"越〜越〜","pinyin":"yuè…yuè…","meaning":"〜すればするほど〜","explain":"越A越Bで、Aの程度が上がるほどBも変化することを表します。","contrast":"越学越有意思 は学べば学ぶほど面白い。","mistake":"前後の関係をはっきりさせます。","example":"中文越学越有意思。","exPinyin":"Zhōngwén yuè xué yuè yǒu yìsi.","exJa":"中国語は学べば学ぶほど面白いです。","test":"話せば話すほど自然になります。","answer":"越说越自然。"}]}]

const TOTAL_DAYS=90;
const PAID_CONTENT_CACHE_KEY='hsk4-paid-content-v1';
function paywallUrl(){ return localStorage.getItem('hsk4-paywall-url')||'https://hsk4-paywall.hsk4test.workers.dev'; }
function lessonAvailable(day){ return LESSONS.some(function(l){ return l.day===day; }); }
function mergePaidContent(data){
  if(!data) return false;
  try{
    if(Array.isArray(data.lessons)){
      var have={}; LESSONS.forEach(function(l){ have[l.day]=true; });
      data.lessons.forEach(function(l){ if(!have[l.day]){ LESSONS.push(l); have[l.day]=true; } });
      LESSONS.sort(function(a,b){ return a.day-b.day; });
    }
    if(data.bank) Object.assign(BANK, data.bank);
    if(data.listening) Object.assign(LISTENING, data.listening);
    return true;
  }catch(e){ return false; }
}
(function restorePaidContentCache(){
  // 初回描画より前（この位置）で同期的に行う必要がある。宣言順の注意点は
  // CLAUDE.md参照（try/catchで定義前のconstを踏むと黙って誤動作する）。
  try{
    var raw=localStorage.getItem(PAID_CONTENT_CACHE_KEY);
    if(raw) mergePaidContent(JSON.parse(raw));
  }catch(e){}
})();
(function cleanupCancelledPurchaseUrl(){
  // 決済キャンセルで戻ってきたときのURL掃除。成功時(purchase=success)はログインが
  // 前提になるため、onAuthStateChangedの中で処理する（initFirebase()参照）。
  try{
    if(new URLSearchParams(location.search).get('purchase')==='cancel'){
      history.replaceState(null,'',location.pathname);
    }
  }catch(e){}
})();
async function fetchPaidContent(){
  if(!firebaseReady || !auth || !auth.currentUser) return false;
  try{
    var token=await auth.currentUser.getIdToken();
    var res=await fetch(paywallUrl()+'/content', { headers:{ 'Authorization':'Bearer '+token } });
    if(!res.ok) return false;
    var data=await res.json();
    var okMerge=mergePaidContent(data);
    if(okMerge){ try{ localStorage.setItem(PAID_CONTENT_CACHE_KEY, JSON.stringify(data)); }catch(e){} }
    return okMerge;
  }catch(e){ return false; }
}
async function startCheckout(){
  if(!firebaseReady){ alert('クラウド同期は現在利用できません。しばらくしてからお試しください。'); return; }
  if(!auth || !auth.currentUser){ window.hsk4GoogleLogin(); return; }
  try{
    var token=await auth.currentUser.getIdToken();
    var res=await fetch(paywallUrl()+'/checkout', { method:'POST', headers:{ 'Authorization':'Bearer '+token } });

// ===== ブックマーク：並び替え（「おすすめ」順は統合復習スケジュール state.srs を参照、bookmarks本体は非破壊） =====
var _bmRandom=null; // ランダム並びのキャッシュ（id配列）。再描画で並びが変わらないように保持
function bmSortedItems(){
  var arr=Object.values(state.bookmarks||{});
  var mode=state.bmSort||'recommend';
  if(mode==='hard'){ return arr.sort(function(a,b){return ((state.levels[b.id]||0)-(state.levels[a.id]||0))||(a.day-b.day);}); }
  if(mode==='added'){ return arr.reverse(); } // 追加が新しい順
  if(mode==='random'){
    var map={}; arr.forEach(function(b){ map[b.id]=b; });
    if(!_bmRandom){ _bmRandom=_shuffle(arr.map(function(b){return b.id;})); }
    var out=[];
    _bmRandom.forEach(function(id){ if(map[id]){ out.push(map[id]); delete map[id]; } });
    Object.keys(map).forEach(function(id){ out.push(map[id]); }); // 後から追加された語は末尾へ
    return out;
  }
  // recommend（おすすめ）：今日が期限の語を上に→未学習→先の予定。期限は復習で変わるので毎日入れ替わる
  var now=nowMs();
  function rank(b){ var s=state.srs[b.id]; if(!s) return [1,0]; var d=s.due||0; return (d<=now)?[0,d]:[2,d]; }
  return arr.sort(function(a,b){ var ra=rank(a), rb=rank(b); return (ra[0]-rb[0])||(ra[1]-rb[1])||(a.day-b.day); });
}
function bmSortChips(){
  var cur=state.bmSort||'recommend';
  var opts=[['recommend','おすすめ'],['hard','苦手順'],['added','追加順'],['random','ランダム']];
  return opts.map(function(o){ return '<button type="button" class="chip-toggle'+(cur===o[0]?' on':'')+'" data-action="bmSort" data-id="'+o[0]+'">'+o[1]+'</button>'; }).join('');
}
function bmSetSort(s){

  if(s==='random' && state.bmSort==='random') _bmRandom=null; // ランダム再タップで再シャッフル
  if(s!=='random') _bmRandom=null;                           // 他へ切替えたらキャッシュ破棄
  state.bmSort=s; save(); renderBookmarkPanel();
}

/* ===== 新ミニテストエンジン（案P：1問ずつ・即時解説・AI作文採点） ===== */
var _mt=null;
function mtEsc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function mtRich(s){return mtEsc(s).replace(/&lt;z&gt;/g,'<z>').replace(/&lt;\/z&gt;/g,'</z>').replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>');}
function mtBlank(s){return String(s).replace(/[_＿]{2,}|　+/g,'<span class="mt-blank"></span>');}
function mtShuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function mtRand(a){return a[Math.floor(Math.random()*a.length)];}
function mtOptsZh(q){
  // タグ・設問文の型ごとに選択肢の言語は一定（実データで検証済み）。
  // 「丁寧」「以上／以下」のような仮名を含まない日本語の言い回しがあるため、
  // 文字だけで中国語か判定すると誤る。型で決める。
  if(q.tag.indexOf('意味')>=0) return false;                                    // 語彙・意味：選択肢は日本語
  if(q.tag.indexOf('使い分け')>=0) return true;                                  // 語彙・使い分け：選択肢は中国語
  if(/の使い方として正しいものは|を使うときに気をつける点は/.test(q.q)) return false; // 文法の意味・注意点：日本語
  return true;                                                                  // 文法の文完成・空欄・語順：中国語
}
function mtOptLabel(t, zh){ var r=mtRich(t); return zh ? '<z>'+r+'</z>' : r; }
function mtGraderUrl(){ return localStorage.getItem('hsk4-grader-url')||'https://hsk4-grader.hsk4test.workers.dev'; }
function mtPick(day){
  var b=BANK[day];
  var meaning=b.mc.filter(function(q){return q.tag.indexOf('意味')>=0;});
  var usage  =b.mc.filter(function(q){return q.tag.indexOf('使い分け')>=0;});
  var grammar=b.mc.filter(function(q){return q.tag.indexOf('文法')>=0;});
  // 文法を置いていない日があるので、狙ったタグが尽きたら残りの問題から埋める。
  var used=[];
  function pick(arr){
    var pool=arr.filter(function(x){ return used.indexOf(x)<0; });
    if(!pool.length) pool=b.mc.filter(function(x){ return used.indexOf(x)<0; });
    if(!pool.length) pool=b.mc;
    var q=mtRand(pool); used.push(q); return q;
  }
  var five=[pick(meaning), pick(usage), pick(grammar), pick(grammar)];
  if(Math.random()<0.5){ five.push(Object.assign({__t:'drag'}, b.drag)); }
  else { var wi=Math.floor(Math.random()*b.writing.length); var w=b.writing[wi]; five.push(Object.assign({__t:'writing', idx:wi, vocab:b.vocab, grammar:b.grammar}, w)); }
  return five.map(function(q){ if(q.opts){ var c=Object.assign({},q); c.opts=mtShuffle(q.opts); return c; } return q; });
}
function mtInit(day){
  if(!BANK[day]){ var r0=$('mtRoot'); if(r0) r0.innerHTML='<div class="small muted">この日のミニテストは準備中です。</div>'; return; }
  _mt={ day:day, quiz:mtPick(day), idx:0, correct:0, answered:false };
  mtRender();
}
function mtRender(){
  var root=$('mtRoot'); if(!root) return;
  var q=_mt.quiz[_mt.idx];
  var head='<div class="mt-counter">問'+(_mt.idx+1)+' / '+_mt.quiz.length+'</div>'+
           '<div class="mt-prog"><i style="width:'+(_mt.idx/_mt.quiz.length*100)+'%"></i></div>';
  _mt.answered=false;
  if(q.opts){ root.innerHTML=head+mtMC(q); mtBindMC(q); }
  else if(q.__t==='drag'){ root.innerHTML=head+mtDrag(q); mtBindDrag(q); }
  else if(q.__t==='writing'){ root.innerHTML=head+mtWriting(q); mtBindWriting(q); }
}
function mtMC(q){
  var h='<span class="mt-qtype">'+mtEsc(q.tag)+'</span><div class="mt-q">'+mtBlank(mtRich(q.q))+'</div><div class="mt-opts">';
  var _zh=mtOptsZh(q);
  q.opts.forEach(function(o,i){ h+='<button class="mt-opt" data-i="'+i+'"><span>'+mtOptLabel(o.t,_zh)+'</span><span class="mk"></span></button>'; });
  h+='</div><div id="mtExp"></div><div id="mtNx"></div>';
  return h;
}
function mtBindMC(q){
  var root=$('mtRoot');
  [].forEach.call(root.querySelectorAll('.mt-opt'),function(btn){ btn.onclick=function(){ if(_mt.answered)return; mtChooseMC(q,Number(btn.dataset.i)); }; });
}
function mtChooseMC(q,choice){
  _mt.answered=true;
  var ci=-1; q.opts.forEach(function(o,i){ if(o.ok)ci=i; });
  var right=(choice===ci); if(right)_mt.correct++;
  var root=$('mtRoot');
  [].forEach.call(root.querySelectorAll('.mt-opt'),function(b,i){
    b.setAttribute('disabled','');
    if(i===ci){ b.classList.add('correct'); b.querySelector('.mk').textContent='✓'; }
    if(i===choice && !right){ b.classList.add('wrong'); b.querySelector('.mk').textContent='✗'; }
  });
  var _zh=mtOptsZh(q);
  var e='<div class="mt-exp"><h4>'+(right?'正解 ✓':'不正解 ✗')+'</h4>';
  q.opts.forEach(function(o,i){
    if(o.ok) e+='<div class="row"><span class="o">○ '+mtOptLabel(o.t,_zh)+'：</span>'+mtRich(o.why)+'</div>';
    else if(i===choice) e+='<div class="row"><span class="x">× '+mtOptLabel(o.t,_zh)+'（あなたの解答）：</span>'+mtRich(o.why)+'</div>';
    else e+='<div class="row"><span class="x">× '+mtOptLabel(o.t,_zh)+'：</span>'+mtRich(o.why)+'</div>';
  });
  e+='</div>';
  $('mtExp').innerHTML=e; mtNext();
}
function mtDrag(q){
  var sh=mtShuffle(q.words);
  var h='<span class="mt-qtype">語順</span><div class="mt-q">語句を正しい順番にタップしてください。</div>';
  h+='<div class="mt-built" id="mtBuilt"></div><div class="mt-chips" id="mtBank">';
  sh.forEach(function(w){ h+='<button class="mt-chip" data-w="'+mtEsc(w)+'">'+mtEsc(w)+'</button>'; });
  h+='</div><div id="mtExp"></div><div id="mtNx"></div>';
  return h;
}
function mtBindDrag(q){
  var built=[]; var be=$('mtBuilt');
  function redraw(){ be.innerHTML=built.map(function(w){return '<span>'+mtEsc(w)+'</span>';}).join(' '); }
  [].forEach.call($('mtRoot').querySelectorAll('#mtBank .mt-chip'),function(b){
    b.onclick=function(){ if(_mt.answered)return; b.setAttribute('disabled',''); built.push(b.dataset.w); redraw(); if(built.length===q.words.length) mtGradeDrag(q,built.join('')); };
  });
}
function mtGradeDrag(q,made){
  _mt.answered=true;
  var nm=function(s){return s.replace(/[，,。\s]/g,'');};
  var right=(nm(made)===nm(q.answer)); if(right)_mt.correct++;
  var e='<div class="mt-exp"><h4>'+(right?'正解 ✓':'不正解 ✗')+'</h4>';
  e+='<div class="row"><span class="o">正しい語順：</span><z>'+mtEsc(q.answer)+'</z></div>';
  if(!right) e+='<div class="row"><span class="x">あなたの解答：</span><z>'+mtEsc(made)+'</z></div>';
  e+='<div class="row">'+mtRich(q.why)+'</div></div>';
  $('mtExp').innerHTML=e; mtNext();
}
function mtWriting(q){
  var h='<span class="mt-qtype">作文（AI採点）</span><div class="mt-q">次の日本語を中国語で書いてください：\n「'+mtEsc(q.prompt)+'」</div>';
  h+='<textarea class="mt-ta" id="mtTa" maxlength="200" placeholder="ここに中文を入力" spellcheck="false"></textarea>';
  h+='<button class="mt-btn" id="mtGrade">採点してもらう</button><div id="mtExp"></div><div id="mtNx"></div>';
  return h;
}
function mtBindWriting(q){ $('mtGrade').onclick=function(){ mtGradeWriting(q); }; }
function mtGradeWriting(q){
  if(_mt.answered) return;
  var ta=$('mtTa'); var userZh=(ta.value||'').trim(); if(!userZh){ ta.focus(); return; }
  if(userZh.length>200){ ta.focus(); return; }
  var gb=$('mtGrade'); gb.setAttribute('disabled',''); gb.innerHTML='<span class="mt-spin"></span> 採点中…';
  // 出題文・模範解答は送らない。採点サーバー側が day/idx から自分のデータを引く。
  // Day8以降は購入済みユーザーのみなので、ログイン中ならIDトークンを付けておく
  // （Day1-7は付けなくても採点される）。
  (firebaseReady && auth && auth.currentUser ? auth.currentUser.getIdToken() : Promise.resolve(null))
  .catch(function(){ return null; })
  .then(function(token){
    var headers={'Content-Type':'application/json'};
    if(token) headers['Authorization']='Bearer '+token;
    return fetch(mtGraderUrl(),{ method:'POST', headers:headers,
      body:JSON.stringify({ day:_mt.day, idx:q.idx, user_zh:userZh }) });
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if(data.error) throw new Error(data.error);
    _mt.answered=true; ta.setAttribute('disabled','');
    var vC=data.verdict==='correct'?'v-correct':data.verdict==='acceptable'?'v-acceptable':'v-incorrect';
    var vL=data.verdict==='correct'?'正解':data.verdict==='acceptable'?'惜しい（通じる）':'要改善';
    if(data.verdict==='correct')_mt.correct++;
    var e='<div class="mt-exp"><span class="mt-verdict '+vC+'">'+vL+'　'+(data.score!=null?data.score+'点':'')+'</span>';
    e+='<div class="row">'+mtEsc(data.comment||'')+'</div>';
    if(data.corrected) e+='<div class="row"><span class="o">自然な言い方：</span><z>'+mtEsc(data.corrected)+'</z></div>';
    e+='<div class="row" style="margin-top:6px;color:var(--muted)">参考解答：<z>'+mtEsc(q.answer)+'</z></div></div>';
    $('mtExp').innerHTML=e; gb.style.display='none'; mtNext();
  })
  .catch(function(err){
    _mt.answered=true; ta.setAttribute('disabled',''); gb.style.display='none';
    $('mtExp').innerHTML='<div class="mt-exp"><h4 style="color:var(--bad)">採点に失敗しました</h4>'+
      '<div class="row">'+mtEsc(String(err.message||err))+'</div>'+
      '<div class="row" style="color:var(--muted)">採点サーバーに接続できませんでした。設定で採点サーバーURLを確認してください。</div>'+
      '<div class="row" style="margin-top:6px;color:var(--muted)">参考解答：<z>'+mtEsc(q.answer)+'</z></div></div>';
    mtNext();
  });
}
function mtNext(){
  var last=(_mt.idx>=_mt.quiz.length-1);
  $('mtNx').innerHTML='<div class="mt-next"><button class="mt-btn" id="mtGo">'+(last?'結果を見る':'次の問題へ')+'</button></div>';
  $('mtGo').onclick=mtAdvance;
}
function mtAdvance(){
  _mt.idx++;
  if(_mt.idx>=_mt.quiz.length) return mtResult();
  mtRender(); var r=$('mtRoot'); if(r) r.scrollIntoView({block:'start',behavior:'smooth'});
}
function mtResult(){
  var n=_mt.correct, total=_mt.quiz.length, pct=Math.round(n/total*100);
  state.scores[_mt.day]=n; save();
  track('minitest_finish',{day:_mt.day, correct:n, total:total});
  var msg=pct===100?'満点！':pct>=80?'よくできました。':pct>=60?'あと少し。解説を読み返しましょう。':'復習タブで反復しましょう。';
  var root=$('mtRoot');
  root.innerHTML='<div class="mt-result"><div class="sc">'+n+' / '+total+'</div><div class="sub">'+pct+'％　'+msg+'</div>'+
    '<div class="mt-next"><button class="mt-btn ghost" id="mtAgain">やり直す（別の問題）</button></div></div>';
  $('mtAgain').onclick=function(){ mtInit(_mt.day); var r=$('mtRoot'); if(r) r.scrollIntoView({block:'start',behavior:'smooth'}); };
  showAnswers=true; var ab=$('answerBtn'); if(ab){ab.textContent='解答を隠す'; ab.className='toggle on';} $('content').className='show-answers';
}
function mtSaveGraderUrl(){
  var inp=$('graderUrlInput'); if(!inp) return;
  var v=(inp.value||'').trim();
  var msg=$('graderUrlMsg');
  if(v && !/^https?:\/\//.test(v)){ if(msg){msg.textContent='URLは http(s):// で始めてください。'; msg.style.color='var(--bad)';} return; }
  if(v) localStorage.setItem('hsk4-grader-url', v); else localStorage.removeItem('hsk4-grader-url');
  if(msg){ msg.textContent='保存しました。'; msg.style.color='var(--good)'; }
}

function srsCard(id){
  var sid=String(id||'');
  if(sid.indexOf('cw-')===0){
    var w=(state.customWords||[]).find(function(x){ return x && x.id===sid; });
    if(!w) return null;
    return {id:sid, type:'単語', day:0, custom:true, zh:w.zh, pin:w.pinyin, ja:w.ja, ex:w.example, exP:w.exPinyin, exJ:w.exJa};
  }
  var m=sid.match(/^d(\d+)-([vg])(\d+)$/);
  if(!m) return null;
  var l=LESSONS.find(function(x){return x.day===Number(m[1]);});
  if(!l) return null;
  if(m[2]==='v'){ var v=l.vocab[Number(m[3])]; if(!v) return null;
    return {id:id, type:'単語', day:l.day, zh:v.zh, pin:v.pinyin, ja:v.ja, ex:v.example, exP:v.exPinyin, exJ:v.exJa}; }
  var g=l.grammar[Number(m[3])]; if(!g) return null;
  return {id:id, type:'文法', day:l.day, zh:g.name, pin:g.pinyin, ja:g.meaning, ex:g.example, exP:g.exPinyin, exJ:g.exJa, contrast:g.contrast};
}
function cwNewId(){ return 'cw-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8); }
function cwEnsureIds(){ var ch=false; (state.customWords||[]).forEach(function(w){ if(w && !w.id){ w.id=cwNewId(); ch=true; } }); if(ch){ try{ localStorage.setItem(storageKey, JSON.stringify(state)); }catch(e){} } return ch; }
function srsEligibleIds(scope){
  scope=scope||state.revScope||'all';
  var set={};
  LESSONS.forEach(function(l){
    if(state.completed[l.day]){
      l.vocab.forEach(function(v){ set[v.id]=true; });
      l.grammar.forEach(function(g){ set[g.id]=true; });
    }
  });
  Object.keys(state.bookmarks||{}).forEach(function(id){ if(/^d\d+-[vg]\d+$/.test(id)) set[id]=true; });
  (state.customWords||[]).forEach(function(w){ if(w && w.id) set[w.id]=true; }); // マイ単語も復習対象（bm絞り込み時は下で除外）
  // コンテンツ変更などでもう存在しないIDは、件数と実際に出せる問題数がズレる原因になるので先に除く。
  var ids=Object.keys(set).filter(function(id){ return !!srsCard(id); });
  if(scope==='bm'){ ids=ids.filter(function(id){ return state.bookmarks && state.bookmarks[id]; }); }
  return ids;
}
function srsCounts(scope){
  var elig=srsEligibleIds(scope), now=nowMs(), due=0, fresh=0;
  elig.forEach(function(id){ var s=state.srs[id]; if(!s) fresh++; else if((s.due||0)<=now) due++; });
  return {elig:elig.length, due:due, fresh:fresh};
}
function srsBuildDue(newLimit, scope, dueLimit){
  var elig=srsEligibleIds(scope), now=nowMs(), due=[], fresh=[];
  elig.forEach(function(id){ var s=state.srs[id]; if(!s) fresh.push(id); else if((s.due||0)<=now) due.push(id); });
  // 久しぶりに開くと期限切れが一気に溜まるので、最も古いものから優先し、上限を超えた分は翌日以降に残す。
  due.sort(function(a,b){ return (state.srs[a].due||0)-(state.srs[b].due||0); });
  if(typeof dueLimit==='number' && dueLimit>=0) due=due.slice(0, dueLimit);
  due=_shuffle(due); fresh=_shuffle(fresh);
  if(newLimit>=0) fresh=fresh.slice(0, newLimit);
  return due.concat(fresh);
}
var LEECH_LAPSES=4; // 「もう一度」がこの回数以上で「つまずき語（リーチ）」
function srsIsLeech(id){ var s=state.srs[id]; return !!(s && (s.lapses||0)>=LEECH_LAPSES); }
function srsGrade(id, q){
  var s=state.srs[id]||{ef:2.5, interval:0, reps:0, due:0, last:0, lapses:0};
  if(q<3){ s.reps=0; s.interval=1; s.lapses=(s.lapses||0)+1; } // もう一度＝つまずき（lapse）を加算
  else{
    s.reps=(s.reps||0)+1;
    if(s.reps===1) s.interval=1;
    else if(s.reps===2) s.interval=6;
    else s.interval=Math.round((s.interval||1)*(s.ef||2.5));
    s.ef=(s.ef||2.5)+(0.1-(5-q)*(0.08+(5-q)*0.02));
    if(s.ef<1.3) s.ef=1.3;
  }
  var now=nowMs();
  s.last=now; s.due=now + (s.interval||1)*86400000;
  state.srs[id]=s; save();
  return s;
}

  var nl=(typeof state.srsNewLimit==='number')?state.srsNewLimit:8;

  var pool=srsBuildDue(nl, state.revScope, dl);
  if(!pool.length){ _rev=null; renderTestScreen(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  _rev={queue:pool, idx:0, revealed:false, again:0, hard:0, good:0, easy:0, reviewed:0};
  track('srs_start',{n:pool.length, scope:state.revScope, dir:state.srsDir});
  renderTestScreen(); window.scrollTo({top:0,behavior:'smooth'});
}
function revReveal(){ if(_rev){ _rev.revealed=true; renderTestScreen(); } }
function revGrade(q){
  if(!_rev) return;
  var id=_rev.queue[_rev.idx];
  srsGrade(id, q);
  if(q===2) _rev.again++; else if(q===3) _rev.hard++; else if(q===4) _rev.good++; else _rev.easy++;
  _rev.reviewed++;
  if(q===2) _rev.queue.push(id); // もう一度→このセッションの最後に再登場
  _rev.idx++; _rev.revealed=false;
  renderTestScreen();
}
function revEnd(){ trackSrsEnd('button'); _rev=null; renderTestScreen(); window.scrollTo({top:0,behavior:'smooth'}); }
function _revRender(c){
  while(_rev.idx<_rev.queue.length && !srsCard(_rev.queue[_rev.idx])) _rev.idx++;
  if(_rev.idx<_rev.queue.length){
    var card=srsCard(_rev.queue[_rev.idx]);
    var remain=_rev.queue.length-_rev.idx;
    var leech=srsIsLeech(card.id);
    function exBlock(){
      if(!card.ex){ return leech?'<div class="leech-tip">🔁 つまずき中：例文がない語です。短い例文を自作する／出題の向きを変えると覚えやすくなります。</div>':''; }
      var tip=leech?'<div class="leech-tip">🔁 つまずき中：例文ごと声に出して、文脈で覚えてみましょう（向きを変えるのも有効）。</div>':'';
      return tip+'<div class="ex'+(leech?' ex-leech':'')+'" style="text-align:left;margin-top:10px"><div style="color:var(--ink);font-weight:600">'+esc(card.ex)+' <button class="speak-btn" onclick="speakZh(\''+esc(card.ex)+'\')" aria-label="例文を再生"><svg class="spk-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg></button></div>'+(card.exP?'<div class="small">'+esc(card.exP)+'</div>':'')+(card.exJ?'<div class="small">'+esc(card.exJ)+'</div>':'')+'</div>';
    }
    // 似た意味の文法表現(了/过 など)を取り違えないよう、Day画面と同じ「違い・注意」を復習でも出す。
    function contrastBlock(){
      return card.contrast?'<div class="note" style="text-align:left;margin-top:10px"><span class="label">違い・注意：</span>'+esc(card.contrast)+'</div>':'';
    }
    var spk='<button class="speak-btn" onclick="speakZh(\''+esc(card.zh)+'\')" aria-label="発音を再生"><svg class="spk-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg></button>';
    var dir=(state.srsDir==='ja2zh')?'ja2zh':'zh2ja';
    var h='<div class="card testwrap"><div class="section-title"><h2>今日の復習'+(state.revScope==='bm'?'（ブックマーク）':'')+'</h2><span class="badge">残り '+remain+'問</span></div>';
    h+='<div class="flashcard"><span class="badge">'+esc(card.type)+'</span><span class="badge">'+(card.custom?'マイ単語':'Day '+card.day)+'</span>'+(leech?'<span class="badge badge-leech">🔁 つまずき中</span>':'');
    if(dir==='zh2ja'){
      h+='<div class="fc-prompt">'+esc(card.zh)+' '+spk+'</div>';
      if(!_rev.revealed){
        h+='<div class="fc-sub">→ 拼音と意味を思い出そう</div>';
        h+='<div class="fc-actions"><button class="primary" onclick="revReveal()">答えを見る</button></div>';
      } else {
        h+='<div class="fc-answer"><div class="a-main">'+esc(card.ja)+'</div>';
        if(card.pin) h+='<div class="fc-sub">'+esc(card.pin)+'</div>';
        h+=exBlock();
        h+=contrastBlock();
        h+='</div>';
        h+='<div class="fc-actions g4"><button class="g4-again" onclick="revGrade(2)">もう一度</button><button class="g4-hard" onclick="revGrade(3)">難しい</button><button class="g4-good" onclick="revGrade(4)">普通</button><button class="g4-easy" onclick="revGrade(5)">簡単</button></div>';
      }
    } else {
      h+='<div class="fc-prompt">'+esc(card.ja)+'</div>';
      if(!_rev.revealed){
        h+='<div class="fc-sub">→ 中文を思い出そう</div>';
        h+='<div class="fc-actions"><button class="primary" onclick="revReveal()">答えを見る</button></div>';
      } else {
        h+='<div class="fc-answer"><div class="a-main">'+esc(card.zh)+' '+spk+'</div>';
        if(card.pin) h+='<div class="fc-sub">'+esc(card.pin)+'</div>';
        h+=exBlock();
        h+=contrastBlock();
        h+='</div>';
        h+='<div class="fc-actions g4"><button class="g4-again" onclick="revGrade(2)">もう一度</button><button class="g4-hard" onclick="revGrade(3)">難しい</button><button class="g4-good" onclick="revGrade(4)">普通</button><button class="g4-easy" onclick="revGrade(5)">簡単</button></div>';
      }

  }
  var r=_rev;
  c.innerHTML='<div class="card testwrap"><div class="section-title"><h2>復習おつかれさま</h2><span class="badge">'+r.reviewed+'問</span></div>'+
    '<div class="scorebox hsk-pop"><b>'+r.reviewed+'問</b>を復習しました。<br>もう一度：<b>'+r.again+'</b>／難しい：<b>'+r.hard+'</b>／普通：<b>'+r.good+'</b>／簡単：<b>'+r.easy+'</b><br><span class="small muted">覚えた語は間隔があき、あやふやな語は近いうちにまた出ます。</span></div>'+
    '<div class="row" style="margin-top:12px"><button class="primary" onclick="revStart()">続けて復習</button><button onclick="revEnd()">復習ホームへ</button></div></div>';

}
function _toast(msg){

function renderTestScreen(){
  var c=$('content'); c.style.display=''; c.className='';
  $('bookmarkPanel').className='bookmark-panel card';
  if(_rev){ _revRender(c); return; }
  // 復習は「開いたら始める」画面。出題範囲・新規問数・出題の向きは一度決めたら
  // ほぼ変えない設定なので、毎日通る導線から外して設定タブへ移した。
  var scope=(state.revScope==='bm')?'bm':'all';
  var nl=(typeof state.srsNewLimit==='number')?state.srsNewLimit:8;
  var dl=(typeof state.srsDueLimit==='number')?state.srsDueLimit:30;
  var cnt=srsCounts(scope);
  var shownNew=(nl<0)?cnt.fresh:Math.min(nl,cnt.fresh);
  var shownDue=(dl<0)?cnt.due:Math.min(dl,cnt.due);
  var carryOver=cnt.due-shownDue;
  var todayTotal=shownDue+shownNew;
  var html='<div class="card testwrap"><div class="section-title"><h2>今日の復習</h2><span class="badge">'+todayTotal+'問</span></div>';
  if(cnt.elig===0){
    html+='<div class="empty" style="margin-top:4px">'+(scope==='bm'?'ブックマークがまだありません。学習画面で単語・文法の ☆ を押すと、ここで復習できます。':'まだ復習対象がありません。学習画面で各Dayを完了すると、その単語・文法が復習に入ります。')+'</div>';
    html+='<button style="width:100%;margin-top:12px" onclick="showToday()">今日やることへ戻る</button>';
  } else if(todayTotal===0){
    html+='<div class="empty" style="margin-top:4px">今日ぶんの復習は終わっています。おつかれさまでした。</div>';
    html+='<button style="width:100%;margin-top:12px" onclick="showToday()">今日やることへ戻る</button>';
  } else {
    html+='<div class="small muted" style="margin-top:2px">期限 '+shownDue+'問'+(carryOver>0?'（+'+carryOver+'問は明日以降に持ち越し）':'')+' ＋ 新しく覚える '+shownNew+'問。忘れる頃に自動で出題します（間隔反復）。</div>';
    html+='<button class="primary" style="width:100%;margin-top:12px" onclick="revStart()">復習を始める（'+todayTotal+'問）</button>';
    html+='<button style="width:100%;margin-top:8px" onclick="showToday()">あとにする</button>';
  }
  html+='<div class="small muted" style="margin-top:14px">出題範囲や1日の新規問数は<a href="#" onclick="showSettings();return false">設定</a>で変更できます。</div>';
  html+='</div>';
  c.innerHTML=html;
}

// ===== 計測 =====
// track(name, props) を呼ぶだけ。送信先(HSK_SINK)が未設定なら端末内に貯める。
// 利用者が増えて送信先を決めたら、設定画面でURLを入れるだけで飛び始める。
var TRACK_KEY='hsk4-events', TRACK_MAX=500;
function trackSinkUrl(){ try{ return localStorage.getItem('hsk4-sink-url')||''; }catch(e){ return ''; } }
function trackRead(){ try{ return JSON.parse(localStorage.getItem(TRACK_KEY)||'[]'); }catch(e){ return []; } }
function track(name, props){
  // 名前とプロパティは別の入れ物に置く。同じ階層に混ぜると props のキーが
  // 名前を上書きしうる（実際 {n:...} が名前を潰していた）。
  var ev={ t:Date.now(), e:name };
  if(props) ev.p=props;
  try{
    var log=trackRead(); log.push(ev);
    if(log.length>TRACK_MAX) log=log.slice(-TRACK_MAX);
    localStorage.setItem(TRACK_KEY, JSON.stringify(log));
  }catch(e){}
  var url=trackSinkUrl();
  if(url){
    try{
      var body=JSON.stringify(ev);
      if(navigator.sendBeacon) navigator.sendBeacon(url, new Blob([body],{type:'application/json'}));
      else fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:body,keepalive:true}).catch(function(){});
    }catch(e){}
  }
}

// ===== 模擬試験 =====
// 本番のHSK4は 听力45／阅读40／书写15。このアプリには听力の音源が無いので、
// ここで作れるのは「読解＋語順」の模試だけ。180/300のような換算スコアは出さない。
// 出せない数字を出すと、本番で足をすくわれるのはユーザーの方なので。
var MOCK_MIN_DAYS = 10;      // これ未満だと出題の幅が足りない
var MOCK_LIMIT_SEC = 30*60;
var _mock = null, _mockTimer = null;

function mockDoneDays(){
  return LESSONS.filter(function(l){ return state.completed[l.day] && BANK[l.day]; }).map(function(l){ return l.day; });
}
function mockAvailable(){ return mockDoneDays().length >= MOCK_MIN_DAYS; }

function mockBuildQuestions(){
  var days=_shuffle(mockDoneDays().slice()), qs=[];
  days.forEach(function(d){
    var b=BANK[d]; if(!b) return;
    (b.mc||[]).forEach(function(m){
      qs.push({ kind:'mc', day:d, tag:m.tag||'語彙', q:m.q,
                opts:_shuffle((m.opts||[]).slice()) });
    });
    if(b.drag && b.drag.words) qs.push({ kind:'drag', day:d, tag:'語順', words:_shuffle(b.drag.words.slice()), answer:b.drag.answer, why:b.drag.why });
  });
  qs=_shuffle(qs);
  var mc=qs.filter(function(q){return q.kind==='mc';}).slice(0,32);
  var dg=qs.filter(function(q){return q.kind==='drag';}).slice(0,8);
  return _shuffle(mc.concat(dg));
}

function mockStart(){
  var qs=mockBuildQuestions();
  if(!qs.length){ return; }
  _mock={ qs:qs, i:0, answers:{}, built:[], startedAt:Date.now(), endsAt:Date.now()+MOCK_LIMIT_SEC*1000, done:false };
  track('mock_start',{count:qs.length});
  goView('mock');
  mockTick();
}
function mockTick(){
  if(_mockTimer) clearInterval(_mockTimer);
  _mockTimer=setInterval(function(){
    if(!_mock || _mock.done || currentView!=='mock'){ clearInterval(_mockTimer); _mockTimer=null; return; }
    if(Date.now()>=_mock.endsAt){ mockFinish(true); return; }
    var el=$('mockClock'); if(el) el.textContent=mockClockText();
  },1000);
}
function mockClockText(){
  var left=Math.max(0, Math.ceil((_mock.endsAt-Date.now())/1000));
  return Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
}
function mockPick(i){ if(!_mock||_mock.done) return; _mock.answers[_mock.i]=i; renderMockScreen(); }
function mockChip(i){
  if(!_mock||_mock.done) return;
  var b=_mock.built[_mock.i]||[]; if(b.indexOf(i)<0) b.push(i);
  _mock.built[_mock.i]=b; renderMockScreen();
}
function mockChipUndo(){ if(!_mock||_mock.done) return; var b=_mock.built[_mock.i]||[]; b.pop(); _mock.built[_mock.i]=b; renderMockScreen(); }
function mockNav(d){
  if(!_mock||_mock.done) return;
  _mock.i=Math.max(0, Math.min(_mock.qs.length-1, _mock.i+d));
  renderMockScreen(); window.scrollTo({top:0,behavior:'smooth'});
}
function mockIsRight(q, idx){
  if(q.kind==='mc'){ var o=q.opts[_mock.answers[idx]]; return !!(o && o.ok); }
  var b=(_mock.built[idx]||[]).map(function(k){ return q.words[k]; }).join('');
  return b===String(q.answer||'').replace(/[。，、？！]/g,'') || b+'。'===q.answer;
}
function mockFinish(auto){
  if(!_mock||_mock.done) return;
  if(_mockTimer){ clearInterval(_mockTimer); _mockTimer=null; }
  var byTag={}, correct=0;
  _mock.qs.forEach(function(q,idx){
    var r=mockIsRight(q,idx);
    if(r) correct++;
    if(!byTag[q.tag]) byTag[q.tag]={c:0,t:0};
    byTag[q.tag].t++; if(r) byTag[q.tag].c++;
  });
  _mock.done=true; _mock.correct=correct; _mock.byTag=byTag; _mock.auto=!!auto;
  _mock.elapsed=Math.round((Date.now()-_mock.startedAt)/1000);
  if(!Array.isArray(state.mockHistory)) state.mockHistory=[];
  state.mockHistory.push({ t:Date.now(), total:_mock.qs.length, correct:correct, elapsed:_mock.elapsed });
  if(state.mockHistory.length>20) state.mockHistory=state.mockHistory.slice(-20);
  save();
  track('mock_finish',{ total:_mock.qs.length, correct:correct, elapsed:_mock.elapsed, auto:!!auto });
  renderMockScreen(); window.scrollTo({top:0,behavior:'smooth'});
}
// 間違えた問題が出たDayの語をまとめて★に入れる。復習に流し込むのが模試の目的なので。
function mockStarWeak(){
  if(!_mock||!_mock.done) return;
  var days={}, n=0;
  _mock.qs.forEach(function(q,idx){ if(!mockIsRight(q,idx)) days[q.day]=true; });
  Object.keys(days).forEach(function(d){
    var l=LESSONS[Number(d)-1]; if(!l) return;
    l.vocab.forEach(function(v){
      if(state.bookmarks[v.id]) return;
      // toggleBookmark と同じ形で入れる（一覧はこの形を前提に描画している）
      state.bookmarks[v.id]={ id:v.id, type:'単語', title:v.zh, sub:v.ja, day:l.day,
        pinyin:v.pinyin||'', example:v.example||'', exPinyin:v.exPinyin||'', exJa:v.exJa||'', hl:0 };
      n++;
    });
  });
  save(); track('mock_star_weak',{count:n});
  _toast(n>0? n+'語をブックマークに追加しました。復習で出題されます。' : '追加できる語がありませんでした。');
  renderMockScreen();
}

// ===== 計測の確認・書き出し =====
// 利用者が少ないうちは「Day7到達率」のような割合に意味が無い（分母が小さすぎる）。
// なので率は出さず、実数と生ログだけを見せる。判断材料になるのは人数が増えてから。
function trackSummary(){
  var log=trackRead(), sum={ events:log.length, days:{}, opens:0, completes:0, srs:0, mocks:0, first:null, last:null };
  log.forEach(function(ev){
    if(!sum.first || ev.t<sum.first) sum.first=ev.t;
    if(!sum.last || ev.t>sum.last) sum.last=ev.t;
    var p=ev.p||{};
    if(ev.e==='day_open'){ sum.opens++; if(p.day) sum.days[p.day]=true; }
    else if(ev.e==='day_complete') sum.completes++;
    else if(ev.e==='srs_start') sum.srs++;
    else if(ev.e==='mock_finish') sum.mocks++;
  });
  sum.uniqueDays=Object.keys(sum.days).length;
  return sum;
}
function trackCopy(){
  var txt=JSON.stringify(trackRead());
  var done=function(){ _toast('計測ログをコピーしました（'+trackRead().length+'件）'); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, function(){ trackFallbackCopy(txt, done); }); }
  else trackFallbackCopy(txt, done);
}
function trackFallbackCopy(txt, done){
  try{
    var ta=document.createElement('textarea'); ta.value=txt;
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done();
  }catch(e){ _toast('コピーできませんでした'); }
}
function trackClear(){
  try{ localStorage.removeItem(TRACK_KEY); }catch(e){}
  _toast('計測ログを消しました'); renderSettings();
}

function _shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

// 問題タイプ1: 単語の意味を選ぶ（4択）
function _genVocabMeaningQ(l){
  var v=l.vocab;
  var correct=v[Math.floor(Math.random()*v.length)];
  var others=_shuffle(v.filter(function(x){return x.id!==correct.id;})).slice(0,3);
  var opts=_shuffle([correct.ja].concat(others.map(function(x){return x.ja;})));
  return {
    q:'次の中国語の意味として正しいものは？\n「'+correct.zh+'」（'+correct.pinyin+'）',
    opts:opts,
    ans:correct.ja,
    exp:correct.zh+'='+correct.ja+'。例：'+correct.example+' '+correct.exJa
  };
}

// 問題タイプ2: 日本語→中国語（例文とは異なる文脈で意味から選ぶ）
function _genZhFromJaQ(l){
  var v=l.vocab;
  var correct=v[Math.floor(Math.random()*v.length)];
  var others=_shuffle(v.filter(function(x){return x.id!==correct.id;})).slice(0,3);
  var opts=_shuffle([correct.zh].concat(others.map(function(x){return x.zh;})));
  return {
    q:'「'+correct.ja+'」を中国語で表現するとどれ？\nピンイン：'+correct.pinyin,
    opts:opts,
    ans:correct.zh,
    exp:correct.zh+'（'+correct.pinyin+'）='+correct.ja+'。例：'+correct.exJa
  };
}

// 問題タイプ3: 文法の意味と使い方を選ぶ
function _genGrammarMeaningQ(l){
  var g=l.grammar;
  if(!g.length) return _genVocabMeaningQ(l);   // 文法を置いていない日がある
  var correct=g[Math.floor(Math.random()*g.length)];
  var others=_shuffle(g.filter(function(x){return x.id!==correct.id;})).slice(0,2);
  var correctAns=correct.name+'：'+correct.meaning;
  var wrongOpts=others.map(function(x){return x.name+'：'+x.meaning;});
  // ダミー選択肢（正解の意味を少し変えたもの）
  var dummy=correct.name+'：'+( correct.meaning.length>4 ? correct.meaning.slice(0,-2)+'する' : correct.meaning+'こと' );
  var opts=_shuffle([correctAns].concat(wrongOpts).concat([dummy])).slice(0,4);
  if(opts.indexOf(correctAns)<0){ opts[0]=correctAns; }
  return {
    q:'文法ポイントの正しい説明はどれ？（'+correct.pinyin+'）',
    opts:opts,
    ans:correctAns,
    exp:correct.name+'の正しい使い方：'+correct.meaning+'。例：'+correct.example+' '+correct.exJa
  };
}

// 問題タイプ4: よくある誤りを選ぶ
function _genMistakeQ(l){
  var g=l.grammar.filter(function(x){return x.mistake&&x.mistake.length>4;});
  if(!g.length) return _genVocabMeaningQ(l);
  var correct=g[Math.floor(Math.random()*g.length)];
  var qText=correct.name+'を使う時に気をつけるべき点はどれ？';
  var correctAns=correct.mistake;
  var others=l.grammar.filter(function(x){return x.id!==correct.id&&x.mistake&&x.mistake.length>4;}).slice(0,2).map(function(x){return x.mistake;});
  var dummy=correct.meaning+'なら必ず'+correct.pinyin+'を使う';
  var opts=_shuffle([correctAns].concat(others).concat([dummy])).slice(0,4);
  if(opts.indexOf(correctAns)<0){ opts[0]=correctAns; }
  return {
    q:qText,
    opts:opts,
    ans:correctAns,
    exp:'注意点：'+correctAns+' 正しい例：'+correct.example+' '+correct.exJa
  };
}

// 問題タイプ5: 対比問題（contrastフィールド活用）
function _genContrastQ(l){
  var g=l.grammar.filter(function(x){return x.contrast&&x.contrast.length>5;});
  if(!g.length) return _genZhFromJaQ(l);
  var correct=g[Math.floor(Math.random()*g.length)];
  var qText=correct.name+'と他の表現の違いとして正しいものは？';
  var correctAns=correct.contrast;
  var others=l.grammar.filter(function(x){return x.id!==correct.id&&x.contrast&&x.contrast.length>5;}).slice(0,2).map(function(x){return x.contrast;});
  var dummy=correct.meaning+'で、'+( l.grammar[0]&&l.grammar[0].id!==correct.id ? l.grammar[0].meaning : '強調する' )+'とも使える';
  var opts=_shuffle([correctAns].concat(others).concat([dummy])).slice(0,4);
  if(opts.indexOf(correctAns)<0){ opts[0]=correctAns; }
  return {
    q:qText,
    opts:opts,
    ans:correctAns,
    exp:'対比ポイント：'+correctAns+' 例：'+correct.example+' （'+correct.exJa+'）'
  };
}

function startAiChallenge(){
  _aiQ=null; _aiAns=null;
  var area=$('aiChallengeArea');
  if(!area) return;
  var l2=lesson();
  var gens=[_genVocabMeaningQ, _genZhFromJaQ, _genGrammarMeaningQ, _genMistakeQ, _genContrastQ];
  try{
    var gen=gens[Math.floor(Math.random()*gens.length)];
    _aiQ=gen(l2);
    if(!_aiQ||!_aiQ.opts||_aiQ.opts.length<2) throw new Error('invalid q');
    _aiAns=null;
    _renderAiQ();
  }catch(e){
    try{ _aiQ=_genVocabMeaningQ(l2); _aiAns=null; _renderAiQ(); }
    catch(e2){ area.innerHTML='<div class="ai-challenge-box"><div class="small muted">問題を生成できませんでした。<button class="primary" onclick="startAiChallenge()" style="margin-top:8px">再試行</button></div></div>'; }
  }
}

window.speakZh = function(text){
  if(!text) return;
  // 文法の型は「因为〜所以〜」のように、語句が入る位置を「〜」で示している。
  // これは目で見るための印なので、音にする前に落とす。
  var say = String(text).replace(/[〜～／]/g,' ').replace(/\s+/g,' ').trim();
  if(!say) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(say);
  u.lang = 'zh-CN';
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
};

// マスター(75%以上)できた最高級の「ひとつ上」を学習目標に。何も届かなければHSK3。
function lcRecommend(correct,total){
  var mastered=0, bands=[3,4,5,6];
  for(var i=0;i<bands.length;i++){ var lv=bands[i]; if(correct[lv]/total[lv]>=0.75) mastered=lv; else break; }
  if(mastered===0) return 3;
  return Math.min(6, mastered+1);
}
