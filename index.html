<style>
:root{--bg:#FCF9F2;--card:#fff;--ink:#2A2724;--muted:#8A8377;--line:#E4DCCB;--accent:#2A2724;--good:#4E7A3C;--goodbg:#D5E4C8;--goodline:#B6CBA4;--bad:#B0561F;--gray:#F0EBE0;--primary:#2A2724;--primary-2:#3D3833;--brand:#F2A227;--brand-2:#D98A16;--brand-3:#FBE0BC;--paper:#FBF6EA;--caution:#B0561F;--sc-head:#2A2724;--pinyin:#7C7469;--brand-tint:#FBE0BC;--caution-tint:#F6D9D2;--primary-tint:#F0EBE0;--sage:#D5E4C8;--apricot:#FBE0BC;--blush:#F6D9D2;--stroke:#2A2724;--bw:1.5px;--font-brand:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;--font-display:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;--font-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;--font-hand:'Yomogi','Hiragino Maru Gothic ProN',cursive}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-weight:400;line-height:1.7}
.app{max-width:980px;margin:0 auto;padding:18px 12px calc(90px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:10;background:rgba(252,249,242,.90);backdrop-filter:blur(14px);border-bottom:var(--bw) solid var(--stroke);padding:calc(18px + env(safe-area-inset-top)) 16px 14px}.top-inner{max-width:980px;margin:0 auto}
h1{font-size:20px;margin:0 0 12px;letter-spacing:-.01em;line-height:1.2;text-align:left}.small{font-size:12.5px;color:var(--muted);line-height:1.7}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,button,input,textarea{font:inherit}select{flex:1;min-width:180px;border:var(--bw) solid var(--stroke);border-radius:999px;padding:11px 14px;background:#fff;font-weight:700}
button{border:var(--bw) solid var(--stroke);background:#fff;border-radius:999px;padding:11px 14px;font-weight:900;color:var(--ink);touch-action:manipulation;cursor:pointer}
.top .row button{border:var(--bw) solid var(--stroke);background:#fff;color:var(--ink)}
.nav-tabs{display:flex;gap:6px;margin-top:10px}
.nav-tab{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 6px;font-size:13px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.72);border:var(--bw) solid #CFC6B6;border-radius:999px;cursor:pointer;touch-action:manipulation;user-select:none;min-height:44px}
.nav-tab svg{display:none}
.nav-tab i{font-size:17px}
.nav-tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav-tab.active{color:var(--bg);background:var(--stroke);border-color:var(--stroke);font-weight:900}
.nav-tab.tab-done{color:var(--good)}button.primary{background:var(--accent);color:var(--bg);border-color:var(--stroke)}
button.complete.active{background:var(--goodbg);color:#2E8B62;border-color:var(--goodline)}button.toggle.off{background:#fff;color:var(--ink)}button.toggle.on{background:var(--gray);color:#5C5249}
button.bookmark{padding:7px 9px;border-radius:999px;background:#fff;color:#A29A8E}button.bookmark.active{background:#FBF4E8;border-color:#E8D9C4;color:#94621C}
.card{background:var(--card);border:var(--bw) solid var(--stroke);border-radius:20px;padding:16px;margin:12px 0}.section-title{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.section-title h2{font-size:18px;margin:0}.badge{display:inline-flex;border-radius:999px;background:var(--gray);color:#5C5249;padding:4px 10px;font-size:12px;font-weight:900}
.vocab{display:grid;gap:10px}.vitem{border:var(--bw) solid var(--stroke);border-radius:18px;padding:13px 15px;background:#fff}.item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.zh{font-size:20px;font-weight:800}.pinyin{color:#5C5249;margin-top:2px}.ja{color:#463F37;margin-top:4px}.ex{margin-top:10px;line-height:1.75}
.gitem{border:var(--bw) solid var(--stroke);border-radius:18px;padding:15px 17px;margin:10px 0;background:#fff}.gitem h3{margin:0 0 6px;font-size:17px}.label{font-weight:800;color:#463F37}.note{background:var(--paper);border:var(--bw) dashed #DFD2B8;border-radius:14px;padding:12px 14px;margin-top:8px;line-height:1.75}
.testq{border-top:1px solid var(--line);padding:14px 0}.testq:first-child{border-top:0}.opts{display:grid;gap:8px;margin-top:8px}.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px;background:#fff;min-height:44px}textarea{min-height:88px;resize:vertical}
.answer{display:none;margin-top:8px;border-radius:14px;background:#FBF7F0;border:1px dashed #DCD3C6;padding:10px}.show-answers .answer{display:block}
.hidden-ja .ja,.hidden-ja .exja{display:none}.hidden-pinyin .pinyin,.hidden-pinyin .expinyin{display:none}.scorebox{background:#FBF4E8;border:1px solid #E8D9C4;border-radius:16px;padding:12px;margin-top:12px}.good{color:var(--good);font-weight:800}.bad{color:var(--bad);font-weight:800}.muted{color:var(--muted)}
.drag-area{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding:10px;border:1px dashed #DCD3C6;border-radius:16px;background:#FBF7F0;min-height:58px}
.answer-area{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding:10px;border:1px solid #E3DBCE;border-radius:16px;background:#fff;min-height:58px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:14px;background:white;border:1px solid var(--line);font-weight:800;box-shadow:0 2px 6px rgba(16,24,40,.05);touch-action:manipulation}
.chip.used{background:var(--gray);color:#A29A8E;text-decoration:line-through}
.chip.answer-chip{background:#221B15;color:white;border-color:#221B15}
.chip.dragging{opacity:.45}.chip.selected{outline:3px solid #CFC6B6}
.bookmark-panel{display:none}.bookmark-panel.active{display:block}.empty{padding:14px;border:1px dashed #DCD3C6;border-radius:16px;background:#FBF7F0;color:var(--muted)}
.bm-stickybar{position:sticky;top:var(--top-h,64px);z-index:8;background:var(--card);padding:8px 0;margin:0 0 8px;box-shadow:0 6px 10px -6px rgba(16,24,40,.18)}


.day-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.daybtn{padding:10px 0;border-radius:12px;background:#fff}.daybtn.done{background:var(--goodbg);border-color:var(--goodline);color:#2E8B62}
.progressline{height:10px;border-radius:999px;background:var(--gray);overflow:hidden;margin-top:8px}.progressline span{display:block;height:100%;background:#221B15;width:0%}
@media(min-width:700px){.day-grid{grid-template-columns:repeat(10,1fr)}}
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:rgba(252,249,242,.94);backdrop-filter:blur(14px);border-top:var(--bw) solid var(--stroke);padding:11px 14px;padding-bottom:calc(11px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:20;transform:translateZ(0);-webkit-transform:translateZ(0);will-change:transform}.bottomnav button{flex:1}
@media(max-width:430px){.top{padding:calc(20px + env(safe-area-inset-top)) 14px 14px}h1{font-size:21px;margin-bottom:16px;text-align:center}button{padding:10px 11px}.app{padding-top:20px}}@media(min-width:800px){.vocab{grid-template-columns:1fr 1fr}.top h1{font-size:28px}.app{padding-bottom:40px}.bottomnav{display:none}}

.syncbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:2px;padding:11px 13px;border:var(--bw) solid var(--stroke);background:#fff;border-radius:16px}
.syncbar .sync-status{font-size:12px;color:#463F37;font-weight:700}
.syncbar .sync-user{font-size:12px;color:#5C5249;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.syncbar button{padding:5px 8px;font-size:11px}
.syncbar .login{background:var(--stroke);color:var(--bg);border-color:var(--stroke)}
.syncbar .logout{background:#fff;color:var(--ink);border-color:var(--stroke)}
.syncbar .force-btn{background:var(--apricot);color:#8A5A18;border-color:var(--stroke);font-size:10.5px;padding:6px 11px}
.syncbar .force-dl{background:var(--sage);color:#3D5A2E;border-color:var(--stroke)}
.hl-btn{border:none!important;background:transparent!important;font-size:18px;padding:2px 4px!important;cursor:pointer;touch-action:manipulation;line-height:1}
.hl-0 .vitem-inner{border-left:8px solid transparent}
.hl-1 .vitem-inner{border-left:8px solid var(--amber);background:var(--amberbg)}
.hl-2 .vitem-inner{border-left:8px solid var(--amber);background:var(--amberbg)}
.hl-3 .vitem-inner{border-left:8px solid var(--red2);background:var(--redbg)}
.hl-badge{font-size:11px;padding:2px 6px;border-radius:8px;font-weight:700;margin-left:4px}
.hl-badge-1{background:#C2773C;color:#94621C}
.hl-badge-2{background:#C2773C;color:#fff}
.hl-badge-3{background:#C8483B;color:#fff}
.ai-challenge-box{background:var(--gray);border:1px solid #CFC6B6;border-radius:16px;padding:14px;margin-top:12px}
.ai-challenge-box h3{margin:0 0 8px;color:var(--ink);font-size:15px}
.ai-q{font-weight:700;margin-bottom:8px;line-height:1.5}
.ai-opts label{display:block;padding:8px 10px;border:1px solid #ECE5DA;border-radius:10px;margin-bottom:6px;cursor:pointer;touch-action:manipulation}
.ai-ans-box{background:#EAF5EF;border:1px solid #C2E2CE;border-radius:10px;padding:10px;margin-top:8px}
.speak-btn{border:none!important;background:transparent!important;padding:4px 6px!important;cursor:pointer;touch-action:manipulation;line-height:0;vertical-align:middle;color:var(--muted);display:inline-flex;align-items:center}.speak-btn .spk-ic{width:18px;height:18px;display:block}
.speak-btn:active{color:var(--ink);transform:scale(1.15)}
.syncdot{width:8px;height:8px;border-radius:999px;background:#A29A8E;display:inline-block}
.syncdot.on{background:var(--good)}.syncdot.warn{background:var(--brand-2)}.syncdot.err{background:var(--bad)}
.cloud-note{font-size:11px;color:#8C8074;text-align:center;margin-top:4px}

/* ===== 改善案（フィードバック②③④⑤⑥＋）追加スタイル ===== */
:root{--blue:#2A2724;--amber:#E0A046;--amberbg:#FBE0BC;--red2:#D96A4F;--redbg:#F6D9D2}
/* ④ 下部ボタン配色：前=淡色 / 完了=グリーン / 次=ブルー */
#bottomPrev,#bottomNext{background:#fff;color:var(--ink);border-color:var(--stroke);display:inline-flex;align-items:center;justify-content:center;gap:5px}
#bottomPrev svg,#bottomNext svg{width:18px;height:18px}
#bottomComplete{background:var(--brand);color:var(--ink);border-color:var(--stroke);flex:1.4}
#bottomComplete.active{background:var(--sage);color:var(--ink);border-color:var(--stroke)}
/* ②③ 学習画面内ツールバー（拼音/和訳トグル・密度・Day選択） */
.daytools{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.modebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip-toggle{border:var(--bw) solid #CFC6B6;background:rgba(255,255,255,.8);color:var(--muted);border-radius:999px;padding:8px 15px;font-weight:900;font-size:13px;cursor:pointer;touch-action:manipulation}
.chip-toggle.on{background:var(--stroke);border-color:var(--stroke);color:var(--bg)}
.daybar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.daybar select{flex:1;min-width:120px}
.daybar button{flex:0 0 auto;background:#fff}
/* ⑤ 難易度コントロール（普通/曖昧/苦手）＋カード左の色バー */
.lvc{display:inline-flex;gap:6px;margin-top:8px}
.lvc button{border:var(--bw) solid #E0D6C4;border-radius:999px;padding:6px 13px;font-size:11.5px;font-weight:900;background:#fff;color:#A89A85;min-height:32px}
.lvc button+button{border-left:1px solid var(--line)}
.lvc button.lvc-on-0{background:var(--gray);border-color:var(--stroke);color:#5C5249}
.lvc button.lvc-on-1{background:var(--apricot);border-color:var(--stroke);color:#8A5A18}
.lvc button.lvc-on-2{background:var(--blush);border-color:var(--stroke);color:#A3402A}
.vitem.lv-1,.gitem.lv-1{border-left:8px solid var(--amber)}
.vitem.lv-2,.gitem.lv-2{border-left:8px solid var(--red2)}
/* ⑥ 密度（標準 / コンパクト） */
/* ⑥ コンパクト＝「一覧／復習モード」：ブックマーク画面でのみ有効。
   各項目を 中文＋拼音＋語義 に圧縮し、例文・文法詳細を畳んで件数を最大化する。
   学習セクション(#content)には一切影響しない（常に標準＝詳細）。 */
#bookmarkPanel.compact .card{padding:10px;margin:8px 0}
#bookmarkPanel.compact .section-title{margin-bottom:6px}
#bookmarkPanel.compact .section-title h2{font-size:16px}
#bookmarkPanel.compact .vocab{gap:6px}
#bookmarkPanel.compact .vitem,#bookmarkPanel.compact .gitem{padding:8px 10px}
#bookmarkPanel.compact .gitem{margin:6px 0}
#bookmarkPanel.compact .gitem h3{font-size:15px;margin:0}
#bookmarkPanel.compact .zh{font-size:17px}
#bookmarkPanel.compact .ja{margin-top:2px}
/* 例文・文法の詳細解説は非表示（標準モードで読む） */
#bookmarkPanel.compact .ex,
#bookmarkPanel.compact .expinyin,
#bookmarkPanel.compact .exja,
#bookmarkPanel.compact .note{display:none}
/* 難易度コントロールも小型化 */
#bookmarkPanel.compact .lvc{margin-top:4px}
#bookmarkPanel.compact .lvc button{padding:3px 8px;font-size:10px}
#bookmarkPanel.compact .gitem .pinyin,#bookmarkPanel.compact .vitem .pinyin{margin-top:1px}
/* ＋ ブックマークだけのミニテスト（フラッシュカード） */
.testwrap .seg{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.testwrap .seg .chip-toggle.on{background:var(--stroke);border-color:var(--stroke);color:var(--bg)}
.flashcard{border:1px solid var(--line);border-radius:18px;padding:22px 16px;background:#fff;text-align:center;box-shadow:0 10px 30px -16px rgba(20,30,50,.12);margin-top:12px}
.flashcard .fc-prompt{font-size:26px;font-weight:800;margin:6px 0}
.flashcard .fc-sub{color:#5C5249;margin-top:4px}
.flashcard .fc-answer{margin-top:14px;padding-top:14px;border-top:1px dashed #DCD3C6}
.flashcard .fc-answer .a-main{font-size:24px;font-weight:800;color:var(--ink)}
.fc-actions{display:flex;gap:8px;margin-top:14px}
.fc-actions button{flex:1;padding:11px 6px;font-size:13px}
.fc-progress{text-align:center;color:#8C8074;font-size:13px;margin-top:10px}
.badge-leech{background:#F5E8D3;color:#94621C}
.leech-tip{background:#FBF4E8;border:1px solid #E8D9C4;color:#94621C;border-radius:10px;padding:8px 10px;font-size:12.5px;margin:10px 0 0;text-align:left;line-height:1.55}
.ex-leech{border:1px solid #E8D9C4;background:#FBF4E8;border-radius:10px;padding:8px 10px}
.btn-vague{background:var(--amberbg);color:#94621C;border-color:#E8D9C4}
.btn-known{background:#EAF5EF;color:#2E8B62;border-color:#C2E2CE}
.btn-master{background:var(--gray);color:var(--ink);border-color:#CFC6B6}

.lc-progress{height:10px;border-radius:999px;background:var(--gray);overflow:hidden;margin:4px 0 14px}.lc-progress span{display:block;height:100%;background:#C2773C;transition:width .25s}
.lc-q{font-size:18px;font-weight:700;line-height:1.5;white-space:pre-wrap}
.lc-qpin{color:#5C5249;font-size:13px;margin-top:4px}
.lc-opts{display:grid;gap:10px;margin-top:14px}
.lc-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;touch-action:manipulation}
.lc-opt.sel{border-color:#C2773C;background:#FBF4E8;color:#94621C}
.lc-opt.unknown{border-style:dashed;color:var(--muted);font-weight:600;text-align:center}
.lc-opt.unknown.sel{border-color:#A29A8E;background:#EFE9E0;color:#8C8074;border-style:dashed}
.lc-nav{display:flex;gap:10px;margin-top:16px}
.lc-result-lv{font-size:32px;font-weight:800;color:var(--ink);text-align:center;margin:6px 0}
.lc-result-sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:8px}
.lc-bands{display:grid;gap:8px;margin:14px 0}
.lc-band{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lc-band .lcbar{flex:1;height:8px;border-radius:999px;background:var(--gray);margin:0 10px;overflow:hidden}.lc-band .lcbar span{display:block;height:100%;background:var(--ink)}
.lc-band .lcsc{font-size:13px;font-weight:700;color:#463F37;min-width:38px;text-align:right}
.lc-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.lc-btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;touch-action:manipulation}
.lc-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.lc-btn.primary:disabled{opacity:.4;cursor:not-allowed}
.lc-btn.rec{border-color:#C2773C;background:#FBF4E8;color:#94621C}
.lc-btn.flex{flex:1}
.lc-startlist{margin:14px 0 0;padding:0;list-style:none;color:#463F37;line-height:1.7;font-size:14px}.lc-startlist li{padding-left:18px;position:relative}.lc-startlist li:before{content:"・";position:absolute;left:2px}
.cw-ex{cursor:text}
mark.cw-hl{background:#FBF4E8;color:inherit;border-radius:3px;padding:0 1px}
.cw-subtabs{display:flex;gap:8px;margin-bottom:12px}
.cw-subtab{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px;font:inherit;font-weight:700;color:#5C5249;cursor:pointer}
.cw-subtab.active{border-color:var(--ink);background:var(--gray);color:var(--ink)}
.cw-item{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.cw-item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cw-item .zh{font-size:17px;font-weight:700}
.cw-del{border:none;background:transparent;font-size:16px;cursor:pointer;line-height:1}
#cw-fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:9998;background:var(--ink);color:#fff;border:none;border-radius:999px;padding:13px 22px;font:inherit;font-weight:700;font-size:14px;box-shadow:0 10px 28px rgba(46,75,107,.40);cursor:pointer;display:none;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cw-modal{position:fixed;inset:0;z-index:9999;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center;padding:16px}
.cw-modal-card{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(16,24,40,.3)}
.cw-modal-h{font-size:18px;font-weight:800;margin-bottom:10px;color:var(--ink)}
.cw-l{display:block;font-size:12px;font-weight:700;color:#8C8074;margin:10px 0 4px}
.cw-in{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;box-sizing:border-box}
.cw-row{display:flex;gap:8px;align-items:center}.cw-row .cw-in{flex:1}
.cw-modal-actions{display:flex;gap:10px;margin-top:16px}.cw-modal-actions .lc-btn{flex:1}
/* ===== a11y + 達成フィードバック（⑨⑩） ===== */
:root{--zh-font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC","Heiti SC",sans-serif}

    getRedirectResult=authMod.getRedirectResult; onAuthStateChanged=authMod.onAuthStateChanged; signOut=authMod.signOut;
    getFirestore=fsMod.getFirestore; doc=fsMod.doc; getDoc=fsMod.getDoc; setDoc=fsMod.setDoc; serverTimestamp=fsMod.serverTimestamp;
    firebaseApp=initializeApp(firebaseConfig);
    auth=getAuth(firebaseApp);
    db=getFirestore(firebaseApp);
    provider=new GoogleAuthProvider();
    firebaseReady=true;
    getRedirectResult(auth).catch(e=>console.warn('Redirect result error',e));
    onAuthStateChanged(auth, async (user)=>{ cloudUser=user; cloudReady=false; if(user){ setSyncStatus('warn','ログイン済み：同期準備中...',user.email||''); await loadCloudState(); } else { setSyncStatus('warn','未ログイン：この端末内に保存中'); } });
  }catch(e){
    console.warn('Firebase init failed; running local-only', e);
    setSyncStatus('warn','オフライン：この端末内に保存中');
    var lb=document.getElementById('loginBtn'); if(lb){ lb.disabled=true; lb.style.opacity='0.5'; lb.title='クラウド同期は現在利用できません'; }
  }
}
let cloudUser = null;
let cloudReady = false;
let cloudLoading = false;
let cloudSaveTimer = null;
let suppressCloudSave = false;
function nowMs(){ return Date.now(); }
function setSyncStatus(kind, text, userText=''){
  const dot=document.getElementById('syncDot'), status=document.getElementById('syncStatus'), user=document.getElementById('syncUser'), login=document.getElementById('loginBtn'), logout=document.getElementById('logoutBtn');
  if(dot) dot.className='syncdot '+(kind==='on'?'on':kind==='err'?'err':'warn');
  if(status) status.textContent=text;
  if(user) user.textContent=userText||'';
  if(login) login.style.display=cloudUser?'none':'';
  if(logout) logout.style.display=cloudUser?'':'none';
  var fu=document.getElementById('forceUploadBtn'),fd=document.getElementById('forceDownloadBtn');
  if(fu) fu.style.display=cloudUser?'':'none';
  if(fd) fd.style.display=cloudUser?'':'none';
}
function cloudDocRef(){ return cloudUser ? doc(db,'users',cloudUser.uid,'hsk4','state') : null; }
function localUpdatedAt(){ const n=Number(localStorage.getItem(storageKey+'-updatedAtMs')||0); return Number.isFinite(n)?n:0; }
function markLocalUpdated(){ localStorage.setItem(storageKey+'-updatedAtMs', String(nowMs())); }
function normalizeStateForCloud(s){ return {completed:s.completed||{}, answers:s.answers||{}, scores:s.scores||{}, bookmarks:s.bookmarks||{}, dragOrders:s.dragOrders||{}, levels:s.levels||{}, customWords:Array.isArray(s.customWords)?s.customWords:[], density:s.density||'standard', fontScale:(s.fontScale==='sm'||s.fontScale==='lg')?s.fontScale:'md', srs:(s.srs&&typeof s.srs==='object')?s.srs:{}, srsNewLimit:(typeof s.srsNewLimit==='number')?s.srsNewLimit:8, srsDir:(s.srsDir==='ja2zh')?'ja2zh':'zh2ja', examDate:(typeof s.examDate==='string')?s.examDate:'', mockHistory:Array.isArray(s.mockHistory)?s.mockHistory:[], bmSort:(['recommend','hard','added','random'].indexOf(s.bmSort)>=0)?s.bmSort:'recommend', revScope:(s.revScope==='bm')?'bm':'all', currentDay:current||1, updatedAtMs:nowMs(), appVersion:'firebase-sync-v1', storageKey:storageKey}; }
async function saveCloudState(force=false){
  if(!cloudUser || ((!cloudReady)&&!force) || (cloudLoading && !force)) return;
  try{ const payload=normalizeStateForCloud(state); payload.updatedAt=serverTimestamp(); await setDoc(cloudDocRef(), payload, {merge:true}); setSyncStatus('on','クラウド同期済み',cloudUser.email||''); }
  catch(e){ console.error(e); setSyncStatus('err','クラウド保存エラー：Rulesを確認',cloudUser?.email||''); }
}
function scheduleCloudSave(){ if(!cloudUser || suppressCloudSave) return; setSyncStatus('warn','クラウドへ保存中...',cloudUser.email||''); clearTimeout(cloudSaveTimer); cloudSaveTimer=setTimeout(()=>saveCloudState(false),700); }
async function loadCloudState(){
  if(!cloudUser) return;
  cloudLoading=true; setSyncStatus('warn','クラウド同期を確認中...',cloudUser.email||'');
  try{
    const snap=await getDoc(cloudDocRef());
    if(!snap.exists()){cloudReady=true;await saveCloudState(true);setSyncStatus('on','初回同期完了',cloudUser.email||'');cloudLoading=false;return;}
    const cloud=snap.data()||{},cloudTs=Number(cloud.updatedAtMs||0),localTs=localUpdatedAt();
    const lbm=Object.keys(state.bookmarks||{}).length,cbm=Object.keys(cloud.bookmarks||{}).length;
    // ローカルが「完全に空」かどうか（新規端末/初回起動の判定。完了・回答・ブックマークいずれも無い）
    const localEmpty=!lbm && !Object.keys(state.completed||{}).length && !Object.keys(state.answers||{}).length;
    // クラウドに何らかの学習データがあるか
    const cloudHasData=cbm>0 || Object.keys(cloud.completed||{}).length>0 || Object.keys(cloud.answers||{}).length>0;
    // 判定：①空ローカルでクラウドにデータあり→クラウド採用（空で上書きしない） ②それ以外は「最終更新が新しい方」を採用（last-write-wins）
    //   → ローカルが新しい/同時刻ならローカルをアップロード。オフライン編集（ブックマーク削除含む）も保持される。
    const loadFromCloud=(localEmpty && cloudHasData) || (!localEmpty && cloudTs>localTs);
    if(loadFromCloud){
      suppressCloudSave=true;
      state.completed=cloud.completed||{};state.answers=cloud.answers||{};
      state.scores=cloud.scores||{};state.bookmarks=cloud.bookmarks||{};
      state.dragOrders=cloud.dragOrders||{};
      state.levels=cloud.levels||state.levels||{};
      if(cloud.srs&&typeof cloud.srs==='object') state.srs=cloud.srs;             // 復習スケジュール（SM-2）
      if(Array.isArray(cloud.customWords)) state.customWords=cloud.customWords;    // マイ単語
      if(typeof cloud.srsNewLimit==='number') state.srsNewLimit=cloud.srsNewLimit;
      if(cloud.srsDir==='ja2zh'||cloud.srsDir==='zh2ja') state.srsDir=cloud.srsDir;
      if(['recommend','hard','added','random'].indexOf(cloud.bmSort)>=0) state.bmSort=cloud.bmSort;
      if(cloud.revScope==='bm'||cloud.revScope==='all') state.revScope=cloud.revScope;
      if(cloud.fontScale==='sm'||cloud.fontScale==='lg'||cloud.fontScale==='md') state.fontScale=cloud.fontScale;
      cwEnsureIds();
      if(cloud.density) state.density=cloud.density;
      if(cloud.currentDay) current=Number(cloud.currentDay)||current;
      localStorage.setItem(storageKey,JSON.stringify(state));
      localStorage.setItem(storageKey+'-updatedAtMs',String(cloudTs));
      localStorage.setItem('hsk4-current-day',String(current));
      suppressCloudSave=false;
      if(typeof applyFontScale==='function') applyFontScale();
      setSyncStatus('on','クラウドから同期(BM:'+cbm+'件)',cloudUser.email||'');
      if(typeof render==='function') render();
    } else {
      cloudReady=true;await saveCloudState(true);
      setSyncStatus('on','端末→クラウド同期(BM:'+lbm+'件)',cloudUser.email||'');
    }
    cloudReady=true;
  } catch(e){console.error(e);setSyncStatus('err','同期エラー:'+(e.message||'不明'),cloudUser?.email||'');}
  finally{cloudLoading=false;}
}
window.hsk4GoogleLogin=async function(){ if(!firebaseReady){ setSyncStatus('warn','クラウド同期は現在利用できません'); return; } try{ setSyncStatus('warn','Googleログイン中...'); try{ await signInWithPopup(auth,provider); } catch(e){ console.warn('popup failed; redirect',e); await signInWithRedirect(auth,provider); } } catch(e){ console.error(e); setSyncStatus('err','ログインできませんでした'); } };
window.hsk4Logout=async function(){ if(!firebaseReady){ return; } await saveCloudState(true); await signOut(auth); };
// 認証監視・リダイレクト結果の処理は initFirebase() 内（遅延読み込み後）で実行する。
document.addEventListener('click', (e)=>{
  if(e.target&&e.target.id==='loginBtn') window.hsk4GoogleLogin();
  if(e.target&&e.target.id==='logoutBtn') window.hsk4Logout();
  if(e.target&&e.target.id==='forceUploadBtn') window.hsk4ForceUpload();
  if(e.target&&e.target.id==='forceDownloadBtn') window.hsk4ForceDownload();
});

// data-action委譲: ブックマーク削除・ハイライト・画面遷移
document.addEventListener('click', function(e){
  var btn = e.target.closest('[data-action]');
  if(!btn) return;
  var a = btn.dataset.action;
  var id = btn.dataset.id;
  if(a==='showHome') showHome();
  else if(a==='showBookmarks') showBookmarks();
  else if(a==='removeBookmark' && id) toggleBookmark(id);
  else if(a==='hl' && id) cycleHighlight(id);
  else if(a==='bmSort' && id) bmSetSort(id);
});

nyin":"jìxù","ja":"続ける","example":"我们继续学习下一课吧。","exPinyin":"Wǒmen jìxù xuéxí xià yí kè ba.","exJa":"次の課を続けて勉強しましょう。"},{"id":"d2-v2","zh":"只好","pinyin":"zhǐhǎo","ja":"仕方なく〜する","example":"地铁停了，我只好打车回家。","exPinyin":"Dìtiě tíng le, wǒ zhǐhǎo dǎchē huí jiā.","exJa":"地下鉄が止まったので、仕方なくタクシーで帰りました。"},{"id":"d2-v3","zh":"及时","pinyin":"jíshí","ja":"タイムリーに、すぐに","example":"如果有问题，请及时联系我。","exPinyin":"Rúguǒ yǒu wèntí, qǐng jíshí liánxì wǒ.","exJa":"問題があれば、すぐに私に連絡してください。"},{"id":"d2-v4","zh":"联系","pinyin":"liánxì","ja":"連絡する","example":"有问题请随时联系我。","exPinyin":"Yǒu wèntí qǐng suíshí liánxì wǒ.","exJa":"問題があればいつでも連絡してください。"}],"grammar":[{"id":"d2-g0","name":"过：否定は没过","pinyin":"méi…guo","meaning":"〜したことがない","explain":"経験の否定は没＋動詞＋过です。","contrast":"不去 は行かない、没去过 は行ったことがない。","mistake":"不＋过にしないこと。","example":"我没去过西安。","exPinyin":"Wǒ méi qùguo Xī’ān.","exJa":"西安に行ったことがありません。","test":"このアプリを使ったことがありません。","answer":"我没用过这个应用。"},{"id":"d2-g1","name":"着：状態持続","pinyin":"zhe","meaning":"〜している状態","explain":"着は動作の結果として続いている状態を表します。","contrast":"正在开门 は開けている最中、门开着 は開いている状態です。","mistake":"正在と着を混同しないこと。","example":"门开着。","exPinyin":"Mén kāizhe.","exJa":"ドアが開いています。","test":"窓が開いています。","answer":"窗户开着。"},{"id":"d2-g2","name":"着：姿勢の持続","pinyin":"zhe","meaning":"〜したまま…する","explain":"坐着、站着、躺着のように姿勢を保ったまま別の動作をします。","contrast":"一边は同時動作、着は状態の持続です。","mistake":"姿勢の「ながら」は一边より着が自然なことがあります。","example":"他坐着看手机。","exPinyin":"Tā zuòzhe kàn shǒujī.","exJa":"彼は座ったままスマホを見ています。","test":"彼は立ったまま話しています。","answer":"他站着说话。"}]},{"day":3,"title":"Day 3｜HSK4 基礎強化","vocab":[{"id":"d3-v0","zh":"习惯","pinyin":"xíguàn","ja":"慣れる、習慣","example":"我已经习惯在上海生活了。","exPinyin":"Wǒ yǐjīng xíguàn zài Shànghǎi shēnghuó le.","exJa":"私はもう上海での生活に慣れました。"},{"id":"d3-v1","zh":"安排","pinyin":"ānpái","ja":"手配する、段取りする","example":"我已经安排好了明天的会议。","exPinyin":"Wǒ yǐjīng ānpái hǎo le míngtiān de huìyì.","exJa":"明日の会議はすでに手配してあります。"},{"id":"d3-v2","zh":"提醒","pinyin":"tíxǐng","ja":"リマインドする、注意するように言う","example":"请提醒我下午三点开会。","exPinyin":"Qǐng tíxǐng wǒ xiàwǔ sān diǎn kāihuì.","exJa":"午後3時の会議を私にリマインドしてください。"},{"id":"d3-v3","zh":"影响","pinyin":"yǐngxiǎng","ja":"影響する","example":"天气会影响心情。","exPinyin":"Tiānqì huì yǐngxiǎng xīnqíng.","exJa":"天気は気分に影響します。"},{"id":"d3-v4","zh":"解决","pinyin":"jiějué","ja":"解決する","example":"这个问题很容易解决。","exPinyin":"Zhège wèntí hěn róngyì jiějué.","exJa":"この問題は簡単に解決できます。"}],"grammar":[{"id":"d3-g0","name":"把構文：処理結果","pinyin":"bǎ","meaning":"目的語をどう処理したかを表す","explain":"把構文は目的語に対して何をして、結果どうなったかを言う形です。","contrast":"我发资料 より 我把资料发给你 の方が処理結果が明確です。","mistake":"把の後ろは特定された目的語が自然です。","example":"请把资料发给我。","exPinyin":"Qǐng bǎ zīliào fā gěi wǒ.","exJa":"資料を私に送ってください。","test":"住所を私に送ってください。","answer":"请把地址发给我。"},{"id":"d3-g1","name":"把構文：動詞だけで終わらない","pinyin":"bǎ + result","meaning":"把構文では結果・方向・場所を付ける","explain":"把構文では多くの場合、動詞だけでは不完全です。","contrast":"把门关 は不自然で、把门关上 が自然です。","mistake":"发给你、发过去、发完了のように結果を付けます。","example":"我把门关上了。","exPinyin":"Wǒ bǎ mén guān shang le.","exJa":"ドアを閉めました。","test":"宿題をやり終えました。","answer":"我把作业做完了。"},{"id":"d3-g2","name":"結果補語：完","pinyin":"wán","meaning":"〜し終える","explain":"動詞＋完で、動作が最後まで終わったことを表します。","contrast":"看了 は見た、看完了 は見終わったです。","mistake":"「終えた」なら完を使うと自然です。","example":"我看完报告了。","exPinyin":"Wǒ kàn wán bàogào le.","exJa":"報告書を読み終えました。","test":"この本を読み終えました。","answer":"我看完这本书了。"}]},{"day":4,"title":"Day 4｜HSK4 基礎強化","vocab":[{"id":"d4-v0","zh":"发生","pinyin":"fāshēng","ja":"起こる、発生する","example":"昨天发生了一件很有意思的事。","exPinyin":"Zuótiān fāshēng le yí jiàn hěn yǒuyìsi de shì.","exJa":"昨日、とても面白いことが起こりました。"},{"id":"d4-v1","zh":"处理","pinyin":"chǔlǐ","ja":"処理する、対応する","example":"这个问题需要马上处理。","exPinyin":"Zhège wèntí xūyào mǎshàng chǔlǐ.","exJa":"この問題はすぐに対応する必要があります。"},{"id":"d4-v2","zh":"结果","pinyin":"jiéguǒ","ja":"結果、その結果","example":"他没来，结果我们自己开始了。","exPinyin":"Tā méi lái, jiéguǒ wǒmen zìjǐ kāishǐ le.","exJa":"彼は来なかったので、結局私たちだけで始めました。"},{"id":"d4-v3","zh":"赶紧","pinyin":"gǎnjǐn","ja":"急いで、早く","example":"快迟到了，我们赶紧走吧。","exPinyin":"Kuài chídào le, wǒmen gǎnjǐn zǒu ba.","exJa":"遅れそうだから、急いで行きましょう。"},{"id":"d4-v4","zh":"讨论","pinyin":"tǎolùn","ja":"議論する、相談する","example":"这个问题我想再讨论一下。","exPinyin":"Zhège wèntí wǒ xiǎng zài tǎolùn yíxià.","exJa":"この問題をもう少し相談したいです。"}],"grammar":[{"id":"d4-g0","name":"結果補語：好","pinyin":"hǎo","meaning":"きちんとできる、準備できる","explain":"動詞＋好は、動作がきちんと完了して使える状態になったことを表します。","contrast":"做好饭 は料理ができた、做完饭 は作業を終えた。","mistake":"准备好了 は非常によく使います。","example":"我准备好了。","exPinyin":"Wǒ zhǔnbèi hǎo le.","exJa":"準備できました。","test":"会議室を予約できました。","answer":"会议室订好了。"},{"id":"d4-g1","name":"結果補語：到","pinyin":"dào","meaning":"目的達成・見つける","explain":"動詞＋到は、探す・買う・聞くなどが成功したことを表します。","contrast":"买了票 は買った、买到票 は買えた。","mistake":"成功したかどうかを言う時に便利です。","example":"我找到钥匙了。","exPinyin":"Wǒ zhǎodào yàoshi le.","exJa":"鍵を見つけました。","test":"タクシーを呼べました。","answer":"我打到车了。"},{"id":"d4-g2","name":"方向補語：来去","pinyin":"lái/qù","meaning":"動作の方向を表す","explain":"来は話し手に近づく方向、去は離れる方向です。","contrast":"拿过来 はこちらへ、拿过去 は向こうへ。","mistake":"日本語では省略しがちな方向を中国語ではよく言います。","example":"你把外卖拿进来吧。","exPinyin":"Nǐ bǎ wàimài ná jìnlái ba.","exJa":"デリバリーを中に持ってきてください。","test":"彼は出て行きました。","answer":"他走出去了。"}]},{"day":5,"title":"Day 5｜HSK4 基礎強化","vocab":[{"id":"d5-v0","zh":"几乎","pinyin":"jīhū","ja":"ほとんど","example":"在上海，手机几乎可以解决很多事情。","exPinyin":"Zài Shànghǎi, shǒujī jīhū kěyǐ jiějué hěn duō shìqing.","exJa":"上海ではスマホでほとんど多くのことを解決できます。"},{"id":"d5-v1","zh":"手续","pinyin":"shǒuxù","ja":"手続き","example":"办理手续有点儿麻烦。","exPinyin":"Bànlǐ shǒuxù yǒudiǎnr máfan.","exJa":"手続きをするのは少し面倒です。"},{"id":"d5-v2","zh":"麻烦","pinyin":"máfan","ja":"面倒だ","example":"不好意思，麻烦您少放一点辣椒。","exPinyin":"Bù hǎoyìsi, máfan nín shǎo fàng yìdiǎn làjiāo.","exJa":"すみません、唐辛子を少なめにしてください。"},{"id":"d5-v3","zh":"流利","pinyin":"liúlì","ja":"流暢だ","example":"我中文说得还不太流利。","exPinyin":"Wǒ Zhōngwén shuō de hái bú tài liúlì.","exJa":"私は中国語を話すのがまだあまり流暢ではありません。"},{"id":"d5-v4","zh":"自然","pinyin":"zìrán","ja":"自然だ","example":"他说中文说得很自然。","exPinyin":"Tā shuō Zhōngwén shuō de hěn zìrán.","exJa":"彼の中国語はとても自然です。"}],"grammar":[{"id":"d5-g0","name":"方向補語：进来进去","pinyin":"jìnlái/jìnqù","meaning":"入ってくる/入っていく","explain":"进来は話し手の方へ入る、进去は話し手から離れた場所へ入る意味です。","contrast":"来/去は話し手の位置で決まります。","mistake":"場所感覚を意識します。","example":"他走进来了。","exPinyin":"Tā zǒu jìnlái le.","exJa":"彼は中に入ってきました。","test":"子どもが部屋に入ってきました。","answer":"孩子走进房间来了。"},{"id":"d5-g1","name":"方向補語：出来出去","pinyin":"chūlái/chūqù","meaning":"出てくる/出ていく","explain":"出来は話し手の方へ出てくる、出去は外へ出ていく意味です。","contrast":"拿出来 は取り出す、拿出去 は外へ持っていく。","mistake":"出す、だけでは方向が足りないことがあります。","example":"请把护照拿出来。","exPinyin":"Qǐng bǎ hùzhào ná chūlái.","exJa":"パスポートを出してください。","test":"ゴミを外に出してください。","answer":"请把垃圾拿出去。"},{"id":"d5-g2","name":"程度補語：说得","pinyin":"de","meaning":"どの程度〜するか","explain":"動詞＋得＋程度で、動作の程度を説明します。","contrast":"我说中文 は話す、我中文说得很好 は話すのが上手い。","mistake":"目的語がある時は我中文说得…の形が自然です。","example":"我中文说得还不太自然。","exPinyin":"Wǒ Zhōngwén shuō de hái bú tài zìrán.","exJa":"私の中国語はまだあまり自然ではありません。","test":"彼は話すのが速いです。","answer":"他说得很快。"}]},{"day":6,"title":"Day 6｜HSK4 基礎強化","vocab":[{"id":"d6-v0","zh":"顺利","pinyin":"shùnlì","ja":"順調だ","example":"今天的会议进行得很顺利。","exPinyin":"Jīntiān de huìyì jìnxíng de hěn shùnlì.","exJa":"今日の会議はとても順調に進みました。"},{"id":"d6-v1","zh":"安全","pinyin":"ānquán","ja":"安全だ","example":"晚上回家要注意安全。","exPinyin":"Wǎnshang huí jiā yào zhùyì ānquán.","exJa":"夜帰る時は安全に気をつけてください。"},{"id":"d6-v2","zh":"准时","pinyin":"zhǔnshí","ja":"時間通り","example":"请大家明天准时到会议室。","exPinyin":"Qǐng dàjiā míngtiān zhǔnshí dào huìyìshì.","exJa":"明日は時間通りに会議室に来てください。"},{"id":"d6-v3","zh":"负责","pinyin":"fùzé","ja":"担当する","example":"这个项目由我负责。","exPinyin":"Zhège xiàngmù yóu wǒ fùzé.","exJa":"このプロジェクトは私が担当します。"},{"id":"d6-v4","zh":"同意","pinyin":"tóngyì","ja":"同意する","example":"我同意你的看法。","exPinyin":"Wǒ tóngyì nǐ de kànfǎ.","exJa":"あなたの考えに賛成です。"}],"grammar":[{"id":"d6-g0","name":"可能補語：看得懂","pinyin":"de/bu","meaning":"〜して理解できる/できない","explain":"動詞＋得/不＋結果補語で可能・不可能を表します。","contrast":"看懂 は理解する、看得懂 は読んで理解できる、看不懂 は読んでも分からない。","mistake":"会と混同しないこと。","example":"这篇文章我看得懂。","exPinyin":"Zhè piān wénzhāng wǒ kàn de dǒng.","exJa":"この文章は読んで理解できます。","test":"この説明は聞いて分かりません。","answer":"这个说明我听不懂。"},{"id":"d6-g1","name":"可能補語：买得到","pinyin":"de dào","meaning":"手に入れられる","explain":"動詞＋得到/不到で、目的を達成できるかを表します。","contrast":"买得到 は買える、买不到 は買えない。","mistake":"可能性というより結果達成の可否です。","example":"这个票今天买得到吗？","exPinyin":"Zhège piào jīntiān mǎi de dào ma?","exJa":"このチケットは今日買えますか。","test":"この店は予約できますか。","answer":"这家店订得到吗？"},{"id":"d6-g2","name":"比構文","pinyin":"bǐ","meaning":"AはBより〜","explain":"A比B＋形容詞で比較を表します。","contrast":"上海比东京热。形容詞の前に很は普通入れません。","mistake":"比东京很热 は不自然です。","example":"上海比东京方便。","exPinyin":"Shànghǎi bǐ Dōngjīng fāngbiàn.","exJa":"上海は東京より便利です。","test":"今日は昨日より寒いです。","answer":"今天比昨天冷。"}]},{"day":7,"title":"Day 7｜HSK4 基礎強化","vocab":[{"id":"d7-v0","zh":"拒绝","pinyin":"jùjué","ja":"断る","example":"如果不方便，可以直接拒绝。","exPinyin":"Rúguǒ bù fāngbiàn, kěyǐ zhíjiē jùjué.","exJa":"都合が悪ければ、直接断ってもいいです。"},{"id":"d7-v1","zh":"解释","pinyin":"jiěshì","ja":"説明する","example":"你能再解释一下吗？","exPinyin":"Nǐ néng zài jiěshì yíxià ma?","exJa":"もう一度説明してもらえますか。"},{"id":"d7-v2","zh":"改变","pinyin":"gǎibiàn","ja":"変える","example":"计划有一点改变。","exPinyin":"Jìhuà yǒu yìdiǎn gǎibiàn.","exJa":"予定に少し変更があります。"},{"id":"d7-v3","zh":"推迟","pinyin":"tuīchí","ja":"延期する","example":"会议推迟到下午三点。","exPinyin":"Huìyì tuīchí dào xiàwǔ sān diǎn.","exJa":"会議は午後3時に延期されました。"},{"id":"d7-v4","zh":"提前","pinyin":"tíqián","ja":"前倒しする","example":"我们提前十分钟出发吧。","exPinyin":"Wǒmen tíqián shí fēnzhōng chūfā ba.","exJa":"10分早めに出発しましょう。"}],"grammar":[{"id":"d7-g0","name":"没有〜那么〜","pinyin":"méiyǒu nàme","meaning":"〜ほど…ではない","explain":"A没有B那么＋形容詞で、AはBほど〜ではないと言います。","contrast":"比は「より〜」、没有那么は「ほど〜ではない」。","mistake":"我的中文没有我想象的那么好 が自然です。","example":"我的中文没有我想象的那么好。","exPinyin":"Wǒ de Zhōngwén méiyǒu wǒ xiǎngxiàng de nàme hǎo.","exJa":"私の中国語は思っていたほど良くありません。","test":"上海の冬は東京ほど寒くありません。","answer":"上海的冬天没有东京那么冷。"},{"id":"d7-g1","name":"越来越","pinyin":"yuèláiyuè","meaning":"ますます〜","explain":"変化がだんだん強くなることを表します。","contrast":"越来越自然 はだんだん自然になる。越A越BはAすればするほどBです。","mistake":"more and moreを直訳せず、越来越＋形容詞で覚えます。","example":"我的中文越来越自然了。","exPinyin":"Wǒ de Zhōngwén yuèláiyuè zìrán le.","exJa":"私の中国語はますます自然になってきました。","test":"上海の生活にますます慣れてきました。","answer":"我越来越习惯上海的生活了。"},{"id":"d7-g2","name":"越〜越〜","pinyin":"yuè…yuè…","meaning":"〜すればするほど〜","explain":"越A越Bで、Aの程度が上がるほどBも変化することを表します。","contrast":"越学越有意思 は学べば学ぶほど面白い。","mistake":"前後の関係をはっきりさせます。","example":"中文越学越有意思。","exPinyin":"Zhōngwén yuè xué yuè yǒu yìsi.","exJa":"中国語は学べば学ぶほど面白いです。","test":"話せば話すほど自然になります。","answer":"越说越自然。"}]},{"day":8,"title":"Day 8｜HSK4 基礎強化","vocab":[{"id":"d8-v0","zh":"检查","pinyin":"jiǎnchá","ja":"チェックする","example":"发邮件之前，请检查一下内容。","exPinyin":"Fā yóujiàn zhīqián, qǐng jiǎnchá yíxià nèiróng.","exJa":"メールを送る前に内容を確認してください。"},{"id":"d8-v1","zh":"整理","pinyin":"zhěnglǐ","ja":"整理する","example":"我把今天的会议内容整理好了。","exPinyin":"Wǒ bǎ jīntiān de huìyì nèiróng zhěnglǐ hǎo le.","exJa":"今日の会議内容を整理しました。"},{"id":"d8-v2","zh":"准备","pinyin":"zhǔnbèi","ja":"準備する","example":"我已经准备好明天的资料了。","exPinyin":"Wǒ yǐjīng zhǔnbèi hǎo míngtiān de zīliào le.","exJa":"明日の資料はもう準備できました。"},{"id":"d8-v3","zh":"计划","pinyin":"jìhuà","ja":"計画する","example":"周末你有什么计划？","exPinyin":"Zhōumò nǐ yǒu shénme jìhuà?","exJa":"週末は何か予定がありますか。"},{"id":"d8-v4","zh":"选择","pinyin":"xuǎnzé","ja":"選ぶ","example":"我还没决定选择哪一个。","exPinyin":"Wǒ hái méi juédìng xuǎnzé nǎ yí ge.","exJa":"どれを選ぶかまだ決めていません。"}],"grammar":[{"id":"d8-g0","name":"一边〜一边〜","pinyin":"yìbiān","meaning":"〜しながら〜する","explain":"同じ主語が二つの動作を同時にする時に使います。","contrast":"一边吃饭，一边看手机。姿勢の持続なら着も使えます。","mistake":"基本は同じ主語で使います。","example":"我一边吃饭，一边看手机。","exPinyin":"Wǒ yìbiān chīfàn, yìbiān kàn shǒujī.","exJa":"ご飯を食べながらスマホを見ます。","test":"コーヒーを飲みながら勉強します。","answer":"我一边喝咖啡，一边学习。"},{"id":"d8-g1","name":"因为〜所以〜","pinyin":"yīnwèi/suǒyǐ","meaning":"〜なので、だから〜","explain":"理由と結果を明確につなぐ表現です。","contrast":"会話では片方だけでも使いますが、両方使うと論理が明確です。","mistake":"英語のbecause/so感覚に引っ張られなくてOKです。","example":"因为地铁很方便，所以我每天坐地铁上班。","exPinyin":"Yīnwèi dìtiě hěn fāngbiàn, suǒyǐ wǒ měitiān zuò dìtiě shàngbān.","exJa":"地下鉄が便利なので、毎日地下鉄で通勤しています。","test":"時間がないので、昼ごはんを食べませんでした。","answer":"因为没有时间，所以我没吃午饭。"},{"id":"d8-g2","name":"虽然〜但是〜","pinyin":"suīrán/dànshì","meaning":"〜だけれども、しかし〜","explain":"前半で事実、後半で逆の結果を言います。","contrast":"虽然忙，但是还要学习。論理が明確です。","mistake":"日本語の「でも」だけの感覚で短くつなぎすぎないこと。","example":"虽然有点儿贵，但是很好吃。","exPinyin":"Suīrán yǒudiǎnr guì, dànshì hěn hǎochī.","exJa":"少し高いですが、とても美味しいです。","test":"忙しいですが、勉強を続けたいです。","answer":"虽然很忙，但是我想继续学习。"}]},{"day":9,"title":"Day 9｜HSK4 基礎強化","vocab":[{"id":"d9-v0","zh":"比较","pinyin":"bǐjiào","ja":"比較的、比べる","example":"这家店比较适合带孩子来。","exPinyin":"Zhè jiā diàn bǐjiào shìhé dài háizi lái.","exJa":"この店は子ども連れで来るのに比較的向いています。"},{"id":"d9-v1","zh":"决定","pinyin":"juédìng","ja":"決める","example":"我决定重新准备HSK四级。","exPinyin":"Wǒ juédìng chóngxīn zhǔnbèi HSK sì jí.","exJa":"HSK4級を改めて準備することに決めました。"},{"id":"d9-v2","zh":"尝试","pinyin":"chángshì","ja":"試す","example":"我想尝试用中文开会。","exPinyin":"Wǒ xiǎng chángshì yòng Zhōngwén kāihuì.","exJa":"中国語で会議をすることに挑戦したいです。"},{"id":"d9-v3","zh":"坚持","pinyin":"jiānchí","ja":"続ける、堅持する","example":"每天坚持十分钟也有帮助。","exPinyin":"Měitiān jiānchí shí fēnzhōng yě yǒu bāngzhù.","exJa":"毎日10分続けるだけでも役に立ちます。"},{"id":"d9-v4","zh":"放弃","pinyin":"fàngqì","ja":"諦める","example":"遇到困难也不要放弃。","exPinyin":"Yùdào kùnnan yě bú yào fàngqì.","exJa":"困難にあっても諦めないでください。"}],"grammar":[{"id":"d9-g0","name":"如果〜就〜","pinyin":"rúguǒ/jiù","meaning":"もし〜なら〜","explain":"条件と結果をつなぐ基本表現です。","contrast":"如果你方便，我们就明天见。","mistake":"就は結果側に置きます。","example":"如果你方便，我们就明天见。","exPinyin":"Rúguǒ nǐ fāngbiàn, wǒmen jiù míngtiān jiàn.","exJa":"都合がよければ明日会いましょう。","test":"雨が降ったら家で勉強します。","answer":"如果下雨，我就在家学习。"},{"id":"d9-g1","name":"只要〜就〜","pinyin":"zhǐyào/jiù","meaning":"〜さえすれば〜","explain":"最低条件を表します。","contrast":"只要每天练习，就会进步。","mistake":"只有才との違いに注意。只要は十分条件です。","example":"只要坚持，就会有进步。","exPinyin":"Zhǐyào jiānchí, jiù huì yǒu jìnbù.","exJa":"続けさえすれば進歩します。","test":"毎日聞けば慣れます。","answer":"只要每天听，就会习惯。"},{"id":"d9-g2","name":"只有〜才〜","pinyin":"zhǐyǒu/cái","meaning":"〜して初めて〜","explain":"必要条件を表します。","contrast":"只有多说，才会自然。","mistake":"只要就は十分条件、只有才は必要条件です。","example":"只有多练习，才会说得自然。","exPinyin":"Zhǐyǒu duō liànxí, cái huì shuō de zìrán.","exJa":"たくさん練習して初めて自然に話せます。","test":"復習して初めて覚えられます。","answer":"只有复习，才能记住。"}]},{"day":10,"title":"Day 10｜HSK4 基礎強化","vocab":[{"id":"d10-v0","zh":"注意","pinyin":"zhùyì","ja":"注意する","example":"过马路的时候要注意车。","exPinyin":"Guò mǎlù de shíhou yào zhùyì chē.","exJa":"道を渡る時は車に注意してください。"},{"id":"d10-v1","zh":"根据","pinyin":"gēnjù","ja":"〜に基づいて","example":"根据天气预报，明天可能会下雨。","exPinyin":"Gēnjù tiānqì yùbào, míngtiān kěnéng huì xià yǔ.","exJa":"天気予報によると、明日は雨が降るかもしれません。"},{"id":"d10-v2","zh":"要求","pinyin":"yāoqiú","ja":"要求する","example":"客户对时间有特别要求。","exPinyin":"Kèhù duì shíjiān yǒu tèbié yāoqiú.","exJa":"顧客は時間について特別な要望があります。"},{"id":"d10-v3","zh":"经验","pinyin":"jīngyàn","ja":"経験","example":"在上海生活的经验对我很有帮助。","exPinyin":"Zài Shànghǎi shēnghuó de jīngyàn duì wǒ hěn yǒu bāngzhù.","exJa":"上海での生活経験は私にとても役立っています。"},{"id":"d10-v4","zh":"机会","pinyin":"jīhuì","ja":"機会","example":"我想找更多说中文的机会。","exPinyin":"Wǒ xiǎng zhǎo gèng duō shuō Zhōngwén de jīhuì.","exJa":"中国語を話す機会をもっと作りたいです。"}],"grammar":[{"id":"d10-g0","name":"不但〜而且〜","pinyin":"búdàn/érqiě","meaning":"〜だけでなく、さらに〜","explain":"二つの特徴を積み上げる表現です。","contrast":"不但方便，而且便宜。","mistake":"而且だけでも使えますが、不但と組み合わせると論理的です。","example":"这家店不但方便，而且味道不错。","exPinyin":"Zhè jiā diàn búdàn fāngbiàn, érqiě wèidào búcuò.","exJa":"この店は便利なだけでなく、味も悪くありません。","test":"彼は中国語だけでなく英語も話せます。","answer":"他不但会说中文，而且会说英文。"},{"id":"d10-g1","name":"不管〜都〜","pinyin":"bùguǎn/dōu","meaning":"〜に関わらず〜","explain":"条件が変わっても結果が変わらないことを表します。","contrast":"不管多忙，都学习。","mistake":"无论都より口語的です。","example":"不管多忙，我都想坚持学习。","exPinyin":"Bùguǎn duō máng, wǒ dōu xiǎng jiānchí xuéxí.","exJa":"どんなに忙しくても学習を続けたいです。","test":"天気がどうであれ行きます。","answer":"不管天气怎么样，我都去。"},{"id":"d10-g2","name":"除了〜以外，还〜","pinyin":"chúle/yǐwài/hái","meaning":"〜以外に、さらに〜","explain":"追加情報を述べる表現です。","contrast":"除了工作以外，还要学习。","mistake":"除了の後ろだけで終わらず、还/也で追加します。","example":"除了日语以外，我还想多用中文。","exPinyin":"Chúle Rìyǔ yǐwài, wǒ hái xiǎng duō yòng Zhōngwén.","exJa":"日本語以外に中国語ももっと使いたいです。","test":"上海以外に蘇州にも行ったことがあります。","answer":"除了上海以外，我还去过苏州。"}]},{"day":11,"title":"Day 11｜HSK4 基礎強化","vocab":[{"id":"d11-v0","zh":"环境","pinyin":"huánjìng","ja":"環境","example":"语言环境很重要。","exPinyin":"Yǔyán huánjìng hěn zhòngyào.","exJa":"言語環境はとても重要です。"},{"id":"d11-v1","zh":"条件","pinyin":"tiáojiàn","ja":"条件","example":"如果条件合适，我们就开始。","exPinyin":"Rúguǒ tiáojiàn héshì, wǒmen jiù kāishǐ.","exJa":"条件が合えば始めましょう。"},{"id":"d11-v2","zh":"感觉","pinyin":"gǎnjué","ja":"感じる","example":"我感觉今天的听力比较难。","exPinyin":"Wǒ gǎnjué jīntiān de tīnglì bǐjiào nán.","exJa":"今日のリスニングは少し難しく感じます。"},{"id":"d11-v3","zh":"兴趣","pinyin":"xìngqù","ja":"興味","example":"我对中国文化很有兴趣。","exPinyin":"Wǒ duì Zhōngguó wénhuà hěn yǒu xìngqù.","exJa":"中国文化にとても興味があります。"},{"id":"d11-v4","zh":"目的","pinyin":"mùdì","ja":"目的","example":"我学习中文的目的是提高表达能力。","exPinyin":"Wǒ xuéxí Zhōngwén de mùdì shì tígāo biǎodá nénglì.","exJa":"中国語を学ぶ目的は表現力を高めることです。"}],"grammar":[{"id":"d11-g0","name":"先〜再〜","pinyin":"xiān/zài","meaning":"先に〜して、それから〜","explain":"動作の順番を表します。","contrast":"先看资料，再讨论。","mistake":"然后も使えますが、先再は順番が明確です。","example":"我们先看资料，再讨论问题。","exPinyin":"Wǒmen xiān kàn zīliào, zài tǎolùn wèntí.","exJa":"先に資料を見て、それから問題を議論しましょう。","test":"先に食べてから出発しましょう。","answer":"我们先吃饭，再出发。"},{"id":"d11-g1","name":"就要〜了","pinyin":"jiùyào…le","meaning":"もうすぐ〜する","explain":"近い未来を表します。","contrast":"会议就要开始了。","mistake":"文末了を忘れないようにします。","example":"会议就要开始了。","exPinyin":"Huìyì jiùyào kāishǐ le.","exJa":"会議がもうすぐ始まります。","test":"もうすぐ遅刻します。","answer":"我就要迟到了。"},{"id":"d11-g2","name":"快〜了","pinyin":"kuài…le","meaning":"もうすぐ〜になる","explain":"状態や動作が近いことを表します。","contrast":"快到了 はもうすぐ着く。到了は着いた。","mistake":"まだ完了していません。","example":"我快到了。","exPinyin":"Wǒ kuài dào le.","exJa":"もうすぐ着きます。","test":"もうすぐ雨が降りそうです。","answer":"快下雨了。"}]},{"day":12,"title":"Day 12｜HSK4 基礎強化","vocab":[{"id":"d12-v0","zh":"关系","pinyin":"guānxì","ja":"関係","example":"这件事和我没有关系。","exPinyin":"Zhè jiàn shì hé wǒ méiyǒu guānxì.","exJa":"この件は私とは関係ありません。"},{"id":"d12-v1","zh":"内容","pinyin":"nèiróng","ja":"内容","example":"今天会议的内容比较复杂。","exPinyin":"Jīntiān huìyì de nèiróng bǐjiào fùzá.","exJa":"今日の会議内容はやや複雑です。"},{"id":"d12-v2","zh":"重点","pinyin":"zhòngdiǎn","ja":"重点","example":"请把重点写在第一页。","exPinyin":"Qǐng bǎ zhòngdiǎn xiě zài dì yī yè.","exJa":"重点を1ページ目に書いてください。"},{"id":"d12-v3","zh":"区别","pinyin":"qūbié","ja":"違い","example":"这两个词的区别是什么？","exPinyin":"Zhè liǎng ge cí de qūbié shì shénme?","exJa":"この2つの単語の違いは何ですか。"},{"id":"d12-v4","zh":"原因","pinyin":"yuányīn","ja":"原因","example":"迟到的原因是路上堵车。","exPinyin":"Chídào de yuányīn shì lùshang dǔchē.","exJa":"遅刻の原因は道が渋滞していたことです。"}],"grammar":[{"id":"d12-g0","name":"刚〜就〜","pinyin":"gāng/jiù","meaning":"〜したばかりなのにすぐ〜","explain":"二つの出来事が近い時間で起きたことを表します。","contrast":"刚到公司就开会。","mistake":"忙しい感じが出ます。","example":"我刚到公司就开会了。","exPinyin":"Wǒ gāng dào gōngsī jiù kāihuì le.","exJa":"会社に着いたばかりですぐ会議になりました。","test":"家に着いたばかりで電話が来ました。","answer":"我刚到家就接到电话了。"},{"id":"d12-g1","name":"刚才と刚","pinyin":"gāngcái/gāng","meaning":"さっき/〜したばかり","explain":"刚才は時間名詞でさっき、刚は副詞で〜したばかりです。","contrast":"刚才我给你打电话了。 我刚到。","mistake":"位置に注意します。","example":"我刚才给你发消息了。","exPinyin":"Wǒ gāngcái gěi nǐ fā xiāoxi le.","exJa":"さっきあなたにメッセージを送りました。","test":"私は着いたばかりです。","answer":"我刚到。"},{"id":"d12-g2","name":"又〜了","pinyin":"yòu…le","meaning":"また〜した","explain":"同じことが再び起きたことを表します。","contrast":"又迟到了 はまた遅刻した。","mistake":"再は未来のまた、又は発生済みのまたが多いです。","example":"他又迟到了。","exPinyin":"Tā yòu chídào le.","exJa":"彼はまた遅刻しました。","test":"また雨が降ってきました。","answer":"又下雨了。"}]},{"day":13,"title":"Day 13｜HSK4 基礎強化","vocab":[{"id":"d13-v0","zh":"方法","pinyin":"fāngfǎ","ja":"方法","example":"这个方法很适合我。","exPinyin":"Zhège fāngfǎ hěn shìhé wǒ.","exJa":"この方法は私に合っています。"},{"id":"d13-v1","zh":"能力","pinyin":"nénglì","ja":"能力","example":"我想提高中文表达能力。","exPinyin":"Wǒ xiǎng tígāo Zhōngwén biǎodá nénglì.","exJa":"中国語の表現力を高めたいです。"},{"id":"d13-v2","zh":"速度","pinyin":"sùdù","ja":"速度","example":"他说话的速度太快了。","exPinyin":"Tā shuōhuà de sùdù tài kuài le.","exJa":"彼の話すスピードは速すぎます。"},{"id":"d13-v3","zh":"质量","pinyin":"zhìliàng","ja":"質","example":"这份报告的质量不错。","exPinyin":"Zhè fèn bàogào de zhìliàng búcuò.","exJa":"このレポートの質は悪くありません。"},{"id":"d13-v4","zh":"态度","pinyin":"tàidu","ja":"態度","example":"他的工作态度很认真。","exPinyin":"Tā de gōngzuò tàidu hěn rènzhēn.","exJa":"彼の仕事の態度はとても真面目です。"}],"grammar":[{"id":"d13-g0","name":"再","pinyin":"zài","meaning":"もう一度、またこれから","explain":"未来やこれからの繰り返し・追加を表します。","contrast":"请再说一遍。","mistake":"すでに起きたことには又が自然です。","example":"请再说一遍。","exPinyin":"Qǐng zài shuō yí biàn.","exJa":"もう一度言ってください。","test":"もう一度説明してください。","answer":"请再解释一下。"},{"id":"d13-g1","name":"还是／或者","pinyin":"háishi/huòzhě","meaning":"選択疑問/平叙文の選択","explain":"疑問文で選択を聞く時は还是、普通の文でまたはは或者です。","contrast":"你喝茶还是咖啡？","mistake":"疑問文で或者を使うと不自然なことがあります。","example":"你坐地铁还是打车？","exPinyin":"Nǐ zuò dìtiě háishi dǎchē?","exJa":"地下鉄ですか、タクシーですか。","test":"コーヒーかお茶を飲みたいです。","answer":"我想喝咖啡或者茶。"},{"id":"d13-g2","name":"才","pinyin":"cái","meaning":"やっと、〜しか","explain":"才は思ったより遅い・少ない感覚を表します。","contrast":"八点才到 は8時になってやっと着いた。","mistake":"就と感覚が逆です。","example":"他十点才到公司。","exPinyin":"Tā shí diǎn cái dào gōngsī.","exJa":"彼は10時になってやっと会社に着きました。","test":"私は今やっと分かりました。","answer":"我现在才明白。"}]},{"day":14,"title":"Day 14｜HSK4 基礎強化","vocab":[{"id":"d14-v0","zh":"服务","pinyin":"fúwù","ja":"サービス","example":"这家店的服务很好。","exPinyin":"Zhè jiā diàn de fúwù hěn hǎo.","exJa":"この店のサービスはとても良いです。"},{"id":"d14-v1","zh":"价格","pinyin":"jiàgé","ja":"価格","example":"这个价格比我想象的高。","exPinyin":"Zhège jiàgé bǐ wǒ xiǎngxiàng de gāo.","exJa":"この価格は思っていたより高いです。"},{"id":"d14-v2","zh":"味道","pinyin":"wèidào","ja":"味","example":"这个菜味道不错。","exPinyin":"Zhège cài wèidào búcuò.","exJa":"この料理は味が悪くありません。"},{"id":"d14-v3","zh":"辣椒","pinyin":"làjiāo","ja":"唐辛子","example":"孩子也要吃，请少放一点辣椒。","exPinyin":"Háizi yě yào chī, qǐng shǎo fàng yìdiǎn làjiāo.","exJa":"子どもも食べるので、唐辛子を少なめにしてください。"},{"id":"d14-v4","zh":"调整","pinyin":"tiáozhěng","ja":"調整する","example":"这个时间可以调整一下吗？","exPinyin":"Zhège shíjiān kěyǐ tiáozhěng yíxià ma?","exJa":"この時間を少し調整できますか。"}],"grammar":[{"id":"d14-g0","name":"就","pinyin":"jiù","meaning":"もう、すぐ、たった","explain":"就は早さ・少なさ・当然の結果を表します。","contrast":"八点就到 は8時にはもう着いた。","mistake":"才との対比で覚えると便利です。","example":"我马上就到。","exPinyin":"Wǒ mǎshàng jiù dào.","exJa":"すぐ着きます。","test":"彼は7時にはもう出発しました。","answer":"他七点就出发了。"},{"id":"d14-g1","name":"才と就","pinyin":"cái/jiù","meaning":"遅い/早いの感覚","explain":"同じ時間でも才と就で話し手の感じ方が逆です。","contrast":"九点才到 は遅い、九点就到 は早い。","mistake":"訳より話者の気持ちを意識します。","example":"他晚上十点才回家。","exPinyin":"Tā wǎnshang shí diǎn cái huí jiā.","exJa":"彼は夜10時になってやっと帰宅しました。","test":"私は5分で着きます。","answer":"我五分钟就到。"},{"id":"d14-g2","name":"有点儿と一点儿","pinyin":"yǒudiǎnr/yìdiǎnr","meaning":"少し〜/少しの量","explain":"有点儿は形容詞の前、一点儿は量や程度を表します。","contrast":"有点儿贵、少放一点儿辣椒。","mistake":"手续一点麻烦ではなく，手续有点儿麻烦。","example":"这个手续有点儿麻烦。","exPinyin":"Zhège shǒuxù yǒudiǎnr máfan.","exJa":"この手続きは少し面倒です。","test":"辛さを少し控えてください。","answer":"请少放一点儿辣椒。"}]},{"day":15,"title":"Day 15｜HSK4 基礎強化","vocab":[{"id":"d15-v0","zh":"客户","pinyin":"kèhù","ja":"顧客","example":"下午我要去见一个客户。","exPinyin":"Xiàwǔ wǒ yào qù jiàn yí ge kèhù.","exJa":"午後、顧客に会いに行きます。"},{"id":"d15-v1","zh":"经理","pinyin":"jīnglǐ","ja":"マネージャー","example":"王经理让我明天再联系他。","exPinyin":"Wáng jīnglǐ ràng wǒ míngtiān zài liánxì tā.","exJa":"王マネージャーは明日また連絡するよう私に言いました。"},{"id":"d15-v2","zh":"同事","pinyin":"tóngshì","ja":"同僚","example":"我跟同事讨论了一下这个问题。","exPinyin":"Wǒ gēn tóngshì tǎolùn le yíxià zhège wèntí.","exJa":"同僚とこの問題について少し話し合いました。"},{"id":"d15-v3","zh":"会议室","pinyin":"huìyìshì","ja":"会議室","example":"会议室已经订好了。","exPinyin":"Huìyìshì yǐjīng dìng hǎo le.","exJa":"会議室はもう予約してあります。"},{"id":"d15-v4","zh":"资料","pinyin":"zīliào","ja":"資料","example":"请把资料发给我。","exPinyin":"Qǐng bǎ zīliào fā gěi wǒ.","exJa":"資料を私に送ってください。"}],"grammar":[{"id":"d15-g0","name":"一点儿也不","pinyin":"yìdiǎnr yě bù","meaning":"少しも〜ない","explain":"完全な否定を強調します。","contrast":"一点儿也不贵 は少しも高くない。","mistake":"不太より強い否定です。","example":"这个菜一点儿也不辣。","exPinyin":"Zhège cài yìdiǎnr yě bú là.","exJa":"この料理は少しも辛くありません。","test":"彼は全然緊張していません。","answer":"他一点儿也不紧张。"},{"id":"d15-g1","name":"差点儿","pinyin":"chàdiǎnr","meaning":"危うく〜するところだった","explain":"もう少しで何かが起きそうだったことを表します。","contrast":"差点儿迟到 は遅刻しそうだった。","mistake":"実際には起きていない場合が多いです。","example":"我今天差点儿迟到。","exPinyin":"Wǒ jīntiān chàdiǎnr chídào.","exJa":"今日は危うく遅刻するところでした。","test":"危うく地下鉄に乗り遅れるところでした。","answer":"我差点儿没赶上地铁。"},{"id":"d15-g2","name":"好像","pinyin":"hǎoxiàng","meaning":"〜みたいだ","explain":"見た感じ・聞いた感じで推測する時に使います。","contrast":"好像要下雨 は雨が降りそう。","mistake":"可能より感覚的です。","example":"外面好像下雨了。","exPinyin":"Wàimiàn hǎoxiàng xià yǔ le.","exJa":"外は雨が降っているみたいです。","test":"彼は少し疲れているみたいです。","answer":"他好像有点儿累。"}]},{"day":16,"title":"Day 16｜HSK4 基礎強化","vocab":[{"id":"d16-v0","zh":"报告","pinyin":"bàogào","ja":"報告書","example":"我还没看完这份报告。","exPinyin":"Wǒ hái méi kàn wán zhè fèn bàogào.","exJa":"この報告書をまだ読み終えていません。"},{"id":"d16-v1","zh":"合同","pinyin":"hétong","ja":"契約書","example":"签合同之前要仔细看。","exPinyin":"Qiān hétong zhīqián yào zǐxì kàn.","exJa":"契約書に署名する前によく見る必要があります。"},{"id":"d16-v2","zh":"护照","pinyin":"hùzhào","ja":"パスポート","example":"去银行办手续需要带护照。","exPinyin":"Qù yínháng bàn shǒuxù xūyào dài hùzhào.","exJa":"銀行で手続きをするにはパスポートを持って行く必要があります。"},{"id":"d16-v3","zh":"身份证","pinyin":"shēnfènzhèng","ja":"身分証","example":"参观工厂需要带身份证。","exPinyin":"Cānguān gōngchǎng xūyào dài shēnfènzhèng.","exJa":"工場見学には身分証が必要です。"},{"id":"d16-v4","zh":"地址","pinyin":"dìzhǐ","ja":"住所","example":"你可以把地址发给我吗？","exPinyin":"Nǐ kěyǐ bǎ dìzhǐ fā gěi wǒ ma?","exJa":"住所を私に送ってもらえますか。"}],"grammar":[{"id":"d16-g0","name":"可能と可以","pinyin":"kěnéng/kěyǐ","meaning":"可能性/許可・可能","explain":"可能は〜かもしれない、可以は〜できる/してよいです。","contrast":"明天可能下雨、这里可以拍照。","mistake":"日本語の「できる」に引っ張られないこと。","example":"明天可能会下雨。","exPinyin":"Míngtiān kěnéng huì xià yǔ.","exJa":"明日は雨が降るかもしれません。","test":"ここで写真を撮ってもいいですか。","answer":"这里可以拍照吗？"},{"id":"d16-g1","name":"应该と要","pinyin":"yīnggāi/yào","meaning":"〜すべき/〜する必要がある","explain":"应该は判断としてすべき、要は必要・予定・意志です。","contrast":"你应该休息、我要休息。","mistake":"文脈で助言か必要かを見ます。","example":"你应该早点休息。","exPinyin":"Nǐ yīnggāi zǎodiǎn xiūxi.","exJa":"早めに休んだ方がいいです。","test":"明日は会議に出なければなりません。","answer":"明天我要参加会议。"},{"id":"d16-g2","name":"必须と得","pinyin":"bìxū/děi","meaning":"必ず〜/〜しなきゃ","explain":"必须は正式で強い義務、得は口語的な必要です。","contrast":"我得走了、必须提交。","mistake":"得はdeではなくděiです。","example":"我得先回家了。","exPinyin":"Wǒ děi xiān huí jiā le.","exJa":"先に家に帰らなければなりません。","test":"この書類は今日提出しなければなりません。","answer":"这个文件今天必须提交。"}]},{"day":17,"title":"Day 17｜HSK4 基礎強化","vocab":[{"id":"d17-v0","zh":"定位","pinyin":"dìngwèi","ja":"位置情報","example":"我把定位发给你。","exPinyin":"Wǒ bǎ dìngwèi fā gěi nǐ.","exJa":"位置情報をあなたに送ります。"},{"id":"d17-v1","zh":"二维码","pinyin":"èrwéimǎ","ja":"QRコード","example":"请扫这个二维码。","exPinyin":"Qǐng sǎo zhège èrwéimǎ.","exJa":"このQRコードをスキャンしてください。"},{"id":"d17-v2","zh":"外卖","pinyin":"wàimài","ja":"デリバリー","example":"你把外卖拿进来吧。","exPinyin":"Nǐ bǎ wàimài ná jìnlái ba.","exJa":"デリバリーを中に持ってきてください。"},{"id":"d17-v3","zh":"地铁","pinyin":"dìtiě","ja":"地下鉄","example":"我每天坐地铁上班。","exPinyin":"Wǒ měitiān zuò dìtiě shàngbān.","exJa":"私は毎日地下鉄で通勤しています。"},{"id":"d17-v4","zh":"高铁","pinyin":"gāotiě","ja":"高速鉄道","example":"从上海坐高铁去杭州很方便。","exPinyin":"Cóng Shànghǎi zuò gāotiě qù Hángzhōu hěn fāngbiàn.","exJa":"上海から高速鉄道で杭州へ行くのは便利です。"}],"grammar":[{"id":"d17-g0","name":"让：使役","pinyin":"ràng","meaning":"〜させる、〜してもらう","explain":"让＋人＋動詞で、誰かに何かをさせる/してもらう意味です。","contrast":"他让我等一下。","mistake":"日本語の「〜してもらう」に近い時もあります。","example":"经理让我明天再联系他。","exPinyin":"Jīnglǐ ràng wǒ míngtiān zài liánxì tā.","exJa":"マネージャーは明日また連絡するよう私に言いました。","test":"先生は私にもう一度読むよう言いました。","answer":"老师让我再读一遍。"},{"id":"d17-g1","name":"被：受け身","pinyin":"bèi","meaning":"〜される","explain":"被は受け身を表します。","contrast":"我的手机被孩子拿走了。","mistake":"中国語は日本語ほど受け身を多用しません。","example":"我的手机被孩子拿走了。","exPinyin":"Wǒ de shǒujī bèi háizi ná zǒu le.","exJa":"私のスマホは子どもに持っていかれました。","test":"資料はマネージャーに直されました。","answer":"资料被经理改了。"},{"id":"d17-g2","name":"给：対象","pinyin":"gěi","meaning":"〜に、〜してあげる","explain":"给＋人で動作の相手を表します。","contrast":"我给你发地址。","mistake":"あげるだけでなく、相手を示す前置詞として使います。","example":"我给你发个地址。","exPinyin":"Wǒ gěi nǐ fā ge dìzhǐ.","exJa":"住所をあなたに送ります。","test":"午後私に電話してください。","answer":"下午给我打电话。"}]},{"day":18,"title":"Day 18｜HSK4 基礎強化","vocab":[{"id":"d18-v0","zh":"打车","pinyin":"dǎchē","ja":"タクシーに乗る/呼ぶ","example":"下雨天打车不太容易。","exPinyin":"Xiàyǔ tiān dǎchē bú tài róngyì.","exJa":"雨の日はタクシーを呼ぶのがあまり簡単ではありません。"},{"id":"d18-v1","zh":"堵车","pinyin":"dǔchē","ja":"渋滞する","example":"今天路上堵车很严重。","exPinyin":"Jīntiān lùshang dǔchē hěn yánzhòng.","exJa":"今日は道の渋滞がひどいです。"},{"id":"d18-v2","zh":"迟到","pinyin":"chídào","ja":"遅刻する","example":"我今天早上差点儿迟到。","exPinyin":"Wǒ jīntiān zǎoshang chàdiǎnr chídào.","exJa":"今朝、危うく遅刻するところでした。"},{"id":"d18-v3","zh":"加班","pinyin":"jiābān","ja":"残業する","example":"今天可能要加班。","exPinyin":"Jīntiān kěnéng yào jiābān.","exJa":"今日は残業になるかもしれません。"},{"id":"d18-v4","zh":"出差","pinyin":"chūchāi","ja":"出張する","example":"我下周要去北京出差。","exPinyin":"Wǒ xià zhōu yào qù Běijīng chūchāi.","exJa":"来週北京に出張します。"}],"grammar":[{"id":"d18-g0","name":"跟：相手","pinyin":"gēn","meaning":"〜と","explain":"跟は一緒に行動する相手や相談相手を表します。","contrast":"跟朋友吃饭、跟经理讨论。","mistake":"和より口語で自然な場面があります。","example":"我想跟你讨论一下。","exPinyin":"Wǒ xiǎng gēn nǐ tǎolùn yíxià.","exJa":"あなたと少し相談したいです。","test":"同僚と昼ごはんを食べます。","answer":"我跟同事吃午饭。"},{"id":"d18-g1","name":"对〜来说","pinyin":"duì…lái shuō","meaning":"〜にとって","explain":"誰かの立場から見た評価を言う時に使います。","contrast":"对我来说，语法很难。","mistake":"对我说 は私に言う、对我来说 は私にとって。","example":"对我来说，中文语顺最难。","exPinyin":"Duì wǒ lái shuō, Zhōngwén yǔxù zuì nán.","exJa":"私にとって中国語の語順が一番難しいです。","test":"外国人にとって手続きは少し面倒です。","answer":"对外国人来说，手续有点儿麻烦。"},{"id":"d18-g2","name":"关于","pinyin":"guānyú","meaning":"〜について","explain":"話題・テーマを示すやや正式な表現です。","contrast":"关于明天的会议，我有一个问题。","mistake":"口語では说到もあります。","example":"关于这个问题，我想再确认一下。","exPinyin":"Guānyú zhège wèntí, wǒ xiǎng zài quèrèn yíxià.","exJa":"この問題について、もう一度確認したいです。","test":"中国語学習について相談したいです。","answer":"关于中文学习，我想咨询一下。"}]},{"day":19,"title":"Day 19｜HSK4 基礎強化","vocab":[{"id":"d19-v0","zh":"报名","pinyin":"bàomíng","ja":"申し込む","example":"我打算报名参加HSK四级考试。","exPinyin":"Wǒ dǎsuàn bàomíng cānjiā HSK sì jí kǎoshì.","exJa":"HSK4級試験に申し込むつもりです。"},{"id":"d19-v1","zh":"考试","pinyin":"kǎoshì","ja":"試験","example":"这次考试比我想象的难。","exPinyin":"Zhè cì kǎoshì bǐ wǒ xiǎngxiàng de nán.","exJa":"今回の試験は思ったより難しいです。"},{"id":"d19-v2","zh":"复习","pinyin":"fùxí","ja":"復習する","example":"晚上我想复习今天学的语法。","exPinyin":"Wǎnshang wǒ xiǎng fùxí jīntiān xué de yǔfǎ.","exJa":"夜、今日学んだ文法を復習したいです。"},{"id":"d19-v3","zh":"预习","pinyin":"yùxí","ja":"予習する","example":"上课之前我会先预习。","exPinyin":"Shàngkè zhīqián wǒ huì xiān yùxí.","exJa":"授業の前に先に予習します。"},{"id":"d19-v4","zh":"发音","pinyin":"fāyīn","ja":"発音","example":"我的发音还需要多练习。","exPinyin":"Wǒ de fāyīn hái xūyào duō liànxí.","exJa":"私の発音はまだもっと練習が必要です。"}],"grammar":[{"id":"d19-g0","name":"为了","pinyin":"wèile","meaning":"〜のために","explain":"目的を表します。","contrast":"为了提高中文，我每天练习。","mistake":"因为は理由、为了は目的です。","example":"为了提高中文，我每天练习。","exPinyin":"Wèile tígāo Zhōngwén, wǒ měitiān liànxí.","exJa":"中国語を上げるために毎日練習しています。","test":"健康のために歩いて通勤します。","answer":"为了健康，我走路上班。"},{"id":"d19-g1","name":"由于","pinyin":"yóuyú","meaning":"〜のために","explain":"理由を表すやや正式な表現です。","contrast":"由于天气原因，活动取消。","mistake":"会話では因为の方が自然な場合も多いです。","example":"由于下雨，活动取消了。","exPinyin":"Yóuyú xià yǔ, huódòng qǔxiāo le.","exJa":"雨のためイベントは中止になりました。","test":"交通のため少し遅れます。","answer":"由于交通原因，我会晚一点到。"},{"id":"d19-g2","name":"因此","pinyin":"yīncǐ","meaning":"したがって","explain":"前の理由を受けて結果を述べる書き言葉寄りの接続詞です。","contrast":"他每天练习，因此进步很快。","mistake":"会話では所以の方が自然なことが多いです。","example":"他每天练习，因此进步很快。","exPinyin":"Tā měitiān liànxí, yīncǐ jìnbù hěn kuài.","exJa":"彼は毎日練習しているので進歩が速いです。","test":"時間がありません。したがって今日はここまでです。","answer":"没有时间了，因此今天到这里。"}]},{"day":20,"title":"Day 20｜HSK4 基礎強化","vocab":[{"id":"d20-v0","zh":"语法","pinyin":"yǔfǎ","ja":"文法","example":"这个语法点我还不太懂。","exPinyin":"Zhège yǔfǎ diǎn wǒ hái bú tài dǒng.","exJa":"この文法ポイントはまだあまり分かりません。"},{"id":"d20-v1","zh":"句子","pinyin":"jùzi","ja":"文","example":"请你用这个词造一个句子。","exPinyin":"Qǐng nǐ yòng zhège cí zào yí ge jùzi.","exJa":"この単語を使って文を作ってください。"},{"id":"d20-v2","zh":"词语","pinyin":"cíyǔ","ja":"語句","example":"今天的词语都很实用。","exPinyin":"Jīntiān de cíyǔ dōu hěn shíyòng.","exJa":"今日の語句はどれも実用的です。"},{"id":"d20-v3","zh":"听力","pinyin":"tīnglì","ja":"リスニング","example":"我的听力比以前好多了。","exPinyin":"Wǒ de tīnglì bǐ yǐqián hǎo duō le.","exJa":"私のリスニングは以前よりずっと良くなりました。"},{"id":"d20-v4","zh":"阅读","pinyin":"yuèdú","ja":"読解","example":"阅读题需要仔细看。","exPinyin":"Yuèdú tí xūyào zǐxì kàn.","exJa":"読解問題はよく読む必要があります。"}],"grammar":[{"id":"d20-g0","name":"不过","pinyin":"búguò","meaning":"ただし、でも","explain":"前の内容を受けて、少し反対・補足を言う時に使います。","contrast":"这件衣服很好看，不过有点儿贵。","mistake":"但是より柔らかく会話で自然です。","example":"这家店不错，不过有点儿贵。","exPinyin":"Zhè jiā diàn búcuò, búguò yǒudiǎnr guì.","exJa":"この店は悪くないですが、少し高いです。","test":"便利ですが少し遠いです。","answer":"很方便，不过有点儿远。"},{"id":"d20-g1","name":"而且","pinyin":"érqiě","meaning":"しかも、さらに","explain":"前の内容に追加してもう一つ特徴を言います。","contrast":"很近，而且便宜。","mistake":"还有より文と文をつなぐ感じが強いです。","example":"这里离地铁近，而且很安静。","exPinyin":"Zhèlǐ lí dìtiě jìn, érqiě hěn ānjìng.","exJa":"ここは地下鉄に近く、しかも静かです。","test":"このアプリは便利で見やすいです。","answer":"这个应用很方便，而且很好看。"},{"id":"d20-g2","name":"另外","pinyin":"lìngwài","meaning":"それから、別に","explain":"話題や情報を追加する時に使います。","contrast":"另外，我还有一个问题。","mistake":"而且は性質の追加、另外は話題の追加に向いています。","example":"另外，我想确认一下时间。","exPinyin":"Lìngwài, wǒ xiǎng quèrèn yíxià shíjiān.","exJa":"それから、時間を確認したいです。","test":"それから住所を送ってください。","answer":"另外，请把地址发给我。"}]},{"day":21,"title":"Day 21｜HSK4 基礎強化","vocab":[{"id":"d21-v0","zh":"书写","pinyin":"shūxiě","ja":"書写","example":"HSK四级也有书写部分。","exPinyin":"HSK sì jí yě yǒu shūxiě bùfen.","exJa":"HSK4級にも書写部分があります。"},{"id":"d21-v1","zh":"翻译","pinyin":"fānyì","ja":"翻訳する","example":"这句话可以怎么翻译？","exPinyin":"Zhè jù huà kěyǐ zěnme fānyì?","exJa":"この文はどう翻訳できますか。"},{"id":"d21-v2","zh":"意思","pinyin":"yìsi","ja":"意味","example":"这个词是什么意思？","exPinyin":"Zhège cí shì shénme yìsi?","exJa":"この単語はどういう意味ですか。"},{"id":"d21-v3","zh":"想象","pinyin":"xiǎngxiàng","ja":"想像する","example":"事情没有我想象的那么简单。","exPinyin":"Shìqing méiyǒu wǒ xiǎngxiàng de nàme jiǎndān.","exJa":"物事は思っていたほど簡単ではありません。"},{"id":"d21-v4","zh":"犹豫","pinyin":"yóuyù","ja":"ためらう","example":"说中文的时候，我有时会犹豫。","exPinyin":"Shuō Zhōngwén de shíhou, wǒ yǒushí huì yóuyù.","exJa":"中国語を話す時、時々ためらってしまいます。"}],"grammar":[{"id":"d21-g0","name":"尤其","pinyin":"yóuqí","meaning":"特に","explain":"いくつかある中で特に強調したいものを言う時に使います。","contrast":"我想提高中文，尤其是口语。","mistake":"特别と近いですが、尤其は比較対象の中で特に。","example":"我想提高中文，尤其是口语。","exPinyin":"Wǒ xiǎng tígāo Zhōngwén, yóuqí shì kǒuyǔ.","exJa":"中国語、特に会話力を高めたいです。","test":"補語、特に結果補語が苦手です。","answer":"我不擅长补语，尤其是结果补语。"},{"id":"d21-g1","name":"甚至","pinyin":"shènzhì","meaning":"〜さえ","explain":"極端な例を出して強調します。","contrast":"他忙得甚至没时间吃饭。","mistake":"強調表現です。","example":"他忙得甚至没时间吃午饭。","exPinyin":"Tā máng de shènzhì méi shíjiān chī wǔfàn.","exJa":"彼は忙しすぎて昼食の時間さえありません。","test":"彼は中国語で会議さえできます。","answer":"他甚至可以用中文开会。"},{"id":"d21-g2","name":"并不是","pinyin":"bìng bú shì","meaning":"必ずしも〜ではない","explain":"相手の前提をやわらかく否定する表現です。","contrast":"有中国老婆，中文并不是一定会好。","mistake":"不是より少し論理的です。","example":"我的中文并不是大家想象的那么好。","exPinyin":"Wǒ de Zhōngwén bìng bú shì dàjiā xiǎngxiàng de nàme hǎo.","exJa":"私の中国語は皆が想像するほど良いわけではありません。","test":"これは必ずしも簡単ではありません。","answer":"这并不是很简单。"}]},{"day":22,"title":"Day 22｜HSK4 基礎強化","vocab":[{"id":"d22-v0","zh":"主动","pinyin":"zhǔdòng","ja":"主体的に","example":"学习语言要主动开口。","exPinyin":"Xuéxí yǔyán yào zhǔdòng kāikǒu.","exJa":"言語学習では自分から口を開く必要があります。"},{"id":"d22-v1","zh":"依赖","pinyin":"yīlài","ja":"頼る","example":"不要太依赖翻译软件。","exPinyin":"Bú yào tài yīlài fānyì ruǎnjiàn.","exJa":"翻訳ソフトに頼りすぎないでください。"},{"id":"d22-v2","zh":"明显","pinyin":"míngxiǎn","ja":"明らか","example":"最近他的中文进步很明显。","exPinyin":"Zuìjìn tā de Zhōngwén jìnbù hěn míngxiǎn.","exJa":"最近、彼の中国語の進歩は明らかです。"},{"id":"d22-v3","zh":"正式","pinyin":"zhèngshì","ja":"正式な","example":"这是一次正式的会议。","exPinyin":"Zhè shì yí cì zhèngshì de huìyì.","exJa":"これは正式な会議です。"},{"id":"d22-v4","zh":"临时","pinyin":"línshí","ja":"臨時の","example":"客户临时改变了时间。","exPinyin":"Kèhù línshí gǎibiàn le shíjiān.","exJa":"顧客が急に時間を変更しました。"}],"grammar":[{"id":"d22-g0","name":"并没有","pinyin":"bìng méiyǒu","meaning":"実は〜していない","explain":"予想に反してそうではない、という否定です。","contrast":"我并没有放弃。","mistake":"没よりやや強く、誤解を訂正する感じがあります。","example":"我并没有忘记这件事。","exPinyin":"Wǒ bìng méiyǒu wàngjì zhè jiàn shì.","exJa":"この件を忘れたわけではありません。","test":"私は諦めたわけではありません。","answer":"我并没有放弃。"},{"id":"d22-g1","name":"非〜不可","pinyin":"fēi…bùkě","meaning":"どうしても〜しなければならない","explain":"強い必要性を表します。","contrast":"这个问题非解决不可。","mistake":"必须より強く聞こえることがあります。","example":"这个问题今天非解决不可。","exPinyin":"Zhège wèntí jīntiān fēi jiějué bùkě.","exJa":"この問題は今日どうしても解決しなければなりません。","test":"HSK4はどうしても合格しなければなりません。","answer":"HSK四级非通过不可。"},{"id":"d22-g2","name":"一〜就〜","pinyin":"yī…jiù…","meaning":"〜するとすぐ〜","explain":"一つの動作の直後に次の動作が起きることを表します。","contrast":"一到家就睡觉。","mistake":"刚就より一般的です。","example":"我一到公司就开会。","exPinyin":"Wǒ yí dào gōngsī jiù kāihuì.","exJa":"会社に着くとすぐ会議です。","test":"家に着いたらすぐ連絡します。","answer":"我一到家就联系你。"}]},{"day":23,"title":"Day 23｜HSK4 基礎強化","vocab":[{"id":"d23-v0","zh":"突然","pinyin":"tūrán","ja":"突然","example":"天气突然变冷了。","exPinyin":"Tiānqì tūrán biàn lěng le.","exJa":"天気が急に寒くなりました。"},{"id":"d23-v1","zh":"原来","pinyin":"yuánlái","ja":"もともと、なんだ","example":"原来这个词是这个意思。","exPinyin":"Yuánlái zhège cí shì zhège yìsi.","exJa":"なるほど、この単語はこういう意味だったのですね。"},{"id":"d23-v2","zh":"后来","pinyin":"hòulái","ja":"その後","example":"后来我慢慢习惯了上海生活。","exPinyin":"Hòulái wǒ mànmàn xíguàn le Shànghǎi shēnghuó.","exJa":"その後、私はだんだん上海生活に慣れました。"},{"id":"d23-v3","zh":"首先","pinyin":"shǒuxiān","ja":"まず","example":"首先，我们确认一下时间。","exPinyin":"Shǒuxiān, wǒmen quèrèn yíxià shíjiān.","exJa":"まず、時間を確認しましょう。"},{"id":"d23-v4","zh":"最后","pinyin":"zuìhòu","ja":"最後に","example":"最后，我们决定坐地铁去。","exPinyin":"Zuìhòu, wǒmen juédìng zuò dìtiě qù.","exJa":"最後に、地下鉄で行くことに決めました。"}],"grammar":[{"id":"d23-g0","name":"V起来：印象","pinyin":"qǐlái","meaning":"〜してみると、〜な感じ","explain":"看起来、听起来、吃起来などで感覚を述べます。","contrast":"看起来很难 は見た感じ難しそう。","mistake":"実際ではなく印象です。","example":"这个语法听起来有点儿难。","exPinyin":"Zhège yǔfǎ tīng qǐlái yǒudiǎnr nán.","exJa":"この文法は聞いた感じ少し難しそうです。","test":"この料理は見た目がおいしそうです。","answer":"这个菜看起来很好吃。"},{"id":"d23-g1","name":"V下去：継続","pinyin":"xiàqù","meaning":"〜し続ける","explain":"動作を継続する意味です。","contrast":"坚持下去、学下去。","mistake":"方向補語から派生した抽象的な意味です。","example":"我想把中文学下去。","exPinyin":"Wǒ xiǎng bǎ Zhōngwén xué xiàqù.","exJa":"中国語を学び続けたいです。","test":"この習慣を続けたいです。","answer":"我想把这个习惯坚持下去。"},{"id":"d23-g2","name":"V下来：記録","pinyin":"xiàlái","meaning":"〜して残す","explain":"写下来、记下来で書き留める意味です。","contrast":"写下来 は書いて残す、写完は書き終える。","mistake":"HSK学習では记下来が便利です。","example":"请把这个句子记下来。","exPinyin":"Qǐng bǎ zhège jùzi jì xiàlái.","exJa":"この文をメモしてください。","test":"新しい単語を書き留めました。","answer":"我把新单词写下来了。"}]},{"day":24,"title":"Day 24｜HSK4 基礎強化","vocab":[{"id":"d24-v0","zh":"另外","pinyin":"lìngwài","ja":"さらに","example":"另外，我还有一个问题。","exPinyin":"Lìngwài, wǒ hái yǒu yí ge wèntí.","exJa":"それから、もう一つ質問があります。"},{"id":"d24-v1","zh":"而且","pinyin":"érqiě","ja":"しかも","example":"这家店很近，而且味道不错。","exPinyin":"Zhè jiā diàn hěn jìn, érqiě wèidào búcuò.","exJa":"この店は近いし、味も悪くありません。"},{"id":"d24-v2","zh":"不过","pinyin":"búguò","ja":"ただし","example":"这件衣服很好看，不过有点儿贵。","exPinyin":"Zhè jiàn yīfu hěn hǎokàn, búguò yǒudiǎnr guì.","exJa":"この服はきれいですが、少し高いです。"},{"id":"d24-v3","zh":"尤其","pinyin":"yóuqí","ja":"特に","example":"我尤其想提高口语。","exPinyin":"Wǒ yóuqí xiǎng tígāo kǒuyǔ.","exJa":"特に会話力を高めたいです。"},{"id":"d24-v4","zh":"甚至","pinyin":"shènzhì","ja":"〜さえ","example":"他忙得甚至没时间吃午饭。","exPinyin":"Tā máng de shènzhì méi shíjiān chī wǔfàn.","exJa":"彼は忙しすぎて昼ごはんを食べる時間さえありませんでした。"}],"grammar":[{"id":"d24-g0","name":"V错","pinyin":"cuò","meaning":"〜し間違える","explain":"说错、写错、听错、看错など、動作の結果が間違っていることを表します。","contrast":"写错了 は書き間違えた。","mistake":"結果補語なので結果に注目します。","example":"我把这个字写错了。","exPinyin":"Wǒ bǎ zhège zì xiě cuò le.","exJa":"この字を書き間違えました。","test":"聞き間違えました。","answer":"我听错了。"},{"id":"d24-g1","name":"V清楚","pinyin":"qīngchu","meaning":"はっきり〜する","explain":"听清楚、看清楚、说清楚で、はっきり聞く・見る・説明する意味です。","contrast":"听见は聞こえる、听清楚ははっきり聞こえる。","mistake":"清楚は補語として便利です。","example":"我没听清楚。","exPinyin":"Wǒ méi tīng qīngchu.","exJa":"はっきり聞き取れませんでした。","test":"もう少しはっきり説明してください。","answer":"请说清楚一点。"},{"id":"d24-g2","name":"V懂","pinyin":"dǒng","meaning":"〜して理解する","explain":"看懂、听懂、读懂など、情報を理解できたことを表します。","contrast":"听见は聞こえる、听懂は理解できる。","mistake":"聞こえることと理解することを分けます。","example":"这个句子我看懂了。","exPinyin":"Zhège jùzi wǒ kàn dǒng le.","exJa":"この文は読んで理解できました。","test":"彼の中国語を理解できません。","answer":"我听不懂他的中文。"}]},{"day":25,"title":"Day 25｜HSK4 基礎強化","vocab":[{"id":"d25-v0","zh":"由于","pinyin":"yóuyú","ja":"〜のため","example":"由于下雨，活动取消了。","exPinyin":"Yóuyú xià yǔ, huódòng qǔxiāo le.","exJa":"雨のため、イベントは中止になりました。"},{"id":"d25-v1","zh":"因此","pinyin":"yīncǐ","ja":"したがって","example":"他每天练习，因此进步很快。","exPinyin":"Tā měitiān liànxí, yīncǐ jìnbù hěn kuài.","exJa":"彼は毎日練習しているので、進歩が速いです。"},{"id":"d25-v2","zh":"否则","pinyin":"fǒuzé","ja":"さもないと","example":"你要早点出门，否则会迟到。","exPinyin":"Nǐ yào zǎodiǎn chūmén, fǒuzé huì chídào.","exJa":"早めに出ないと遅刻します。"},{"id":"d25-v3","zh":"只要","pinyin":"zhǐyào","ja":"〜さえすれば","example":"只要每天练习，就会有进步。","exPinyin":"Zhǐyào měitiān liànxí, jiù huì yǒu jìnbù.","exJa":"毎日練習さえすれば、進歩します。"},{"id":"d25-v4","zh":"无论","pinyin":"wúlùn","ja":"〜に関わらず","example":"无论多忙，我都想坚持学习。","exPinyin":"Wúlùn duō máng, wǒ dōu xiǎng jiānchí xuéxí.","exJa":"どんなに忙しくても、学習を続けたいです。"}],"grammar":[{"id":"d25-g0","name":"多V一点儿","pinyin":"duō V yìdiǎnr","meaning":"もう少し多く〜する","explain":"多说一点儿、多练一点儿のように、動作量を増やします。","contrast":"多练一点儿 はもう少し練習する。","mistake":"一点儿の位置に注意します。","example":"你可以多说一点儿中文。","exPinyin":"Nǐ kěyǐ duō shuō yìdiǎnr Zhōngwén.","exJa":"もう少し中国語を話してもいいですよ。","test":"もう少しゆっくり話してください。","answer":"请说慢一点儿。"},{"id":"d25-g1","name":"少V一点儿","pinyin":"shǎo V yìdiǎnr","meaning":"少し控えめに〜する","explain":"少放一点儿、少吃一点儿のように量を減らします。","contrast":"少放辣椒 は唐辛子を少なめに入れる。","mistake":"少＋動詞＋一点儿の語順が自然です。","example":"请少放一点儿辣椒。","exPinyin":"Qǐng shǎo fàng yìdiǎnr làjiāo.","exJa":"唐辛子を少し少なめにしてください。","test":"少し小さい声で話してください。","answer":"请小声一点儿。"},{"id":"d25-g2","name":"形容詞一点儿","pinyin":"adj yìdiǎnr","meaning":"もう少し〜","explain":"大一点儿、慢一点儿、便宜一点儿など、程度調整に使います。","contrast":"慢一点儿 は少しゆっくり。","mistake":"依頼では请…一点儿が柔らかいです。","example":"请说慢一点儿。","exPinyin":"Qǐng shuō màn yìdiǎnr.","exJa":"少しゆっくり話してください。","test":"辛さを少し控えめにしてください。","answer":"请做得不太辣一点儿。"}]},{"day":26,"title":"Day 26｜HSK4 基礎強化","vocab":[{"id":"d26-v0","zh":"附近","pinyin":"fùjìn","ja":"近く","example":"公司附近有很多饭店。","exPinyin":"Gōngsī fùjìn yǒu hěn duō fàndiàn.","exJa":"会社の近くには多くのレストランがあります。"},{"id":"d26-v1","zh":"周围","pinyin":"zhōuwéi","ja":"周辺","example":"这个小区周围很安静。","exPinyin":"Zhège xiǎoqū zhōuwéi hěn ānjìng.","exJa":"この住宅エリアの周辺は静かです。"},{"id":"d26-v2","zh":"距离","pinyin":"jùlí","ja":"距離","example":"这里距离地铁站不远。","exPinyin":"Zhèlǐ jùlí dìtiězhàn bù yuǎn.","exJa":"ここは地下鉄駅から遠くありません。"},{"id":"d26-v3","zh":"入口","pinyin":"rùkǒu","ja":"入口","example":"地铁入口在前面。","exPinyin":"Dìtiě rùkǒu zài qiánmiàn.","exJa":"地下鉄の入口は前にあります。"},{"id":"d26-v4","zh":"出口","pinyin":"chūkǒu","ja":"出口","example":"请从三号出口出来。","exPinyin":"Qǐng cóng sān hào chūkǒu chūlái.","exJa":"3番出口から出てください。"}],"grammar":[{"id":"d26-g0","name":"V一下","pinyin":"yíxià","meaning":"ちょっと〜する","explain":"動作を軽く・短くする表現です。","contrast":"看一下、确认一下、讨论一下。","mistake":"依頼を柔らかくする効果があります。","example":"请帮我看一下。","exPinyin":"Qǐng bāng wǒ kàn yíxià.","exJa":"ちょっと見てもらえますか。","test":"少し相談したいです。","answer":"我想商量一下。"},{"id":"d26-g1","name":"V一V","pinyin":"V yi V","meaning":"ちょっと〜してみる","explain":"看一看、想一想、试一试のように軽く試します。","contrast":"看一下に近いです。","mistake":"動詞を繰り返す形に慣れましょう。","example":"你想一想再回答。","exPinyin":"Nǐ xiǎng yi xiǎng zài huídá.","exJa":"少し考えてから答えてください。","test":"ちょっと試してみましょう。","answer":"我们试一试吧。"},{"id":"d26-g2","name":"V着V着","pinyin":"V zhe V zhe","meaning":"〜しているうちに","explain":"同じ動作が続く中で別の変化が起きる時に使います。","contrast":"走着走着就到了。","mistake":"自然なストーリー表現です。","example":"我听着听着就懂了。","exPinyin":"Wǒ tīngzhe tīngzhe jiù dǒng le.","exJa":"聞いているうちに分かるようになりました。","test":"歩いているうちに道に迷いました。","answer":"我走着走着就迷路了。"}]},{"day":27,"title":"Day 27｜HSK4 基礎強化","vocab":[{"id":"d27-v0","zh":"楼下","pinyin":"lóuxià","ja":"階下","example":"快递放在楼下了。","exPinyin":"Kuàidì fàng zài lóuxià le.","exJa":"宅配便は階下に置いてあります。"},{"id":"d27-v1","zh":"楼上","pinyin":"lóushàng","ja":"階上","example":"会议室在楼上。","exPinyin":"Huìyìshì zài lóushàng.","exJa":"会議室は上の階にあります。"},{"id":"d27-v2","zh":"对面","pinyin":"duìmiàn","ja":"向かい","example":"便利店在公司对面。","exPinyin":"Biànlìdiàn zài gōngsī duìmiàn.","exJa":"コンビニは会社の向かいにあります。"},{"id":"d27-v3","zh":"旁边","pinyin":"pángbiān","ja":"隣","example":"我坐在经理旁边。","exPinyin":"Wǒ zuò zài jīnglǐ pángbiān.","exJa":"私はマネージャーの隣に座っています。"},{"id":"d27-v4","zh":"里面","pinyin":"lǐmiàn","ja":"中","example":"文件在包里面。","exPinyin":"Wénjiàn zài bāo lǐmiàn.","exJa":"ファイルはカバンの中にあります。"}],"grammar":[{"id":"d27-g0","name":"从〜到〜","pinyin":"cóng/dào","meaning":"〜から〜まで","explain":"時間・場所・範囲を表します。","contrast":"从家到公司、从九点到十点。","mistake":"到の後ろに終点を置きます。","example":"从我家到公司要半个小时。","exPinyin":"Cóng wǒ jiā dào gōngsī yào bàn ge xiǎoshí.","exJa":"家から会社まで30分かかります。","test":"会議は9時から10時までです。","answer":"会议从九点到十点。"},{"id":"d27-g1","name":"离","pinyin":"lí","meaning":"〜から近い/遠い","explain":"場所間の距離を言う時に使います。","contrast":"这里离地铁站很近。","mistake":"在は場所、离は距離です。","example":"我家离地铁站很近。","exPinyin":"Wǒ jiā lí dìtiězhàn hěn jìn.","exJa":"私の家は地下鉄駅から近いです。","test":"会社は家から遠いです。","answer":"公司离我家很远。"},{"id":"d27-g2","name":"往〜走","pinyin":"wǎng zǒu","meaning":"〜の方向へ進む","explain":"道案内で使う表現です。","contrast":"往前走、往左拐。","mistake":"場所名だけでなく方向語と使えます。","example":"你往前走五分钟就到了。","exPinyin":"Nǐ wǎng qián zǒu wǔ fēnzhōng jiù dào le.","exJa":"前に5分歩けば着きます。","test":"右へ曲がってください。","answer":"请往右拐。"}]},{"day":28,"title":"Day 28｜HSK4 基礎強化","vocab":[{"id":"d28-v0","zh":"外面","pinyin":"wàimiàn","ja":"外","example":"外面下雨了。","exPinyin":"Wàimiàn xià yǔ le.","exJa":"外は雨が降ってきました。"},{"id":"d28-v1","zh":"声音","pinyin":"shēngyīn","ja":"音、声","example":"他的声音有点儿小。","exPinyin":"Tā de shēngyīn yǒudiǎnr xiǎo.","exJa":"彼の声は少し小さいです。"},{"id":"d28-v2","zh":"消息","pinyin":"xiāoxi","ja":"知らせ、メッセージ","example":"我刚看到你的消息。","exPinyin":"Wǒ gāng kàn dào nǐ de xiāoxi.","exJa":"今あなたのメッセージを見ました。"},{"id":"d28-v3","zh":"邮件","pinyin":"yóujiàn","ja":"メール","example":"我已经把邮件发出去了。","exPinyin":"Wǒ yǐjīng bǎ yóujiàn fā chūqù le.","exJa":"メールはもう送りました。"},{"id":"d28-v4","zh":"电话","pinyin":"diànhuà","ja":"電話","example":"我下午给你回电话。","exPinyin":"Wǒ xiàwǔ gěi nǐ huí diànhuà.","exJa":"午後あなたに電話を折り返します。"}],"grammar":[{"id":"d28-g0","name":"存在文：地方有","pinyin":"location yǒu","meaning":"場所に〜がある","explain":"場所＋有＋もの、という語順です。","contrast":"公司附近有很多饭店。","mistake":"場所を前に出すのが自然です。","example":"公司附近有很多饭店。","exPinyin":"Gōngsī fùjìn yǒu hěn duō fàndiàn.","exJa":"会社の近くに多くのレストランがあります。","test":"机の上にスマホがあります。","answer":"桌子上有手机。"},{"id":"d28-g1","name":"所在文：东西在地方","pinyin":"thing zài place","meaning":"ものは場所にある","explain":"特定の物がどこにあるかを言う語順です。","contrast":"手机在桌子上。","mistake":"有と在は焦点が違います。","example":"我的手机在桌子上。","exPinyin":"Wǒ de shǒujī zài zhuōzi shang.","exJa":"私のスマホは机の上にあります。","test":"会議室は上の階にあります。","answer":"会议室在楼上。"},{"id":"d28-g2","name":"有と在","pinyin":"yǒu/zài","meaning":"存在/所在","explain":"有は場所に何があるか、在は特定のものがどこにあるかを表します。","contrast":"桌上有手机 / 手机在桌上。","mistake":"主語と情報の焦点が違います。","example":"桌子上有一杯咖啡。","exPinyin":"Zhuōzi shang yǒu yì bēi kāfēi.","exJa":"机の上にコーヒーが一杯あります。","test":"コーヒーは机の上にあります。","answer":"咖啡在桌子上。"}]},{"day":29,"title":"Day 29｜HSK4 基礎強化","vocab":[{"id":"d29-v0","zh":"微信","pinyin":"Wēixìn","ja":"WeChat","example":"我们微信联系吧。","exPinyin":"Wǒmen Wēixìn liánxì ba.","exJa":"WeChatで連絡しましょう。"},{"id":"d29-v1","zh":"手机","pinyin":"shǒujī","ja":"スマホ","example":"我的手机快没电了。","exPinyin":"Wǒ de shǒujī kuài méi diàn le.","exJa":"私のスマホはもうすぐ電池が切れそうです。"},{"id":"d29-v2","zh":"电脑","pinyin":"diànnǎo","ja":"パソコン","example":"我的电脑突然坏了。","exPinyin":"Wǒ de diànnǎo tūrán huài le.","exJa":"私のパソコンが急に壊れました。"},{"id":"d29-v3","zh":"表格","pinyin":"biǎogé","ja":"表","example":"这个表格需要重新填写。","exPinyin":"Zhège biǎogé xūyào chóngxīn tiánxiě.","exJa":"この表は書き直す必要があります。"},{"id":"d29-v4","zh":"文件","pinyin":"wénjiàn","ja":"ファイル","example":"请把文件发给我。","exPinyin":"Qǐng bǎ wénjiàn fā gěi wǒ.","exJa":"ファイルを私に送ってください。"}],"grammar":[{"id":"d29-g0","name":"時間場所動作","pinyin":"word order","meaning":"時間→場所→動作","explain":"中国語では時間・場所・動作の順が自然です。","contrast":"我明天在公司开会。","mistake":"日本語の自由語順をそのまま移さないこと。","example":"我明天在公司开会。","exPinyin":"Wǒ míngtiān zài gōngsī kāihuì.","exJa":"私は明日会社で会議します。","test":"今夜家で中国語を勉強します。","answer":"我今晚在家学中文。"},{"id":"d29-g1","name":"用＋言語＋動詞","pinyin":"yòng","meaning":"〜語で〜する","explain":"言語を手段として使う時に用を使います。","contrast":"用中文开会。","mistake":"说中文は中国語を話す、用中文说は中国語で言う。","example":"我想用中文表达自己的想法。","exPinyin":"Wǒ xiǎng yòng Zhōngwén biǎodá zìjǐ de xiǎngfǎ.","exJa":"中国語で自分の考えを表現したいです。","test":"英語で説明してもいいですか。","answer":"可以用英文解释吗？"},{"id":"d29-g2","name":"用＋工具＋動詞","pinyin":"yòng tool","meaning":"〜を使って〜する","explain":"スマホ、PC、ソフトなど道具を使う表現です。","contrast":"用手机点外卖。","mistake":"道具は動詞の前に置きます。","example":"我用手机点外卖。","exPinyin":"Wǒ yòng shǒujī diǎn wàimài.","exJa":"スマホでデリバリーを注文します。","test":"パソコンで資料を作ります。","answer":"我用电脑做资料。"}]},{"day":30,"title":"Day 30｜HSK4 基礎強化","vocab":[{"id":"d30-v0","zh":"礼貌","pinyin":"lǐmào","ja":"礼儀正しい","example":"他说话很有礼貌。","exPinyin":"Tā shuōhuà hěn yǒu lǐmào.","exJa":"彼は話し方がとても礼儀正しいです。"},{"id":"d30-v1","zh":"耐心","pinyin":"nàixīn","ja":"辛抱強さ","example":"老师很有耐心。","exPinyin":"Lǎoshī hěn yǒu nàixīn.","exJa":"先生はとても辛抱強いです。"},{"id":"d30-v2","zh":"仔细","pinyin":"zǐxì","ja":"丁寧に、細かく","example":"请仔细看一下合同。","exPinyin":"Qǐng zǐxì kàn yíxià hétong.","exJa":"契約書をよく見てください。"},{"id":"d30-v3","zh":"认真","pinyin":"rènzhēn","ja":"真面目に","example":"他学习中文很认真。","exPinyin":"Tā xuéxí Zhōngwén hěn rènzhēn.","exJa":"彼は中国語をとても真面目に勉強しています。"},{"id":"d30-v4","zh":"马虎","pinyin":"mǎhu","ja":"いい加減","example":"这个地方不能太马虎。","exPinyin":"Zhège dìfang bù néng tài mǎhu.","exJa":"この部分はいい加減にしてはいけません。"}],"grammar":[{"id":"d30-g0","name":"帮＋人＋動詞","pinyin":"bāng","meaning":"〜してあげる/手伝う","explain":"相手のために動作をする表現です。","contrast":"帮我看一下。","mistake":"帮助より口語的です。","example":"你能帮我看一下吗？","exPinyin":"Nǐ néng bāng wǒ kàn yíxià ma?","exJa":"ちょっと見てもらえますか。","test":"資料を送るのを手伝ってください。","answer":"请帮我发一下资料。"},{"id":"d30-g1","name":"替＋人＋動詞","pinyin":"tì","meaning":"人の代わりに〜する","explain":"代理で何かをする時に使います。","contrast":"替我开会。","mistake":"帮は手伝う、替は代行する。","example":"你能替我参加会议吗？","exPinyin":"Nǐ néng tì wǒ cānjiā huìyì ma?","exJa":"私の代わりに会議に出てもらえますか。","test":"彼の代わりに資料を送ります。","answer":"我替他发资料。"},{"id":"d30-g2","name":"对〜有兴趣","pinyin":"duì…yǒu xìngqù","meaning":"〜に興味がある","explain":"興味の対象を对で示します。","contrast":"我对中文有兴趣。","mistake":"喜欢とは少し違います。","example":"我对中国文化很有兴趣。","exPinyin":"Wǒ duì Zhōngguó wénhuà hěn yǒu xìngqù.","exJa":"中国文化にとても興味があります。","test":"文法に興味があります。","answer":"我对语法有兴趣。"}]},{"day":31,"title":"Day 31｜HSK4 基礎強化","vocab":[{"id":"d31-v0","zh":"清楚","pinyin":"qīngchu","ja":"はっきりしている","example":"这个说明写得很清楚。","exPinyin":"Zhège shuōmíng xiě de hěn qīngchu.","exJa":"この説明はとても分かりやすく書かれています。"},{"id":"d31-v1","zh":"简单","pinyin":"jiǎndān","ja":"簡単","example":"这个语法没有我想象的那么简单。","exPinyin":"Zhège yǔfǎ méiyǒu wǒ xiǎngxiàng de nàme jiǎndān.","exJa":"この文法は思っていたほど簡単ではありません。"},{"id":"d31-v2","zh":"困难","pinyin":"kùnnan","ja":"難しい","example":"开始的时候会有一点困难。","exPinyin":"Kāishǐ de shíhou huì yǒu yìdiǎn kùnnan.","exJa":"最初は少し難しいことがあります。"},{"id":"d31-v3","zh":"重要","pinyin":"zhòngyào","ja":"重要","example":"每天开口说中文很重要。","exPinyin":"Měitiān kāikǒu shuō Zhōngwén hěn zhòngyào.","exJa":"毎日中国語を口に出すことは重要です。"},{"id":"d31-v4","zh":"主要","pinyin":"zhǔyào","ja":"主要な","example":"主要问题是语顺不太自然。","exPinyin":"Zhǔyào wèntí shì yǔxù bú tài zìrán.","exJa":"主な問題は語順があまり自然ではないことです。"}],"grammar":[{"id":"d31-g0","name":"对〜满意","pinyin":"duì…mǎnyì","meaning":"〜に満足する","explain":"満足の対象を对で示します。","contrast":"对服务满意。","mistake":"满意は形容詞的に使います。","example":"客户对服务很满意。","exPinyin":"Kèhù duì fúwù hěn mǎnyì.","exJa":"顧客はサービスに満足しています。","test":"私はこの結果に満足しています。","answer":"我对这个结果很满意。"},{"id":"d31-g1","name":"对〜有帮助","pinyin":"duì…yǒu bāngzhù","meaning":"〜に役立つ","explain":"何が誰に役立つかを言う表現です。","contrast":"这个练习对我有帮助。","mistake":"帮助は動詞にも名詞にもなります。","example":"这个应用对我很有帮助。","exPinyin":"Zhège yìngyòng duì wǒ hěn yǒu bāngzhù.","exJa":"このアプリは私にとても役立ちます。","test":"毎日の復習は中国語に役立ちます。","answer":"每天复习对中文有帮助。"},{"id":"d31-g2","name":"在〜方面","pinyin":"zài…fāngmiàn","meaning":"〜の面で","explain":"ある分野・側面について述べます。","contrast":"在语法方面，我还需要努力。","mistake"
