// ===== ブックマーク：並び替え（「おすすめ」順は統合復習スケジュール state.srs を参照、bookmarks本体は非破壊） =====
var _bmRandom=null; // ランダム並びのキャッシュ（id配列）。再描画で並びが変わらないように保持
function bmSortedItems(){
  var arr=Object.values(state.bookmarks||{});
  var mode=state.bmSort||'recommend';
  if(mode==='hard'){ return arr.sort(function(a,b){return ((state.levels[b.id]||0)-(state.levels[a.id]||0))||(a.day-b.day);}); }
  if(mode==='added'){ return arr.reverse(); } // 追加が新しい順
  if(mode==='random'){
    var map={}; arr.forEach(function(b){ map[b.id]=b; });
    if(!_bmRandom){ _bmRandom=_shuffle(arr.map(function(b){return b.id;})); }
    var out=[];
    _bmRandom.forEach(function(id){ if(map[id]){ out.push(map[id]); delete map[id]; } });
    Object.keys(map).forEach(function(id){ out.push(map[id]); }); // 後から追加された語は末尾へ
    return out;
  }
  // recommend（おすすめ）：今日が期限の語を上に→未学習→先の予定。期限は復習で変わるので毎日入れ替わる
  var now=nowMs();
  function rank(b){ var s=state.srs[b.id]; if(!s) return [1,0]; var d=s.due||0; return (d<=now)?[0,d]:[2,d]; }
  return arr.sort(function(a,b){ var ra=rank(a), rb=rank(b); return (ra[0]-rb[0])||(ra[1]-rb[1])||(a.day-b.day); });
}
function bmSortChips(){
  var cur=state.bmSort||'recommend';
  var opts=[['recommend','おすすめ'],['hard','苦手順'],['added','追加順'],['random','ランダム']];
  return opts.map(function(o){ return '<button type="button" class="chip-toggle'+(cur===o[0]?' on':'')+'" data-action="bmSort" data-id="'+o[0]+'">'+o[1]+'</button>'; }).join('');
}
function bmSetSort(s){
  if(['recommend','hard','added','random'].indexOf(s)<0) s='recommend';
  if(s==='random' && state.bmSort==='random') _bmRandom=null; // ランダム再タップで再シャッフル
  if(s!=='random') _bmRandom=null;                           // 他へ切替えたらキャッシュ破棄
  state.bmSort=s; save(); renderBookmarkPanel();
}

/* ===== 新ミニテストエンジン（案P：1問ずつ・即時解説・AI作文採点） ===== */
var _mt=null;
function mtEsc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function mtRich(s){return mtEsc(s).replace(/&lt;z&gt;/g,'<z>').replace(/&lt;\/z&gt;/g,'</z>').replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>');}
function mtBlank(s){return String(s).replace(/[_＿]{2,}|　+/g,'<span class="mt-blank"></span>');}
function mtShuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function mtOptsZh(q){
  // タグ・設問文の型ごとに選択肢の言語は一定（実データで検証済み）。
  // 「丁寧」「以上／以下」のような仮名を含まない日本語の言い回しがあるため、
  // 文字だけで中国語か判定すると誤る。型で決める。
  if(q.tag.indexOf('意味')>=0) return false;                                    // 語彙・意味：選択肢は日本語
  if(q.tag.indexOf('使い分け')>=0) return true;                                  // 語彙・使い分け：選択肢は中国語
  if(/の使い方として正しいものは|を使うときに気をつける点は/.test(q.q)) return false; // 文法の意味・注意点：日本語
  return true;                                                                  // 文法の文完成・空欄・語順：中国語
}
function mtOptLabel(t, zh){ var r=mtRich(t); return zh ? '<z>'+r+'</z>' : r; }
function mtGraderUrl(){ return localStorage.getItem('hsk4-grader-url')||'https://hsk4-grader.hsk4test.workers.dev'; }
function mtPick(day){
  var b=BANK[day];
  var meaning=b.mc.filter(function(q){return q.tag.indexOf('意味')>=0;});
  var usage  =b.mc.filter(function(q){return q.tag.indexOf('使い分け')>=0;});
  var grammar=b.mc.filter(function(q){return q.tag.indexOf('文法')>=0;});
  // 文法を置いていない日があるので、狙ったタグが尽きたら残りの問題から埋める。
  var used=[];
  function pick(arr){
    var pool=arr.filter(function(x){ return used.indexOf(x)<0; });
    if(!pool.length) pool=b.mc.filter(function(x){ return used.indexOf(x)<0; });
    if(!pool.length) pool=b.mc;
    var q=mtRand(pool); used.push(q); return q;
  }
  var five=[pick(meaning), pick(usage), pick(grammar), pick(grammar)];
  if(Math.random()<0.5){ five.push(Object.assign({__t:'drag'}, b.drag)); }
  else { var wi=Math.floor(Math.random()*b.writing.length); var w=b.writing[wi]; five.push(Object.assign({__t:'writing', idx:wi, vocab:b.vocab, grammar:b.grammar}, w)); }
  return five.map(function(q){ if(q.opts){ var c=Object.assign({},q); c.opts=mtShuffle(q.opts); return c; } return q; });
}
function mtInit(day){
  if(!BANK[day]){ var r0=$('mtRoot'); if(r0) r0.innerHTML='<div class="small muted">この日のミニテストは準備中です。</div>'; return; }

function mtRender(){

           '<div class="mt-prog"><i style="width:'+(_mt.idx/_mt.quiz.length*100)+'%"></i></div>';
  _mt.answered=false;
  if(q.opts){ root.innerHTML=head+mtMC(q); mtBindMC(q); }
  else if(q.__t==='drag'){ root.innerHTML=head+mtDrag(q); mtBindDrag(q); }

function mtMC(q){

}
function mtBindMC(q){

function mtChooseMC(q,choice){
  _mt.answered=true;

  var _zh=mtOptsZh(q);
  var e='<div class="mt-exp"><h4>'+(right?'正解 ✓':'不正解 ✗')+'</h4>';
  q.opts.forEach(function(o,i){
    if(o.ok) e+='<div class="row"><span class="o">○ '+mtOptLabel(o.t,_zh)+'：</span>'+mtRich(o.why)+'</div>';
    else if(i===choice) e+='<div class="row"><span class="x">× '+mtOptLabel(o.t,_zh)+'（あなたの解答）：</span>'+mtRich(o.why)+'</div>';

function mtDrag(q){

}
function mtBindDrag(q){

  });

function mtGradeDrag(q,made){
  _mt.answered=true;

  var right=(nm(made)===nm(q.answer)); if(right)_mt.correct++;

  e+='<div class="row"><span class="o">正しい語順：</span><z>'+mtEsc(q.answer)+'</z></div>';
  if(!right) e+='<div class="row"><span class="x">あなたの解答：</span><z>'+mtEsc(made)+'</z></div>';

function mtWriting(q){
  var h='<span class="mt-qtype">作文（AI採点）</span><div class="mt-q">次の日本語を中国語で書いてください：\n「'+mtEsc(q.prompt)+'」</div>';

}
function mtBindWriting(q){ $('mtGrade').onclick=function(){ mtGradeWriting(q); }; }
function mtGradeWriting(q){
  if(_mt.answered) return;
  var ta=$('mtTa'); var userZh=(ta.value||'').trim(); if(!userZh){ ta.focus(); return; }
  if(userZh.length>200){ ta.focus(); return; }
  var gb=$('mtGrade'); gb.setAttribute('disabled',''); gb.innerHTML='<span class="mt-spin"></span> 採点中…';
  // 出題文・模範解答は送らない。採点サーバー側が day/idx から自分のデータを引く。
  fetch(mtGraderUrl(),{ method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ day:_mt.day, idx:q.idx, user_zh:userZh }) })
  .then(function(r){ return r.json(); })

    if(data.error) throw new Error(data.error);
    _mt.answered=true; ta.setAttribute('disabled','');
    var vC=data.verdict==='correct'?'v-correct':data.verdict==='acceptable'?'v-acceptable':'v-incorrect';
    var vL=data.verdict==='correct'?'正解':data.verdict==='acceptable'?'惜しい（通じる）':'要改善';
    if(data.verdict==='correct')_mt.correct++;
    var e='<div class="mt-exp"><span class="mt-verdict '+vC+'">'+vL+'　'+(data.score!=null?data.score+'点':'')+'</span>';
    e+='<div class="row">'+mtEsc(data.comment||'')+'</div>';
    if(data.corrected) e+='<div class="row"><span class="o">自然な言い方：</span><z>'+mtEsc(data.corrected)+'</z></div>';
    e+='<div class="row" style="margin-top:6px;color:var(--muted)">参考解答：<z>'+mtEsc(q.answer)+'</z></div></div>';

      '<div class="row" style="margin-top:6px;color:var(--muted)">参考解答：<z>'+mtEsc(q.answer)+'</z></div></div>';
    mtNext();
  });

function vocabStripTone(s){

function srsCard(id){
  var sid=String(id||'');
  if(sid.indexOf('cw-')===0){
    var w=(state.customWords||[]).find(function(x){ return x && x.id===sid; });
    if(!w) return null;
    return {id:sid, type:'単語', day:0, custom:true, zh:w.zh, pin:w.pinyin, ja:w.ja, ex:w.example, exP:w.exPinyin, exJ:w.exJa};
  }
  var m=sid.match(/^d(\d+)-([vg])(\d+)$/);
  if(!m) return null;
  var l=LESSONS.find(function(x){return x.day===Number(m[1]);});
  if(!l) return null;
  if(m[2]==='v'){ var v=l.vocab[Number(m[3])]; if(!v) return null;
    return {id:id, type:'単語', day:l.day, zh:v.zh, pin:v.pinyin, ja:v.ja, ex:v.example, exP:v.exPinyin, exJ:v.exJa}; }
  var g=l.grammar[Number(m[3])]; if(!g) return null;
  return {id:id, type:'文法', day:l.day, zh:g.name, pin:g.pinyin, ja:g.meaning, ex:g.example, exP:g.exPinyin, exJ:g.exJa};
}
function cwNewId(){ return 'cw-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8); }
function cwEnsureIds(){ var ch=false; (state.customWords||[]).forEach(function(w){ if(w && !w.id){ w.id=cwNewId(); ch=true; } }); if(ch){ try{ localStorage.setItem(storageKey, JSON.stringify(state)); }catch(e){} } return ch; }
function srsEligibleIds(scope){
  scope=scope||state.revScope||'all';
  var set={};
  LESSONS.forEach(function(l){
    if(state.completed[l.day]){
      l.vocab.forEach(function(v){ set[v.id]=true; });
      l.grammar.forEach(function(g){ set[g.id]=true; });
    }
  });
  Object.keys(state.bookmarks||{}).forEach(function(id){ if(/^d\d+-[vg]\d+$/.test(id)) set[id]=true; });
  (state.customWords||[]).forEach(function(w){ if(w && w.id) set[w.id]=true; }); // マイ単語も復習対象（bm絞り込み時は下で除外）
  var ids=Object.keys(set);
  if(scope==='bm'){ ids=ids.filter(function(id){ return state.bookmarks && state.bookmarks[id]; }); }
  return ids;
}
function srsCounts(scope){
  var elig=srsEligibleIds(scope), now=nowMs(), due=0, fresh=0;
  elig.forEach(function(id){ var s=state.srs[id]; if(!s) fresh++; else if((s.due||0)<=now) due++; });
  return {elig:elig.length, due:due, fresh:fresh};
}
function srsBuildDue(newLimit, scope){
  var elig=srsEligibleIds(scope), now=nowMs(), due=[], fresh=[];
  elig.forEach(function(id){ var s=state.srs[id]; if(!s) fresh.push(id); else if((s.due||0)<=now) due.push(id); });
  due=_shuffle(due); fresh=_shuffle(fresh);
  if(newLimit>=0) fresh=fresh.slice(0, newLimit);
  return due.concat(fresh);
}
var LEECH_LAPSES=4; // 「もう一度」がこの回数以上で「つまずき語（リーチ）」
function srsIsLeech(id){ var s=state.srs[id]; return !!(s && (s.lapses||0)>=LEECH_LAPSES); }
function srsGrade(id, q){
  var s=state.srs[id]||{ef:2.5, interval:0, reps:0, due:0, last:0, lapses:0};
  if(q<3){ s.reps=0; s.interval=1; s.lapses=(s.lapses||0)+1; } // もう一度＝つまずき（lapse）を加算
  else{
    s.reps=(s.reps||0)+1;
    if(s.reps===1) s.interval=1;
    else if(s.reps===2) s.interval=6;
    else s.interval=Math.round((s.interval||1)*(s.ef||2.5));
    s.ef=(s.ef||2.5)+(0.1-(5-q)*(0.08+(5-q)*0.02));
    if(s.ef<1.3) s.ef=1.3;
  }
  var now=nowMs();
  s.last=now; s.due=now + (s.interval||1)*86400000;
  state.srs[id]=s; save();
  return s;
}

  // ほぼ変えない設定なので、毎日通る導線から外して設定タブへ移した。
  var scope=(state.revScope==='bm')?'bm':'all';
  var nl=(typeof state.srsNewLimit==='number')?state.srsNewLimit:8;
  var cnt=srsCounts(scope);
  var shownNew=(nl<0)?cnt.fresh:Math.min(nl,cnt.fresh);
  var todayTotal=cnt.due+shownNew;
  var html='<div class="card testwrap"><div class="section-title"><h2>今日の復習</h2><span class="badge">'+todayTotal+'問</span></div>';
  if(cnt.elig===0){
    html+='<div class="empty" style="margin-top:4px">'+(scope==='bm'?'ブックマークがまだありません。学習画面で単語・文法の ☆ を押すと、ここで復習できます。':'まだ復習対象がありません。学習画面で各Dayを完了すると、その単語・文法が復習に入ります。')+'</div>';
    html+='<button style="width:100%;margin-top:12px" onclick="showToday()">今日やることへ戻る</button>';
  } else if(todayTotal===0){
    html+='<div class="empty" style="margin-top:4px">今日ぶんの復習は終わっています。おつかれさまでした。</div>';
    html+='<button style="width:100%;margin-top:12px" onclick="showToday()">今日やることへ戻る</button>';
  } else {
    html+='<div class="small muted" style="margin-top:2px">期限 '+cnt.due+' 枚 ＋ 新しく覚える '+shownNew+' 枚。忘れる頃に自動で出題します（間隔反復）。</div>';
    html+='<button class="primary" style="width:100%;margin-top:12px" onclick="revStart()">復習を始める（'+todayTotal+'問）</button>';
    html+='<button style="width:100%;margin-top:8px" onclick="showToday()">あとにする</button>';
  }
  html+='<div class="small muted" style="margin-top:14px">出題範囲や1日の新規問数は<a href="#" onclick="showSettings();return false">設定</a>で変更できます。</div>';
  html+='</div>';
  c.innerHTML=html;
}

// 級診断は、いちばん必要な人（自分の級が分かっていない人）に届かないと意味がない。
// 設定の奥ではなく初回起動で出す。ただし必ずスキップできるようにする。
function hasOnboarded(){ try{ return !!localStorage.getItem(ONBOARDED_KEY); }catch(e){ return true; } }

// ===== 計測 =====
// track(name, props) を呼ぶだけ。送信先(HSK_SINK)が未設定なら端末内に貯める。
// 利用者が増えて送信先を決めたら、設定画面でURLを入れるだけで飛び始める。
var TRACK_KEY='hsk4-events', TRACK_MAX=500;
function trackSinkUrl(){ try{ return localStorage.getItem('hsk4-sink-url')||''; }catch(e){ return ''; } }
function trackRead(){ try{ return JSON.parse(localStorage.getItem(TRACK_KEY)||'[]'); }catch(e){ return []; } }
function track(name, props){
  // 名前とプロパティは別の入れ物に置く。同じ階層に混ぜると props のキーが
  // 名前を上書きしうる（実際 {n:...} が名前を潰していた）。
  var ev={ t:Date.now(), e:name };
  if(props) ev.p=props;
  try{
    var log=trackRead(); log.push(ev);
    if(log.length>TRACK_MAX) log=log.slice(-TRACK_MAX);
    localStorage.setItem(TRACK_KEY, JSON.stringify(log));
  }catch(e){}
  var url=trackSinkUrl();
  if(url){
    try{
      var body=JSON.stringify(ev);
      if(navigator.sendBeacon) navigator.sendBeacon(url, new Blob([body],{type:'application/json'}));
      else fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:body,keepalive:true}).catch(function(){});
    }catch(e){}
  }
}

// ===== 模擬試験 =====
// 本番のHSK4は 听力45／阅读40／书写15。このアプリには听力の音源が無いので、
// ここで作れるのは「読解＋語順」の模試だけ。180/300のような換算スコアは出さない。
// 出せない数字を出すと、本番で足をすくわれるのはユーザーの方なので。
var MOCK_MIN_DAYS = 10;      // これ未満だと出題の幅が足りない
var MOCK_LIMIT_SEC = 30*60;
var _mock = null, _mockTimer = null;

function mockDoneDays(){
  return LESSONS.filter(function(l){ return state.completed[l.day] && BANK[l.day]; }).map(function(l){ return l.day; });
}
function mockAvailable(){ return mockDoneDays().length >= MOCK_MIN_DAYS; }

function mockBuildQuestions(){
  var days=_shuffle(mockDoneDays().slice()), qs=[];
  days.forEach(function(d){
    var b=BANK[d]; if(!b) return;
    (b.mc||[]).forEach(function(m){
      qs.push({ kind:'mc', day:d, tag:m.tag||'語彙', q:m.q,
                opts:_shuffle((m.opts||[]).slice()) });
    });
    if(b.drag && b.drag.words) qs.push({ kind:'drag', day:d, tag:'語順', words:_shuffle(b.drag.words.slice()), answer:b.drag.answer, why:b.drag.why });
  });
  qs=_shuffle(qs);
  var mc=qs.filter(function(q){return q.kind==='mc';}).slice(0,32);
  var dg=qs.filter(function(q){return q.kind==='drag';}).slice(0,8);
  return _shuffle(mc.concat(dg));
}

function mockStart(){
  var qs=mockBuildQuestions();
  if(!qs.length){ return; }
  _mock={ qs:qs, i:0, answers:{}, built:[], startedAt:Date.now(), endsAt:Date.now()+MOCK_LIMIT_SEC*1000, done:false };
  track('mock_start',{count:qs.length});
  goView('mock');
  mockTick();
}
function mockTick(){
  if(_mockTimer) clearInterval(_mockTimer);
  _mockTimer=setInterval(function(){
    if(!_mock || _mock.done || currentView!=='mock'){ clearInterval(_mockTimer); _mockTimer=null; return; }
    if(Date.now()>=_mock.endsAt){ mockFinish(true); return; }
    var el=$('mockClock'); if(el) el.textContent=mockClockText();
  },1000);
}
function mockClockText(){
  var left=Math.max(0, Math.ceil((_mock.endsAt-Date.now())/1000));
  return Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
}
function mockPick(i){ if(!_mock||_mock.done) return; _mock.answers[_mock.i]=i; renderMockScreen(); }
function mockChip(i){
  if(!_mock||_mock.done) return;
  var b=_mock.built[_mock.i]||[]; if(b.indexOf(i)<0) b.push(i);
  _mock.built[_mock.i]=b; renderMockScreen();
}
function mockChipUndo(){ if(!_mock||_mock.done) return; var b=_mock.built[_mock.i]||[]; b.pop(); _mock.built[_mock.i]=b; renderMockScreen(); }
function mockNav(d){
  if(!_mock||_mock.done) return;
  _mock.i=Math.max(0, Math.min(_mock.qs.length-1, _mock.i+d));
  renderMockScreen(); window.scrollTo({top:0,behavior:'smooth'});
}
function mockIsRight(q, idx){
  if(q.kind==='mc'){ var o=q.opts[_mock.answers[idx]]; return !!(o && o.ok); }
  var b=(_mock.built[idx]||[]).map(function(k){ return q.words[k]; }).join('');
  return b===String(q.answer||'').replace(/[。，、？！]/g,'') || b+'。'===q.answer;
}
function mockFinish(auto){
  if(!_mock||_mock.done) return;
  if(_mockTimer){ clearInterval(_mockTimer); _mockTimer=null; }
  var byTag={}, correct=0;
  _mock.qs.forEach(function(q,idx){
    var r=mockIsRight(q,idx);
    if(r) correct++;
    if(!byTag[q.tag]) byTag[q.tag]={c:0,t:0};
    byTag[q.tag].t++; if(r) byTag[q.tag].c++;
  });
  _mock.done=true; _mock.correct=correct; _mock.byTag=byTag; _mock.auto=!!auto;
  _mock.elapsed=Math.round((Date.now()-_mock.startedAt)/1000);
  if(!Array.isArray(state.mockHistory)) state.mockHistory=[];
  state.mockHistory.push({ t:Date.now(), total:_mock.qs.length, correct:correct, elapsed:_mock.elapsed });
  if(state.mockHistory.length>20) state.mockHistory=state.mockHistory.slice(-20);
  save();
  track('mock_finish',{ total:_mock.qs.length, correct:correct, elapsed:_mock.elapsed, auto:!!auto });
  renderMockScreen(); window.scrollTo({top:0,behavior:'smooth'});
}
// 間違えた問題が出たDayの語をまとめて★に入れる。復習に流し込むのが模試の目的なので。
function mockStarWeak(){
  if(!_mock||!_mock.done) return;
  var days={}, n=0;
  _mock.qs.forEach(function(q,idx){ if(!mockIsRight(q,idx)) days[q.day]=true; });
  Object.keys(days).forEach(function(d){
    var l=LESSONS[Number(d)-1]; if(!l) return;
    l.vocab.forEach(function(v){
      if(state.bookmarks[v.id]) return;
      // toggleBookmark と同じ形で入れる（一覧はこの形を前提に描画している）
      state.bookmarks[v.id]={ id:v.id, type:'単語', title:v.zh, sub:v.ja, day:l.day,
        pinyin:v.pinyin||'', example:v.example||'', exPinyin:v.exPinyin||'', exJa:v.exJa||'', hl:0 };
      n++;
    });
  });
  save(); track('mock_star_weak',{count:n});
  _toast(n>0? n+'語をブックマークに追加しました。復習で出題されます。' : '追加できる語がありませんでした。');
  renderMockScreen();
}
function mockExit(){
  if(_mockTimer){ clearInterval(_mockTimer); _mockTimer=null; }
  _mock=null; showToday();
}

function mockShowReview(){ if(!_mock||!_mock.done) return; _mock.reviewing=true; renderMockScreen(); window.scrollTo({top:0,behavior:'smooth'}); }
function mockCloseReview(){ if(!_mock) return; _mock.reviewing=false; renderMockScreen(); window.scrollTo({top:0,behavior:'smooth'}); }
function mockReviewHtml(){
  var n=_mock.qs.length;
  var h='<div class="card"><div class="section-title"><h2>模試の振り返り</h2><span class="badge">'+_mock.correct+' / '+n+'</span></div>';
  h+='<div class="small muted" style="margin-bottom:10px">全'+n+'問の解答・正解・解説です。</div>';
  _mock.qs.forEach(function(q,i){
    var right=mockIsRight(q,i);
    var answered = q.kind==='mc' ? (_mock.answers[i]!=null) : ((_mock.built[i]||[]).length>0);
    var statusColor = !answered ? 'var(--muted)' : (right?'var(--good)':'var(--bad)');
    var statusText = !answered ? '未回答' : (right?'正解 ✓':'不正解 ✗');
    h+='<div class="mt-review-item"><div class="row" style="justify-content:space-between">'
     + '<span class="mt-qtype">'+esc(q.tag)+'</span><span style="font-weight:800;color:'+statusColor+'">'+statusText+'</span></div>';
    if(q.kind==='mc'){
      var _zh=mtOptsZh(q);
      var ci=-1; q.opts.forEach(function(o,j){ if(o.ok) ci=j; });
      h+='<div class="mt-q" style="font-size:15px">'+mtBlank(mtRich(q.q))+'</div>';
      h+='<div class="mt-exp"><div class="row"><span class="o">正解：</span>'+mtOptLabel(q.opts[ci].t,_zh)+'</div>';
      if(answered && !right) h+='<div class="row"><span class="x">あなたの解答：</span>'+mtOptLabel(q.opts[_mock.answers[i]].t,_zh)+'</div>';
      h+='<div class="row">'+mtRich(q.opts[ci].why)+'</div></div>';
    } else {
      var built=_mock.built[i]||[];
      var made=built.map(function(k){return q.words[k];}).join('');
      h+='<div class="mt-q" style="font-size:15px">正しい語順に並べてください。</div>';
      h+='<div class="mt-exp"><div class="row"><span class="o">正しい語順：</span><z>'+mtEsc(q.answer)+'</z></div>';
      if(answered && !right) h+='<div class="row"><span class="x">あなたの解答：</span><z>'+mtEsc(made)+'</z></div>';
      if(q.why) h+='<div class="row">'+mtRich(q.why)+'</div>';
      h+='</div>';
    }
    h+='</div>';

// ===== 計測の確認・書き出し =====
// 利用者が少ないうちは「Day7到達率」のような割合に意味が無い（分母が小さすぎる）。
// なので率は出さず、実数と生ログだけを見せる。判断材料になるのは人数が増えてから。
function trackSummary(){
  var log=trackRead(), sum={ events:log.length, days:{}, opens:0, completes:0, srs:0, mocks:0, first:null, last:null };
  log.forEach(function(ev){
    if(!sum.first || ev.t<sum.first) sum.first=ev.t;
    if(!sum.last || ev.t>sum.last) sum.last=ev.t;
    var p=ev.p||{};
    if(ev.e==='day_open'){ sum.opens++; if(p.day) sum.days[p.day]=true; }
    else if(ev.e==='day_complete') sum.completes++;
    else if(ev.e==='srs_start') sum.srs++;
    else if(ev.e==='mock_finish') sum.mocks++;
  });
  sum.uniqueDays=Object.keys(sum.days).length;
  return sum;
}
function trackCopy(){
  var txt=JSON.stringify(trackRead());
  var done=function(){ _toast('計測ログをコピーしました（'+trackRead().length+'件）'); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, function(){ trackFallbackCopy(txt, done); }); }
  else trackFallbackCopy(txt, done);
}
function trackFallbackCopy(txt, done){
  try{
    var ta=document.createElement('textarea'); ta.value=txt;
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done();
  }catch(e){ _toast('コピーできませんでした'); }
}
function trackClear(){
  try{ localStorage.removeItem(TRACK_KEY); }catch(e){}
  _toast('計測ログを消しました'); renderSettings();
}

function _shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

// 問題タイプ1: 単語の意味を選ぶ（4択）
function _genVocabMeaningQ(l){
  var v=l.vocab;
  var correct=v[Math.floor(Math.random()*v.length)];
  var others=_shuffle(v.filter(function(x){return x.id!==correct.id;})).slice(0,3);
  var opts=_shuffle([correct.ja].concat(others.map(function(x){return x.ja;})));
  return {
    q:'次の中国語の意味として正しいものは？\n「'+correct.zh+'」（'+correct.pinyin+'）',
    opts:opts,
    ans:correct.ja,
    exp:correct.zh+'='+correct.ja+'。例：'+correct.example+' '+correct.exJa
  };
}

// 問題タイプ2: 日本語→中国語（例文とは異なる文脈で意味から選ぶ）
function _genZhFromJaQ(l){
  var v=l.vocab;
  var correct=v[Math.floor(Math.random()*v.length)];
  var others=_shuffle(v.filter(function(x){return x.id!==correct.id;})).slice(0,3);
  var opts=_shuffle([correct.zh].concat(others.map(function(x){return x.zh;})));
  return {
    q:'「'+correct.ja+'」を中国語で表現するとどれ？\nピンイン：'+correct.pinyin,
    opts:opts,
    ans:correct.zh,
    exp:correct.zh+'（'+correct.pinyin+'）='+correct.ja+'。例：'+correct.exJa
  };
}

// 問題タイプ3: 文法の意味と使い方を選ぶ
function _genGrammarMeaningQ(l){
  var g=l.grammar;
  if(!g.length) return _genVocabMeaningQ(l);   // 文法を置いていない日がある
  var correct=g[Math.floor(Math.random()*g.length)];
  var others=_shuffle(g.filter(function(x){return x.id!==correct.id;})).slice(0,2);
  var correctAns=correct.name+'：'+correct.meaning;
  var wrongOpts=others.map(function(x){return x.name+'：'+x.meaning;});
  // ダミー選択肢（正解の意味を少し変えたもの）
  var dummy=correct.name+'：'+( correct.meaning.length>4 ? correct.meaning.slice(0,-2)+'する' : correct.meaning+'こと' );
  var opts=_shuffle([correctAns].concat(wrongOpts).concat([dummy])).slice(0,4);
  if(opts.indexOf(correctAns)<0){ opts[0]=correctAns; }
  return {
    q:'文法ポイントの正しい説明はどれ？（'+correct.pinyin+'）',
    opts:opts,
    ans:correctAns,
    exp:correct.name+'の正しい使い方：'+correct.meaning+'。例：'+correct.example+' '+correct.exJa
  };
}

// 問題タイプ4: よくある誤りを選ぶ
function _genMistakeQ(l){
  var g=l.grammar.filter(function(x){return x.mistake&&x.mistake.length>4;});
  if(!g.length) return _genVocabMeaningQ(l);
  var correct=g[Math.floor(Math.random()*g.length)];
  var qText=correct.name+'を使う時に気をつけるべき点はどれ？';
  var correctAns=correct.mistake;
  var others=l.grammar.filter(function(x){return x.id!==correct.id&&x.mistake&&x.mistake.length>4;}).slice(0,2).map(function(x){return x.mistake;});
  var dummy=correct.meaning+'なら必ず'+correct.pinyin+'を使う';
  var opts=_shuffle([correctAns].concat(others).concat([dummy])).slice(0,4);
  if(opts.indexOf(correctAns)<0){ opts[0]=correctAns; }
  return {
    q:qText,
    opts:opts,
    ans:correctAns,
    exp:'注意点：'+correctAns+' 正しい例：'+correct.example+' '+correct.exJa
  };
}

// 問題タイプ5: 対比問題（contrastフィールド活用）
function _genContrastQ(l){
  var g=l.grammar.filter(function(x){return x.contrast&&x.contrast.length>5;});
  if(!g.length) return _genZhFromJaQ(l);
  var correct=g[Math.floor(Math.random()*g.length)];
  var qText=correct.name+'と他の表現の違いとして正しいものは？';
  var correctAns=correct.contrast;
  var others=l.grammar.filter(function(x){return x.id!==correct.id&&x.contrast&&x.contrast.length>5;}).slice(0,2).map(function(x){return x.contrast;});
  var dummy=correct.meaning+'で、'+( l.grammar[0]&&l.grammar[0].id!==correct.id ? l.grammar[0].meaning : '強調する' )+'とも使える';
  var opts=_shuffle([correctAns].concat(others).concat([dummy])).slice(0,4);
  if(opts.indexOf(correctAns)<0){ opts[0]=correctAns; }
  return {
    q:qText,
    opts:opts,
    ans:correctAns,
    exp:'対比ポイント：'+correctAns+' 例：'+correct.example+' （'+correct.exJa+'）'
  };
}

function startAiChallenge(){
  _aiQ=null; _aiAns=null;
  var area=$('aiChallengeArea');
  if(!area) return;
  var l2=lesson();
  var gens=[_genVocabMeaningQ, _genZhFromJaQ, _genGrammarMeaningQ, _genMistakeQ, _genContrastQ];
  try{
    var gen=gens[Math.floor(Math.random()*gens.length)];
    _aiQ=gen(l2);
    if(!_aiQ||!_aiQ.opts||_aiQ.opts.length<2) throw new Error('invalid q');
    _aiAns=null;
    _renderAiQ();
  }catch(e){
    try{ _aiQ=_genVocabMeaningQ(l2); _aiAns=null; _renderAiQ(); }
    catch(e2){ area.innerHTML='<div class="ai-challenge-box"><div class="small muted">問題を生成できませんでした。<button class="primary" onclick="startAiChallenge()" style="margin-top:8px">再試行</button></div></div>'; }
  }
}

  window.speechSynthesis.cancel();

  u.lang = 'zh-CN';
  u.rate = 0.9;

};

// マスター(75%以上)できた最高級の「ひとつ上」を学習目標に。何も届かなければHSK3。
function lcRecommend(correct,total){
  var mastered=0, bands=[3,4,5,6];
  for(var i=0;i<bands.length;i++){ var lv=bands[i]; if(correct[lv]/total[lv]>=0.75) mastered=lv; else break; }
  if(mastered===0) return 3;
  return Math.min(6, mastered+1);
}

function lcQuizHtml(){
  var total=PLACEMENT_QUESTIONS.length, item=PLACEMENT_QUESTIONS[lcIndex];

function lcResultHtml(){

function lcPick(lv){
  try{ localStorage.setItem(SELECTED_LEVEL_KEY,'hsk'+lv); }catch(e){}
  track('level_pick',{lv:lv});
  if(lv>=5){
    // 上の級：この教材は本当に易しすぎる。正直に伝えて、需要だけ受け取る。
    lcSoonLevel=lv; lcStage='above'; render(); window.scrollTo({top:0,behavior:'smooth'});
  } else if(lv<=3){
    // 下の級：同じ道の少し手前にいるだけ。HSK4教材のまま受け止められる。
    lcSoonLevel=lv; lcStage='below'; render(); window.scrollTo({top:0,behavior:'smooth'});
  } else {
    markOnboarded('level4'); showHome();
  }
}

function lcInterest(lv){
  var k='hsk4-interest-hsk'+lv, n=0;
  try{ n=Number(localStorage.getItem(k)||0)+1; localStorage.setItem(k,String(n)); }catch(e){}
  track('waitlist_interest',{lv:lv});
  lcStage='thanks'; render(); window.scrollTo({top:0,behavior:'smooth'});
}

// 診断専用のクリックリスナー（既存ハンドラと完全に独立）
document.addEventListener('click', function(e){
  var b=e.target.closest && e.target.closest('[data-lc-action]');
  if(!b) return;
  var a=b.dataset.lcAction;
  if(a==='start'){ lcStage='quiz'; lcIndex=0; lcAnswers={}; render(); }
  else if(a==='answer'){ lcAnswers[lcIndex]=PLACEMENT_QUESTIONS[lcIndex].options[Number(b.dataset.opt)]; render(); }
  else if(a==='unknown'){ lcAnswers[lcIndex]='__unknown__'; render(); }
  else if(a==='prev'){ if(lcIndex>0){ lcIndex--; render(); } }
  else if(a==='next'){
    if(lcAnswers[lcIndex]==null) return;
    if(lcIndex<PLACEMENT_QUESTIONS.length-1){ lcIndex++; render(); }
    else { lcStage='result'; markOnboarded('done');
           try{ track('level_check_done',{rec:lcLastRec}); }catch(e){}
           render(); window.scrollTo({top:0,behavior:'smooth'}); }
  }
  else if(a==='retry'){ lcStage='start'; lcIndex=0; lcAnswers={}; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else if(a==='pick'){ lcPick(Number(b.dataset.lv)); }
  else if(a==='backToResult'){ lcStage='result'; render(); }
  else if(a==='interest'){ lcInterest(Number(b.dataset.lv)); }
  else if(a==='startProgram'){ markOnboarded('done'); showHome(); }
  else if(a==='skip'){ markOnboarded('skipped'); track('onboard_skip'); showHome(); }
  else if(a==='back'){ markOnboarded('done'); showHome(); }
});

/* =========================================================================
   新規単語（例文から選択して登録） — 既存データ/同期に非干渉な追加モジュール
   - 操作は data-cw-action 専用リスナー＋選択検知で処理
   - state.customWords に保存（normalizeStateForCloud に追加済みで同期対象）
   - 例文(中文/ピンイン/和訳)は選択元からコピー。ピンイン/意味は best-effort 自動＋編集可
   ========================================================================= */
if(!Array.isArray(state.customWords)) state.customWords=[];
cwEnsureIds(); // 既存のマイ単語に安定IDを付与（SRSスケジュールの取り違え防止）

function cwEsc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ---- 一覧（ブックマーク画面の「新規単語」サブタブ） ---- */

      +(w.exJa?'<div class="ja exja">'+cwEsc(w.exJa)+'</div>':'')
      +'</div>';
  }).join('');

/* ---- 保存語を例文中で自動ハイライト ---- */
var cwApplying=false;
function cwApplyHighlights(){
  if(cwApplying) return; cwApplying=true;
  try{
    var words=(state.customWords||[]).map(function(w){return w.zh;}).filter(Boolean);
    var n=String(words.length);
    document.querySelectorAll('.cw-ex').forEach(function(el){
      if(el.getAttribute('data-cw-n')===n) return;
      var raw=el.getAttribute('data-ex')||el.textContent||'';
      var html=cwEsc(raw);
      words.forEach(function(w){ if(w && raw.indexOf(w)>=0){ html=html.split(cwEsc(w)).join('<mark class="cw-hl">'+cwEsc(w)+'</mark>'); } });
      el.innerHTML=html;
      el.setAttribute('data-cw-n',n);
    });
  } finally { cwApplying=false; }
}
(function(){
  var c=document.getElementById('content');
  if(c && window.MutationObserver){ new MutationObserver(function(){ cwApplyHighlights(); }).observe(c,{childList:true,subtree:true}); }
  setTimeout(cwApplyHighlights,400);
})();

/* ---- 例文内の選択 → フローティング「＋単語を追加」 ---- */
var cwFab=null, cwSel=null;
function cwGetExEl(node){ while(node && node!==document){ if(node.classList && node.classList.contains('cw-ex')) return node; node=node.parentNode; } return null; }
function cwOnSelectEnd(){
  var sel=window.getSelection && window.getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount){ cwHideFab(); return; }
  var text=String(sel.toString()).trim();
  if(!text || text.length>20){ cwHideFab(); return; }
  var exEl=cwGetExEl(sel.anchorNode)||cwGetExEl(sel.focusNode);
  if(!exEl){ cwHideFab(); return; }
  cwSel={ text:text, ex:exEl.getAttribute('data-ex')||exEl.textContent||'', exp:exEl.getAttribute('data-exp')||'', exj:exEl.getAttribute('data-exj')||'' };
  cwShowFab(text);
}
function cwShowFab(text){
  if(!cwFab){
    cwFab=document.createElement('button'); cwFab.id='cw-fab';
    cwFab.addEventListener('mousedown',function(e){e.preventDefault();});
    cwFab.addEventListener('click',function(e){e.preventDefault();e.stopPropagation(); if(cwSel) cwOpenModal(cwSel);});
    document.body.appendChild(cwFab);
  }
  var disp=text.length>8?text.slice(0,8)+'…':text;
  cwFab.textContent='＋「'+disp+'」をマイ単語に追加';
  cwFab.style.display='block';
}
function cwHideFab(){ if(cwFab) cwFab.style.display='none'; }
document.addEventListener('selectionchange', function(){ setTimeout(cwOnSelectEnd,0); });
document.addEventListener('touchend', function(){ setTimeout(cwOnSelectEnd,10); });
document.addEventListener('mouseup', function(){ setTimeout(cwOnSelectEnd,10); });

/* ---- 追加フォーム（モーダル） ---- */
function cwOpenModal(selObj){
  cwHideFab();
  selObj=selObj||{text:'',ex:'',exp:'',exj:''};
  var ov=document.getElementById('cw-modal');
  if(!ov){ ov=document.createElement('div'); ov.id='cw-modal'; document.body.appendChild(ov); }
  ov.innerHTML='<div class="cw-modal-card">'
    +'<div class="cw-modal-h">マイ単語に追加</div>'
    +'<label class="cw-l">単語（中国語）</label><div class="cw-row"><input id="cw-zh" class="cw-in" value="'+cwEsc(selObj.text)+'" placeholder="例：填写"><button class="speak-btn" data-cw-action="speak-input" title="発音"><svg class="spk-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg></button><button class="lc-btn" data-cw-action="autofill" style="flex:0 0 auto;padding:9px 12px">自動取得</button></div>'
    +'<div class="small" style="margin:4px 0 0;color:#8C8074">中国語を入れて「自動取得」を押すと、ピンインと意味が入ります。</div>'
    +'<label class="cw-l">ピンイン</label><input id="cw-pin" class="cw-in" placeholder="自動取得 or 手入力">'
    +'<label class="cw-l">意味</label><input id="cw-ja" class="cw-in" placeholder="自動取得 or 手入力">'
    +'<label class="cw-l">例文（任意・手入力）</label><textarea id="cw-ex" class="cw-in" rows="2">'+cwEsc(selObj.ex)+'</textarea>'
    +'<input id="cw-exp" type="hidden" value="'+cwEsc(selObj.exp)+'"><input id="cw-exj" type="hidden" value="'+cwEsc(selObj.exj)+'">'
    +(selObj.exj?'<div class="small" style="margin-top:6px">例文訳：'+cwEsc(selObj.exj)+'</div>':'')
    +'<div class="cw-modal-actions"><button class="lc-btn" data-cw-action="modal-cancel">キャンセル</button><button class="lc-btn primary" data-cw-action="modal-save">保存</button></div>'
    +'<div class="small" id="cw-msg" style="margin-top:8px;min-height:1em">発音ボタンはいつでも使えます。ピンイン・意味は自動取得（編集可）。</div>'
    +'</div>';
  ov.style.display='flex';
  ov.onclick=function(e){ if(e.target===ov) cwCloseModal(); };
  var zhEl=document.getElementById('cw-zh');
  if(zhEl){ zhEl.addEventListener('blur', function(){ cwRunAutofill(zhEl.value,false); }); }
  if((selObj.text||'').trim()){ cwRunAutofill(selObj.text,false); }
  else if(zhEl){ try{ zhEl.focus(); }catch(e){} }
}
function cwRunAutofill(zh, force){
  zh=(zh||'').trim(); if(!zh) return;
  if(force){ var p=document.getElementById('cw-pin'); if(p)p.value=''; var j=document.getElementById('cw-ja'); if(j)j.value=''; }
  var hit=cwLookupApp(zh);
  if(hit){
    var pe=document.getElementById('cw-pin'); if(pe && !pe.value && hit.pinyin) pe.value=hit.pinyin;
    var je=document.getElementById('cw-ja'); if(je && !je.value && hit.ja) je.value=hit.ja;
    var mg=document.getElementById('cw-msg'); if(mg) mg.textContent='アプリ内の単語データから取得しました（編集可）。';
  }
  cwFillPinyin(zh);
  cwFillMeaning(zh);
}
function cwLookupApp(zh){
  if(!zh) return null;
  for(var d=0; d<LESSONS.length; d++){
    var v=LESSONS[d].vocab||[];
    for(var i=0;i<v.length;i++){ if(v[i].zh===zh) return {ja:v[i].ja||'', pinyin:v[i].pinyin||''}; }
  }
  return null;
}
function cwCloseModal(){ var ov=document.getElementById('cw-modal'); if(ov) ov.style.display='none'; }

async function cwFillPinyin(zh){
  var el=document.getElementById('cw-pin'); if(!el || el.value) return;
  try{
    var m=await import('https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/+esm');
    if(el && !el.value && m && m.pinyin){ el.value=m.pinyin(zh); }
    else if(el && !el.value){ el.placeholder='手入力してください'; }
  }catch(e){ if(el && !el.value){ el.placeholder='手入力してください'; } }
}
function cwExtract(d){
  function dig(x){
    if(typeof x==='string'){ var t=x.trim(); if(t && !/^[a-z]{2}(-[a-zA-Z]{2,4})?$/.test(t)) return t; return ''; }
    if(Array.isArray(x)){ for(var k=0;k<x.length;k++){ var s=dig(x[k]); if(s) return s; } }
    return '';
  }
  return dig(d);
}
async function cwTranslateZhJa(zh){
  // ① Google 辞書系（dict-chrome-ex）— 中→日の品質が高い
  try{
    var r=await fetch('https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=zh-CN&tl=ja&q='+encodeURIComponent(zh));
    if(r.ok){ var d=await r.json(); var t=cwExtract(d); if(t && t!==zh) return {t:t, src:'Google辞書'}; }
  }catch(e){}
  // ② Google 翻訳（gtx）
  try{
    var r2=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=ja&dt=t&q='+encodeURIComponent(zh));
    if(r2.ok){ var d2=await r2.json(); var t2=cwExtract(d2); if(t2 && t2!==zh) return {t:t2, src:'Google翻訳'}; }
  }catch(e){}
  // ③ MyMemory（最終手段）
  try{
    var r3=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(zh)+'&langpair=zh-CN|ja');
    if(r3.ok){ var d3=await r3.json(); if(d3 && d3.responseStatus===200){ var t3=d3.responseData && d3.responseData.translatedText; if(t3 && t3!==zh && !/MYMEMORY|QUOTA|LIMIT|INVALID/i.test(t3)) return {t:t3, src:'MyMemory'}; } }
  }catch(e){}
  return null;
}
async function cwFillMeaning(zh){
  var el=document.getElementById('cw-ja'); if(!el || el.value) return;
  var msg=document.getElementById('cw-msg');
  if(msg) msg.textContent='意味を取得中…';
  var res=await cwTranslateZhJa(zh);
  if(el && !el.value){
    if(res && res.t){ el.value=res.t; if(msg) msg.textContent=res.src+'の訳を入れました（要確認・編集可）。'; }
    else { el.placeholder='自動取得できませんでした。手入力してください'; if(msg) msg.textContent='意味は自動取得できませんでした。手入力してください。'; }
  }
}

function cwModalSave(){
  var zhEl=document.getElementById('cw-zh');
  var zh=(zhEl?zhEl.value:'').trim();
  var msg=document.getElementById('cw-msg');
  if(!zh){ if(msg) msg.textContent='単語を入力してください。'; return; }
  var g=function(id){ var e=document.getElementById(id); return e?e.value:''; };
  var w={ id:cwNewId(), zh:zh, pinyin:g('cw-pin'), ja:g('cw-ja'), example:g('cw-ex'), exPinyin:g('cw-exp'), exJa:g('cw-exj'), ts:Date.now() };
  if(!Array.isArray(state.customWords)) state.customWords=[];
  state.customWords.unshift(w);
  save();
  cwCloseModal();
  document.querySelectorAll('.cw-ex').forEach(function(el){ el.removeAttribute('data-cw-n'); });
  cwApplyHighlights();
  if(currentView==='bookmark' && cwSubTab==='custom'){ renderBookmarkPanel(); }
}

/* ---- 専用クリックリスナー（既存ハンドラと独立） ---- */
document.addEventListener('click', function(e){
  var b=e.target.closest && e.target.closest('[data-cw-action]');
  if(!b) return;
  var a=b.dataset.cwAction, i=Number(b.dataset.i);
  if(a==='tab-bm'){ cwSubTab='bm'; renderBookmarkPanel(); }
  else if(a==='tab-custom'){ cwSubTab='custom'; renderBookmarkPanel(); }
  else if(a==='del'){ if(state.customWords[i]){ state.customWords.splice(i,1); save(); renderBookmarkPanel(); document.querySelectorAll('.cw-ex').forEach(function(el){ el.removeAttribute('data-cw-n'); }); cwApplyHighlights(); } }
  else if(a==='speak'){ var w=state.customWords[i]; if(w&&window.speakZh) window.speakZh(w.zh); }
  else if(a==='speak-ex'){ var w2=state.customWords[i]; if(w2&&window.speakZh) window.speakZh(w2.example); }
  else if(a==='speak-input'){ var z=(document.getElementById('cw-zh')||{}).value; if(z&&window.speakZh) window.speakZh(z); }
  else if(a==='new'){ cwOpenModal({text:'',ex:'',exp:'',exj:''}); }
  else if(a==='autofill'){ var zz=(document.getElementById('cw-zh')||{}).value||''; cwRunAutofill(zz,true); }
  else if(a==='modal-cancel'){ cwCloseModal(); }
  else if(a==='modal-save'){ cwModalSave(); }
});

// 初回起動時だけ級診断から始める。進捗がある人はそのまま。
// PLACEMENT_QUESTIONS など級診断側の定義がすべて済んだ後でないと描画できないため、
// モジュールの最後で判定する（render() は同じタスク内なので画面のちらつきは起きない）。
(function firstRun(){
  var started=Object.keys(state.completed||{}).some(function(k){ return state.completed[k]; });
  if(!hasOnboarded() && !started){ track('first_visit'); showLevelCheck(); }
  else track('app_open');
})();

</script>
