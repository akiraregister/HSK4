:"作文や自己評価に便利です。","example":"在表达方面，我还需要多练习。","exPinyin":"Zài biǎodá fāngmiàn, wǒ hái xūyào duō liànxí.","exJa":"表現面ではまだもっと練習が必要です。","test":"聞き取り面で進歩しました。","answer":"在听力方面，我进步了。"}]},{"day":32,"title":"Day 32｜HSK4 基礎強化","vocab":[{"id":"d32-v0","zh":"一般","pinyin":"yìbān","ja":"普通、一般的","example":"这家店味道一般。","exPinyin":"Zhè jiā diàn wèidào yìbān.","exJa":"この店の味は普通です。"},{"id":"d32-v1","zh":"特别","pinyin":"tèbié","ja":"特別に、とても","example":"我特别喜欢上海的生活。","exPinyin":"Wǒ tèbié xǐhuan Shànghǎi de shēnghuó.","exJa":"私は上海での生活が特に好きです。"},{"id":"d32-v2","zh":"实际","pinyin":"shíjì","ja":"実際","example":"实际情况比我们想象的复杂。","exPinyin":"Shíjì qíngkuàng bǐ wǒmen xiǎngxiàng de fùzá.","exJa":"実際の状況は私たちが想像したより複雑です。"},{"id":"d32-v3","zh":"正确","pinyin":"zhèngquè","ja":"正しい","example":"这个答案是正确的。","exPinyin":"Zhège dá'àn shì zhèngquè de.","exJa":"この答えは正しいです。"},{"id":"d32-v4","zh":"错误","pinyin":"cuòwù","ja":"間違い","example":"这个句子有一个语法错误。","exPinyin":"Zhège jùzi yǒu yí ge yǔfǎ cuòwù.","exJa":"この文には文法ミスが1つあります。"}],"grammar":[{"id":"d32-g0","name":"系统地","pinyin":"xìtǒng de","meaning":"体系的に〜する","explain":"地は副詞化マーカーで、動作の方法を表します。","contrast":"系统地学习、自然地表达。","mistake":"的ではなく地を使います。","example":"我想系统地复习语法。","exPinyin":"Wǒ xiǎng xìtǒng de fùxí yǔfǎ.","exJa":"文法を体系的に復習したいです。","test":"もっと自然に表現したいです。","answer":"我想更自然地表达。"},{"id":"d32-g1","name":"地と得","pinyin":"de/de","meaning":"動詞の前/後","explain":"地は動詞の前で方法、得は動詞の後で程度を説明します。","contrast":"自然地说 / 说得自然。","mistake":"位置が違います。","example":"他自然地表达了自己的想法。","exPinyin":"Tā zìrán de biǎodá le zìjǐ de xiǎngfǎ.","exJa":"彼は自然に自分の考えを表現しました。","test":"彼は中国語を自然に話します。","answer":"他中文说得很自然。"},{"id":"d32-g2","name":"的地得","pinyin":"de trio","meaning":"三つのdeの違い","explain":"的は名詞修飾、地は動詞修飾、得は動詞後の程度・結果です。","contrast":"我的中文、自然地说、说得自然。","mistake":"日本人学習者が混乱しやすいポイントです。","example":"我的中文说得还不太自然。","exPinyin":"Wǒ de Zhōngwén shuō de hái bú tài zìrán.","exJa":"私の中国語はまだあまり自然ではありません。","test":"彼はゆっくり説明しました。","answer":"他慢慢地解释了。"}]},{"day":33,"title":"Day 33｜HSK4 基礎強化","vocab":[{"id":"d33-v0","zh":"满意","pinyin":"mǎnyì","ja":"満足する","example":"客户对服务很满意。","exPinyin":"Kèhù duì fúwù hěn mǎnyì.","exJa":"顧客はサービスに満足しています。"},{"id":"d33-v1","zh":"担心","pinyin":"dānxīn","ja":"心配する","example":"我有点儿担心明天的考试。","exPinyin":"Wǒ yǒudiǎnr dānxīn míngtiān de kǎoshì.","exJa":"明日の試験が少し心配です。"},{"id":"d33-v2","zh":"放心","pinyin":"fàngxīn","ja":"安心する","example":"你放心，我已经处理好了。","exPinyin":"Nǐ fàngxīn, wǒ yǐjīng chǔlǐ hǎo le.","exJa":"安心してください、もう対応しました。"},{"id":"d33-v3","zh":"生气","pinyin":"shēngqì","ja":"怒る","example":"他迟到了，所以经理有点儿生气。","exPinyin":"Tā chídào le, suǒyǐ jīnglǐ yǒudiǎnr shēngqì.","exJa":"彼が遅刻したので、マネージャーは少し怒っています。"},{"id":"d33-v4","zh":"紧张","pinyin":"jǐnzhāng","ja":"緊張する","example":"考试前我有点儿紧张。","exPinyin":"Kǎoshì qián wǒ yǒudiǎnr jǐnzhāng.","exJa":"試験前は少し緊張します。"}],"grammar":[{"id":"d33-g0","name":"的时候","pinyin":"de shíhou","meaning":"〜する時","explain":"動詞句＋的时候で〜する時を表します。","contrast":"说中文的时候。","mistake":"时候の前に的を入れるのが基本です。","example":"说中文的时候，我有点儿紧张。","exPinyin":"Shuō Zhōngwén de shíhou, wǒ yǒudiǎnr jǐnzhāng.","exJa":"中国語を話す時、少し緊張します。","test":"会議の時、よくメモします。","answer":"开会的时候，我经常记笔记。"},{"id":"d33-g1","name":"〜以前／〜以后","pinyin":"yǐqián/yǐhòu","meaning":"〜の前/後","explain":"動詞句や時間語の後ろに置いて、前後関係を表します。","contrast":"吃饭以后、上班以前。","mistake":"日本語と語順が逆に感じやすいです。","example":"下班以后我想学习中文。","exPinyin":"Xiàbān yǐhòu wǒ xiǎng xuéxí Zhōngwén.","exJa":"退勤後、中国語を勉強したいです。","test":"会議の前に資料を見ます。","answer":"开会以前我看资料。"},{"id":"d33-g2","name":"〜之前／〜之后","pinyin":"zhīqián/zhīhòu","meaning":"〜の前/後","explain":"以前/以后より少し書き言葉・明確な前後関係です。","contrast":"发邮件之前、会议之后。","mistake":"会話では以前/以后も自然です。","example":"发邮件之前，请检查一下。","exPinyin":"Fā yóujiàn zhīqián, qǐng jiǎnchá yíxià.","exJa":"メールを送る前に確認してください。","test":"授業の後で復習します。","answer":"上课之后我复习。"}]},{"day":34,"title":"Day 34｜HSK4 基礎強化","vocab":[{"id":"d34-v0","zh":"舒服","pinyin":"shūfu","ja":"快適だ","example":"这个房间很舒服。","exPinyin":"Zhège fángjiān hěn shūfu.","exJa":"この部屋は快適です。"},{"id":"d34-v1","zh":"健康","pinyin":"jiànkāng","ja":"健康","example":"为了健康，我每天走路上班。","exPinyin":"Wèile jiànkāng, wǒ měitiān zǒulù shàngbān.","exJa":"健康のために、私は毎日歩いて通勤しています。"},{"id":"d34-v2","zh":"发烧","pinyin":"fāshāo","ja":"熱が出る","example":"孩子发烧了，所以我今天在家。","exPinyin":"Háizi fāshāo le, suǒyǐ wǒ jīntiān zài jiā.","exJa":"子どもが熱を出したので、今日は家にいます。"},{"id":"d34-v3","zh":"休息","pinyin":"xiūxi","ja":"休む","example":"你最近太忙了，要多休息。","exPinyin":"Nǐ zuìjìn tài máng le, yào duō xiūxi.","exJa":"最近忙しすぎるので、もっと休んでください。"},{"id":"d34-v4","zh":"运动","pinyin":"yùndòng","ja":"運動する","example":"下班以后我想去运动。","exPinyin":"Xiàbān yǐhòu wǒ xiǎng qù yùndòng.","exJa":"退勤後、運動しに行きたいです。"}],"grammar":[{"id":"d34-g0","name":"从来没〜过","pinyin":"cónglái méi guo","meaning":"これまで一度も〜したことがない","explain":"経験の完全否定です。","contrast":"从来没去过。","mistake":"没…过より強いです。","example":"我从来没参加过HSK考试。","exPinyin":"Wǒ cónglái méi cānjiāguo HSK kǎoshì.","exJa":"HSK試験を一度も受けたことがありません。","test":"この料理を一度も食べたことがありません。","answer":"我从来没吃过这个菜。"},{"id":"d34-g1","name":"曾经〜过","pinyin":"céngjīng guo","meaning":"かつて〜したことがある","explain":"過去の経験を少し正式に述べます。","contrast":"我曾经在北京工作过。","mistake":"会話では以前/过だけでも自然です。","example":"我曾经学过一点儿中文。","exPinyin":"Wǒ céngjīng xuéguo yìdiǎnr Zhōngwén.","exJa":"かつて少し中国語を学んだことがあります。","test":"以前蘇州に行ったことがあります。","answer":"我曾经去过苏州。"},{"id":"d34-g2","name":"没想到","pinyin":"méi xiǎngdào","meaning":"思いがけず〜","explain":"予想外の結果を表します。","contrast":"没想到这么难。","mistake":"想不到も近いです。","example":"没想到这个语法这么重要。","exPinyin":"Méi xiǎngdào zhège yǔfǎ zhème zhòngyào.","exJa":"この文法がこんなに重要だとは思いませんでした。","test":"こんなに便利だとは思いませんでした。","answer":"没想到这么方便。"}]},{"day":35,"title":"Day 35｜HSK4 基礎強化","vocab":[{"id":"d35-v0","zh":"天气","pinyin":"tiānqì","ja":"天気","example":"今天的天气很好。","exPinyin":"Jīntiān de tiānqì hěn hǎo.","exJa":"今日の天気は良いです。"},{"id":"d35-v1","zh":"下雨","pinyin":"xiàyǔ","ja":"雨が降る","example":"如果明天下雨，我们就不去公园。","exPinyin":"Rúguǒ míngtiān xià yǔ, wǒmen jiù bú qù gōngyuán.","exJa":"明日雨が降れば、公園には行きません。"},{"id":"d35-v2","zh":"变冷","pinyin":"biàn lěng","ja":"寒くなる","example":"这几天上海突然变冷了。","exPinyin":"Zhè jǐ tiān Shànghǎi tūrán biàn lěng le.","exJa":"ここ数日、上海は急に寒くなりました。"},{"id":"d35-v3","zh":"变热","pinyin":"biàn rè","ja":"暑くなる","example":"中午以后天气变热了。","exPinyin":"Zhōngwǔ yǐhòu tiānqì biàn rè le.","exJa":"昼以降、天気が暑くなりました。"},{"id":"d35-v4","zh":"季节","pinyin":"jìjié","ja":"季節","example":"我最喜欢上海的秋天这个季节。","exPinyin":"Wǒ zuì xǐhuan Shànghǎi de qiūtiān zhège jìjié.","exJa":"私は上海の秋という季節が一番好きです。"}],"grammar":[{"id":"d35-g0","name":"看来","pinyin":"kànlái","meaning":"どうやら〜のようだ","explain":"状況を見て判断する時に使います。","contrast":"看来要下雨了。","mistake":"好像より判断・結論に近いです。","example":"看来今天会迟到。","exPinyin":"Kànlái jīntiān huì chídào.","exJa":"どうやら今日は遅刻しそうです。","test":"どうやらこの文法は大事です。","answer":"看来这个语法很重要。"},{"id":"d35-g1","name":"听说","pinyin":"tīngshuō","meaning":"〜だそうだ","explain":"聞いた情報を伝える時に使います。","contrast":"听说明天下雨。","mistake":"自分で確認した事実ではありません。","example":"听说这家店很好吃。","exPinyin":"Tīngshuō zhè jiā diàn hěn hǎochī.","exJa":"この店は美味しいそうです。","test":"明日会議があるそうです。","answer":"听说明天有会议。"},{"id":"d35-g2","name":"据说","pinyin":"jùshuō","meaning":"〜だと言われている","explain":"听说より少し書き言葉・客観的です。","contrast":"据说这个方法很有效。","mistake":"日常会話では听说が自然なことも多いです。","example":"据说这个应用很好用。","exPinyin":"Jùshuō zhège yìngyòng hěn hǎoyòng.","exJa":"このアプリは使いやすいと言われています。","test":"このレストランは有名だそうです。","answer":"据说这家餐厅很有名。"}]},{"day":36,"title":"Day 36｜HSK4 基礎強化","vocab":[{"id":"d36-v0","zh":"城市","pinyin":"chéngshì","ja":"都市","example":"上海是一个很方便的城市。","exPinyin":"Shànghǎi shì yí ge hěn fāngbiàn de chéngshì.","exJa":"上海はとても便利な都市です。"},{"id":"d36-v1","zh":"生活","pinyin":"shēnghuó","ja":"生活","example":"我已经习惯上海的生活了。","exPinyin":"Wǒ yǐjīng xíguàn Shànghǎi de shēnghuó le.","exJa":"私はもう上海の生活に慣れました。"},{"id":"d36-v2","zh":"工作","pinyin":"gōngzuò","ja":"仕事","example":"我平时在工作中经常用日语和英语。","exPinyin":"Wǒ píngshí zài gōngzuò zhōng jīngcháng yòng Rìyǔ hé Yīngyǔ.","exJa":"普段仕事では日本語と英語をよく使います。"},{"id":"d36-v3","zh":"家庭","pinyin":"jiātíng","ja":"家庭","example":"家庭生活中也有很多学习中文的机会。","exPinyin":"Jiātíng shēnghuó zhōng yě yǒu hěn duō xuéxí Zhōngwén de jīhuì.","exJa":"家庭生活の中にも中国語を学ぶ機会はたくさんあります。"},{"id":"d36-v4","zh":"孩子","pinyin":"háizi","ja":"子ども","example":"孩子也要吃，所以请做得不太辣。","exPinyin":"Háizi yě yào chī, suǒyǐ qǐng zuò de bú tài là.","exJa":"子どもも食べるので、あまり辛くしないでください。"}],"grammar":[{"id":"d36-g0","name":"原来","pinyin":"yuánlái","meaning":"なんだ、もともと","explain":"新しく気づいた時の「なんだ〜だったのか」を表します。","contrast":"原来是这样。","mistake":"本来はもともとの予定、原来は気づきにも使います。","example":"原来这个词是这个意思。","exPinyin":"Yuánlái zhège cí shì zhège yìsi.","exJa":"なんだ、この単語はこういう意味だったんですね。","test":"なるほど、あなたは日本人だったんですね。","answer":"原来你是日本人。"},{"id":"d36-g1","name":"本来〜后来〜","pinyin":"běnlái/hòulái","meaning":"もともと〜、その後〜","explain":"計画や状況の変化を説明します。","contrast":"本来想打车，后来坐地铁。","mistake":"ストーリー説明に便利です。","example":"我本来想打车，后来坐地铁了。","exPinyin":"Wǒ běnlái xiǎng dǎchē, hòulái zuò dìtiě le.","exJa":"元々タクシーに乗るつもりでしたが、その後地下鉄にしました。","test":"元々行くつもりでしたが後でやめました。","answer":"我本来想去，后来不去了。"},{"id":"d36-g2","name":"差不多","pinyin":"chàbuduō","meaning":"だいたい、ほぼ","explain":"数量・時間・程度が大体同じ、またはほぼ完了したことを表します。","contrast":"差不多到了、差不多一样。","mistake":"随便とは違います。","example":"我差不多五分钟后到。","exPinyin":"Wǒ chàbuduō wǔ fēnzhōng hòu dào.","exJa":"だいたい5分後に着きます。","test":"宿題はほぼ終わりました。","answer":"作业差不多做完了。"}]},{"day":37,"title":"Day 37｜HSK4 基礎強化","vocab":[{"id":"d37-v0","zh":"邀请","pinyin":"yāoqǐng","ja":"招待する","example":"我邀请朋友来家里。","exPinyin":"Wǒ yāo qǐng péng yǒu lái jiā lǐ。","exJa":"友達を家に招待します。"},{"id":"d37-v1","zh":"接受","pinyin":"jiēshòu","ja":"受け入れる","example":"他接受了我的建议。","exPinyin":"Tā jiē shòu le wǒ de jiàn yì。","exJa":"彼は私の提案を受け入れた。"},{"id":"d37-v2","zh":"参观","pinyin":"cānguān","ja":"見学する","example":"我们去参观工厂。","exPinyin":"Wǒ men qù cān guān gōng chǎng。","exJa":"私たちは工場を見学します。"},{"id":"d37-v3","zh":"举办","pinyin":"jǔbàn","ja":"開催する","example":"公司举办了活动。","exPinyin":"Gōng sī jǔ bàn le huó dòng。","exJa":"会社はイベントを開催した。"},{"id":"d37-v4","zh":"庆祝","pinyin":"qìngzhù","ja":"祝う","example":"大家一起庆祝生日。","exPinyin":"Dà jiā yì qǐ qìng zhù shēng rì。","exJa":"みんなで誕生日を祝う。"}],"grammar":[{"id":"d37-g0","name":"大概","pinyin":"dàgài","meaning":"だいたい、多分","explain":"数量や推測をざっくり言う時に使います。","contrast":"大概三点。","mistake":"数字と一緒に使うと自然です。","example":"我大概三点到。","exPinyin":"Wǒ dàgài sān diǎn dào.","exJa":"だいたい3時に着きます。","test":"この仕事はだいたい1時間かかります。","answer":"这个工作大概要一个小时。"},{"id":"d37-g1","name":"左右","pinyin":"zuǒyòu","meaning":"〜くらい","explain":"数量や時間の後ろにつけて、およそを表します。","contrast":"三点左右、十分钟左右。","mistake":"左右は数字の後ろに置きます。","example":"会议三点左右开始。","exPinyin":"Huìyì sān diǎn zuǒyòu kāishǐ.","exJa":"会議は3時ごろ始まります。","test":"家から会社まで30分くらいです。","answer":"从家到公司要半个小时左右。"},{"id":"d37-g2","name":"每〜都〜","pinyin":"měi/dōu","meaning":"毎〜すべて〜","explain":"毎日、毎回など、全てに当てはまることを表します。","contrast":"每天都学习。","mistake":"都を入れると「毎回全部」感が出ます。","example":"我每天都学中文。","exPinyin":"Wǒ měitiān dōu xué Zhōngwén.","exJa":"私は毎日中国語を勉強しています。","test":"毎回少し復習します。","answer":"我每次都复习一点儿。"}]},{"day":38,"title":"Day 38｜HSK4 基礎強化","vocab":[{"id":"d38-v0","zh":"推荐","pinyin":"tuījiàn","ja":"勧める","example":"我推荐这本书。","exPinyin":"Wǒ tuī jiàn zhè běn shū。","exJa":"私はこの本を勧めます。"},{"id":"d38-v1","zh":"介绍","pinyin":"jièshào","ja":"紹介する","example":"请介绍一下你自己。","exPinyin":"Qǐng jiè shào yí xià nǐ zì jǐ。","exJa":"自己紹介してください。"},{"id":"d38-v2","zh":"建议","pinyin":"jiànyì","ja":"助言・提案","example":"我有一个建议。","exPinyin":"Wǒ yǒu yí gè jiàn yì。","exJa":"一つ提案があります。"},{"id":"d38-v3","zh":"鼓励","pinyin":"gǔlì","ja":"励ます","example":"老师鼓励学生。","exPinyin":"Lǎo shī gǔ lì xué shēng。","exJa":"先生は生徒を励ます。"},{"id":"d38-v4","zh":"表扬","pinyin":"biǎoyáng","ja":"褒める","example":"经理表扬了他。","exPinyin":"Jīng lǐ biǎo yáng le tā。","exJa":"マネージャーは彼を褒めた。"}],"grammar":[{"id":"d38-g0","name":"有的〜有的〜","pinyin":"yǒude/yǒude","meaning":"あるものは〜、あるものは〜","explain":"複数の中で違う種類があることを表します。","contrast":"有的人喜欢辣，有的人不喜欢辣。","mistake":"分類して説明する時に便利です。","example":"有的菜很辣，有的菜不辣。","exPinyin":"Yǒude cài hěn là, yǒude cài bú là.","exJa":"辛い料理もあれば辛くない料理もあります。","test":"ある人は地下鉄で、ある人はタクシーで来ます。","answer":"有的人坐地铁来，有的人打车来。"},{"id":"d38-g1","name":"又〜又〜","pinyin":"yòu/yòu","meaning":"〜でもあり〜でもある","explain":"二つの性質が同時にあることを表します。","contrast":"又便宜又好吃。","mistake":"ネガティブにもポジティブにも使えます。","example":"这家店又便宜又好吃。","exPinyin":"Zhè jiā diàn yòu piányi yòu hǎochī.","exJa":"この店は安くて美味しいです。","test":"彼は忙しくて疲れています。","answer":"他又忙又累。"},{"id":"d38-g2","name":"既然〜就〜","pinyin":"jìrán/jiù","meaning":"〜である以上、〜する","explain":"すでに成立している条件を受けて、当然の結果を言います。","contrast":"既然来了，就一起吃饭吧。","mistake":"如果は未確定条件、既然は既成事実です。","example":"既然你来了，我们就开始吧。","exPinyin":"Jìrán nǐ lái le, wǒmen jiù kāishǐ ba.","exJa":"あなたが来たので始めましょう。","test":"もう決めた以上、続けましょう。","answer":"既然决定了，就继续吧。"}]},{"day":39,"title":"Day 39｜HSK4 基礎強化","vocab":[{"id":"d39-v0","zh":"批评","pinyin":"pīpíng","ja":"叱る・批判する","example":"他被老师批评了。","exPinyin":"Tā bèi lǎo shī pī píng le。","exJa":"彼は先生に叱られた。"},{"id":"d39-v1","zh":"反对","pinyin":"fǎnduì","ja":"反対する","example":"我反对这个计划。","exPinyin":"Wǒ fǎn duì zhè ge jì huà。","exJa":"私はこの計画に反対です。"},{"id":"d39-v2","zh":"支持","pinyin":"zhīchí","ja":"支持する","example":"我支持你的决定。","exPinyin":"Wǒ zhī chí nǐ de jué dìng。","exJa":"あなたの決定を支持します。"},{"id":"d39-v3","zh":"商量","pinyin":"shāngliáng","ja":"相談する","example":"这件事我们再商量。","exPinyin":"Zhè jiàn shì wǒ men zài shāng liáng。","exJa":"この件はまた相談しましょう。"},{"id":"d39-v4","zh":"谈","pinyin":"tán","ja":"話し合う","example":"我们谈谈这个问题。","exPinyin":"Wǒ men tán tán zhè ge wèn tí。","exJa":"この問題について話しましょう。"}],"grammar":[{"id":"d39-g0","name":"即使〜也〜","pinyin":"jíshǐ/yě","meaning":"たとえ〜でも〜","explain":"仮定の譲歩を表します。","contrast":"即使很忙，也要学习。","mistake":"虽然は事実、即使は仮定です。","example":"即使很忙，我也想坚持学习。","exPinyin":"Jíshǐ hěn máng, wǒ yě xiǎng jiānchí xuéxí.","exJa":"たとえ忙しくても学習を続けたいです。","test":"たとえ難しくても諦めません。","answer":"即使很难，我也不放弃。"},{"id":"d39-g1","name":"哪怕〜也〜","pinyin":"nǎpà/yě","meaning":"たとえ〜でも〜","explain":"即使に近いですが、口語的で強い譲歩です。","contrast":"哪怕只有十分钟，也要练习。","mistake":"少し感情が入る表現です。","example":"哪怕每天只有十分钟，也要练习。","exPinyin":"Nǎpà měitiān zhǐyǒu shí fēnzhōng, yě yào liànxí.","exJa":"毎日10分だけでも練習します。","test":"たとえ少しでも続けたいです。","answer":"哪怕只有一点儿，我也想坚持。"},{"id":"d39-g2","name":"随着","pinyin":"suízhe","meaning":"〜につれて","explain":"時間や状況の変化に伴う変化を表します。","contrast":"随着练习增加，表达会自然。","mistake":"越…越…より少し書き言葉です。","example":"随着练习增加，我的表达越来越自然。","exPinyin":"Suízhe liànxí zēngjiā, wǒ de biǎodá yuèláiyuè zìrán.","exJa":"練習が増えるにつれて表現が自然になります。","test":"年齢とともに考え方が変わりました。","answer":"随着年龄增长，想法改变了。"}]},{"day":40,"title":"Day 40｜HSK4 基礎強化","vocab":[{"id":"d40-v0","zh":"通知","pinyin":"tōngzhī","ja":"知らせる","example":"请通知大家开会。","exPinyin":"Qǐng tōng zhī dà jiā kāi huì。","exJa":"会議をみんなに知らせてください。"},{"id":"d40-v1","zh":"提供","pinyin":"tígōng","ja":"提供する","example":"酒店提供早餐。","exPinyin":"Jiǔ diàn tí gōng zǎo cān。","exJa":"ホテルは朝食を提供する。"},{"id":"d40-v2","zh":"申请","pinyin":"shēnqǐng","ja":"申請する","example":"我申请了签证。","exPinyin":"Wǒ shēn qǐng le qiān zhèng。","exJa":"ビザを申請した。"},{"id":"d40-v3","zh":"登记","pinyin":"dēngjì","ja":"登録する","example":"请在前台登记。","exPinyin":"Qǐng zài qián tái dēng jì。","exJa":"フロントで登録してください。"},{"id":"d40-v4","zh":"完成","pinyin":"wánchéng","ja":"やり遂げる","example":"我完成了作业。","exPinyin":"Wǒ wán chéng le zuò yè。","exJa":"宿題を終えました。"}],"grammar":[{"id":"d40-g0","name":"通过","pinyin":"tōngguò","meaning":"〜を通じて","explain":"方法・手段を表します。","contrast":"通过准备考试提高中文。","mistake":"经过は過程、通过は手段です。","example":"我想通过HSK提高中文水平。","exPinyin":"Wǒ xiǎng tōngguò HSK tígāo Zhōngwén shuǐpíng.","exJa":"HSKを通じて中国語レベルを上げたいです。","test":"毎日の練習を通じて自然になりたいです。","answer":"我想通过每天练习变得更自然。"},{"id":"d40-g1","name":"经过","pinyin":"jīngguò","meaning":"〜を経て","explain":"ある過程や経験を経たことを表します。","contrast":"经过三个月学习。","mistake":"通过は手段、经过は過程に注目します。","example":"经过三个月的练习，我进步了很多。","exPinyin":"Jīngguò sān ge yuè de liànxí, wǒ jìnbù le hěn duō.","exJa":"3か月の練習を経てかなり進歩しました。","test":"相談の後、私たちは決めました。","answer":"经过讨论，我们决定了。"},{"id":"d40-g2","name":"按照","pinyin":"ànzhào","meaning":"〜に従って","explain":"ルール・方法・順番に従うことを表します。","contrast":"按照说明操作。","mistake":"根据は根拠、按照は手順や基準です。","example":"请按照这个步骤操作。","exPinyin":"Qǐng ànzhào zhège bùzhòu cāozuò.","exJa":"この手順に従って操作してください。","test":"予定通り進めましょう。","answer":"我们按照计划进行吧。"}]},{"day":41,"title":"Day 41｜HSK4 基礎強化","vocab":[{"id":"d41-v0","zh":"进行","pinyin":"jìnxíng","ja":"行う","example":"会议正在进行。","exPinyin":"Huì yì zhèng zài jìn xíng。","exJa":"会議が行われている。"},{"id":"d41-v1","zh":"收拾","pinyin":"shōushí","ja":"片付ける","example":"我收拾房间。","exPinyin":"Wǒ shōu shí fáng jiān。","exJa":"部屋を片付けます。"},{"id":"d41-v2","zh":"节约","pinyin":"jiéyuē","ja":"節約する","example":"我们要节约用水。","exPinyin":"Wǒ men yào jié yuē yòng shuǐ。","exJa":"水を節約しよう。"},{"id":"d41-v3","zh":"浪费","pinyin":"làngfèi","ja":"浪費する","example":"别浪费时间。","exPinyin":"Bié làng fèi shí jiān。","exJa":"時間を無駄にするな。"},{"id":"d41-v4","zh":"增加","pinyin":"zēngjiā","ja":"増える・増やす","example":"工资增加了。","exPinyin":"Gōng zī zēng jiā le。","exJa":"給料が増えた。"}],"grammar":[{"id":"d41-g0","name":"根据","pinyin":"gēnjù","meaning":"〜に基づいて","explain":"情報・根拠に基づいて判断する時に使います。","contrast":"根据天气预报。","mistake":"按照は手順に従う、根据は情報を根拠にする。","example":"根据天气预报，明天会下雨。","exPinyin":"Gēnjù tiānqì yùbào, míngtiān huì xià yǔ.","exJa":"天気予報によると明日は雨です。","test":"資料に基づいて判断します。","answer":"根据资料来判断。"},{"id":"d41-g1","name":"按时／准时","pinyin":"ànshí/zhǔnshí","meaning":"期限通り/時間通り","explain":"按时は決められた時間通り、准时は時間に正確です。","contrast":"按时提交、准时到。","mistake":"コロケーションで覚えると自然です。","example":"请按时提交报告。","exPinyin":"Qǐng ànshí tíjiāo bàogào.","exJa":"報告書を期限通り提出してください。","test":"明日は時間通りに来てください。","answer":"明天请准时来。"},{"id":"d41-g2","name":"由〜负责","pinyin":"yóu…fùzé","meaning":"〜が担当する","explain":"仕事の担当者を説明する時に使います。","contrast":"这个项目由我负责。","mistake":"被と似た形に見えますが、担当者を示します。","example":"这个项目由我负责。","exPinyin":"Zhège xiàngmù yóu wǒ fùzé.","exJa":"このプロジェクトは私が担当します。","test":"この問題は誰が担当しますか。","answer":"这个问题由谁负责？"}]},{"day":42,"title":"Day 42｜HSK4 基礎強化","vocab":[{"id":"d42-v0","zh":"减少","pinyin":"jiǎnshǎo","ja":"減らす","example":"减少压力很重要。","exPinyin":"Jiǎn shǎo yā lì hěn zhòng yào。","exJa":"ストレスを減らすことは大切だ。"},{"id":"d42-v1","zh":"降低","pinyin":"jiàngdī","ja":"下げる","example":"价格降低了。","exPinyin":"Jià gé jiàng dī le。","exJa":"価格が下がった。"},{"id":"d42-v2","zh":"修改","pinyin":"xiūgǎi","ja":"修正する","example":"请修改这个句子。","exPinyin":"Qǐng xiū gǎi zhè ge jù zi。","exJa":"この文を直してください。"},{"id":"d42-v3","zh":"说明","pinyin":"shuōmíng","ja":"説明する","example":"他说明了原因。","exPinyin":"Tā shuō míng le yuán yīn。","exJa":"彼は理由を説明した。"},{"id":"d42-v4","zh":"表示","pinyin":"biǎoshì","ja":"表す","example":"他表示同意。","exPinyin":"Tā biǎo shì tóng yì。","exJa":"彼は同意を示した。"}],"grammar":[{"id":"d42-g0","name":"为〜做准备","pinyin":"wèi…zuò zhǔnbèi","meaning":"〜のために準備する","explain":"試験・会議・出張などの準備に使います。","contrast":"为考试做准备。","mistake":"为了は目的全体、为…做准备は準備対象が明確です。","example":"我在为HSK四级做准备。","exPinyin":"Wǒ zài wèi HSK sì jí zuò zhǔnbèi.","exJa":"HSK4級の準備をしています。","test":"明日の会議の準備をしています。","answer":"我在为明天的会议做准备。"},{"id":"d42-g1","name":"针对","pinyin":"zhēnduì","meaning":"〜に対して、〜向けに","explain":"特定の問題・対象に向けた対応を表します。","contrast":"针对这个问题，我们需要讨论。","mistake":"仕事でよく使うやや正式な表現です。","example":"针对这个问题，我们再讨论一下。","exPinyin":"Zhēnduì zhège wèntí, wǒmen zài tǎolùn yíxià.","exJa":"この問題についてもう少し議論しましょう。","test":"日本人向けに例文を作ります。","answer":"针对日本人做例句。"},{"id":"d42-g2","name":"以〜为主","pinyin":"yǐ…wéi zhǔ","meaning":"〜を中心にする","explain":"主な内容・中心を表します。","contrast":"课程以语法为主。","mistake":"为主はメインという意味です。","example":"这个课程以HSK四级语法为主。","exPinyin":"Zhège kèchéng yǐ HSK sì jí yǔfǎ wéi zhǔ.","exJa":"このコースはHSK4級文法を中心にしています。","test":"今日は復習を中心にします。","answer":"今天以复习为主。"}]},{"day":43,"title":"Day 43｜HSK4 基礎強化","vocab":[{"id":"d43-v0","zh":"怀疑","pinyin":"huáiyí","ja":"疑う","example":"我怀疑他说谎。","exPinyin":"Wǒ huái yí tā shuō huǎng。","exJa":"彼が嘘をついていると疑う。"},{"id":"d43-v1","zh":"估计","pinyin":"gūjì","ja":"推測する","example":"我估计他会迟到。","exPinyin":"Wǒ gū jì tā huì chí dào。","exJa":"彼は遅れると思う。"},{"id":"d43-v2","zh":"判断","pinyin":"pànduàn","ja":"判断する","example":"很难判断对错。","exPinyin":"Hěn nán pàn duàn duì cuò。","exJa":"正誤を判断するのは難しい。"},{"id":"d43-v3","zh":"考虑","pinyin":"kǎolǜ","ja":"考慮する","example":"让我考虑一下。","exPinyin":"Ràng wǒ kǎo lǜ yí xià。","exJa":"少し考えさせて。"},{"id":"d43-v4","zh":"理解","pinyin":"lǐjiě","ja":"理解する","example":"我理解你的想法。","exPinyin":"Wǒ lǐ jiě nǐ de xiǎng fǎ。","exJa":"あなたの考えを理解します。"}],"grammar":[{"id":"d43-g0","name":"以〜为例","pinyin":"yǐ…wéi lì","meaning":"〜を例にすると","explain":"説明で例を出す時に使います。","contrast":"以把构文为例。","mistake":"作文・説明で便利です。","example":"以“把”字句为例。","exPinyin":"Yǐ “bǎ” zì jù wéi lì.","exJa":"把構文を例にすると。","test":"上海を例に説明します。","answer":"以上海为例来说明。"},{"id":"d43-g1","name":"例如","pinyin":"lìrú","meaning":"例えば","explain":"例を出す基本表現です。","contrast":"例如，在上海坐地铁很方便。","mistake":"比如より少し書き言葉寄りです。","example":"例如，在上海坐地铁很方便。","exPinyin":"Lìrú, zài Shànghǎi zuò dìtiě hěn fāngbiàn.","exJa":"例えば、上海では地下鉄に乗るのが便利です。","test":"例えば、この文は自然です。","answer":"例如，这个句子很自然。"},{"id":"d43-g2","name":"比如","pinyin":"bǐrú","meaning":"例えば","explain":"口語でも書き言葉でも使える例示表現です。","contrast":"比如外卖、打车。","mistake":"例如より少し会話的です。","example":"生活中有很多中文表达，比如点外卖。","exPinyin":"Shēnghuó zhōng yǒu hěn duō Zhōngwén biǎodá, bǐrú diǎn wàimài.","exJa":"生活には例えばデリバリー注文などの中国語表現がたくさんあります。","test":"例えば地下鉄に乗る時に使います。","answer":"比如坐地铁的时候会用。"}]},{"day":44,"title":"Day 44｜HSK4 基礎強化","vocab":[{"id":"d44-v0","zh":"了解","pinyin":"liǎojiě","ja":"把握する","example":"我不太了解情况。","exPinyin":"Wǒ bú tài liǎo jiě qíng kuàng。","exJa":"状況がよくわからない。"},{"id":"d44-v1","zh":"熟悉","pinyin":"shúxī","ja":"熟知している","example":"我对这里很熟悉。","exPinyin":"Wǒ duì zhè lǐ hěn shú xī。","exJa":"ここはよく知っている。"},{"id":"d44-v2","zh":"适应","pinyin":"shìyìng","ja":"適応する","example":"我适应了新工作。","exPinyin":"Wǒ shì yìng le xīn gōng zuò。","exJa":"新しい仕事に慣れた。"},{"id":"d44-v3","zh":"养成","pinyin":"yǎngchéng","ja":"身につける","example":"养成好习惯很重要。","exPinyin":"Yǎng chéng hǎo xí guàn hěn zhòng yào。","exJa":"良い習慣を身につけるのは大切だ。"},{"id":"d44-v4","zh":"努力","pinyin":"nǔlì","ja":"努力する","example":"他很努力地学习。","exPinyin":"Tā hěn nǔ lì dì xué xí。","exJa":"彼は一生懸命勉強する。"}],"grammar":[{"id":"d44-g0","name":"像〜这样的","pinyin":"xiàng…zhèyàng de","meaning":"〜のような","explain":"例を挙げて種類を説明する表現です。","contrast":"像上海这样的城市。","mistake":"例示と分類に便利です。","example":"像上海这样的城市，生活很方便。","exPinyin":"Xiàng Shànghǎi zhèyàng de chéngshì, shēnghuó hěn fāngbiàn.","exJa":"上海のような都市は生活が便利です。","test":"このような表現を覚えたいです。","answer":"我想记住像这样的表达。"},{"id":"d44-g1","name":"〜之类的","pinyin":"zhīlèi de","meaning":"〜のようなもの","explain":"例を挙げた後に同類をまとめる表現です。","contrast":"外卖、打车之类的。","mistake":"口語では什么的もあります。","example":"我想学习点外卖、打车之类的表达。","exPinyin":"Wǒ xiǎng xuéxí diǎn wàimài, dǎchē zhīlèi de biǎodá.","exJa":"デリバリーやタクシー配車のような表現を学びたいです。","test":"文法や語順のようなものを復習します。","answer":"复习语法、语顺之类的。"},{"id":"d44-g2","name":"顺便","pinyin":"shùnbiàn","meaning":"ついでに〜","explain":"何かのついでに別のことをする時に使います。","contrast":"下楼顺便买咖啡。","mistake":"一边とは違い同時ではなくついでです。","example":"我下楼顺便买杯咖啡。","exPinyin":"Wǒ xià lóu shùnbiàn mǎi bēi kāfēi.","exJa":"下に行くついでにコーヒーを買います。","test":"帰りに牛乳を買ってください。","answer":"回来的时候顺便买牛奶。"}]},{"day":45,"title":"Day 45｜HSK4 基礎強化","vocab":[{"id":"d45-v0","zh":"后悔","pinyin":"hòuhuǐ","ja":"後悔する","example":"我有点后悔。","exPinyin":"Wǒ yǒu diǎn hòu huǐ。","exJa":"少し後悔している。"},{"id":"d45-v1","zh":"羡慕","pinyin":"xiànmù","ja":"羨む","example":"我很羡慕你。","exPinyin":"Wǒ hěn xiàn mù nǐ。","exJa":"あなたが羨ましい。"},{"id":"d45-v2","zh":"感动","pinyin":"gǎndòng","ja":"感動する","example":"这个故事很感动。","exPinyin":"Zhè ge gù shì hěn gǎn dòng。","exJa":"この話は感動的だ。"},{"id":"d45-v3","zh":"吃惊","pinyin":"chījīng","ja":"驚く","example":"我听了很吃惊。","exPinyin":"Wǒ tīng le hěn chī jīng。","exJa":"聞いて驚いた。"},{"id":"d45-v4","zh":"害怕","pinyin":"hàipà","ja":"怖がる","example":"你别害怕。","exPinyin":"Nǐ bié hài pà。","exJa":"怖がらないで。"}],"grammar":[{"id":"d45-g0","name":"顺便问一下","pinyin":"shùnbiàn wèn yíxià","meaning":"ついでに聞く","explain":"別の話題に軽く追加で質問する表現です。","contrast":"顺便问一下，明天几点？","mistake":"会話で自然です。","example":"顺便问一下，明天几点开会？","exPinyin":"Shùnbiàn wèn yíxià, míngtiān jǐ diǎn kāihuì?","exJa":"ついでに聞きますが、明日は何時に会議ですか。","test":"ついでに住所を教えてください。","answer":"顺便把地址告诉我。"},{"id":"d45-g1","name":"主动","pinyin":"zhǔdòng","meaning":"自分から〜する","explain":"自発的に行動することを表します。","contrast":"主动开口。","mistake":"被动は受け身・受動的です。","example":"学习语言要主动开口。","exPinyin":"Xuéxí yǔyán yào zhǔdòng kāikǒu.","exJa":"言語学習では自分から話す必要があります。","test":"自分から質問します。","answer":"我主动问问题。"},{"id":"d45-g2","name":"靠","pinyin":"kào","meaning":"〜に頼る、〜で","explain":"手段や依存対象を表します。","contrast":"靠翻译软件。","mistake":"依靠より口語的です。","example":"不要太靠翻译软件。","exPinyin":"Bú yào tài kào fānyì ruǎnjiàn.","exJa":"翻訳ソフトに頼りすぎないでください。","test":"努力に頼るしかありません。","answer":"只能靠努力。"}]},{"day":46,"title":"Day 46｜HSK4 基礎強化","vocab":[{"id":"d46-v0","zh":"激动","pinyin":"jīdòng","ja":"興奮する","example":"他激动得说不出话。","exPinyin":"Tā jī dòng dé shuō bù chū huà。","exJa":"彼は興奮して言葉が出ない。"},{"id":"d46-v1","zh":"兴奋","pinyin":"xīngfèn","ja":"わくわくする","example":"我很兴奋。","exPinyin":"Wǒ hěn xīng fèn。","exJa":"とてもわくわくしている。"},{"id":"d46-v2","zh":"失望","pinyin":"shīwàng","ja":"失望する","example":"我对结果很失望。","exPinyin":"Wǒ duì jié guǒ hěn shī wàng。","exJa":"結果に失望した。"},{"id":"d46-v3","zh":"伤心","pinyin":"shāngxīn","ja":"悲しむ","example":"她伤心地哭了。","exPinyin":"Tā shāng xīn dì kū le。","exJa":"彼女は悲しくて泣いた。"},{"id":"d46-v4","zh":"同情","pinyin":"tóngqíng","ja":"同情する","example":"我很同情他。","exPinyin":"Wǒ hěn tóng qíng tā。","exJa":"彼に同情する。"}],"grammar":[{"id":"d46-g0","name":"依赖","pinyin":"yīlài","meaning":"依存する、頼る","explain":"依存のニュアンスが強い表現です。","contrast":"不要太依赖手机翻译。","mistake":"頼りすぎる感じが出ます。","example":"不要太依赖手机翻译。","exPinyin":"Bú yào tài yīlài shǒujī fānyì.","exJa":"スマホ翻訳に頼りすぎないでください。","test":"環境だけに頼ってはいけません。","answer":"不要只依赖环境。"},{"id":"d46-g1","name":"总而言之","pinyin":"zǒng éryán zhī","meaning":"要するに","explain":"まとめの表現です。","contrast":"总而言之，要多练习。","mistake":"総括に便利です。","example":"总而言之，学习语言需要坚持。","exPinyin":"Zǒng éryán zhī, xuéxí yǔyán xūyào jiānchí.","exJa":"要するに、言語学習には継続が必要です。","test":"要するに、もっと練習が必要です。","answer":"总而言之，我需要多练习。"},{"id":"d46-g2","name":"总之","pinyin":"zǒngzhī","meaning":"とにかく、要するに","explain":"まとめ・結論を短く言う表現です。","contrast":"总之，别放弃。","mistake":"口語でも使えます。","example":"总之，每天学一点儿就好。","exPinyin":"Zǒngzhī, měitiān xué yìdiǎnr jiù hǎo.","exJa":"とにかく毎日少し学べばいいです。","test":"とにかく続けましょう。","answer":"总之，坚持吧。"}]},{"day":47,"title":"Day 47｜HSK4 基礎強化","vocab":[{"id":"d47-v0","zh":"友好","pinyin":"yǒuhǎo","ja":"友好的","example":"这里的人很友好。","exPinyin":"Zhè lǐ de rén hěn yǒu hǎo。","exJa":"ここの人は親切だ。"},{"id":"d47-v1","zh":"热闹","pinyin":"rènào","ja":"にぎやか","example":"街上很热闹。","exPinyin":"Jiē shàng hěn rè nào。","exJa":"通りはにぎやかだ。"},{"id":"d47-v2","zh":"安静","pinyin":"ānjìng","ja":"静か","example":"教室很安静。","exPinyin":"Jiào shì hěn ān jìng。","exJa":"教室は静かだ。"},{"id":"d47-v3","zh":"活泼","pinyin":"huópō","ja":"活発","example":"这个孩子很活泼。","exPinyin":"Zhè ge hái zi hěn huó pō。","exJa":"この子は活発だ。"},{"id":"d47-v4","zh":"诚实","pinyin":"chéngshí","ja":"正直","example":"他是个诚实的人。","exPinyin":"Tā shì gè chéng shí de rén。","exJa":"彼は正直な人だ。"}],"grammar":[{"id":"d47-g0","name":"反正","pinyin":"fǎnzhèng","meaning":"どうせ、とにかく","explain":"理由を少し雑にまとめる口語表現です。","contrast":"反正不远，我们走过去吧。","mistake":"場面によって投げやりに聞こえることもあります。","example":"反正不远，我们走过去吧。","exPinyin":"Fǎnzhèng bù yuǎn, wǒmen zǒu guòqù ba.","exJa":"どうせ遠くないので歩いて行きましょう。","test":"どうせ時間があるので復習しましょう。","answer":"反正有时间，复习一下吧。"},{"id":"d47-g1","name":"不知不觉","pinyin":"bù zhī bù jué","meaning":"いつの間にか","explain":"気づかないうちに変化が起きることを表します。","contrast":"不知不觉住了八年。","mistake":"感想表現で自然です。","example":"不知不觉，我在上海住了快八年了。","exPinyin":"Bù zhī bù jué, wǒ zài Shànghǎi zhù le kuài bā nián le.","exJa":"いつの間にか上海にもうすぐ8年住んでいます。","test":"いつの間にか中国語に慣れました。","answer":"不知不觉，我习惯了中文。"},{"id":"d47-g2","name":"慢慢地","pinyin":"mànmàn de","meaning":"ゆっくりと、だんだん","explain":"変化や動作がゆっくり進むことを表します。","contrast":"慢慢地习惯。","mistake":"慢慢は動詞の前でも使えます。","example":"我慢慢地习惯了上海生活。","exPinyin":"Wǒ mànmàn de xíguàn le Shànghǎi shēnghuó.","exJa":"だんだん上海生活に慣れました。","test":"ゆっくり話してください。","answer":"请慢慢说。"}]},{"day":48,"title":"Day 48｜HSK4 基礎強化","vocab":[{"id":"d48-v0","zh":"勇敢","pinyin":"yǒnggǎn","ja":"勇敢","example":"他很勇敢。","exPinyin":"Tā hěn yǒng gǎn。","exJa":"彼は勇敢だ。"},{"id":"d48-v1","zh":"骄傲","pinyin":"jiāoào","ja":"誇りに思う・高慢","example":"我为你骄傲。","exPinyin":"Wǒ wèi nǐ jiāo ào。","exJa":"あなたを誇りに思う。"},{"id":"d48-v2","zh":"谦虚","pinyin":"qiānxū","ja":"謙虚","example":"他很谦虚。","exPinyin":"Tā hěn qiān xū。","exJa":"彼は謙虚だ。"},{"id":"d48-v3","zh":"粗心","pinyin":"cūxīn","ja":"そそっかしい","example":"你太粗心了。","exPinyin":"Nǐ tài cū xīn le。","exJa":"君は不注意すぎる。"},{"id":"d48-v4","zh":"性格","pinyin":"xìnggé","ja":"性格","example":"她的性格很好。","exPinyin":"Tā de xìng gé hěn hǎo。","exJa":"彼女は性格が良い。"}],"grammar":[{"id":"d48-g0","name":"渐渐地","pinyin":"jiànjiàn de","meaning":"だんだん","explain":"変化が徐々に進む書き言葉寄り表現です。","contrast":"渐渐地进步。","mistake":"慢慢地より少し書き言葉です。","example":"我的中文渐渐地自然了。","exPinyin":"Wǒ de Zhōngwén jiànjiàn de zìrán le.","exJa":"私の中国語はだんだん自然になりました。","test":"彼はだんだん慣れてきました。","answer":"他渐渐地习惯了。"},{"id":"d48-g1","name":"先别","pinyin":"xiān bié","meaning":"まず〜しないで","explain":"一旦止めてほしい時の自然表現です。","contrast":"先别急。","mistake":"先不用とはニュアンスが違います。","example":"先别急，我们慢慢说。","exPinyin":"Xiān bié jí, wǒmen mànmàn shuō.","exJa":"まず焦らず、ゆっくり話しましょう。","test":"まず送らないでください。","answer":"先别发。"},{"id":"d48-g2","name":"先不用","pinyin":"xiān bú yòng","meaning":"今はまだ〜しなくてよい","explain":"現時点では不要という表現です。","contrast":"先不用发。","mistake":"先别はしないで、先不用はしなくてよい。","example":"你先不用发资料。","exPinyin":"Nǐ xiān bú yòng fā zīliào.","exJa":"今はまだ資料を送らなくていいです。","test":"今はまだ来なくていいです。","answer":"你先不用来。"}]},{"day":49,"title":"Day 49｜HSK4 基礎強化","vocab":[{"id":"d49-v0","zh":"脾气","pinyin":"píqì","ja":"気性","example":"他脾气不太好。","exPinyin":"Tā pí qì bú tài hǎo。","exJa":"彼は気が短い。"},{"id":"d49-v1","zh":"印象","pinyin":"yìnxiàng","ja":"印象","example":"他给我留下好印象。","exPinyin":"Tā gěi wǒ liú xià hǎo yìn xiàng。","exJa":"彼は良い印象を残した。"},{"id":"d49-v2","zh":"看法","pinyin":"kànfǎ","ja":"見方","example":"我有不同的看法。","exPinyin":"Wǒ yǒu bù tóng de kàn fǎ。","exJa":"私は違う見方がある。"},{"id":"d49-v3","zh":"意见","pinyin":"yìjiàn","ja":"意見","example":"大家有什么意见？","exPinyin":"Dà jiā yǒu shén me yì jiàn？","exJa":"皆さん意見は？"},{"id":"d49-v4","zh":"主意","pinyin":"zhǔyì","ja":"アイデア","example":"这是个好主意。","exPinyin":"Zhè shì gè hǎo zhǔ yì。","exJa":"それは良い考えだ。"}],"grammar":[{"id":"d49-g0","name":"我来吧","pinyin":"wǒ lái ba","meaning":"私が〜します","explain":"自分が引き受ける時の自然表現です。","contrast":"这个问题我来处理吧。","mistake":"来は役割を引き受ける意味にもなります。","example":"这个问题我来处理吧。","exPinyin":"Zhège wèntí wǒ lái chǔlǐ ba.","exJa":"この問題は私が対応します。","test":"私が説明します。","answer":"我来解释吧。"},{"id":"d49-g1","name":"该〜了","pinyin":"gāi…le","meaning":"そろそろ〜する時間だ","explain":"予定・時間が来たことを表します。","contrast":"该走了、该开会了。","mistake":"应该とは違い時間が来た感じです。","example":"该开会了。","exPinyin":"Gāi kāihuì le.","exJa":"そろそろ会議の時間です。","test":"そろそろ復習する時間です。","answer":"该复习了。"},{"id":"d49-g2","name":"不用","pinyin":"bú yòng","meaning":"〜しなくてよい","explain":"必要がないことを表します。","contrast":"不用担心。","mistake":"不要はしないで、不用はしなくてよい。","example":"你不用担心。","exPinyin":"Nǐ bú yòng dānxīn.","exJa":"心配しなくていいです。","test":"今日は来なくていいです。","answer":"你今天不用来。"}]},{"day":50,"title":"Day 50｜HSK4 基礎強化","vocab":[{"id":"d50-v0","zh":"办法","pinyin":"bànfǎ","ja":"方法・手段","example":"我有办法。","exPinyin":"Wǒ yǒu bàn fǎ。","exJa":"私には方法がある。"},{"id":"d50-v1","zh":"经历","pinyin":"jīnglì","ja":"経験・体験","example":"这是难忘的经历。","exPinyin":"Zhè shì nán wàng de jīng lì。","exJa":"忘れられない経験だ。"},{"id":"d50-v2","zh":"过程","pinyin":"guòchéng","ja":"過程","example":"学习的过程很重要。","exPinyin":"Xué xí de guò chéng hěn zhòng yào。","exJa":"学ぶ過程が大切だ。"},{"id":"d50-v3","zh":"效果","pinyin":"xiàoguǒ","ja":"効果","example":"这个方法效果很好。","exPinyin":"Zhè ge fāng fǎ xiào guǒ hěn hǎo。","exJa":"この方法は効果的だ。"},{"id":"d50-v4","zh":"优点","pinyin":"yōudiǎn","ja":"長所","example":"他有很多优点。","exPinyin":"Tā yǒu hěn duō yōu diǎn。","exJa":"彼には長所が多い。"}],"grammar":[{"id":"d50-g0","name":"不要","pinyin":"bú yào","meaning":"〜しないで","explain":"禁止・忠告を表します。","contrast":"不要迟到。","mistake":"不用とは違います。","example":"不要忘记带护照。","exPinyin":"Bú yào wàngjì dài hùzhào.","exJa":"パスポートを忘れないでください。","test":"あまり辛くしないでください。","answer":"不要做得太辣。"},{"id":"d50-g1","name":"别","pinyin":"bié","meaning":"〜しないで","explain":"不要より口語的な禁止・忠告です。","contrast":"别担心、别迟到。","mistake":"親しい場面で自然です。","example":"别担心，没问题。","exPinyin":"Bié dānxīn, méi wèntí.","exJa":"心配しないで、大丈夫です。","test":"遅刻しないでください。","answer":"别迟到。"},{"id":"d50-g2","name":"别再","pinyin":"bié zài","meaning":"もう〜しないで","explain":"同じことを繰り返さないように言う表現です。","contrast":"别再迟到了。","mistake":"再は繰り返しを表します。","example":"别再忘记了。","exPinyin":"Bié zài wàngjì le.","exJa":"もう忘れないでください。","test":"もうこのミスをしないでください。","answer":"别再犯这个错误了。"}]},{"day":51,"title":"Day 51｜HSK4 基礎強化","vocab":[{"id":"d51-v0","zh":"缺点","pinyin":"quēdiǎn","ja":"欠点","example":"每个人都有缺点。","exPinyin":"Měi gè rén dōu yǒu quē diǎn。","exJa":"誰にでも欠点がある。"},{"id":"d51-v1","zh":"任务","pinyin":"rènwu","ja":"任務","example":"我完成了任务。","exPinyin":"Wǒ wán chéng le rèn wu。","exJa":"任務を完了した。"},{"id":"d51-v2","zh":"责任","pinyin":"zérèn","ja":"責任","example":"这是我的责任。","exPinyin":"Zhè shì wǒ de zé rèn。","exJa":"これは私の責任だ。"},{"id":"d51-v3","zh":"压力","pinyin":"yālì","ja":"プレッシャー","example":"工作压力很大。","exPinyin":"Gōng zuò yā lì hěn dà。","exJa":"仕事のプレッシャーが大きい。"},{"id":"d51-v4","zh":"危险","pinyin":"wēixiǎn","ja":"危険","example":"这里很危险。","exPinyin":"Zhè lǐ hěn wēi xiǎn。","exJa":"ここは危険だ。"}],"grammar":[{"id":"d51-g0","name":"再也不","pinyin":"zài yě bù","meaning":"二度と〜しない","explain":"強い決意や否定です。","contrast":"我再也不迟到了。","mistake":"別再は相手への禁止、再也不は主語の決意です。","example":"我再也不这样说了。","exPinyin":"Wǒ zài yě bù zhèyàng shuō le.","exJa":"もう二度とこう言いません。","test":"二度と忘れません。","answer":"我再也不忘了。"},{"id":"d51-g1","name":"可以的话","pinyin":"kěyǐ dehuà","meaning":"可能なら","explain":"相手に柔らかく依頼する表現です。","contrast":"可以的话，今天发给我。","mistake":"方便的话より可能性に寄ります。","example":"可以的话，今天发给我。","exPinyin":"Kěyǐ dehuà, jīntiān fā gěi wǒ.","exJa":"可能なら今日送ってください。","test":"できれば少し早く来てください。","answer":"可以的话，请早点来。"},{"id":"d51-g2","name":"方便的话","pinyin":"fāngbiàn dehuà","meaning":"都合がよければ","explain":"相手に配慮した依頼表現です。","contrast":"方便的话，请回我电话。","mistake":"都合を聞く自然な表現です。","example":"方便的话，请给我回个电话。","exPinyin":"Fāngbiàn dehuà, qǐng gěi wǒ huí ge diànhuà.","exJa":"都合がよければ電話を折り返してください。","test":"都合がよければ住所を送ってください。","answer":"方便的话，请把地址发给我。"}]},{"day":52,"title":"Day 52｜HSK4 基礎強化","vocab":[{"id":"d52-v0","zh":"情况","pinyin":"qíngkuàng","ja":"状況","example":"情况有点复杂。","exPinyin":"Qíng kuàng yǒu diǎn fù zá。","exJa":"状況は少し複雑だ。"},{"id":"d52-v1","zh":"标准","pinyin":"biāozhǔn","ja":"基準・標準","example":"这是标准答案。","exPinyin":"Zhè shì biāo zhǔn dá àn。","exJa":"これは標準的な答えだ。"},{"id":"d52-v2","zh":"规定","pinyin":"guīdìng","ja":"規定","example":"这是公司的规定。","exPinyin":"Zhè shì gōng sī de guī dìng。","exJa":"これは会社の規則だ。"},{"id":"d52-v3","zh":"目标","pinyin":"mùbiāo","ja":"目標","example":"我的目标是通过考试。","exPinyin":"Wǒ de mù biāo shì tōng guò kǎo shì。","exJa":"私の目標は試験合格だ。"},{"id":"d52-v4","zh":"将来","pinyin":"jiānglái","ja":"将来","example":"将来我想当老师。","exPinyin":"Jiāng lái wǒ xiǎng dāng lǎo shī。","exJa":"将来教師になりたい。"}],"grammar":[{"id":"d52-g0","name":"麻烦你","pinyin":"máfan nǐ","meaning":"お手数ですが","explain":"丁寧にお願いする表現です。","contrast":"麻烦你看一下。","mistake":"请だけより配慮があります。","example":"麻烦你帮我看一下。","exPinyin":"Máfan nǐ bāng wǒ kàn yíxià.","exJa":"お手数ですが、ちょっと見てもらえますか。","test":"お手数ですが住所を送ってください。","answer":"麻烦你把地址发给我。"},{"id":"d52-g1","name":"不好意思","pinyin":"bù hǎoyìsi","meaning":"すみませんが","explain":"依頼・謝罪・声かけの前置きとして便利です。","contrast":"不好意思，麻烦你…","mistake":"对不起より軽い日常表現です。","example":"不好意思，请问地铁站怎么走？","exPinyin":"Bù hǎoyìsi, qǐngwèn dìtiězhàn zěnme zǒu?","exJa":"すみません、地下鉄駅へはどう行きますか。","test":"すみません、少し辛さを控えてください。","answer":"不好意思，请少放一点儿辣椒。"},{"id":"d52-g2","name":"要不〜吧","pinyin":"yàobù…ba","meaning":"それなら〜しましょうか","explain":"提案をする自然な会話表現です。","contrast":"要不我们打车吧。","mistake":"柔らかい提案です。","example":"要不我们坐地铁吧。","exPinyin":"Yàobù wǒmen zuò dìtiě ba.","exJa":"それなら地下鉄で行きましょうか。","test":"それなら明日話しましょう。","answer":"要不我们明天再聊吧。"}]},{"day":53,"title":"Day 53｜HSK4 基礎強化","vocab":[{"id":"d53-v0","zh":"重视","pinyin":"zhòngshì","ja":"重視する","example":"我们重视质量。","exPinyin":"Wǒ men zhòng shì zhì liàng。","exJa":"私たちは品質を重視する。"},{"id":"d53-v1","zh":"交流","pinyin":"jiāoliú","ja":"交流する","example":"我们用中文交流。","exPinyin":"Wǒ men yòng zhōng wén jiāo liú。","exJa":"中国語で交流する。"},{"id":"d53-v2","zh":"合作","pinyin":"hézuò","ja":"協力する","example":"我们合作得很好。","exPinyin":"Wǒ men hé zuò dé hěn hǎo。","exJa":"うまく協力できている。"},{"id":"d53-v3","zh":"比赛","pinyin":"bǐsài","ja":"試合","example":"明天有足球比赛。","exPinyin":"Míng tiān yǒu zú qiú bǐ sài。","exJa":"明日サッカーの試合がある。"},{"id":"d53-v4","zh":"参加","pinyin":"cānjiā","ja":"参加する","example":"我参加了会议。","exPinyin":"Wǒ cān jiā le huì yì。","exJa":"会議に参加した。"}],"grammar":[{"id":"d53-g0","name":"算了","pinyin":"suàn le","meaning":"もういい、やめておこう","explain":"何かを諦める・やめる時の自然表現です。","contrast":"太贵了，算了。","mistake":"言い方によっては投げやりに聞こえます。","example":"太麻烦了，算了吧。","exPinyin":"Tài máfan le, suàn le ba.","exJa":"面倒すぎるのでやめましょう。","test":"今日は混んでいるのでやめましょう。","answer":"今天人太多了，算了吧。"},{"id":"d53-g1","name":"怪不得","pinyin":"guàibude","meaning":"どうりで〜","explain":"理由が分かって納得した時に使います。","contrast":"怪不得你迟到了。","mistake":"责怪ではなく「なるほど」に近いです。","example":"怪不得你这么累。","exPinyin":"Guàibude nǐ zhème lèi.","exJa":"どうりでそんなに疲れているわけですね。","test":"どうりで今日は道が混んでいます。","answer":"怪不得今天路上这么堵。"},{"id":"d53-g2","name":"其实","pinyin":"qíshí","meaning":"実は","explain":"相手の予想と違う事実や本音を言う時に使います。","contrast":"其实我中文没那么好。","mistake":"原来は新発見、其实は実際のところです。","example":"其实我的中文没有大家想象的那么好。","exPinyin":"Qíshí wǒ de Zhōngwén méiyǒu dàjiā xiǎngxiàng de nàme hǎo.","exJa":"実は私の中国語は皆が想像するほど良くありません。","test":"実は少し緊張しています。","answer":"其实我有点儿紧张。"}]},{"day":54,"title":"Day 54｜HSK4 基礎強化","vocab":[{"id":"d54-v0","zh":"举行","pinyin":"jǔxíng","ja":"挙行する","example":"学校举行运动会。","exPinyin":"Xué xiào jǔ xíng yùn dòng huì。","exJa":"学校は運動会を開く。"},{"id":"d54-v1","zh":"总结","pinyin":"zǒngjié","ja":"まとめる","example":"我做了一个总结。","exPinyin":"Wǒ zuò le yí gè zǒng jié。","exJa":"まとめを作った。"},{"id":"d54-v2","zh":"详细","pinyin":"xiángxì","ja":"詳しい","example":"请详细说明。","exPinyin":"Qǐng xiáng xì shuō míng。","exJa":"詳しく説明してください。"},{"id":"d54-v3","zh":"严格","pinyin":"yángé","ja":"厳しい","example":"老师很严格。","exPinyin":"Lǎo shī hěn yán gé。","exJa":"先生は厳しい。"},{"id":"d54-v4","zh":"严重","pinyin":"yánzhòng","ja":"深刻","example":"问题很严重。","exPinyin":"Wèn tí hěn yán zhòng。","exJa":"問題は深刻だ。"}],"grammar":[{"id":"d54-g0","name":"说实话","pinyin":"shuō shíhuà","meaning":"正直に言うと","explain":"本音を言う前置きです。","contrast":"说实话，我有点儿担心。","mistake":"少しカジュアルですが自然です。","example":"说实话，我有点儿紧张。","exPinyin":"Shuō shíhuà, wǒ yǒudiǎnr jǐnzhāng.","exJa":"正直に言うと、少し緊張しています。","test":"正直、まだよく分かりません。","answer":"说实话，我还不太明白。"},{"id":"d54-g1","name":"说不定","pinyin":"shuōbudìng","meaning":"もしかすると〜かもしれない","explain":"可能性を口語的に表す表現です。","contrast":"说不定他会来。","mistake":"可能よりややくだけています。","example":"说不定明天会下雨。","exPinyin":"Shuōbudìng míngtiān huì xià yǔ.","exJa":"もしかしたら明日雨が降るかもしれません。","test":"もしかすると彼は知っています。","answer":"说不定他知道。"},{"id":"d54-g2","name":"看情况","pinyin":"kàn qíngkuàng","meaning":"状況を見る","explain":"今すぐ決められない時に使います。","contrast":"明天看情况吧。","mistake":"曖昧すぎる場合もあるので仕事では補足するとよいです。","example":"明天看情况吧。","exPinyin":"Míngtiān kàn qíngkuàng ba.","exJa":"明日は状況を見ましょう。","test":"天気を見て決めましょう。","answer":"看天气再决定吧。"}]},{"day":55,"title":"Day 55｜HSK4 基礎強化","vocab":[{"id":"d55-v0","zh":"航班","pinyin":"hángbān","ja":"フライト・便","example":"我的航班晚点了。","exPinyin":"Wǒ de háng bān wǎn diǎn le。","exJa":"私のフライトは遅れた。"},{"id":"d55-v1","zh":"行李","pinyin":"xíngli","ja":"荷物","example":"我的行李很重。","exPinyin":"Wǒ de xíng li hěn zhòng。","exJa":"私の荷物は重い。"},{"id":"d55-v2","zh":"登机牌","pinyin":"dēngjīpái","ja":"搭乗券","example":"请出示登机牌。","exPinyin":"Qǐng chū shì dēng jī pái。","exJa":"搭乗券を見せてください。"},{"id":"d55-v3","zh":"出发","pinyin":"chūfā","ja":"出発する","example":"我们明天出发。","exPinyin":"Wǒ men míng tiān chū fā。","exJa":"私たちは明日出発する。"},{"id":"d55-v4","zh":"到达","pinyin":"dàodá","ja":"到着する","example":"飞机准时到达。","exPinyin":"Fēi jī zhǔn shí dào dá。","exJa":"飛行機は時間通り到着した。"}],"grammar":[{"id":"d55-g0","name":"回头","pinyin":"huítóu","meaning":"あとで","explain":"口語で「あとで」を表します。","contrast":"回头联系你。","mistake":"以后より近い後での感じがあります。","example":"我回头联系你。","exPinyin":"Wǒ huítóu liánxì nǐ.","exJa":"あとで連絡します。","test":"あとで資料を送ります。","answer":"我回头把资料发给你。"},{"id":"d55-g1","name":"一会儿","pinyin":"yíhuìr","meaning":"少し後で","explain":"短い時間の後に何かをする表現です。","contrast":"一会儿见。","mistake":"回头より近い時間です。","example":"我一会儿给你回电话。","exPinyin":"Wǒ yíhuìr gěi nǐ huí diànhuà.","exJa":"少し後で電話を折り返します。","test":"少し後で会いましょう。","answer":"一会儿见。"},{"id":"d55-g2","name":"等〜再〜","pinyin":"děng…zài","meaning":"〜を待ってから〜","explain":"条件となる人・時間を待って、その後に動作します。","contrast":"等他来了再说。","mistake":"等は条件節を作れます。","example":"等经理来了再决定。","exPinyin":"Děng jīnglǐ lái le zài juédìng.","exJa":"マネージャーが来てから決めましょう。","test":"子どもが寝てから勉強します。","answer":"等孩子睡了再学习。"}]},{"day":56,"title":"Day 56｜HSK4 基礎強化","vocab":[{"id":"d56-v0","zh":"风景","pinyin":"fēngjǐng","ja":"風景","example":"这里的风景很美。","exPinyin":"Zhè lǐ de fēng jǐng hěn měi。","exJa":"ここの景色は美しい。"},{"id":"d56-v1","zh":"导游","pinyin":"dǎoyóu","ja":"ガイド","example":"导游带我们参观。","exPinyin":"Dǎo yóu dài wǒ men cān guān。","exJa":"ガイドが案内してくれた。"},{"id":"d56-v2","zh":"门票","pinyin":"ménpiào","ja":"入場券","example":"门票多少钱？","exPinyin":"Mén piào duō shǎo qián？","exJa":"入場券はいくら？"},{"id":"d56-v3","zh":"排队","pinyin":"páiduì","ja":"並ぶ","example":"大家在排队买票。","exPinyin":"Dà jiā zài pái duì mǎi piào。","exJa":"みんな切符を買うため並んでいる。"},{"id":"d56-v4","zh":"拍照","pinyin":"pāizhào","ja":"写真を撮る","example":"我们一起拍照吧。","exPinyin":"Wǒ men yì qǐ pāi zhào ba。","exJa":"一緒に写真を撮ろう。"}],"grammar":[{"id":"d56-g0","name":"让我想一下","pinyin":"ràng wǒ xiǎng yíxià","meaning":"少し考えさせて","explain":"即答できない時の自然な表現です。","contrast":"让我想一下怎么说。","mistake":"仕事でも会話でも使えます。","example":"让我想一下怎么说。","exPinyin":"Ràng wǒ xiǎng yíxià zěnme shuō.","exJa":"どう言えばいいか少し考えさせてください。","test":"少し考えてから答えます。","answer":"让我想一下再回答。"},{"id":"d56-g1","name":"我想确认一下","pinyin":"wǒ xiǎng quèrèn yíxià","meaning":"確認したいです","explain":"丁寧に確認を始める表現です。","contrast":"我想确认一下时间。","mistake":"いきなり聞くより自然です。","example":"我想确认一下明天的安排。","exPinyin":"Wǒ xiǎng quèrèn yíxià míngtiān de ānpái.","exJa":"明日の予定を確認したいです。","test":"会議時間を確認したいです。","answer":"我想确认一下会议时间。"},{"id":"d56-g2","name":"我想问一下","pinyin":"wǒ xiǎng wèn yíxià","meaning":"ちょっと聞きたいです","explain":"質問する前置きとして自然です。","contrast":"我想问一下，这个怎么用？","mistake":"礼貌で柔らかい聞き方です。","example":"我想问一下，这个词怎么用？","exPinyin":"Wǒ xiǎng wèn yíxià, zhège cí zěnme yòng?","exJa":"この単語をどう使うか聞きたいです。","test":"少し聞いてもいいですか。","answer":"我可以问一下吗？"}]},{"day":57,"title":"Day 57｜HSK4 基礎強化","vocab":[{"id":"d57-v0","zh":"工资","pinyin":"gōngzī","ja":"給料","example":"这个月工资发了。","exPinyin":"Zhè ge yuè gōng zī fā le。","exJa":"今月の給料が出た。"},{"id":"d57-v1","zh":"奖金","pinyin":"jiǎngjīn","ja":"ボーナス","example":"年底有奖金。","exPinyin":"Nián dǐ yǒu jiǎng jīn。","exJa":"年末にボーナスがある。"},{"id":"d57-v2","zh":"收入","pinyin":"shōurù","ja":"収入","example":"他的收入很高。","exPinyin":"Tā de shōu rù hěn gāo。","exJa":"彼の収入は高い。"},{"id":"d57-v3","zh":"招聘","pinyin":"zhāopìn","ja":"求人・採用する","example":"公司在招聘新人。","exPinyin":"Gōng sī zài zhāo pìn xīn rén。","exJa":"会社は新人を募集している。"},{"id":"d57-v4","zh":"面试","pinyin":"miànshì","ja":"面接","example":"我明天去面试。","exPinyin":"Wǒ míng tiān qù miàn shì。","exJa":"明日面接に行く。"}],"grammar":[{"id":"d57-g0","name":"我不太确定","pinyin":"bù tài quèdìng","meaning":"あまり確信がない","explain":"自信がない時に自然に言えます。","contrast":"我不太确定这个句子对不对。","mistake":"不知道より柔らかいです。","example":"我不太确定这个句子对不对。","exPinyin":"Wǒ bú tài quèdìng zhège jùzi duì bu duì.","exJa":"この文が正しいかあまり確信がありません。","test":"時間はまだ確定していません。","answer":"时间还不太确定。"},{"id":"d57-g1","name":"我不太清楚","pinyin":"bù tài qīngchu","meaning":"よく分かりません","explain":"分からないことを柔らかく言います。","contrast":"我不知道より少し柔らかいことがあります。","mistake":"清楚ははっきり分かるという意味です。","example":"这个情况我不太清楚。","exPinyin":"Zhège qíngkuàng wǒ bú tài qīngchu.","exJa":"この状況はあまりよく分かりません。","test":"住所はよく分かりません。","answer":"地址我不太清楚。"},{"id":"d57-g2","name":"这样说自然吗","pinyin":"zìrán ma","meaning":"この言い方は自然ですか","explain":"中国語学習で非常に使える質問です。","contrast":"对不对だけでなく、自然かどうかを聞くのが大事です。","mistake":"自然な会話力を伸ばす質問です。","example":"这样说自然吗？","exPinyin":"Zhèyàng shuō zìrán ma?","exJa":"この言い方は自然ですか。","test":"この文は自然ですか。","answer":"这个句子自然吗？"}]},{"day":58,"title":"Day 58｜HSK4 基礎強化","vocab":[{"id":"d58-v0","zh":"简历","pinyin":"jiǎnlì","ja":"履歴書","example":"请发一份简历。","exPinyin":"Qǐng fā yí fèn jiǎn lì。","exJa":"履歴書を送ってください。"},{"id":"d58-v1","zh":"职业","pinyin":"zhíyè","ja":"職業","example":"你的职业是什么？","exPinyin":"Nǐ de zhí yè shì shén me？","exJa":"あなたの職業は？"},{"id":"d58-v2","zh":"专业","pinyin":"zhuānyè","ja":"専攻","example":"我的专业是法律。","exPinyin":"Wǒ de zhuān yè shì fǎ lǜ。","exJa":"私の専攻は法律だ。"},{"id":"d58-v3","zh":"知识","pinyin":"zhīshi","ja":"知識","example":"学习新知识很有趣。","exPinyin":"Xué xí xīn zhī shi hěn yǒu qù。","exJa":"新しい知識を学ぶのは楽しい。"},{"id":"d58-v4","zh":"文章","pinyin":"wénzhāng","ja":"文章","example":"这篇文章很长。","exPinyin":"Zhè piān wén zhāng hěn cháng。","exJa":"この文章は長い。"}],"grammar":[{"id":"d58-g0","name":"应该怎么说","pinyin":"yīnggāi zěnme shuō","meaning":"どう言うべきですか","explain":"より自然・正確な言い方を聞く表現です。","contrast":"这个中文应该怎么说？","mistake":"学習時に非常に便利です。","example":"这个用中文应该怎么说？","exPinyin":"Zhège yòng Zhōngwén yīnggāi zěnme shuō?","exJa":"これは中国語でどう言えばいいですか。","test":"自然にはどう言いますか。","answer":"自然一点应该怎么说？"},{"id":"d58-g1","name":"不太地道","pinyin":"bú tài dìdao","meaning":"あまりネイティブらしくない","explain":"自然な中国語らしさを表す表現です。","contrast":"这个表达不太地道。","mistake":"地道は本場らしい、自然なという意味です。","example":"这个表达不太地道。","exPinyin":"Zhège biǎodá bú tài dìdao.","exJa":"この表現はあまり自然な中国語らしくありません。","test":"もっと自然な言い方を教えてください。","answer":"请告诉我更地道的说法。"},{"id":"d58-g2","name":"口语里","pinyin":"kǒuyǔ lǐ","meaning":"口語では","explain":"話し言葉の表現を説明する時に使います。","contrast":"口语里常说没事儿。","mistake":"書き言葉との差を意識できます。","example":"口语里常说“没事儿”。","exPinyin":"Kǒuyǔ lǐ cháng shuō “méi shìr”.","exJa":"口語ではよく「没事儿」と言います。","test":"口語ではこう言えます。","answer":"口语里可以这样说。"}]},{"day":59,"title":"Day 59｜HSK4 基礎強化","vocab":[{"id":"d59-v0","zh":"词典","pinyin":"cídiǎn","ja":"辞書","example":"我用词典查生词。","exPinyin":"Wǒ yòng cí diǎn chá shēng cí。","exJa":"辞書で新出単語を調べる。"},{"id":"d59-v1","zh":"成绩","pinyin":"chéngjì","ja":"成績","example":"他的成绩很好。","exPinyin":"Tā de chéng jì hěn hǎo。","exJa":"彼の成績は良い。"},{"id":"d59-v2","zh":"及格","pinyin":"jígé","ja":"合格する","example":"我考试及格了。","exPinyin":"Wǒ kǎo shì jí gé le。","exJa":"試験に合格した。"},{"id":"d59-v3","zh":"练习","pinyin":"liànxí","ja":"練習する","example":"每天练习汉语。","exPinyin":"Měi tiān liàn xí hàn yǔ。","exJa":"毎日中国語を練習する。"},{"id":"d59-v4","zh":"笔记","pinyin":"bǐjì","ja":"ノート・メモ","example":"我记了笔记。","exPinyin":"Wǒ jì le bǐ jì。","exJa":"ノートを取った。"}],"grammar":[{"id":"d59-g0","name":"书面语里","pinyin":"shūmiànyǔ lǐ","meaning":"書き言葉では","explain":"文章・通知・メールで使う表現を説明できます。","contrast":"书面语里常用由于。","mistake":"口語では因为の方が自然な場合があります。","example":"书面语里常用“由于”。","exPinyin":"Shūmiànyǔ lǐ chángyòng “yóuyú”.","exJa":"書き言葉ではよく「由于」を使います。","test":"書き言葉ではこう書けます。","answer":"书面语里可以这样写。"},{"id":"d59-g1","name":"是〜的：強調","pinyin":"shì…de","meaning":"すでに起きたことの時・場所・方法を強調する","explain":"起きたこと自体は前提にして、「いつ・どこで・どうやって」を取り立てます。是は省けますが的は省けません。","contrast":"我去了上海 は行った事実、我是昨天去的上海 は「昨日」を強調します。","mistake":"これから起きることには使えません。","example":"我是坐高铁来的。","exPinyin":"Wǒ shì zuò gāotiě lái de.","exJa":"私は高鉄で来ました。","test":"私は先週上海に来ました。（「先週」を強調して）","answer":"我是上个星期来上海的。"},{"id":"d59-g2","name":"正在〜呢：進行","pinyin":"zhèngzài…ne","meaning":"ちょうど〜しているところだ","explain":"動作が進行中であることを表します。正在／在／正のいずれかを動詞の前に置き、文末に呢を添えることもあります。","contrast":"我看报告 は習慣や予定、我正在看报告呢 は今まさに進行中です。","mistake":"是・有・知道のような状態を表す語には使えません。","example":"我正在开会呢，等一下回你。","exPinyin":"Wǒ zhèngzài kāihuì ne, děng yíxià huí nǐ.","exJa":"いま会議中なので、あとで返します。","test":"彼はいま資料を整理しているところです。","answer":"他正在整理资料呢。"}]},{"day":60,"title":"Day 60｜HSK4 基礎強化","vocab":[{"id":"d60-v0","zh":"厨房","pinyin":"chúfáng","ja":"台所","example":"妈妈在厨房做饭。","exPinyin":"Mā ma zài chú fáng zuò fàn。","exJa":"母は台所で料理している。"},{"id":"d60-v1","zh":"客厅","pinyin":"kètīng","ja":"居間","example":"客厅很宽敞。","exPinyin":"Kè tīng hěn kuān chǎng。","exJa":"居間は広い。"},{"id":"d60-v2","zh":"家具","pinyin":"jiājù","ja":"家具","example":"这些家具很贵。","exPinyin":"Zhè xiē jiā jù hěn guì。","exJa":"これらの家具は高い。"},{"id":"d60-v3","zh":"沙发","pinyin":"shāfā","ja":"ソファ","example":"他坐在沙发上。","exPinyin":"Tā zuò zài shā fā shàng。","exJa":"彼はソファに座っている。"},{"id":"d60-v4","zh":"窗户","pinyin":"chuānghù","ja":"窓","example":"请打开窗户。","exPinyin":"Qǐng dǎ kāi chuāng hù。","exJa":"窓を開けてください。"}],"grammar":[{"id":"d60-g0","name":"V了＋時間量","pinyin":"le","meaning":"どのくらいの間〜したかを表す","explain":"動詞のすぐ後ろに了を置き、その後に時間の長さを置きます。文末にもう一つ了を足すと、今も続いていることを表します。","contrast":"我学了中文 は完了、我学了三年中文了 は三年続けて今も学んでいる、です。","mistake":"時間の長さを動詞の前に置かないこと。","example":"我学了三年中文了。","exPinyin":"Wǒ xué le sān nián Zhōngwén le.","exJa":"中国語を3年学んでいます。","test":"私は上海に8年住んでいます。","answer":"我在上海住了八年了。"},{"id":"d60-g1","name":"V了＋回数","pinyin":"cì / biàn","meaning":"何回〜したかを表す","explain":"動詞の後ろに回数を置きます。次は単なる回数、遍は最初から最後まで通した回数です。","contrast":"看了两次 は二回見た、看了两遍 は通して二回読んだ、が近いです。","mistake":"目的語が人称代名詞のときは、回数をその後ろに置きます（等了他两次）。","example":"这个报告我看了两遍。","exPinyin":"Zhège bàogào wǒ kàn le liǎng biàn.","exJa":"この報告書は2回通して読みました。","test":"この映画は3回見ました。","answer":"这个电影我看了三次。"},{"id":"d60-g2","name":"连〜也／都〜","pinyin":"lián…yě/dōu","meaning":"〜さえも〜","explain":"極端な例を挙げて「それすらそうだ」と示します。连の後ろに取り立てる語、後半に也か都を置きます。","contrast":"他不知道 は単なる否定、连他都不知道 は「彼でさえ知らない」という含みです。","mistake":"也／都を落とすと文になりません。","example":"他忙得连午饭都没吃。","exPinyin":"Tā máng de lián wǔfàn dōu méi chī.","exJa":"彼は忙しくて昼食さえ食べませんでした。","test":"この字は私でさえ書けません。","answer":"这个字连我也不会写。"}]},{"day":61,"title":"Day 61｜HSK4 基礎強化","vocab":[{"id":"d61-v0","zh":"镜子","pinyin":"jìngzi","ja":"鏡","example":"她在照镜子。","exPinyin":"Tā zài zhào jìng zi。","exJa":"彼女は鏡を見ている。"},{"id":"d61-v1","zh":"钥匙","pinyin":"yàoshi","ja":"鍵","example":"我找不到钥匙。","exPinyin":"Wǒ zhǎo bú dào yào shi。","exJa":"鍵が見つからない。"},{"id":"d61-v2","zh":"垃圾","pinyin":"lājī","ja":"ゴミ","example":"请把垃圾扔掉。","exPinyin":"Qǐng bǎ lā jī rēng diào。","exJa":"ゴミを捨ててください。"},{"id":"d61-v3","zh":"工具","pinyin":"gōngjù","ja":"道具","example":"这是修理工具。","exPinyin":"Zhè shì xiū lǐ gōng jù。","exJa":"これは修理道具だ。"},{"id":"d61-v4","zh":"毛巾","pinyin":"máojīn","ja":"タオル","example":"我需要一条毛巾。","exPinyin":"Wǒ xū yào yì tiáo máo jīn。","exJa":"タオルが一枚要る。"}],"grammar":[{"id":"d61-g0","name":"不是〜而是〜","pinyin":"búshì…érshì","meaning":"〜ではなく〜だ","explain":"前半で否定し、後半で正しいほうを示します。","contrast":"不是〜就是〜 は「〜かさもなくば〜」で、二つのうちどちらか、の意味になります。","mistake":"而是のかわりに但是を使わないこと。","example":"问题不是价格，而是时间。","exPinyin":"Wèntí búshì jiàgé, érshì shíjiān.","exJa":"問題は価格ではなく時間です。","test":"私が言いたいのは方法ではなく目的です。","answer":"我想说的不是方法，而是目的。"},{"id":"d61-g1","name":"跟〜一样","pinyin":"gēn…yíyàng","meaning":"〜と同じだ","explain":"跟（または和）＋比べる相手＋一样。後ろに形容詞を続けると「同じくらい〜だ」になります。","contrast":"比 は差を示し、跟〜一样 は等しいことを示します。","mistake":"否定は跟〜不一样で、不は一样の前に置きます。","example":"这个方法跟上次一样有效。","exPinyin":"Zhège fāngfǎ gēn shàng cì yíyàng yǒuxiào.","exJa":"この方法は前回と同じく有効です。","test":"彼の意見は私と同じです。","answer":"他的看法跟我一样。"},{"id":"d61-g2","name":"除了〜都〜","pinyin":"chúle…dōu","meaning":"〜以外はすべて〜","explain":"除了の後ろを例外として外し、残り全部を都で受けます。","contrast":"除了〜以外，还〜 は付け加える形、除了〜都〜 は取り除く形で、向きが逆です。","mistake":"还と都を取り違えると意味が反対になります。","example":"除了小王，大家都参加了。","exPinyin":"Chúle Xiǎo Wáng, dàjiā dōu cānjiā le.","exJa":"王さん以外は全員参加しました。","test":"日曜以外は毎日出勤します。","answer":"除了星期天，我每天都上班。"}]},{"day":62,"title":"Day 62｜HSK4 基礎強化","vocab":[{"id":"d62-v0","zh":"牙膏","pinyin":"yágāo","ja":"歯磨き粉","example":"牙膏用完了。","exPinyin":"Yá gāo yòng wán le。","exJa":"歯磨き粉を使い切った。"},{"id":"d62-v1","zh":"洗衣机","pinyin":"xǐyījī","ja":"洗濯機","example":"洗衣机坏了。","exPinyin":"Xǐ yī jī huài le。","exJa":"洗濯機が壊れた。"},{"id":"d62-v2","zh":"冰箱","pinyin":"bīngxiāng","ja":"冷蔵庫","example":"把牛奶放进冰箱。","exPinyin":"Bǎ niú nǎi fàng jìn bīng xiāng。","exJa":"牛乳を冷蔵庫に入れて。"},{"id":"d62-v3","zh":"空调","pinyin":"kōngtiáo","ja":"エアコン","example":"请打开空调。","exPinyin":"Qǐng dǎ kāi kōng tiáo。","exJa":"エアコンをつけて。"},{"id":"d62-v4","zh":"电梯","pinyin":"diàntī","ja":"エレベーター","example":"我们坐电梯上去。","exPinyin":"Wǒ men zuò diàn tī shàng qù。","exJa":"エレベーターで上がろう。"}],"grammar":[{"id":"d62-g0","name":"对于","pinyin":"duìyú","meaning":"〜について、〜に対して","explain":"話題を先に示すときに使い、文頭にも主語の後ろにも置けます。","contrast":"对我来说 は「私にとって」、对于这个问题 は「この問題について」で、指すものが違います。","mistake":"人に向けた動作（对他说）には对于を使いません。","example":"对于这个安排，我没有意见。","exPinyin":"Duìyú zhège ānpái, wǒ méiyǒu yìjiàn.","exJa":"この段取りについて、私は異議ありません。","test":"この件について、もう少し考えたいです。","answer":"对于这件事，我想再考虑一下。"},{"id":"d62-g1","name":"使：〜させる","pinyin":"shǐ","meaning":"ある状態を引き起こす","explain":"主に気持ちや状態の変化を引き起こすときに使う、書き言葉寄りの使役です。","contrast":"让 は人に何かをさせる指示寄り、使 は状態を引き起こす結果寄りです。","mistake":"話し言葉で人に頼むときは让を使います。","example":"这个结果使大家很失望。","exPinyin":"Zhège jiéguǒ shǐ dàjiā hěn shīwàng.","exJa":"この結果はみんなをがっかりさせました。","test":"この知らせは私をとても驚かせました。","answer":"这个消息使我很吃惊。"},{"id":"d62-g2","name":"叫／给：受け身","pinyin":"jiào / gěi","meaning":"〜される（話し言葉）","explain":"被と同じ受け身です。叫と让は動作をした人を必ず言い、给はより口語的です。","contrast":"被 は書き言葉でも使え、動作主を省けます。叫は省けません。","mistake":"叫の後ろの動作主を省略しないこと。","example":"我的伞叫人拿走了。","exPinyin":"Wǒ de sǎn jiào rén ná zǒu le.","exJa":"私の傘は誰かに持って行かれました。","test":"私の自転車は雨に濡れました。","answer":"我的自行车叫雨淋湿了。"}]},{"day":63,"title":"Day 63｜HSK4 基礎強化","vocab":[{"id":"d63-v0","zh":"房东","pinyin":"fángdōng","ja":"大家（おおや）","example":"房东人很好。","exPinyin":"Fáng dōng rén hěn hǎo。","exJa":"大家さんは親切だ。"},{"id":"d63-v1","zh":"租","pinyin":"zū","ja":"借りる・賃借","example":"我租了一间房子。","exPinyin":"Wǒ zū le yì jiān fáng zi。","exJa":"部屋を一つ借りた。"},{"id":"d63-v2","zh":"邻居","pinyin":"línjū","ja":"隣人","example":"我的邻居很友好。","exPinyin":"Wǒ de lín jū hěn yǒu hǎo。","exJa":"隣人は親切だ。"},{"id":"d63-v3","zh":"亲戚","pinyin":"qīnqi","ja":"親戚","example":"春节我去看亲戚。","exPinyin":"Chūn jié wǒ qù kàn qīn qi。","exJa":"春節に親戚を訪ねる。"},{"id":"d63-v4","zh":"顾客","pinyin":"gùkè","ja":"顧客","example":"这家店顾客很多。","exPinyin":"Zhè jiā diàn gù kè hěn duō。","exJa":"この店は客が多い。"}],"grammar":[{"id":"d63-g0","name":"难道〜吗","pinyin":"nándào…ma","meaning":"まさか〜ではないだろう（反語）","explain":"答えを求めず、驚きや納得のいかない気持ちを表します。文末に吗を伴うのが普通です。","contrast":"你不知道吗 は普通の確認、难道你不知道吗 は「知らないはずがない」という含みです。","mistake":"反語なので、はい／いいえで答える質問には使いません。","example":"难道这个问题没有别的办法吗？","exPinyin":"Nándào zhège wèntí méiyǒu bié de bànfǎ ma?","exJa":"まさかこの問題に他の方法がないのですか。","test":"まさか彼はまだ知らないのですか。","answer":"难道他还不知道吗？"},{"id":"d63-g1","name":"到底：問い詰める","pinyin":"dàodǐ","meaning":"いったい〜なのか","explain":"疑問文に置いて「はっきりさせたい」気持ちを加えます。","contrast":"你去吗 は可否の確認、你到底去不去 ははっきりさせたい追及です。","mistake":"到底と吗は一緒に使えません。疑問詞か反復疑問と組みます。","example":"你到底同意不同意？","exPinyin":"Nǐ dàodǐ tóngyì bu tóngyì?","exJa":"いったい賛成なのですか、反対なのですか。","test":"会議はいったい何時に始まるのですか。","answer":"会议到底几点开始？"},{"id":"d63-g2","name":"否则","pinyin":"fǒuzé","meaning":"そうでなければ","explain":"前の条件が満たされない場合にどうなるかを後ろで述べます。書き言葉寄りです。","contrast":"不然 はより口語的で、意味はほぼ同じです。","mistake":"否则の前は、指示や条件になる文にします。","example":"请按时提交，否则会影响进度。","exPinyin":"Qǐng ànshí tíjiāo, fǒuzé huì yǐngxiǎng jìndù.","exJa":"期限通りに提出してください、でないと進行に影響します。","test":"早めに出発しよう、でないと遅刻します。","answer":"我们早点儿出发吧，否则会迟到。"}]},{"day":64,"title":"Day 64｜HSK4 基礎強化","vocab":[{"id":"d64-v0","zh":"性别","pinyin":"xìngbié","ja":"性別","example":"请填写性别。","exPinyin":"Qǐng tián xiě xìng bié。","exJa":"性別を記入してください。"},{"id":"d64-v1","zh":"年龄","pinyin":"niánlíng","ja":"年齢","example":"他的年龄不大。","exPinyin":"Tā de nián líng bú dà。","exJa":"彼は年が若い。"},{"id":"d64-v2","zh":"样子","pinyin":"yàngzi","ja":"様子・格好","example":"他的样子很着急。","exPinyin":"Tā de yàng zi hěn zháo jí。","exJa":"彼は焦った様子だ。"},{"id":"d64-v3","zh":"帅","pinyin":"shuài","ja":"かっこいい","example":"这个演员很帅。","exPinyin":"Zhè ge yǎn yuán hěn shuài。","exJa":"この俳優はかっこいい。"},{"id":"d64-v4","zh":"美丽","pinyin":"měilì","ja":"美しい","example":"这是个美丽的城市。","exPinyin":"Zhè shì gè měi lì de chéng shì。","exJa":"美しい街だ。"}],"grammar":[{"id":"d64-g0","name":"稍微〜一点儿","pinyin":"shāowēi…yìdiǎnr","meaning":"少しだけ〜","explain":"稍微の後ろに形容詞や動詞を置き、一点儿や一些で受けます。","contrast":"有点儿 は不満を含む「少し〜だ」、稍微〜一点儿 は依頼や調整に使えます。","mistake":"稍微だけで終わらせず、一点儿などで受けます。","example":"请稍微说慢一点儿。","exPinyin":"Qǐng shāowēi shuō màn yìdiǎnr.","exJa":"少しゆっくり話してください。","test":"少し早めに来てもらえますか。","answer":"你能稍微早一点儿来吗？"},{"id":"d64-g1","name":"最好","pinyin":"zuìhǎo","meaning":"〜したほうがいい","explain":"勧めや助言をやわらかく述べます。否定は最好别です。","contrast":"应该 は義務寄り、最好 は「そのほうが望ましい」という提案です。","mistake":"「いちばん良い」の意味だけで覚えないこと。助言で使うことが多いです。","example":"你最好提前跟他确认一下。","exPinyin":"Nǐ zuìhǎo tíqián gēn tā quèrèn yíxià.","exJa":"事前に彼に確認したほうがいいですよ。","test":"明日は早めに出発したほうがいいです。","answer":"明天最好早点儿出发。"},{"id":"d64-g2","name":"不如","pinyin":"bùrú","meaning":"〜には及ばない／〜したほうがましだ","explain":"A不如B で「AはBに及ばない」。後ろに動詞句を続けると提案になります。","contrast":"没有〜那么〜 も比較の否定ですが、不如 は提案にも使えます。","mistake":"比べる相手を不如の後ろに置きます。順序を逆にしないこと。","example":"坐地铁不如走路快。","exPinyin":"Zuò dìtiě bùrú zǒulù kuài.","exJa":"地下鉄より歩いたほうが速いです。","test":"電話するより直接会ったほうがいいです。","answer":"打电话不如直接见面。"}]},{"day":65,"title":"Day 65｜HSK4 基礎強化","vocab":[{"id":"d65-v0","zh":"害羞","pinyin":"hàixiū","ja":"恥ずかしがる","example":"她有点害羞。","exPinyin":"Tā yǒu diǎn hài xiū。","exJa":"彼女は少し恥ずかしがり屋だ。"},{"id":"d65-v1","zh":"热情","pinyin":"rèqíng","ja":"親切・熱心","example":"服务员很热情。","exPinyin":"Fú wù yuán hěn rè qíng。","exJa":"店員は親切だ。"},{"id":"d65-v2","zh":"冷静","pinyin":"lěngjìng","ja":"冷静","example":"请保持冷静。","exPinyin":"Qǐng bǎo chí lěng jìng。","exJa":"冷静さを保って。"},{"id":"d65-v3","zh":"大方","pinyin":"dàfāng","ja":"気前が良い・上品","example":"他很大方。","exPinyin":"Tā hěn dà fāng。","exJa":"彼は気前が良い。"},{"id":"d65-v4","zh":"友谊","pinyin":"yǒuyì","ja":"友情","example":"我们的友谊很深。","exPinyin":"Wǒ men de yǒu yì hěn shēn。","exJa":"私たちの友情は深い。"}],"grammar":[{"id":"d65-g0","name":"于是","pinyin":"yúshì","meaning":"そこで、それで","explain":"前の出来事を受けて、続けて起こした行動を述べます。","contrast":"所以 は理由とその結果、于是 は時間の流れに沿った次の行動です。","mistake":"因为と組にするのは所以で、于是ではありません。","example":"地铁停了，于是我们打车去了。","exPinyin":"Dìtiě tíng le, yúshì wǒmen dǎchē qù le.","exJa":"地下鉄が止まったので、タクシーで行きました。","test":"雨が降ってきたので、私たちは予定を変えました。","answer":"下雨了，于是我们改变了计划。"},{"id":"d65-g1","name":"并且","pinyin":"bìngqiě","meaning":"しかも、そのうえ","explain":"前の内容に、同じ方向の内容を足します。書き言葉でよく使います。","contrast":"而且 は口語でも広く使い、并且 はやや硬い言い方です。","mistake":"逆の内容を足すときは但是を使います。","example":"这个方案成本低，并且容易执行。","exPinyin":"Zhège fāng'àn chéngběn dī, bìngqiě róngyì zhíxíng.","exJa":"この案はコストが低く、しかも実行しやすいです。","test":"彼は中国語ができ、しかも日本語も話せます。","answer":"他会说中文，并且也会说日语。"},{"id":"d65-g2","name":"其中","pinyin":"qízhōng","meaning":"そのうちの","explain":"前に出た集合を受けて「そのうち」と部分を取り出します。","contrast":"里面 は場所寄り、其中 は数や集合の内訳に使います。","mistake":"其中の前に、集合を示す文が必要です。","example":"我们有五个方案，其中两个已经通过了。","exPinyin":"Wǒmen yǒu wǔ ge fāng'àn, qízhōng liǎng ge yǐjīng tōngguò le.","exJa":"案が5つあり、そのうち2つはすでに通っています。","test":"参加者は30人で、そのうち10人は新人です。","answer":"参加的有三十个人，其中十个是新人。"}]},{"day":66,"title":"Day 66｜HSK4 基礎強化","vocab":[{"id":"d66-v0","zh":"愉快","pinyin":"yúkuài","ja":"楽しい","example":"祝你旅途愉快。","exPinyin":"Zhù nǐ lǚ tú yú kuài。","exJa":"楽しい旅を。"},{"id":"d66-v1","zh":"开心","pinyin":"kāixīn","ja":"嬉しい","example":"今天我很开心。","exPinyin":"Jīn tiān wǒ hěn kāi xīn。","exJa":"今日は嬉しい。"},{"id":"d66-v2","zh":"幸福","pinyin":"xìngfú","ja":"幸せ","example":"他们生活很幸福。","exPinyin":"Tā men shēng huó hěn xìng fú。","exJa":"彼らは幸せに暮らしている。"},{"id":"d66-v3","zh":"着急","pinyin":"zháojí","ja":"焦る","example":"别着急，慢慢来。","exPinyin":"Bié zháo jí， màn màn lái。","exJa":"焦らず、ゆっくり。"},{"id":"d66-v4","zh":"烦恼","pinyin":"fánnǎo","ja":"悩み","example":"他有很多烦恼。","exPinyin":"Tā yǒu hěn duō fán nǎo。","exJa":"彼には悩みが多い。"}],"grammar":[{"id":"d66-g0","name":"任何","pinyin":"rènhé","meaning":"どんな〜も","explain":"名詞の前に置き、後ろに都や也を伴って全肯定や全否定にします。","contrast":"什么 は疑問にも任指にも使え、任何 は書き言葉寄りの硬い言い方です。","mistake":"任何の後ろに量詞は要りません。","example":"有任何问题都可以随时联系我。","exPinyin":"Yǒu rènhé wèntí dōu kěyǐ suíshí liánxì wǒ.","exJa":"どんな問題でもいつでも連絡してください。","test":"どんな理由でも遅刻はできません。","answer":"任何理由都不能迟到。"},{"id":"d66-g1","name":"谁都／什么都〜","pinyin":"shéi dōu / shénme dōu","meaning":"誰でも／何でも〜、誰も／何も〜ない","explain":"疑問詞に都や也を続けると「すべて」を表します。否定と組めば全否定になります。","contrast":"谁知道？ は疑問、谁都知道 は「誰でも知っている」です。","mistake":"都／也を落とすと疑問文に読まれます。","example":"这个道理谁都懂。","exPinyin":"Zhège dàolǐ shéi dōu dǒng.","exJa":"この道理は誰でも分かります。","test":"今日は何も食べたくありません。","answer":"我今天什么都不想吃。"},{"id":"d66-g2","name":"是不是／V不V","pinyin":"shì bu shì","meaning":"〜かどうか（反復疑問）","explain":"肯定形と否定形を並べて疑問にします。","contrast":"你去吗 は単純な質問、你去不去 は選ばせる問い方で、少し直接的です。","mistake":"吗と一緒には使えません。","example":"你是不是已经发邮件了？","exPinyin":"Nǐ shì bu shì yǐjīng fā yóujiàn le?","exJa":"もうメールを送りましたか。","test":"明日の会議に参加しますか。","answer":"你参不参加明天的会议？"}]},{"day":67,"title":"Day 67｜HSK4 基礎強化","vocab":[{"id":"d67-v0","zh":"失败","pinyin":"shībài","ja":"失敗する","example":"失败是成功之母。","exPinyin":"Shī bài shì chéng gōng zhī mǔ。","exJa":"失敗は成功のもと。"},{"id":"d67-v1","zh":"成功","pinyin":"chénggōng","ja":"成功する","example":"他终于成功了。","exPinyin":"Tā zhōng yú chéng gōng le。","exJa":"彼はついに成功した。"},{"id":"d67-v2","zh":"倒霉","pinyin":"dǎoméi","ja":"運が悪い","example":"今天真倒霉。","exPinyin":"Jīn tiān zhēn dǎo méi。","exJa":"今日はついてない。"},{"id":"d67-v3","zh":"遗憾","pinyin":"yíhàn","ja":"残念","example":"很遗憾你不能来。","exPinyin":"Hěn yí hàn nǐ bù néng lái。","exJa":"来られなくて残念。"},{"id":"d67-v4","zh":"可惜","pinyin":"kěxī","ja":"惜しい","example":"太可惜了。","exPinyin":"Tài kě xī le。","exJa":"実に惜しい。"}],"grammar":[{"id":"d67-g0","name":"動詞＋人＋物：二重目的語","pinyin":"gěi / jiāo / wèn","meaning":"〜に〜を〜する","explain":"给・送・教・问などは、人と物を続けて二つ取れます。","contrast":"我给他一本书 は二重目的語、我把书给他 は把構文で、処理の焦点が違います。","mistake":"人と物の順序を入れ替えないこと。","example":"经理给了我一个新任务。","exPinyin":"Jīnglǐ gěi le wǒ yí ge xīn rènwù.","exJa":"部長は私に新しい仕事をくれました。","test":"先生は私たちに中国語を教えています。","answer":"老师教我们中文。"},{"id":"d67-g1","name":"离合词：帮忙・见面・请假","pinyin":"bāngmáng / jiànmiàn / qǐngjià","meaning":"2字で1語だが、間に語を挟める動詞","explain":"帮忙・见面・请假などはもともと動詞＋目的語なので、後ろにさらに目的語を置けません。数量や修飾語は間に挟みます。","contrast":"帮我一个忙 とは言えますが、帮忙我 とは言えません。","mistake":"见面他 ではなく 跟他见面 とします。","example":"我想请两天假。","exPinyin":"Wǒ xiǎng qǐng liǎng tiān jià.","exJa":"2日間休みを取りたいです。","test":"明日彼と会いたいです。","answer":"我想明天跟他见面。"},{"id":"d67-g2","name":"V出来：見分ける","pinyin":"chūlái","meaning":"〜して分かる、見分けがつく","explain":"看・听・尝などの後ろに出来を付けて、識別できたことを表します。","contrast":"看懂 は内容が分かる、看出来 は違いや正体に気づく、が近いです。","mistake":"可能形は看得出来／看不出来です。","example":"我听出来他有点儿不高兴。","exPinyin":"Wǒ tīng chūlái tā yǒudiǎnr bù gāoxìng.","exJa":"彼が少し不機嫌なのが聞いて分かりました。","test":"この2つの違いが見分けられません。","answer":"这两个的区别我看不出来。"}]},{"day":68,"title":"Day 68｜HSK4 基礎強化","vocab":[{"id":"d68-v0","zh":"想念","pinyin":"xiǎngniàn","ja":"恋しく思う","example":"我很想念家人。","exPinyin":"Wǒ hěn xiǎng niàn jiā rén。","exJa":"家族が恋しい。"},{"id":"d68-v1","zh":"无聊","pinyin":"wúliáo","ja":"退屈","example":"这部电影很无聊。","exPinyin":"Zhè bù diàn yǐng hěn wú liáo。","exJa":"この映画は退屈だ。"},{"id":"d68-v2","zh":"奇怪","pinyin":"qíguài","ja":"不思議・変だ","example":"这件事很奇怪。","exPinyin":"Zhè jiàn shì hěn qí guài。","exJa":"この件は変だ。"},{"id":"d68-v3","zh":"厉害","pinyin":"lìhài","ja":"すごい・ひどい","example":"他汉语说得很厉害。","exPinyin":"Tā hàn yǔ shuō dé hěn lì hài。","exJa":"彼は中国語がすごく上手い。"},{"id":"d68-v4","zh":"可怜","pinyin":"kělián","ja":"かわいそう","example":"这只小狗很可怜。","exPinyin":"Zhè zhī xiǎo gǒu hěn kě lián。","exJa":"この子犬はかわいそうだ。"}],"grammar":[{"id":"d68-g0","name":"比〜＋形容詞＋得多","pinyin":"bǐ…de duō","meaning":"〜よりずっと〜だ","explain":"比較文の形容詞の後ろに得多・多了・一点儿・一些を置いて、差の大きさを示します。","contrast":"比〜好 は差の大きさを言わず、比〜好得多 は差が大きいことを示します。","mistake":"比〜很好 とは言えません。很は比較文に使えません。","example":"今年的成绩比去年好得多。","exPinyin":"Jīnnián de chéngjì bǐ qùnián hǎo de duō.","exJa":"今年の成績は去年よりずっと良いです。","test":"高鉄は飛行機よりずっと便利です。","answer":"高铁比飞机方便得多。"},{"id":"d68-g1","name":"有时候〜有时候〜","pinyin":"yǒu shíhou…yǒu shíhou","meaning":"〜のときもあれば〜のときもある","explain":"二つの場合を並べて、時によって変わることを示します。","contrast":"有的〜有的〜 はものを分けて言い、有时候〜有时候〜 は時で分けます。","mistake":"偶尔 は「たまに」で頻度が低い場合。対になる二つを並べるときは有时候を使います。","example":"我有时候坐地铁，有时候打车。","exPinyin":"Wǒ yǒu shíhou zuò dìtiě, yǒu shíhou dǎchē.","exJa":"地下鉄のときもあれば、タクシーのときもあります。","test":"昼は外で食べるときも、自分で作るときもあります。","answer":"中午我有时候在外面吃，有时候自己做。"},{"id":"d68-g2","name":"既〜又〜","pinyin":"jì…yòu","meaning":"〜であり、そのうえ〜だ","explain":"同じ方向の性質を二つ並べます。書き言葉でもよく使います。","contrast":"又〜又〜 は口語的、既〜又〜 はやや硬い言い方です。","mistake":"反対の性質を並べるときは虽然〜但是〜を使います。","example":"这个方法既省钱又省时间。","exPinyin":"Zhège fāngfǎ jì shěng qián yòu shěng shíjiān.","exJa":"この方法はお金も時間も節約できます。","test":"この店は安くて、しかも静かです。","answer":"这家店既便宜又安静。"}]},{"day":69,"title":"Day 69｜HSK4 基礎強化","vocab":[{"id":"d69-v0","zh":"然而","pinyin":"ránér","ja":"しかし","example":"我想去，然而没时间。","exPinyin":"Wǒ xiǎng qù， rán ér méi shí jiān。","exJa":"行きたいが、時間がない。"},{"id":"d69-v1","zh":"不仅","pinyin":"bùjǐn","ja":"…だけでなく","example":"他不仅聪明，而且努力。","exPinyin":"Tā bù jǐn cōng ming， ér qiě nǔ lì。","exJa":"彼は賢いだけでなく努力家だ。"},{"id":"d69-v2","zh":"既然","pinyin":"jìrán","ja":"…である以上","example":"既然来了，就好好玩。","exPinyin":"Jì rán lái le， jiù hǎo hǎo wán。","exJa":"来たからにはしっかり楽しもう。"},{"id":"d69-v3","zh":"即使","pinyin":"jíshǐ","ja":"たとえ…でも","example":"即使下雨我也去。","exPinyin":"Jí shǐ xià yǔ wǒ yě qù。","exJa":"たとえ雨でも行く。"},{"id":"d69-v4","zh":"万一","pinyin":"wànyī","ja":"万一","example":"万一迟到怎么办？","exPinyin":"Wàn yī chí dào zěn me bàn？","exJa":"万一遅れたらどうする？"}],"grammar":[{"id":"d69-g0","name":"来得及／来不及","pinyin":"láidejí / láibují","meaning":"間に合う／間に合わない","explain":"時間的に間に合うかどうかを表します。後ろに動詞を続けられます。","contrast":"赶得上 は乗り物などに追いつく、来得及 は時間の余裕を言います。","mistake":"否定は不来得及ではなく来不及です。","example":"现在出发还来得及。","exPinyin":"Xiànzài chūfā hái láidejí.","exJa":"いま出発すればまだ間に合います。","test":"もう間に合わないので、次の便にしましょう。","answer":"已经来不及了，我们坐下一班吧。"},{"id":"d69-g1","name":"受不了","pinyin":"shòubuliǎo","meaning":"我慢できない、耐えられない","explain":"体力や気持ちが限界を超えていることを表します。肯定は受得了です。","contrast":"不喜欢 は好みの問題、受不了 は限界を超えている状態です。","mistake":"受不了の後ろには、耐えられない対象を置きます。","example":"上海的夏天我有点儿受不了。","exPinyin":"Shànghǎi de xiàtiān wǒ yǒudiǎnr shòubuliǎo.","exJa":"上海の夏は少し耐えられません。","test":"この暑さはもう耐えられません。","answer":"这么热我真的受不了了。"},{"id":"d69-g2","name":"只好","pinyin":"zhǐhǎo","meaning":"〜するしかない","explain":"ほかに方法がなく、やむを得ずそうすることを表します。","contrast":"只能 は能力や条件の限界、只好 は仕方なくという気持ちが強く出ます。","mistake":"進んで選んだ場合には使いません。","example":"地铁停了，我们只好打车。","exPinyin":"Dìtiě tíng le, wǒmen zhǐhǎo dǎchē.","exJa":"地下鉄が止まったので、タクシーにするしかありませんでした。","test":"資料が間に合わず、会議を延期するしかありませんでした。","answer":"资料没准备好，我们只好推迟会议。"}]},{"day":70,"title":"Day 70｜HSK4 基礎強化","vocab":[{"id":"d70-v0","zh":"总之","pinyin":"zǒngzhī","ja":"要するに","example":"总之，我同意。","exPinyin":"Zǒng zhī， wǒ tóng yì。","exJa":"要するに、賛成だ。"},{"id":"d70-v1","zh":"反正","pinyin":"fǎnzhèng","ja":"どうせ","example":"反正都一样。","exPinyin":"Fǎn zhèng dōu yí yàng。","exJa":"どうせ同じだ。"},{"id":"d70-v2","zh":"难怪","pinyin":"nánguài","ja":"道理で","example":"难怪他这么累。","exPinyin":"Nán guài tā zhè me lèi。","exJa":"道理で彼は疲れている。"},{"id":"d70-v3","zh":"难道","pinyin":"nándào","ja":"まさか…ではあるまい","example":"难道你忘了？","exPinyin":"Nán dào nǐ wàng le？","exJa":"まさか忘れたの？"},{"id":"d70-v4","zh":"千万","pinyin":"qiānwàn","ja":"くれぐれも","example":"你千万别迟到。","exPinyin":"Nǐ qiān wàn bié chí dào。","exJa":"くれぐれも遅れないで。"}],"grammar":[{"id":"d70-g0","name":"也就是说","pinyin":"yě jiù shì shuō","meaning":"つまり、言い換えると","explain":"前の内容を、分かりやすく言い直します。","contrast":"总之 は話をまとめる、也就是说 は同じ内容を言い換える、です。","mistake":"新しい情報を足すときには使いません。","example":"他明天出差，也就是说会议他参加不了。","exPinyin":"Tā míngtiān chūchāi, yě jiù shì shuō huìyì tā cānjiā bu liǎo.","exJa":"彼は明日出張です。つまり会議には出られません。","test":"資料は明日届きます。つまり今日は確認できません。","answer":"资料明天到，也就是说今天不能确认。"},{"id":"d70-g1","name":"在我看来","pinyin":"zài wǒ kànlái","meaning":"私の見たところでは","explain":"自分の見方であることを先に示してから意見を述べます。","contrast":"我觉得 は日常的、在我看来 は改まった場でも使いやすい言い方です。","mistake":"事実を述べるときには付けません。","example":"在我看来，这个价格还可以接受。","exPinyin":"Zài wǒ kànlái, zhège jiàgé hái kěyǐ jiēshòu.","exJa":"私の見たところ、この価格はまだ受け入れられます。","test":"私の見たところ、この計画は少し急ぎすぎです。","answer":"在我看来，这个计划有点儿急。"},{"id":"d70-g2","name":"正好","pinyin":"zhènghǎo","meaning":"ちょうど、都合よく","explain":"時間・数量・タイミングがぴったり合うことを表します。","contrast":"刚好 とほぼ同じ意味で、正好 のほうがやや書き言葉寄りです。","mistake":"偶然そうなった場合に使い、意図して合わせた場合には使いません。","example":"我正好也要去那边，一起走吧。","exPinyin":"Wǒ zhènghǎo yě yào qù nàbiān, yìqǐ zǒu ba.","exJa":"ちょうど私もそちらへ行くので、一緒に行きましょう。","test":"ちょうど時間があるので、今すぐ確認します。","answer":"我正好有时间，现在就确认。"}]},{"day":71,"title":"Day 71｜HSK4 基礎強化","vocab":[{"id":"d71-v0","zh":"到底","pinyin":"dàodǐ","ja":"一体・結局","example":"你到底想说什么？","exPinyin":"Nǐ dào dǐ xiǎng shuō shén me？","exJa":"一体何が言いたいの？"},{"id":"d71-v1","zh":"至少","pinyin":"zhìshǎo","ja":"少なくとも","example":"至少要等一小时。","exPinyin":"Zhì shǎo yào děng yì xiǎo shí。","exJa":"少なくとも1時間待つ。"},{"id":"d71-v2","zh":"仍然","pinyin":"réngrán","ja":"依然として","example":"他仍然没来。","exPinyin":"Tā réng rán méi lái。","exJa":"彼は依然来ていない。"},{"id":"d71-v3","zh":"偶尔","pinyin":"ǒuěr","ja":"たまに","example":"我偶尔去看电影。","exPinyin":"Wǒ ǒu ěr qù kàn diàn yǐng。","exJa":"たまに映画を見に行く。"},{"id":"d71-v4","zh":"重新","pinyin":"chóngxīn","ja":"改めて","example":"请重新写一遍。","exPinyin":"Qǐng chóng xīn xiě yí biàn。","exJa":"書き直してください。"}],"grammar":[{"id":"d71-g0","name":"〜以上／〜以下","pinyin":"yǐshàng / yǐxià","meaning":"〜以上／〜以下","explain":"数量の後ろに置いて範囲を示します。以上はその数を含みます。","contrast":"超过 はその数を超える、以上 はその数を含む点が違います。","mistake":"数字の前ではなく後ろに置きます。","example":"参加的人在五十人以上。","exPinyin":"Cānjiā de rén zài wǔshí rén yǐshàng.","exJa":"参加者は50人以上です。","test":"3年以上の経験が必要です。","answer":"需要三年以上的经验。"},{"id":"d71-g1","name":"会：習って身につけた能力","pinyin":"huì","meaning":"〜できる（習得して）","explain":"学んで身につけた技能に使います。「〜だろう」と可能性を表す会とは別の用法です。","contrast":"能 は条件が整ってできる、会 は習得してできる、です。","mistake":"力があってできるかどうかは能を使います（我能搬）。","example":"我会说一点儿中文。","exPinyin":"Wǒ huì shuō yìdiǎnr Zhōngwén.","exJa":"中国語が少し話せます。","test":"彼はピアノが弾けます。","answer":"他会弹钢琴。"},{"id":"d71-g2","name":"愿意","pinyin":"yuànyì","meaning":"進んで〜する、〜してもよいと思う","explain":"気持ちとして受け入れる、進んでやる意思を表します。","contrast":"想 は願望、愿意 は「やってもいい」という承諾寄りです。","mistake":"否定は不愿意です。","example":"我愿意帮你看一下资料。","exPinyin":"Wǒ yuànyì bāng nǐ kàn yíxià zīliào.","exJa":"喜んで資料を見ますよ。","test":"彼はこの仕事を引き受けたがっていません。","answer":"他不愿意做这个工作。"}]},{"day":72,"title":"Day 72｜HSK4 基礎強化","vocab":[{"id":"d72-v0","zh":"互相","pinyin":"hùxiāng","ja":"互いに","example":"我们互相帮助。","exPinyin":"Wǒ men hù xiāng bāng zhù。","exJa":"私たちは助け合う。"},{"id":"d72-v1","zh":"亲自","pinyin":"qīnzì","ja":"自ら","example":"他亲自来道歉。","exPinyin":"Tā qīn zì lái dào qiàn。","exJa":"彼は自ら謝りに来た。"},{"id":"d72-v2","zh":"故意","pinyin":"gùyì","ja":"わざと","example":"我不是故意的。","exPinyin":"Wǒ bú shì gù yì de。","exJa":"わざとじゃない。"},{"id":"d72-v3","zh":"专门","pinyin":"zhuānmén","ja":"専ら・わざわざ","example":"他专门来看你。","exPinyin":"Tā zhuān mén lái kàn nǐ。","exJa":"彼はわざわざ会いに来た。"},{"id":"d72-v4","zh":"顺便","pinyin":"shùnbiàn","ja":"ついでに","example":"顺便买点东西。","exPinyin":"Shùn biàn mǎi diǎn dōng xī。","exJa":"ついでに買い物する。"}],"grammar":[{"id":"d72-g0","name":"随便","pinyin":"suíbiàn","meaning":"自由に、何でもいい","explain":"相手に選ばせるときや、こだわらないことを示すときに使います。","contrast":"都可以 は「どれでも良い」、随便 は相手に任せる気持ちが強い言い方です。","mistake":"目上に対しては失礼になることがあるので、您决定吧 などに言い換えます。","example":"你随便坐，别客气。","exPinyin":"Nǐ suíbiàn zuò, bié kèqi.","exJa":"どうぞご自由に座ってください。","test":"何を食べるかは何でもいいです。","answer":"吃什么都行，我随便。"},{"id":"d72-g1","name":"是否","pinyin":"shìfǒu","meaning":"〜かどうか（書き言葉）","explain":"是不是の書き言葉です。メールや報告書でよく使います。","contrast":"是不是 は話し言葉、是否 は文書向けです。","mistake":"是否と吗は一緒に使えません。","example":"请确认是否收到这封邮件。","exPinyin":"Qǐng quèrèn shìfǒu shōudào zhè fēng yóujiàn.","exJa":"このメールを受け取ったかどうかご確認ください。","test":"参加できるかどうか、明日お知らせします。","answer":"我明天告诉你是否能参加。"},{"id":"d72-g2","name":"同时","pinyin":"tóngshí","meaning":"同時に、それと同時に","explain":"二つのことが同じ時に起きること、また話を並べて足すときに使います。","contrast":"一边〜一边〜 は一人が同時にする動作、同时 は出来事や話を並べます。","mistake":"短い動作の同時進行は一边〜一边〜のほうが自然です。","example":"我们要提高质量，同时也要控制成本。","exPinyin":"Wǒmen yào tígāo zhìliàng, tóngshí yě yào kòngzhì chéngběn.","exJa":"品質を上げると同時に、コストも抑える必要があります。","test":"時間を決めると同時に、場所も決めましょう。","answer":"我们决定时间，同时也决定地点。"}]},{"day":73,"title":"Day 73｜HSK4 基礎強化","vocab":[{"id":"d73-v0","zh":"取","pinyin":"qǔ","ja":"受け取る・引き出す","example":"我去银行取钱。","exPinyin":"Wǒ qù yín háng qǔ qián。","exJa":"銀行へお金を下ろしに行く。"},{"id":"d73-v1","zh":"存","pinyin":"cún","ja":"預ける・蓄える","example":"我想存钱。","exPinyin":"Wǒ xiǎng cún qián。","exJa":"お金を貯めたい。"},{"id":"d73-v2","zh":"寄","pinyin":"jì","ja":"郵送する","example":"我要寄一封信。","exPinyin":"Wǒ yào jì yì fēng xìn。","exJa":"手紙を出したい。"},{"id":"d73-v3","zh":"扔","pinyin":"rēng","ja":"捨てる・投げる","example":"别乱扔垃圾。","exPinyin":"Bié luàn rēng lā jī。","exJa":"ゴミをポイ捨てするな。"},{"id":"d73-v4","zh":"丢","pinyin":"diū","ja":"なくす","example":"我丢了钱包。","exPinyin":"Wǒ diū le qián bāo。","exJa":"財布をなくした。"}],"grammar":[{"id":"d73-g0","name":"不得不","pinyin":"bùdébù","meaning":"〜せざるを得ない","explain":"事情があってやむを得ずそうすることを表します。二重否定で強い必要を示します。","contrast":"只好 は仕方なさの気持ち、不得不 は外の事情に迫られた感じが強いです。","mistake":"不得不の後ろは動詞句です。名詞は置けません。","example":"因为下雨，我们不得不推迟活动。","exPinyin":"Yīnwèi xiàyǔ, wǒmen bùdébù tuīchí huódòng.","exJa":"雨のため、イベントを延期せざるを得ませんでした。","test":"体調が悪く、休みを取らざるを得ませんでした。","answer":"身体不舒服，我不得不请假。"},{"id":"d73-g1","name":"结果：ところが","pinyin":"jiéguǒ","meaning":"その結果、〜となった","explain":"前の行動を受けて、実際にどうなったかを述べます。思っていたのと違う結果にもよく使います。","contrast":"所以 は理由から導かれる当然の結果、结果 は実際にどうなったかの報告です。","mistake":"名詞の「結果」と同じ形なので、文の中の位置で見分けます。","example":"我提前出发了，结果还是迟到了。","exPinyin":"Wǒ tíqián chūfā le, jiéguǒ háishi chídào le.","exJa":"早めに出発したのに、結局遅刻しました。","test":"1時間並んだのに、結局買えませんでした。","answer":"我排了一个小时队，结果没买到。"},{"id":"d73-g2","name":"关键是","pinyin":"guānjiàn shì","meaning":"肝心なのは〜だ","explain":"いくつかある中で、決め手になる点を取り出して示します。","contrast":"主要是 は主な理由、关键是 は決め手になる点です。","mistake":"关键は名詞なので、是を落とさないようにします。","example":"关键是我们没有足够的时间。","exPinyin":"Guānjiàn shì wǒmen méiyǒu zúgòu de shíjiān.","exJa":"肝心なのは、私たちに十分な時間がないことです。","test":"肝心なのは、毎日続けられるかどうかです。","answer":"关键是能不能每天坚持。"}]},{"day":74,"title":"Day 74｜HSK4 基礎強化","vocab":[{"id":"d74-v0","zh":"抬","pinyin":"tái","ja":"持ち上げる","example":"我们一起抬桌子。","exPinyin":"Wǒ men yì qǐ tái zhuō zi。","exJa":"一緒に机を運ぼう。"},{"id":"d74-v1","zh":"推","pinyin":"tuī","ja":"押す","example":"请推门进来。","exPinyin":"Qǐng tuī mén jìn lái。","exJa":"ドアを押して入って。"},{"id":"d74-v2","zh":"拉","pinyin":"lā","ja":"引く","example":"用力拉绳子。","exPinyin":"Yòng lì lā shéng zi。","exJa":"力を入れて綱を引く。"},{"id":"d74-v3","zh":"挂","pinyin":"guà","ja":"掛ける","example":"把画挂在墙上。","exPinyin":"Bǎ huà guà zài qiáng shàng。","exJa":"絵を壁に掛ける。"},{"id":"d74-v4","zh":"擦","pinyin":"cā","ja":"拭く","example":"请擦一下桌子。","exPinyin":"Qǐng cā yí xià zhuō zi。","exJa":"机を拭いて。"}],"grammar":[{"id":"d74-g0","name":"以为","pinyin":"yǐwéi","meaning":"〜だと思っていた（実際は違った）","explain":"思い込みが事実と違っていたときに使います。","contrast":"认为 は今の判断、以为 は間違っていた思い込みです。","mistake":"正しい判断を述べるときは认为や觉得を使います。","example":"我以为今天不上班。","exPinyin":"Wǒ yǐwéi jīntiān bú shàngbān.","exJa":"今日は仕事がないと思っていました。","test":"彼はもう知っていると思っていました。","answer":"我以为他已经知道了。"},{"id":"d74-g1","name":"恐怕","pinyin":"kǒngpà","meaning":"おそらく〜だろう（よくない見込み）","explain":"好ましくない可能性を控えめに述べます。断るときの前置きにも使います。","contrast":"也许 は中立の推量、恐怕 は好ましくない見込みに偏ります。","mistake":"良い見込みには使いません。","example":"今天恐怕来不及了。","exPinyin":"Jīntiān kǒngpà láibují le.","exJa":"今日はおそらく間に合いません。","test":"明日はおそらく参加できません。","answer":"明天我恐怕不能参加。"},{"id":"d74-g2","name":"首先〜其次〜","pinyin":"shǒuxiān…qícì","meaning":"まず〜、次に〜","explain":"順序立てて理由や手順を並べます。最後は最后で締めます。","contrast":"先〜再〜 は動作の順番、首先〜其次〜 は説明の順序です。","mistake":"其次は二番目に使い、三番目以降は再次や最后にします。","example":"首先要确认时间，其次要准备资料。","exPinyin":"Shǒuxiān yào quèrèn shíjiān, qícì yào zhǔnbèi zīliào.","exJa":"まず時間を確認し、次に資料を準備します。","test":"まず原因を調べ、次に方法を考えましょう。","answer":"首先调查原因，其次考虑方法。"}]},{"day":75,"title":"Day 75｜HSK4 基礎強化","vocab":[{"id":"d75-v0","zh":"敲","pinyin":"qiāo","ja":"叩く","example":"有人在敲门。","exPinyin":"Yǒu rén zài qiāo mén。","exJa":"誰かがドアをノックしている。"},{"id":"d75-v1","zh":"抱","pinyin":"bào","ja":"抱く","example":"妈妈抱着孩子。","exPinyin":"Mā ma bào zhe hái zi。","exJa":"母は子を抱いている。"},{"id":"d75-v2","zh":"摇","pinyin":"yáo","ja":"揺らす・振る","example":"他摇了摇头。","exPinyin":"Tā yáo le yáo tóu。","exJa":"彼は首を振った。"},{"id":"d75-v3","zh":"弹钢琴","pinyin":"tángāngqín","ja":"ピアノを弾く","example":"她会弹钢琴。","exPinyin":"Tā huì tán gāng qín。","exJa":"彼女はピアノが弾ける。"},{"id":"d75-v4","zh":"散步","pinyin":"sànbù","ja":"散歩する","example":"晚饭后我去散步。","exPinyin":"Wǎn fàn hòu wǒ qù sàn bù。","exJa":"夕食後に散歩する。"},{"id":"d75-v5","zh":"打招呼","pinyin":"dǎ zhāohu","ja":"あいさつする、声をかける","example":"在公司遇到同事要主动打招呼。","exPinyin":"Zài gōngsī yùdào tóngshì yào zhǔdòng dǎ zhāohu.","exJa":"会社で同僚に会ったら自分から声をかけましょう。"},{"id":"d75-v6","zh":"打扰","pinyin":"dǎrǎo","ja":"邪魔をする、手を止めさせる","example":"打扰一下，我想问个问题。","exPinyin":"Dǎrǎo yíxià, wǒ xiǎng wèn ge wèntí.","exJa":"少しお邪魔します、質問があります。"},{"id":"d75-v7","zh":"提","pinyin":"tí","ja":"（話を）持ち出す、提げる","example":"这件事他昨天提过一次。","exPinyin":"Zhè jiàn shì tā zuótiān tí guo yí cì.","exJa":"この件は彼が昨日一度持ち出しました。"}],"grammar":[]},{"day":76,"title":"Day 76｜HSK4 基礎強化","vocab":[{"id":"d76-v0","zh":"锻炼","pinyin":"duànliàn","ja":"鍛える","example":"每天锻炼身体。","exPinyin":"Měi tiān duàn liàn shēn tǐ。","exJa":"毎日体を鍛える。"},{"id":"d76-v1","zh":"减肥","pinyin":"jiǎnféi","ja":"ダイエットする","example":"我正在减肥。","exPinyin":"Wǒ zhèng zài jiǎn féi。","exJa":"ダイエット中だ。"},{"id":"d76-v2","zh":"旅行","pinyin":"lǚxíng","ja":"旅行する","example":"暑假我去旅行。","exPinyin":"Shǔ jià wǒ qù lǚ xíng。","exJa":"夏休みに旅行する。"},{"id":"d76-v3","zh":"出生","pinyin":"chūshēng","ja":"生まれる","example":"他在北京出生。","exPinyin":"Tā zài běi jīng chū shēng。","exJa":"彼は北京で生まれた。"},{"id":"d76-v4","zh":"长大","pinyin":"zhǎngdà","ja":"成長する","example":"孩子长大了。","exPinyin":"Hái zi zhǎng dà le。","exJa":"子どもが大きくなった。"},{"id":"d76-v5","zh":"轻松","pinyin":"qīngsōng","ja":"気楽だ、楽だ","example":"今天的工作比较轻松。","exPinyin":"Jīntiān de gōngzuò bǐjiào qīngsōng.","exJa":"今日の仕事は比較的楽です。"},{"id":"d76-v6","zh":"力气","pinyin":"lìqi","ja":"力","example":"搬这个箱子需要不少力气。","exPinyin":"Bān zhège xiāngzi xūyào bù shǎo lìqi.","exJa":"この箱を運ぶにはかなり力が要ります。"},{"id":"d76-v7","zh":"活动","pinyin":"huódòng","ja":"活動、イベント","example":"公司下个月有一个活动。","exPinyin":"Gōngsī xià ge yuè yǒu yí ge huódòng.","exJa":"会社は来月イベントがあります。"}],"grammar":[]},{"day":77,"title":"Day 77｜HSK4 基礎強化","vocab":[{"id":"d77-v0","zh":"结婚","pinyin":"jiéhūn","ja":"結婚する","example":"他们去年结婚了。","exPinyin":"Tā men qù nián jié hūn le。","exJa":"彼らは去年結婚した。"},{"id":"d77-v1","zh":"退休","pinyin":"tuìxiū","ja":"退職する","example":"父亲已经退休了。","exPinyin":"Fù qīn yǐ jīng tuì xiū le。","exJa":"父はもう退職した。"},{"id":"d77-v2","zh":"救","pinyin":"jiù","ja":"救う","example":"医生救了他。","exPinyin":"Yī shēng jiù le tā。","exJa":"医者が彼を救った。"},{"id":"d77-v3","zh":"帮忙","pinyin":"bāngmáng","ja":"手伝う","example":"你能帮个忙吗？","exPinyin":"Nǐ néng bāng gè máng ma？","exJa":"手伝ってくれる？"},{"id":"d77-v4","zh":"照顾","pinyin":"zhàogù","ja":"世話する","example":"她照顾老人。","exPinyin":"Tā zhào gù lǎo rén。","exJa":"彼女は老人の世話をする。"},{"id":"d77-v5","zh":"请假","pinyin":"qǐngjià","ja":"休みを取る","example":"他因为感冒请假了。","exPinyin":"Tā yīnwèi gǎnmào qǐngjià le.","exJa":"彼は風邪で休みを取りました。"},{"id":"d77-v6","zh":"尊重","pinyin":"zūnzhòng","ja":"尊重する","example":"我们应该尊重别人的意见。","exPinyin":"Wǒmen yīnggāi zūnzhòng biérén de yìjiàn.","exJa":"他人の意見を尊重すべきです。"},{"id":"d77-v7","zh":"抱歉","pinyin":"bàoqiàn","ja":"申し訳なく思う","example":"很抱歉，让您久等了。","exPinyin":"Hěn bàoqiàn, ràng nín jiǔ děng le.","exJa":"大変申し訳ありません、お待たせしました。"}],"grammar":[]},{"day":78,"title":"Day 78｜HSK4 基礎強化","vocab":[{"id":"d78-v0","zh":"富","pinyin":"fù","ja":"豊か・金持ち","example":"他家很富。","exPinyin":"Tā jiā hěn fù。","exJa":"彼の家は裕福だ。"},{"id":"d78-v1","zh":"穷","pinyin":"qióng","ja":"貧しい","example":"以前他很穷。","exPinyin":"Yǐ qián tā hěn qióng。","exJa":"以前彼は貧しかった。"},{"id":"d78-v2","zh":"厚","pinyin":"hòu","ja":"厚い","example":"这本书很厚。","exPinyin":"Zhè běn shū hěn hòu。","exJa":"この本は厚い。"},{"id":"d78-v3","zh":"深","pinyin":"shēn","ja":"深い","example":"这条河很深。","exPinyin":"Zhè tiáo hé hěn shēn。","exJa":"この川は深い。"},{"id":"d78-v4","zh":"空","pinyin":"kōng","ja":"空っぽ","example":"瓶子是空的。","exPinyin":"Píng zi shì kōng de。","exJa":"瓶は空だ。"},{"id":"d78-v5","zh":"超过","pinyin":"chāoguò","ja":"超える、上回る","example":"这次的费用超过了预算。","exPinyin":"Zhè cì de fèiyòng chāoguò le yùsuàn.","exJa":"今回の費用は予算を超えました。"},{"id":"d78-v6","zh":"许多","pinyin":"xǔduō","ja":"多くの","example":"这次会议提出了许多新想法。","exPinyin":"Zhè cì huìyì tíchū le xǔduō xīn xiǎngfǎ.","exJa":"今回の会議では多くの新しい考えが出ました。"},{"id":"d78-v7","zh":"完全","pinyin":"wánquán","ja":"完全に、まったく","example":"我完全同意你的看法。","exPinyin":"Wǒ wánquán tóngyì nǐ de kànfǎ.","exJa":"あなたの見方に完全に同意します。"}],"grammar":[]},{"day":79,"title":"Day 79｜HSK4 基礎強化","vocab":[{"id":"d79-v0","zh":"干燥","pinyin":"gānzào","ja":"乾燥している","example":"冬天空气很干燥。","exPinyin":"Dōng tiān kōng qì hěn gān zào。","exJa":"冬は空気が乾燥している。"},{"id":"d79-v1","zh":"凉快","pinyin":"liángkuai","ja":"涼しい","example":"今天很凉快。","exPinyin":"Jīn tiān hěn liáng kuai。","exJa":"今日は涼しい。"},{"id":"d79-v2","zh":"暖和","pinyin":"nuǎnhuo","ja":"暖かい","example":"春天很暖和。","exPinyin":"Chūn tiān hěn nuǎn huo。","exJa":"春は暖かい。"},{"id":"d79-v3","zh":"温度","pinyin":"wēndù","ja":"温度","example":"今天温度很高。","exPinyin":"Jīn tiān wēn dù hěn gāo。","exJa":"今日は気温が高い。"},{"id":"d79-v4","zh":"轻","pinyin":"qīng","ja":"軽い","example":"这个包很轻。","exPinyin":"Zhè ge bāo hěn qīng。","exJa":"このかばんは軽い。"},{"id":"d79-v5","zh":"气候","pinyin":"qìhòu","ja":"気候","example":"上海的气候比较湿润。","exPinyin":"Shànghǎi de qìhòu bǐjiào shīrùn.","exJa":"上海の気候は比較的湿っています。"},{"id":"d79-v6","zh":"空气","pinyin":"kōngqì","ja":"空気","example":"早上的空气特别新鲜。","exPinyin":"Zǎoshang de kōngqì tèbié xīnxiān.","exJa":"朝の空気はとても新鮮です。"},{"id":"d79-v7","zh":"停","pinyin":"tíng","ja":"止まる、止める","example":"雨停了，我们出发吧。","exPinyin":"Yǔ tíng le, wǒmen chūfā ba.","exJa":"雨がやんだので、出発しましょう。"}],"grammar":[]},{"day":80,"title":"Day 80｜HSK4 基礎強化","vocab":[{"id":"d80-v0","zh":"圆","pinyin":"yuán","ja":"丸い","example":"月亮是圆的。","exPinyin":"Yuè liàng shì yuán de。","exJa":"月は丸い。"},{"id":"d80-v1","zh":"直","pinyin":"zhí","ja":"まっすぐ","example":"一直往前走。","exPinyin":"Yì zhí wǎng qián zǒu。","exJa":"ずっとまっすぐ進む。"},{"id":"d80-v2","zh":"假","pinyin":"jiǎ","ja":"偽物","example":"这是假的。","exPinyin":"Zhè shì jiǎ de。","exJa":"これは偽物だ。"},{"id":"d80-v3","zh":"真正","pinyin":"zhēnzhèng","ja":"本当の","example":"这是真正的
