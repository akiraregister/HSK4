name = "hsk4-grader"
main = "src/index.js"
compatibility_date = "2026-08-24"

# APIキーは secret として置く（このファイルには書かない）。
#   npx wrangler secret put ANTHROPIC_API_KEY

# 回数制限を使うときだけ、下の2行のコメントを外して id を入れる。
# 繋がなければ制限なしで動く。手順は README.md を参照。
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "1373b4b05d19cc43bef4dffe1e1b1bdf"

# Day8以降の採点を購入済みユーザーに限定するためのKV。
# worker-paywall/wrangler.toml の ENTITLEMENTS と「同じ id」を指定すること
# （購入済みフラグを書くのはworker-paywall、ここは読むだけ）。
# 繋がないとDay8以降は常に403になる（安全側のデフォルト）。手順はREADME.md参照。
# [[kv_namespaces]]
# binding = "ENTITLEMENTS"
# id = "worker-paywallと同じKV名前空間のIDを貼る"
