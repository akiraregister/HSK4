<!doctype html>
<!-- 改修案のモックアップ（案A＝土台を整える／案C＝有料商品として見せる）。
     実装前に画面の形と流れを確かめるためのもので、アプリ本体（../index.html）には
     まだ一切手を入れていない。色・書体はアプリと同じトークンを共有している。
     「いま」の側は design/current/*.png（アプリを実際に操作して撮ったもの）。
     撮り直し: node design/capture-current.mjs -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>加油 — 改修案モックアップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Yomogi&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FCF9F2;--card:#fff;--ink:#2A2724;--ink-2:#4A443C;--muted:#8A8377;--line:#E4DCCB;
  --brand:#F2A227;--brand-2:#D98A16;--good:#4E7A3C;--bad:#B0561F;--gray:#F0EBE0;--paper:#FBF6EA;
  --sage:#D5E4C8;--apricot:#FBE0BC;--blush:#F6D9D2;--stroke:#2A2724;--bw:1.5px;
  --font-display:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;
  --font-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  --font-hand:'Yomogi','Hiragino Maru Gothic ProN',cursive;
  --zh:"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#E8E2D6;color:var(--ink);font-family:var(--font-body);line-height:1.7;
     padding:22px 16px 60px;-webkit-font-smoothing:antialiased}
a{color:var(--bad)}

/* ── 台紙 ───────────────────────────── */
.wrap{max-width:1120px;margin:0 auto}
.lede{background:var(--stroke);color:var(--bg);border-radius:18px;padding:16px 20px;font-size:13.5px;line-height:1.8;margin-bottom:20px}
.lede b{color:var(--brand)}
h1{font-family:var(--font-display);font-size:26px;font-weight:900;margin-bottom:6px}
.sub{font-size:13.5px;color:#5C5249;margin-bottom:18px}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.seg{display:inline-flex;background:#fff;border:var(--bw) solid var(--stroke);border-radius:999px;padding:4px;gap:4px}
.seg button{font:inherit;font-weight:900;font-size:13.5px;border:0;background:transparent;color:var(--muted);
  padding:8px 18px;border-radius:999px;cursor:pointer;font-family:var(--font-display)}
.seg button.on{background:var(--stroke);color:var(--bg)}
.picker{display:flex;flex-wrap:wrap;gap:7px}
.picker button{font:inherit;font-family:var(--font-display);font-weight:700;font-size:13px;cursor:pointer;
  border:var(--bw) solid #CFC6B6;background:rgba(255,255,255,.75);color:#5C5249;border-radius:999px;padding:8px 15px}
.picker button.on{background:var(--brand);border-color:var(--stroke);color:var(--ink);font-weight:900}
.picker button.c{border-style:dashed}

.stage{display:grid;gap:26px;grid-template-columns:1fr;align-items:start}
@media(min-width:900px){.stage{grid-template-columns:392px 1fr}}

/* 端末 */
.phone{width:392px;flex:none;border:10px solid var(--stroke);border-radius:46px;background:#fff;padding:9px;
       box-shadow:0 28px 50px -26px rgba(42,39,36,.55);position:relative;justify-self:center}
.screen{width:100%;height:844px;border-radius:37px;overflow:hidden;background:var(--bg);position:relative}
.screen img{display:block;width:100%}
.screen .scroll{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}

/* 解説 */
.notes{background:#fff;border:var(--bw) solid var(--stroke);border-radius:20px;padding:18px 20px}
.notes h2{font-family:var(--font-display);font-size:18px;font-weight:900;margin-bottom:4px}
.notes .tag{display:inline-block;font-family:var(--font-display);font-size:11.5px;font-weight:900;
  border:var(--bw) solid var(--stroke);border-radius:999px;padding:2px 10px;margin-bottom:10px}
.notes .tag.a{background:var(--sage)} .notes .tag.c{background:var(--apricot)}
.notes ul{margin:10px 0 0 0;padding-left:1.15em;font-size:14px;line-height:1.85}
.notes li{margin-bottom:7px}
.notes li b{font-weight:700}
.notes .why{margin-top:14px;background:var(--paper);border:var(--bw) dashed #DFD2B8;border-radius:14px;
  padding:12px 14px;font-size:13.5px;line-height:1.8;color:var(--ink-2)}

.cmpnote{font-size:12.5px;color:#8A8377}
.nofit{display:flex;height:100%;flex-direction:column;align-items:center;justify-content:center;
  padding:34px 30px;text-align:center;gap:10px}
.nofit .ic{width:52px;height:52px;border-radius:999px;border:var(--bw) solid var(--stroke);background:var(--apricot);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:24px}
.nofit b{font-family:var(--font-display);font-size:16.5px;font-weight:900}
.nofit p{font-size:13.5px;line-height:1.85;color:#8A8377}
.nofit code{background:var(--gray);border-radius:5px;padding:1px 5px;font-size:12.5px}

/* ══ ここから下は「アプリの中身」のモック ══ */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);font-size:15px}
.app .body{flex:1;overflow:auto;padding:14px 16px 18px}
.app .body.center{display:flex;flex-direction:column;justify-content:center}
.app .zh{font-family:var(--zh)}

/* 細いヘッダー（4タブをやめ、縦を返す） */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
     padding:16px 16px 12px;background:rgba(252,249,242,.94);border-bottom:var(--bw) solid var(--line)}
.top.bare{border-bottom:0;padding-bottom:4px}
.top .brand{display:flex;align-items:center;gap:7px;font-family:var(--font-display);font-weight:900;font-size:18px;letter-spacing:.04em}
.streak{display:inline-flex;align-items:center;gap:5px;background:var(--apricot);border:var(--bw) solid var(--stroke);
  border-radius:999px;padding:4px 12px;font-family:var(--font-display);font-weight:900;font-size:13.5px}
.top .back{font-family:var(--font-display);font-weight:900;font-size:15px;background:none;border:0;cursor:pointer;color:var(--ink)}

/* 下タブ */
.tabs{flex:none;display:flex;background:rgba(252,249,242,.96);border-top:var(--bw) solid var(--stroke);
      padding:8px 10px 14px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;
  font:inherit;font-family:var(--font-display);font-weight:700;font-size:11px;color:var(--muted);cursor:pointer;padding:4px 0}
.tabs button.on{color:var(--ink);font-weight:900}
.tabs .ic{width:22px;height:22px;display:block}

h2.screen-h{font-family:var(--font-display);font-size:21px;font-weight:900;margin:2px 0 3px}
.hand{font-family:var(--font-hand);font-size:13px;color:var(--bad)}

/* 主役カード：1画面に1つだけ大きく置く */
.hero{background:#fff;border:var(--bw) solid var(--stroke);border-radius:22px;padding:18px;margin-top:12px}
.hero .eye{font-family:var(--font-display);font-size:12.5px;font-weight:900;color:var(--good);letter-spacing:.04em}
.hero .t{font-family:var(--font-display);font-size:30px;font-weight:900;line-height:1.2;margin:2px 0 4px}
.hero .m{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.big{display:block;width:100%;margin-top:14px;background:var(--stroke);color:var(--bg);border:var(--bw) solid var(--stroke);
  border-radius:999px;padding:16px;font-family:var(--font-display);font-weight:900;font-size:17px;cursor:pointer}
.big.amber{background:var(--brand);color:var(--ink)}
.big.ghost{background:#fff;color:var(--ink)}
.mini{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}

/* 副次カード：主役より明確に小さく */
.subs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
.subcard{background:#fff;border:var(--bw) solid var(--stroke);border-radius:16px;padding:11px 13px}
.subcard .e{font-size:11px;color:var(--muted);font-family:var(--font-display);font-weight:700}
.subcard .n{font-family:var(--font-display);font-size:19px;font-weight:900;line-height:1.2;margin:1px 0 2px}
.subcard .b{display:block;width:100%;margin-top:7px;background:#fff;border:var(--bw) solid var(--stroke);
  border-radius:999px;padding:7px;font-family:var(--font-display);font-weight:900;font-size:12.5px;cursor:pointer}

/* 週の帯＋進捗 */
.week{display:flex;gap:6px;margin-top:14px}
.week div{flex:1;text-align:center;font-size:10.5px;color:var(--muted);font-family:var(--font-display);font-weight:700}
.week .dot{display:block;width:100%;aspect-ratio:1;border-radius:999px;border:var(--bw) solid var(--stroke);
  background:#fff;margin-bottom:3px}
.week .dot.done{background:var(--sage)}
.week .dot.today{background:var(--brand)}
.week .dot.off{border-style:dashed;border-color:#CFC6B6;background:transparent}
.bar{height:9px;border-radius:999px;background:var(--gray);overflow:hidden;margin-top:12px;border:1px solid var(--line)}
.bar span{display:block;height:100%;background:var(--stroke)}
.barlabel{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:5px}

/* 学習ステップ */
.steps{flex:none;display:flex;gap:5px;padding:10px 16px 12px;background:rgba(252,249,242,.94);border-bottom:var(--bw) solid var(--line)}
.steps i{flex:1;height:5px;border-radius:999px;background:var(--gray);display:block}
.steps i.on{background:var(--stroke)}
.steplabel{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.steplabel b{font-family:var(--font-display);font-size:16px;font-weight:900}
.steplabel span{font-size:12px;color:var(--muted)}
.wordcard{background:#fff;border:var(--bw) solid var(--stroke);border-radius:20px;padding:20px 18px;text-align:center}
.wordcard .w{font-family:var(--zh);font-size:40px;font-weight:700;line-height:1.25}
.wordcard .p{font-size:17px;color:#5C5249;margin-top:2px}
.wordcard .j{font-size:17px;font-weight:700;margin-top:8px}
.wordcard .ex{background:var(--paper);border-radius:14px;padding:11px 13px;margin-top:14px;text-align:left;font-size:13.5px;line-height:1.75}
.wordcard .ex .s{color:var(--muted);font-size:12.5px}
.dots{display:flex;gap:5px;justify-content:center;margin-top:12px}
.dots i{width:7px;height:7px;border-radius:999px;background:#D8CFBE}
.dots i.on{background:var(--stroke)}
.footbar{flex:none;padding:10px 16px calc(14px);background:rgba(252,249,242,.96);border-top:var(--bw) solid var(--line)}

/* ミニテスト */
.q{font-size:15.5px;font-weight:700;line-height:1.7;margin-bottom:10px}
.bank{min-height:56px;background:var(--paper);border:var(--bw) dashed #DFD2B8;border-radius:14px;padding:9px;
      display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}
.slot{min-height:56px;background:#fff;border:var(--bw) solid var(--line);border-radius:14px;padding:9px;margin-top:9px;
      display:flex;flex-wrap:wrap;gap:7px}
.chip{font-family:var(--zh);font-size:16px;font-weight:700;background:#fff;border:var(--bw) solid var(--stroke);
  border-radius:12px;padding:8px 13px;cursor:pointer}
.chip.used{background:var(--gray);color:#A29A8E;border-color:var(--line);text-decoration:line-through}
.chip.in{background:var(--stroke);color:var(--bg)}

/* 完了 */
.done-wrap{text-align:center;padding:26px 6px 0}
.done-mark{width:96px;height:96px;border-radius:999px;background:var(--sage);border:3px solid var(--stroke);
  display:flex;align-items:center;justify-content:center;font-size:44px;margin:0 auto 16px}
.done-wrap h3{font-family:var(--font-display);font-size:26px;font-weight:900;margin-bottom:4px}
.tally{background:#fff;border:var(--bw) solid var(--stroke);border-radius:18px;padding:14px 16px;margin-top:18px;text-align:left}
.tally div{display:flex;justify-content:space-between;font-size:14px;padding:5px 0}
.tally div+div{border-top:1px solid var(--line)}

/* 価格 */
.pricehead{background:var(--stroke);color:var(--bg);margin:-14px -16px 0;padding:24px 20px 22px;text-align:center}
.pricehead .e{font-family:var(--font-hand);font-size:13px;color:var(--brand)}
.pricehead h3{font-family:var(--font-display);font-size:25px;font-weight:900;line-height:1.35;margin:6px 0 8px}
.pricehead p{font-size:13.5px;color:rgba(252,249,242,.82);line-height:1.75}
.cmp{width:100%;border-collapse:separate;border-spacing:0;margin-top:16px;font-size:13px;background:#fff;
     border:var(--bw) solid var(--stroke);border-radius:16px;overflow:hidden}
.cmp th,.cmp td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line)}
.cmp th{font-family:var(--font-display);font-weight:900;font-size:12.5px;background:var(--gray)}
.cmp td:first-child,.cmp th:first-child{text-align:left}
.cmp tr:last-child td{border-bottom:0}
.cmp .yes{color:var(--good);font-weight:900}
.cmp .no{color:#B9B0A2}
.pricebox{background:var(--apricot);border:var(--bw) solid var(--stroke);border-radius:18px;padding:16px;margin-top:14px;text-align:center}
.pricebox .amt{font-family:var(--font-display);font-size:34px;font-weight:900;line-height:1.2}
.pricebox .amt small{font-size:14px;font-weight:700}
.pricebox .note{font-size:12.5px;color:#7A6446;margin-top:2px}
.fine{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.8}
.fine a{color:var(--muted);text-decoration:underline}
details.coupon{margin-top:12px;font-size:13px}
details.coupon summary{cursor:pointer;color:var(--muted);font-size:12.5px;list-style:none}
details.coupon summary::-webkit-details-marker{display:none}
details.coupon input{width:100%;border:var(--bw) solid var(--line);border-radius:12px;padding:10px;margin-top:8px;font:inherit}

/* 設定（整理後） */
.group{margin-top:16px}
.group>h4{font-family:var(--font-display);font-size:12.5px;font-weight:900;color:var(--muted);
  letter-spacing:.06em;margin:0 0 7px 4px}
.rows{background:#fff;border:var(--bw) solid var(--stroke);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;font-size:14.5px}
.row+.row{border-top:1px solid var(--line)}
.row .v{color:var(--muted);font-size:13.5px}
.row .chev{color:#C4BAAA}
.moved{background:var(--sage);border:var(--bw) dashed var(--stroke);border-radius:14px;padding:11px 13px;
  font-size:12.5px;line-height:1.75;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">

  <div class="lede">
    <b>これはモックアップです。</b>アプリ本体（<code>index.html</code>）にはまだ一切手を入れていません。
    画面の形と流れを実装前に確かめるためのもので、色・書体はアプリと同じトークンを使っています。<br>
    <b>案A</b>＝土台を整える（ナビ・情報の優先順位・学習のステップ化）／<b>案C</b>＝有料商品として見せる（価格画面・無料の区切り）。
  </div>

  <h1>加油 — 改修案モックアップ</h1>
  <p class="sub">画面を選び、「いま / 改善案」を切り替えて見比べてください。改善案の側はボタンが実際に動きます。<br>
  <span class="cmpnote">◧ が付いた画面は「いま」と見比べられます。付いていないものは新設なので比較対象がありません。</span></p>

  <div class="controls">
    <div class="seg" id="seg">
      <button data-mode="now">いま</button>
      <button data-mode="new" class="on">改善案</button>
    </div>
    <div class="picker" id="picker"></div>
  </div>

  <template id="imgfail">
    <div class="nofit"><div class="ic">!</div>
      <b>画像を読み込めませんでした</b>
      <p><code>design/current/</code> の画像が見つかりません。
      このファイルだけを移動していないか確認してください。</p></div>
  </template>

  <div class="stage">
    <div class="phone"><div class="screen" id="screen"></div></div>
    <div class="notes" id="notes"></div>
  </div>
</div>

<script>
// 絵文字ではなく線のアイコン。アプリの線画（枠線1.5px）と調子を合わせる
const IC = {
  today:'<path d="M4 7h16v13H4z"/><path d="M4 11h16"/><path d="M8 3v4M16 3v4"/>',
  study:'<path d="M4 5h7v15H4z"/><path d="M13 5h7v15h-7z"/><path d="M11 5v15"/>',
  vocab:'<path d="M5 19V6a2 2 0 0 1 2-2h12v16H7a2 2 0 0 0-2 2"/><path d="M9 8h7M9 12h5"/>',
  settings:'<circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6"/>',
};
const icon = k => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const TABS = (on) => `
  <div class="tabs">
    <button class="${on==='today'?'on':''}" data-go="today">${icon('today')}今日</button>
    <button class="${on==='study'?'on':''}" data-go="study">${icon('study')}学習</button>
    <button>${icon('vocab')}単語</button>
    <button class="${on==='settings'?'on':''}" data-go="settings">${icon('settings')}設定</button>
  </div>`;

const HEAD = `<div class="top">
    <span class="brand">🔥 加油</span>
    <span class="streak">🔥 12日連続</span>
  </div>`;

const SCREENS = {
  today: {
    label:'今日', plan:'A', current:'today.png',
    title:'今日（ホーム）',
    points:[
      '<b>主役を1つに絞る。</b>いまは「Day 13」と「まだありません／18問」が同じ大きさで並んでいる。学習カードだけを大きく、復習と模試は小さい2枚に落とす',
      '<b>模試を設定タブから救い出す</b>。売りの機能が設定の奥にあるのは損',
      '<b>連続日数と今週の帯</b>を足す。90日完走が商品なのに、続けた証が0%リングだけだった',
      '<b>4タブを下へ移す</b>。上ヘッダー約300pxを返し、その分を中身に使う',
      '所要時間（15分）をボタンの下に出し、「いま始められるか」を判断させる',
    ],
    why:'いちばん見られる画面なので、ここだけは「今日ひとつ」をやり切らせることに全振りする。他の導線は小さくてよい。',
    render:()=>`<div class="app">
      ${HEAD}
      <div class="body">
        <h2 class="screen-h">今日やること <span class="hand">あと78日！</span></h2>
        <div class="hero">
          <span class="eye">あたらしく覚える</span>
          <div class="t">Day 13</div>
          <div class="m">単語5個・文法3つ・音声1問・ミニテスト5問</div>
          <button class="big" data-go="study">学習を始める</button>
          <div class="mini">だいたい15分</div>
        </div>
        <div class="subs">
          <div class="subcard">
            <span class="e">思い出す</span>
            <div class="n">18問</div>
            <span class="e">期限13＋新規5</span>
            <button class="b">復習する</button>
          </div>
          <div class="subcard">
            <span class="e">腕試し</span>
            <div class="n">模擬試験</div>
            <span class="e">40問・30分</span>
            <button class="b">受ける</button>
          </div>
        </div>
        <div class="week">
          <div><span class="dot done"></span>月</div><div><span class="dot done"></span>火</div>
          <div><span class="dot done"></span>水</div><div><span class="dot done"></span>木</div>
          <div><span class="dot today"></span>金</div><div><span class="dot off"></span>土</div>
          <div><span class="dot off"></span>日</div>
        </div>
        <div class="bar"><span style="width:13%"></span></div>
        <div class="barlabel"><span>90日のうち 12日</span><span>13%</span></div>
      </div>
      ${TABS('today')}
    </div>`
  },

  study: {
    label:'学習（ステップ）', plan:'A', current:'day.png',
    title:'Day学習 — 1本のスクロールをやめる',
    points:[

const ORDER = ['today','study','test','done','free_end','price','settings'];
let mode = 'new', cur = 'today';

const picker = document.getElementById('picker');
picker.innerHTML = ORDER.map(k => {
  const s = SCREENS[k];
  return `<button data-k="${k}" class="${s.plan==='C'?'c':''}">${s.current?'◧ ':''}${s.label}${s.plan==='C'?' ※案C':''}</button>`;
}).join('');

function draw(){
  const s = SCREENS[cur];
  [...picker.children].forEach(b => b.classList.toggle('on', b.dataset.k === cur));
  [...document.querySelectorAll('#seg button')].forEach(b => b.classList.toggle('on', b.dataset.mode === mode));

  const screen = document.getElementById('screen');
  if (mode === 'now') {
    screen.innerHTML = s.current
      ? `<div class="scroll"><img src="current/${s.current}" alt=""
           onerror="this.closest('.scroll').innerHTML=document.getElementById('imgfail').innerHTML"></div>`
      : `<div class="nofit"><div class="ic">＋</div>
           <b>この画面は新設です</b>
           <p>いまのアプリには対応する画面が無いので、見比べられません。</p></div>`;
  } else {
    screen.innerHTML = s.render();
  }

  document.getElementById('notes').innerHTML =
    `<span class="tag ${s.plan==='C'?'c':'a'}">案${s.plan}</span>
     <h2>${s.title}</h2>
     <ul>${s.points.map(p=>`<li>${p}</li>`).join('')}</ul>
     <div class="why"><b>なぜ：</b>${s.why}</div>`;
}

picker.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; cur = b.dataset.k; draw(); });
document.getElementById('seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; mode = b.dataset.mode; draw(); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  const go = b.dataset.go;
  if (SCREENS[go]) { cur = go; mode = 'new'; draw(); }
});
draw();
